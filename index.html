  ICRA: [
    { id: "inspector", th: "ผู้ตรวจประเมิน", en: "Inspector" },
    { id: "contractor", th: "ผู้รับเหมา / ผู้ควบคุมงาน", en: "Contractor / supervisor" },
    { id: "approver", th: "ผู้อนุมัติ / หัวหน้าหน่วยงาน", en: "Approver / unit head" }
  ]
};
// PCRA sections that are compliance measures (Yes = good). The others are risk screening questions.
const MP_PCRA_COMPLIANCE_SECTIONS = ["B", "G"];
const MpFormUI = { id: null };

/** flat item list of a form type: {id, text, group, comply} */
function mpFormItems(type) {
  const out = [];
  if (type === "PCRA") {
    MP_PCRA.sections.forEach((s) => s.items.forEach((it) => out.push({ id: it.id, text: it.text, group: s.id + ". " + s.th, comply: MP_PCRA_COMPLIANCE_SECTIONS.includes(s.id) })));
    MP_PCRA.practices.forEach((s) => s.items.forEach((it) => out.push({ id: it.id, text: it.text, group: s.th, comply: true })));
  } else {
    MP_ICRA.groups.forEach((g) => g.items.forEach((it) => out.push({ id: it.id, text: it.text, group: g.id + " " + g.en + " · " + g.th, comply: true })));
  }
  return out;
}
const mpFormIsExempt = (f) => f.type === "PCRA" && Object.keys(f.exempt || {}).some((k) => f.exempt[k]);

function mpFormStats(f) {
  const items = mpFormItems(f.type);
  const a = f.answers || {};
  const S = { yes: 0, no: 0, na: 0, blank: 0, total: items.length, cYes: 0, cNo: 0 };
  items.forEach((it) => {
    const v = a[it.id];
    if (v === "yes") { S.yes++; if (it.comply) S.cYes++; }
    else if (v === "no") { S.no++; if (it.comply) S.cNo++; }
    else if (v === "na") S.na++;
    else S.blank++;
  });
  const roles = MP_FORM_SIGNERS[f.type];
  const sig = f.signatures || {};
  S.signersNeeded = roles.filter((r) => !(sig[r.id] && sig[r.id].skip)).length;
  S.signed = roles.filter((r) => sig[r.id] && !sig[r.id].skip && sig[r.id].strokes && sig[r.id].strokes.length).length;
  S.exempt = mpFormIsExempt(f);
  /** compliance % : Yes / (Yes + No) on compliance items; N/A and blank are left out */
  S.pct = S.cYes + S.cNo ? (S.cYes / (S.cYes + S.cNo)) * 100 : null;
  S.complete = S.exempt ? 100 : Math.round(((S.total - S.blank) / S.total) * 100);
  return S;
}
function mpFormsOf(unitId, type) {
  return DB.get("mpForms", []).filter((f) => f.unitId === unitId && (!type || f.type === type))
    .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
}
const mpFormsCount = (unitId, type) => mpFormsOf(unitId, type).length;

function mpNewForm(type, unitId) {
  return {
    id: uid("frm"), type, unitId, projectName: "", fields: { area: "", contractor: "", tel: "", start: "", end: "", date: todayISO(), time: mpNowHM() },
    exempt: {}, scope: {}, answers: {}, notes: {}, signatures: {}, status: "draft",
    by: State.user ? State.user.name || State.user.username : "", createdAt: new Date().toISOString(), finalAt: ""
  };
}
const mpGetForm = (id) => DB.get("mpForms", []).find((f) => f.id === id);
function mpSaveForm(f) {
  const all = DB.get("mpForms", []);
  const i = all.findIndex((x) => x.id === f.id);
  f.by = State.user ? State.user.name || State.user.username : f.by;
  if (i >= 0) all[i] = f; else all.push(f);
  DB.set("mpForms", all);
}

// ------------------------------------------------------------ signatures ---
function mpSigSvg(sig, h) {
  if (!sig || !sig.strokes || !sig.strokes.length) return "";
  const paths = sig.strokes.map((s) => (s.length === 1 ? `<circle cx="${s[0][0]}" cy="${s[0][1]}" r="1.2" fill="currentColor"/>` :
    `<polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${s.map((p) => p[0] + "," + p[1]).join(" ")}"/>`)).join("");
  return `<svg class="sig-svg" viewBox="0 0 ${sig.w} ${sig.h}" style="height:${h || 70}px" preserveAspectRatio="xMidYMid meet" role="img" aria-label="signature">${paths}</svg>`;
}
function mpOpenSignPad(roleLabel, existing, onSave) {
  const W = 480, H = 180;
  const modal = openModal(`
    <h3>${mt("ลงลายมือชื่อ", "Sign")} · ${mpEsc(roleLabel)}</h3>
    <canvas id="sig-cv" class="sig-canvas" width="${W}" height="${H}" aria-label="${mt("พื้นที่เซ็นชื่อ", "Signature area")}"></canvas>
    <div class="muted-s">${mt("ใช้นิ้ว เมาส์ หรือปากกาเซ็นในกรอบ", "Sign in the box with a finger, mouse or stylus")}</div>
    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;">
      <div class="field"><label>${mt("ชื่อ-สกุล (ตัวบรรจง)", "Full name")} *</label><input type="text" id="sg-name" value="${mpEsc(existing && existing.name || "")}" /></div>
      <div class="field"><label>${mt("โทรศัพท์ / ตำแหน่ง", "Phone / position")}</label><input type="text" id="sg-tel" value="${mpEsc(existing && existing.tel || "")}" /></div>
    </div>
    <div class="actions"><button class="btn ghost" id="sg-clear">${mt("ล้าง", "Clear")}</button><button class="btn ghost" id="sg-cancel">${mt("ยกเลิก", "Cancel")}</button><button class="btn" id="sg-ok">${mt("บันทึกลายเซ็น", "Save signature")}</button></div>`);
  const cv = modal.querySelector("#sig-cv"), g = cv.getContext("2d");
  let strokes = existing && existing.strokes ? JSON.parse(JSON.stringify(existing.strokes)) : [];
  let cur = null;
  const redraw = () => {
    g.clearRect(0, 0, W, H);
    g.lineWidth = 2; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#111"; g.fillStyle = "#111";
    strokes.forEach((s) => {
      if (s.length === 1) { g.beginPath(); g.arc(s[0][0], s[0][1], 1.2, 0, 7); g.fill(); return; }
      g.beginPath(); s.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.stroke();
    });
  };
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [Math.round(((e.clientX - r.left) / r.width) * W), Math.round(((e.clientY - r.top) / r.height) * H)]; };
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } cur = [pos(e)]; strokes.push(cur); redraw(); });
  cv.addEventListener("pointermove", (e) => { if (!cur) return; cur.push(pos(e)); redraw(); });
  const end = () => { cur = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  redraw();
  modal.querySelector("#sg-clear").addEventListener("click", () => { strokes = []; redraw(); });
  modal.querySelector("#sg-cancel").addEventListener("click", closeModal);
  modal.querySelector("#sg-ok").addEventListener("click", () => {
    const name = modal.querySelector("#sg-name").value.trim();
    if (!strokes.length) return alert(mt("กรุณาเซ็นชื่อในกรอบ", "Please sign in the box"));
    if (!name) return alert(mt("กรุณากรอกชื่อ-สกุล", "Please enter the full name"));
    onSave({ strokes, w: W, h: H, name, tel: modal.querySelector("#sg-tel").value.trim(), at: new Date().toISOString() });
    closeModal();
  });
}
const mpFmtStamp = (iso) => (iso ? new Date(iso).toLocaleString(mt("th-TH", "en-GB"), { dateStyle: "medium", timeStyle: "short" }) : "");

// --------------------------------------------------------- forms panel ---
function mpRenderFormsPanel(el, unit) {

  const rows = list.map((f) => {

        <div class="muted-s">${mpEsc(f.fields.date || "")} ${mpEsc(f.fields.time || "")} · ${S.exempt ? mt("เข้าข่ายยกเว้น", "Exempt") : `${mt("ตอบแล้ว", "Answered")} ${S.complete}%`} · ${mt("ลงนาม", "Signed")} ${S.signed}/${S.signersNeeded}${S.pct !== null ? ` · ${mt("ผ่านเกณฑ์", "Compliance")} ${S.pct.toFixed(0)}%` : ""}</div></div>
      <span class="st-chip ${f.status === "final" ? "ok" : "muted"}">${f.status === "final" ? "🔒 " + mt("ยืนยันแล้ว", "Final") : "✎ " + mt("ร่าง", "Draft")}</span>
      <button class="btn small" data-fopen="${f.id}">${f.status === "final" ? mt("เปิดดู", "View") : mt("กรอก / แก้ไข", "Fill / edit")}</button>
    </div>`;
  }).join("");
  el.innerHTML = `<div class="forms-head"><b>${mt("แบบฟอร์ม PCRA / ICRA ของหน่วยงานนี้", "PCRA / ICRA forms for this unit")}</b>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${tabs}</div>
      <div style="margin-left:auto;display:flex;gap:6px;"><button class="btn small" data-fnew="PCRA">+ PCRA</button><button class="btn small" data-fnew="ICRA">+ ICRA</button></div></div>
    <div class="forms-list">${rows || `<div class="muted-s" style="padding:8px 0;">${mt("ยังไม่มีแบบฟอร์ม กด + PCRA หรือ + ICRA", "No forms yet – click + PCRA or + ICRA")}</div>`}</div>`;
  el.querySelectorAll("[data-ftab]").forEach((b) => b.addEventListener("click", () => { MpCheckUI.formsType = b.dataset.ftab; mpRenderFormsPanel(el, unit); }));
  el.querySelectorAll("[data-fnew]").forEach((b) => b.addEventListener("click", () => {
    const f = mpNewForm(b.dataset.fnew, unit.id);
    mpSaveForm(f);
    MpFormUI.id = f.id; navigate("mp_form");
  }));
  el.querySelectorAll("[data-fopen]").forEach((b) => b.addEventListener("click", () => { MpFormUI.id = b.dataset.fopen; navigate("mp_form"); }));
}

      ${MP_PCRA.scope.map((t, i) => `<label class="fm-check"><input type="checkbox" data-scope="${i}" ${(f.scope || {})[i] ? "checked" : ""} ${dis}/> ${mpEsc(t)}</label>`).join("")}</div>`;
    bodyHtml += MP_PCRA.sections.map((s) => `<details class="chk-cat" open><summary><span class="cat-title">${s.id}. ${mpEsc(s.th)}</span></summary>${s.items.map((it) => itemRow(it, MP_PCRA_COMPLIANCE_SECTIONS.includes(s.id))).join("")}</details>`).join("");
    bodyHtml += MP_PCRA.practices.map((s) => `<details class="chk-cat" open><summary><span class="cat-title">${mt("แนวปฏิบัติ", "Practice")}: ${mpEsc(s.th)}</span></summary>${s.items.map((it) => itemRow(it, true)).join("")}</details>`).join("");
  } else {
    bodyHtml += MP_ICRA.groups.map((g) => `<details class="chk-cat" open><summary><span class="cat-title">${g.id} · ${mpEsc(g.en)} — ${mpEsc(g.th)}</span></summary>${g.items.map((it) => itemRow(it, true)).join("")}</details>`).join("");
  }

  const sigHtml = roles.map((r) => {

      ${s.skip ? `<div class="muted-s" style="padding:24px 0;">${mt("ไม่เกี่ยวข้อง (ไม่ต้องลงนาม)", "Not applicable (no signature)")}</div>`
        : s.strokes && s.strokes.length ? `<div class="sig-draw">${mpSigSvg(s, 70)}</div><div><b>${mpEsc(s.name)}</b>${s.tel ? ` · ${mpEsc(s.tel)}` : ""}</div><div class="muted-s">${mpFmtStamp(s.at)}</div>`

      ${locked ? "" : `<div class="sig-actions"><button class="btn small" data-sign="${r.id}">${s.strokes && s.strokes.length ? mt("เซ็นใหม่", "Re-sign") : mt("ลงนาม", "Sign")}</button>

        <div class="field"><label>${mt("ผู้รับเหมา / ผู้ขอ", "Contractor / requester")}</label><input type="text" id="ff-contractor" value="${mpEsc(f.fields.contractor)}" ${dis}/></div>

      <div class="sig-grid">${sigHtml}</div></div>`;

  const upd = () => {

function mpFormValidate(f) {
  const issues = [];
  if (!f.projectName) issues.push(mt("ระบุชื่อโครงการ / งาน", "Enter the project / work name"));
  const S = mpFormStats(f);
  if (!S.exempt && S.blank) issues.push(mt(`ยังไม่ได้ตอบ ${S.blank} ข้อ (เลือก ใช่ / ไม่ใช่ / N/A)`, `${S.blank} item(s) not answered (choose Yes / No / N/A)`));
  const sig = f.signatures || {};
  MP_FORM_SIGNERS[f.type].forEach((r) => {
    const s = sig[r.id];
    if (!s || (!s.skip && !(s.strokes && s.strokes.length))) issues.push(mt(`ยังไม่ลงนาม: ${r.th}`, `Not signed: ${r.en}`));
  });
  return issues;
}

/**
 * monitor.js
 * "Construction & Renovation Monitor" on the main Dashboard.
 * Evaluated from checklist items 7.1-7.6 (latest visit per unit) paired with the PCRA / ICRA forms
 * of the same unit.  Compliance of a form = Yes / (Yes + No) on its compliance items (N/A left out).
 * Combined score of a unit = average of the available parts (items 7.x %, PCRA %, ICRA %).
 * Target line: 90 %.
 */
const MP_TARGET = 90;
/** dashboard period filter: null = all time, else "year" | "month" | "week" | "day" */
const MpPeriod = { kind: null };
function mpPeriodRange() {
  if (!MpPeriod.kind) return null;
  const now = new Date();
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const y = now.getFullYear(), m = now.getMonth();
  if (MpPeriod.kind === "year") return { from: `${y}-01-01`, to: `${y}-12-31` };
  if (MpPeriod.kind === "month") return { from: iso(new Date(y, m, 1)), to: iso(new Date(y, m + 1, 0)) };
  if (MpPeriod.kind === "week") { const dow = (now.getDay() + 6) % 7; const a = new Date(y, m, now.getDate() - dow), b = new Date(y, m, now.getDate() - dow + 6); return { from: iso(a), to: iso(b) }; }
  return { from: iso(now), to: iso(now) };
}
const mpInRange = (date, r) => !r || (!!date && date >= r.from && date <= r.to);
const mpPeriodLabel = () => {
  const r = mpPeriodRange();
  if (!r) return mt("ทุกช่วงเวลา", "All time");
  return r.from === r.to ? mpFmtDate(r.from) : `${mpFmtDate(r.from)} – ${mpFmtDate(r.to)}`;
};
const MpMonUI = { unit: "ALL", table: false };

/** a unit counts as "construction / renovation" when it has a PCRA/ICRA form or any scored (non-N/A) item 7.x */
function mpIsConstruction(u, forms, range) {
  if ((forms || DB.get("mpForms", [])).some((f) => f.unitId === u.id && mpInRange(f.fields && f.fields.date, range))) return true;
  const rec = mpRecordIn(u.id, range);
  return !!rec && mpItemsOfCat(7).some((it) => typeof (rec.scores || {})[it.id] === "number");
}
const mpShort = (t, n) => (t.length > (n || 46) ? t.slice(0, n || 46) + "…" : t);
const MP_RISK_CLS = { critical: "critical", high: "serious", medium: "warning", low: "good" };

function mpMonData() {
  const range = mpPeriodRange();
  const allUnits = DB.get("mpUnits", []);
  const forms = DB.get("mpForms", []).filter((f) => mpInRange(f.fields && f.fields.date, range));
  const units = allUnits.filter((u) => mpIsConstruction(u, forms, range));
  const rows = units.map((u) => {
    const rec = mpRecordIn(u.id, range);
    const S = rec ? mpStatsFromRecs([rec], [u.id]) : null;
    const c7 = S ? S.cats[6] : null;
    const fl = (type) => {
      const fs = forms.filter((f) => f.unitId === u.id && f.type === type).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
      const sc = fs.map((f) => mpFormStats(f).pct).filter((p) => p !== null);
      return { n: fs.length, final: fs.filter((f) => f.status === "final").length, pct: sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : null, list: fs };
    };
    const pc = fl("PCRA"), ic = fl("ICRA");
    const parts = [c7 && c7.pct, pc.pct, ic.pct].filter((x) => x !== null && x !== undefined);
    // risks found: items 7.x scored <=3 (latest visit) and form answers "No" on compliance items
    const items = [];
    if (rec) mpItemsOfCat(7).forEach((it) => { const v = rec.scores[it.id]; if (typeof v === "number" && v <= 3) items.push({ id: it.id, text: it.text, risk: mpRiskOfScore(v), score: v }); });
    const noAns = [];
    pc.list.concat(ic.list).forEach((f) => {
      mpFormItems(f.type).forEach((it) => { if (it.comply && (f.answers || {})[it.id] === "no") noAns.push({ type: f.type, id: it.id, text: it.text }); });
    });
    const crit = items.filter((x) => x.risk === "critical" || x.risk === "high").length;
    return { unit: u, c7, rec, pcra: pc, icra: ic, combined: parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : null, items, noAns, crit };
  });
  const ev = { item: {}, all: {} };
  const add = (bag, date, y) => { if (date && y !== null && y !== undefined) (bag[date] = bag[date] || []).push(y); };
  units.forEach((u) => {
    if (MpMonUI.unit !== "ALL" && MpMonUI.unit !== u.id) return;
    mpVisits(u.id).filter((r) => mpInRange(r.date, range)).forEach((r) => {
      const S = mpStatsFromRecs([r], [u.id]);
      add(ev.item, r.date, S.cats[6].pct); add(ev.all, r.date, S.cats[6].pct);
    });
    forms.filter((f) => f.unitId === u.id).forEach((f) => add(ev.all, f.fields && f.fields.date, mpFormStats(f).pct));
  });
  const toPts = (bag) => Object.keys(bag).sort().map((d) => ({ date: d, y: bag[d].reduce((a, b) => a + b, 0) / bag[d].length, n: bag[d].length }));
  // risk distribution of items 7.x (latest visits) with the unit + item behind each level
  const risk = { critical: 0, high: 0, medium: 0, low: 0, na: 0 };
  const who = { critical: {}, high: {}, medium: {}, low: {}, na: {} };
  rows.forEach((r) => {
    if (!r.rec || (MpMonUI.unit !== "ALL" && MpMonUI.unit !== r.unit.id)) return;
    mpItemsOfCat(7).forEach((it) => {
      const v = r.rec.scores[it.id];
      const k = v === "na" ? "na" : typeof v === "number" ? mpRiskOfScore(v) : null;
      if (!k) return;
      risk[k]++;
      (who[k][r.unit.name] = who[k][r.unit.name] || []).push(it.id);
    });
  });
  return { rows, allUnits: units, itemPts: toPts(ev.item), allPts: toPts(ev.all), risk, who };
}

/** responsive SVG line chart. series: [{name,color,pts:[{date,y,n}]}] */
function mpLineChartSvg(series, opt) {
  opt = opt || {};
  const W = 420, H = 240, L = 40, R = 14, T = 14, B = 34;
  const all = series.flatMap((s) => s.pts.map((p) => new Date(p.date).getTime()));
  if (!all.length) return `<div class="empty-state">${mt("ยังไม่มีข้อมูล", "No data yet")}</div>`;
  let x0 = Math.min.apply(null, all), x1 = Math.max.apply(null, all);
  if (x0 === x1) { x0 -= 3 * 86400000; x1 += 3 * 86400000; }
  const X = (ms) => L + ((ms - x0) / (x1 - x0)) * (W - L - R);
  const Y = (v) => T + (1 - v / 100) * (H - T - B);
  let g = "";
  [0, 25, 50, 75, 100].forEach((v) => { g += `<line class="lc-grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="lc-t" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`; });
  const ticks = Math.min(5, Math.max(2, all.length));
  for (let i = 0; i < ticks; i++) {
    const ms = x0 + ((x1 - x0) * i) / (ticks - 1);
    const d = new Date(ms);
    g += `<text class="lc-t" x="${X(ms)}" y="${H - 10}" text-anchor="${i === 0 ? "start" : i === ticks - 1 ? "end" : "middle"}">${d.getDate()}/${d.getMonth() + 1}/${String(d.getFullYear() + 543).slice(2)}</text>`;
  }
  if (opt.target) g += `<line class="lc-target" x1="${L}" x2="${W - R}" y1="${Y(opt.target)}" y2="${Y(opt.target)}"/><text class="lc-tl" x="${W - R}" y="${Y(opt.target) - 5}" text-anchor="end">${mt("เป้าหมาย", "Target")} &gt;${opt.target}%</text>`;
  series.forEach((s) => {
    const pts = s.pts.map((p) => [X(new Date(p.date).getTime()), Y(p.y), p]);
    if (pts.length > 1) g += `<polyline class="lc-line" style="stroke:${s.color}" points="${pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}"/>`;
    pts.forEach((p) => {
      const tip = `${s.name}\n${mpFmtDate(p[2].date)}\n${p[2].y.toFixed(1)}%${p[2].n > 1 ? ` (${p[2].n} ${mt("รายการ", "results")})` : ""}`;
      g += `<circle class="lc-dot" style="fill:${s.color}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/><circle class="lc-hit" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="12" data-tip="${mpEsc(tip)}"/>`;
    });
  });
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${mpEsc(opt.label || "line chart")}">${g}</svg>`;
}
function mpDonutSvg(parts) {
  const total = parts.reduce((a, p) => a + p.v, 0);
  if (!total) return `<div class="empty-state">${mt("ยังไม่มีข้อมูล", "No data yet")}</div>`;
  const R = 52, C = 2 * Math.PI * R;
  let off = 0, g = "";
  parts.filter((p) => p.v).forEach((p) => {
    const len = (p.v / total) * C, gap = parts.filter((q) => q.v).length > 1 ? 2 : 0;
    g += `<circle class="dn" r="${R}" cx="70" cy="70" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" data-tip="${mpEsc(p.tip || p.label + ": " + p.v)}\n(${((p.v / total) * 100).toFixed(0)}%)"/>`;
    off += len;
  });
  return `<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="${mt("สัดส่วนระดับความเสี่ยง", "Risk level share")}">${g}<text x="70" y="68" text-anchor="middle" class="dn-n">${total}</text><text x="70" y="84" text-anchor="middle" class="lc-t">${mt("ข้อ", "items")}</text></svg>`;
}


/** donut of 7.x risk levels – lives at the top of the dashboard; hover shows which unit / items */
/** safety colour of a % score: red <70, orange <85, green >=85 (always shown with icon + label elsewhere) */
function mpScoreColor(pct) { return pct === null ? "var(--muted)" : pct < 70 ? "var(--st-critical)" : pct < 85 ? "var(--st-serious)" : "var(--st-good)"; }
function mpRenderDashDonut(host, D) {
  if (!host) return;
  D = D || mpMonData();
  const defs = [["critical", "var(--st-critical)"], ["high", "var(--st-serious)"], ["medium", "var(--st-warning)"], ["low", "var(--st-good)"], ["na", "var(--muted)"]];
  const parts = defs.map(([id, color]) => {
    const label = id === "na" ? "N/A" : `${mpRiskMeta(id).icon} ${mpRiskLabel(id)}`;
    const detail = Object.keys(D.who[id]).map((u) => `${u}: ${D.who[id][u].join(", ")}`).join("\n");
    return { v: D.risk[id], color, label, tip: `${label} · ${D.risk[id]} ${mt("ข้อ", "items")}${detail ? "\n" + detail : ""}` };
  });

/** severity order: most critical first, then high, medium, low; ties -> lower % first */
const mpRiskOrder = (a, b) => (b.risk.critical - a.risk.critical) || (b.risk.high - a.risk.high) || (b.risk.medium - a.risk.medium) || (b.risk.low - a.risk.low) || ((a.pct === null ? 101 : a.pct) - (b.pct === null ? 101 : b.pct));

/** newest save among the given units' checklist visits and forms: {at, by} */
const MP_STALE_DAYS = 30;
function mpLastUpdate(unitIds) {
  let best = null;
  DB.get("mpScores", []).concat(DB.get("mpForms", [])).forEach((r) => {
    if (!r || !unitIds.includes(r.unitId)) return;
    const at = r.at || r._u || r.finalAt || r.createdAt;
    if (at && (!best || at > best.at)) best = { at, by: r.byName || r.by || "" };
  });
  return best;
}
/** "before editing": the first visit, with each item at the value first recorded for it */
function mpBaselineStats(unitId) {
  const first = mpVisits(unitId)[0];
  if (!first) return null;
  return mpStatsFromRecs([Object.assign({}, first, { scores: Object.assign({}, first.scores, first.base || {}) })], [unitId]);
}
const mpIsStale = (last) => !!last && (Date.now() - new Date(last.at).getTime()) / 86400000 > MP_STALE_DAYS;
/** blink only when nothing was updated for a month AND the score is in the red / orange zone */
const mpBlinkNow = (pct, last) => mpIsStale(last) && pct !== null && pct < 85;
/** one-line form for the compact lists: 👤 name · 🕒 time (+ ⚠ when stale) */
function mpUpdShort(last) {
  if (!last) return mt("ยังไม่มีข้อมูล", "no data");
  const adm = Auth.isAdmin(State.user);
  return `${adm && last.by ? "👤 " + mpEsc(last.by) + " · " : ""}🕒 ${mpFmtWhen(last.at)}` + (mpIsStale(last) ? ` <b class="stale-flag" title="${mt("ไม่มีการอัปเดตเกิน 1 เดือน", "no update for over 1 month")}">⚠ &gt;1 ${mt("เดือน", "mo")}</b>` : "");
}
/** "who / when" line: names are for admins only, everybody sees the time and the stale warning */
function mpUpdLine(last) {
  if (!last) return `<span class="muted-s">${mt("ยังไม่มีการบันทึกข้อมูล", "No data saved yet")}</span>`;

  return `<span>${mt("อัปเดตล่าสุด", "Last update")}: ${adm && last.by ? "👤 " + mpEsc(last.by) + " · " : ""}🕒 ${mpFmtWhen(last.at)}</span>` +
    (mpIsStale(last) ? ` <b class="stale-flag">⚠ ${mt("ไม่มีการอัปเดตเกิน 1 เดือน", "no update for over 1 month")}</b>` : "");
}

function mpRiskStackRow(label, risk, pct, extraTip, link, compact, wide, o) {

    <div class="stack-track">${n ? segs : `<span class="muted-s">${mt("ยังไม่ประเมิน / N/A", "Not assessed / N/A")}</span>`}</div>${o.upd ? `<div class="rk-upd muted-s">${o.upd}</div>` : ""}
    <div class="rk-val${o.blink ? " blink" : ""}"${o.blink ? ` style="color:${mpScoreColor(pct)}"` : ""}>${pct === null ? "–" : pct.toFixed(1) + "%"}${st ? ` <i style="color:var(--st-${st.cls})" title="${mt(st.th, st.en)}">${st.icon}</i>` : ""}</div></div>`;
}

    const b = mpBaselineStats(u.id), a = mpStats([u.id], range), last = mpLastUpdate([u.id]);
    return { u, b: b || a, a, last };
  }).sort((x, y) => mpRiskOrder({ risk: x.b.risk, pct: x.b.pct }, { risk: y.b.risk, pct: y.b.pct }));
  const adm = Auth.isAdmin(State.user);
  const html = rows.map(({ u, b, a, last }) => {
    const bc = b.risk.critical, bh = b.risk.high, ac = a.risk.critical, ah = a.risk.high;
    const bt = bc + bh, at = ac + ah;
    const noData = !a.done;
    const fixed = bt ? Math.max(0, ((bt - at) / bt) * 100) : null;
    const edited = bc !== ac || bh !== ah;
    const blink = mpBlinkNow(a.pct, last);
    const seg = (n, color, lbl) => n ? `<div class="seg${blink && color !== "var(--st-good)" ? " blink" : ""}" style="flex:${n};background:${color};" data-tip="${mpEsc(u.name)}\n${lbl}: ${n}"><b>${n}</b></div>` : "";
    const bar = noData ? `<span class="muted-s">${mt("ไม่มีข้อมูลในช่วงนี้", "no data in this period")}</span>`
      : (bt || at) ? seg(ac, mpRiskColor("critical"), "✖ " + mt("วิกฤต (ยังไม่แก้)", "critical (open)")) + seg(ah, mpRiskColor("high"), "▲ " + mt("สูง (ยังไม่แก้)", "high (open)")) + seg(Math.max(0, bt - at), "var(--st-good)", "✔ " + mt("แก้ไขแล้ว", "corrected"))
      : `<span class="muted-s">✔ ${mt("ไม่มีข้อเสี่ยงสูง/วิกฤต", "no high / critical items")}</span>`;
    const cnt = noData ? "" : edited
      ? `✖ ${bc}→<b>${ac}</b> · ▲ ${bh}→<b>${ah}</b>`
      : `✖ <b>${ac}</b> · ▲ <b>${ah}</b> <span class="muted-s">(${mt("ยังไม่แก้ไข", "not edited")})</span>`;
    return `<div class="aft-row"><div class="aft-top"><span class="aft-name" title="${mpEsc(u.name)}">${mpEsc(u.name)}</span>
        <span class="aft-pct${blink ? " blink" : ""}" ${blink ? `style="color:${mpScoreColor(a.pct)}"` : ""}>${noData || fixed === null ? "" : mt("แก้ไขแล้ว ", "corrected ") + fixed.toFixed(1) + "%"}</span></div>
      <div class="stack-track">${bar}</div>
      <div class="aft-line">${cnt ? `<span>${cnt}</span>` : ""}<span class="muted-s">${mpUpdShort(last)}</span></div></div>`;
  }).join("");
  return `<div class="aft-box">
    ${html || `<div class="muted-s">${mt("ยังไม่มีหน่วยงาน", "No units")}</div>`}</div>`;
}

// ================================================= SAFETY FIRST board ===
const MP_SAFETY = { start: "2026-01-01", target: 365 };
const MpSafeUI = { scope: null };
const mpDayNum = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
function mpIsAccident(c) { return c.type === "incident" || (!c.type && /incident|accident|อุบัติเหตุ/i.test(c.source || "")); }
/** unitIds: accidents recorded against those units; null = every accident (whole group, incl. ones with no unit) */
function mpSafetyStats(unitIds) {
  const today = todayISO();
  const t0 = mpDayNum(today), s0 = mpDayNum(MP_SAFETY.start);
  const bIds = accessibleBuildings().map((b) => b.id);
  const dates = DB.get("capas", []).filter((c) => bIds.includes(c.buildingId) && mpIsAccident(c) && (!unitIds || unitIds.includes(c.unitId)))
    .map((c) => c.occurredDate || c.openedDate).filter((d) => d && d >= MP_SAFETY.start && d <= today).sort();
  if (!dates.length) { const d = Math.max(0, t0 - s0 + 1); return { last: null, days: d, best: d, count: 0 }; }
  let best = 0, prev = s0;
  dates.forEach((d) => { const n = mpDayNum(d); best = Math.max(best, n - prev); prev = n; });
  const days = t0 - prev;
  return { last: dates[dates.length - 1], days, best: Math.max(best, days), count: dates.length };
}
const mpBoxes = (n, min) => String(Math.max(0, n)).padStart(min || 3, "0").split("").map((d) => `<span class="sf-box">${d}</span>`).join("");

function renderSafetyBoard(host) {
  if (!host) return;
  const units = DB.get("mpUnits", []);
  mpDashScopeUnits();                       // normalises MpDashUI.scope

  const pct = Math.min(100, (S.days / MP_SAFETY.target) * 100);

        <text font-size="10.5" font-weight="700" fill="var(--st-good)" text-anchor="middle"><textPath href="#sf-top" startOffset="50%">${mt("ปลอดภัยไว้ก่อน", "SAFETY")}</textPath></text>
        <text font-size="9.5" font-weight="700" fill="var(--st-good)" text-anchor="middle" letter-spacing="1"><textPath href="#sf-bot" startOffset="50%">SAFETY FIRST</textPath></text>
        <path d="M43 30h14v13h13v14H57v13H43V57H30V43h13z" fill="var(--st-good)"/></svg></div>
    </div>
    <div class="sf-scope"><select id="sf-scope" aria-label="${mt("ขอบเขต", "Scope")}"><option value="ALL" ${scope === "ALL" ? "selected" : ""}>${mt("ทั้งเครือ BBG", "Whole BBG group")}</option>${units.map((u) => `<option value="${u.id}" ${scope === u.id ? "selected" : ""}>${mpEsc(u.name)}</option>`).join("")}</select>
      <span class="muted-s">${mt("นับตั้งแต่", "Counting from")} ${mpFmtDate(MP_SAFETY.start)} · ${mt("คำนวณอัตโนมัติจาก CAPA / Incident", "auto-calculated from CAPA / Incident")}</span></div>
    <div class="sf-row sf-red"><div>${mt("เกิดอุบัติเหตุครั้งสุดท้ายเมื่อ", "Last accident occurred")}<small>LAST ACCIDENT OCCURRED</small></div>
      <div class="sf-date" data-tip="${mpEsc(name)}">${S.last ? mpFmtDate(S.last) : "– " + mt("ไม่มี", "none")}</div></div>
    <div class="sf-two">
      <div class="sf-row sf-blue"><div>${mt("เราทำงานมาแล้ว", "We have operated")}<small>WE HAVE OPERATED</small></div><div class="sf-num">${mpBoxes(S.days)}<span>${mt("วัน", "days")}<small>DAYS</small></span></div></div>
      <div class="sf-row sf-blue"><div>${mt("เป้าหมาย", "Target")}<small>TARGET</small></div><div class="sf-num">${mpBoxes(MP_SAFETY.target)}<span>${mt("วัน", "days")}<small>DAYS</small></span></div></div>
    </div>

    <div class="sf-prog" data-tip="${mpEsc(name)}\n${S.days}/${MP_SAFETY.target} ${mt("วัน", "days")}"><div class="stack-track"><div class="seg" style="flex:${Math.max(pct, 0.5)};background:var(--st-good);"></div><div style="flex:${Math.max(100 - pct, 0)}"></div></div>
      <span class="muted-s">${hit ? "✔ " + mt("ถึงเป้าหมายแล้ว", "Target reached") : `${pct.toFixed(0)}% ${mt("ของเป้าหมาย", "of target")}`} · ${name} · ${mt("อุบัติเหตุ", "accidents")} ${S.count}</span></div>
    <details class="sf-by"><summary>${mt("แยกรายหน่วยงาน", "By unit")}</summary>
      <table class="mon-table"><thead><tr><th>${mt("หน่วยงาน", "Unit")}</th><th>${mt("วันปลอดอุบัติเหตุ", "Days safe")}</th><th>${mt("ครั้งล่าสุด", "Last")}</th><th>${mt("สูงสุด", "Best")}</th><th>${mt("ครั้ง", "No.")}</th></tr></thead><tbody>${rows}</tbody></table></details>
  </div>`;
  host.querySelector("#sf-scope").addEventListener("change", (e) => {

    mpDashRefresh(); renderSafetyBoard(host);
  });
  if (!host._tips) { mpWireTips(host); host._tips = true; }
}

// ------------------------------------------------------------------ data helpers ---
const drrEsc = (s) => mpEsc(s === null || s === undefined ? "" : String(s));
const drrNum = (v) => { const n = parseFloat(String(v).replace(/,/g, "")); return isNaN(n) ? null : n; };
const drrFmt = (n, dec) => (n === null || n === undefined || isNaN(n) ? "–" : Number(n).toLocaleString("en-US", { maximumFractionDigits: dec === undefined ? 0 : dec, minimumFractionDigits: dec || 0 }));
const drrYearOf = (r) => Number(String((r.d || {}).date || "").slice(0, 4)) || 0;
const drrMonthOf = (r) => Number(String((r.d || {}).date || "").slice(5, 7)) || 0;
function drrAll(report) { return DB.get("drrRecords", []).filter((r) => r.report === report); }
function drrScoped(report) {
  return drrAll(report).filter((r) => drrYearOf(r) === DrrUI.year && (DrrUI.site === "ALL" || (r.d.site || "") === DrrUI.site));
}
function drrYears() {
  const ys = new Set([new Date().getFullYear()]);
  DB.get("drrRecords", []).forEach((r) => { const y = drrYearOf(r); if (y) ys.add(y); });
  return [...ys].sort((a, b) => b - a);
}
function drrSiteList(report) {
  const base = report === "food" ? DRR_FOOD_SITES : report === "ww" ? Object.keys(DRR_WW_SITES) : report === "tw" ? DRR_BU : DB.get("mpUnits", []).map((u) => u.name).concat(["BITEC", "Retail"]);
  const used = drrAll(report).map((r) => r.d.site).filter(Boolean);
  return [...new Set(base.concat(used))];
}
function drrSave(rec) {
  rec.by = State.user ? State.user.username : "";
  rec.byName = mpUserLabel();
  rec.at = new Date().toISOString();
  const all = DB.get("drrRecords", []);
  const i = all.findIndex((r) => r.id === rec.id);

/**
 * sync.js
 * Central data sync through the same Google Apps Script web app used for backup.
 * Why: data is otherwise kept in each browser's own storage, so an Admin on another computer
 * cannot see what a unit entered. With sync on, every computer pushes its changes to the
 * Google Sheet (tabs d_*) and pulls everybody else's, so Admin sees all of it.
 *
 *  - record level, last writer wins (compared by the `_u` time stamp that DB.set puts on records)
 *  - deletions travel as tombstones
 *  - photos are uploaded to the sheet (tab _photos) and fetched on demand
 *  - users / passwords are NOT synced
 * Connection: the Admin copies a "team connection code" (URL + token) from the Backup page and
 * each user pastes it once in Settings.
 */

const SyncMgr = {
  _busy: false,
  _timer: null,
  _deb: null,
  _listeners: [],

  cfg() { return Object.assign({ url: "", token: "", on: false }, DB.get("syncCfg", {})); },
  saveCfg(c) { DB.set("syncCfg", c); },
  meta() { return DB.get("syncMeta", {}); },
  saveMeta(p) { DB.set("syncMeta", Object.assign(this.meta(), p)); },
  enabled() { const c = this.cfg(); return !!(c.on && BackupMgr.validUrl(c.url) && c.token); },

  // ---- connection code ----
  makeCode(url, token) {
    return "QSHE1." + btoa(unescape(encodeURIComponent(JSON.stringify({ u: url, t: token }))));
  },
  parseCode(code) {
    const m = String(code || "").trim().match(/^QSHE1\.([A-Za-z0-9+/=]+)$/);
    if (!m) throw new Error(mt("รหัสเชื่อมต่อไม่ถูกต้อง", "Invalid connection code"));
    let o;
    try { o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (e) { throw new Error(mt("รหัสเชื่อมต่อไม่ถูกต้อง", "Invalid connection code")); }
    if (!o || !BackupMgr.validUrl(o.u) || !o.t) throw new Error(mt("รหัสเชื่อมต่อไม่ถูกต้อง", "Invalid connection code"));
    return { url: o.u, token: o.t };
  },
  /** low-level call using the sync connection (never the blind fallback) */
  async call(payload) {
    const c = this.cfg();
    if (!BackupMgr.validUrl(c.url) || !c.token) throw new Error(mt("ยังไม่ได้เชื่อมต่อ", "Not connected"));
    const r = await fetch(c.url.trim(), { method: "POST", body: JSON.stringify(Object.assign({ token: c.token }, payload)), headers: { "Content-Type": "text/plain;charset=utf-8" } });
    return r.json();
  },
  connect(code) {
    const o = this.parseCode(code);
    this.saveCfg({ url: o.url, token: o.token, on: true });
    // the same connection also serves backups
    const b = BackupMgr.cfg();
    if (!b.url) BackupMgr.saveCfg(Object.assign(b, { url: o.url, token: o.token, auto: false }));
    DB.set("syncMeta", {});
    return this.run(true);
  },
  disconnect() { this.saveCfg(Object.assign(this.cfg(), { on: false })); this.paint(); },

  // ---- scheduling ----
  schedule() {
    if (!this.enabled()) return;
    clearTimeout(this._deb);
    this._deb = setTimeout(() => this.run(), 4000);
  },
  start() {
    if (this._timer) return;
    this._timer = setInterval(() => { if (!document.hidden) this.run(); }, 120000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) this.run(); });
    this.run();
  },
  onChange(fn) { this._listeners.push(fn); },

  // ---- main sync ----
  async run(first) {
    if (!this.enabled() || this._busy) return;
    this._busy = true; this.paint("busy");
    const started = new Date().toISOString();
    try {
      const meta = this.meta();
      const init = !meta.initialized;
      let since = init ? 0 : meta.since || 0;
      let res;
      if (init) {
        // 1) pull everything that already exists centrally (central copy wins)
        res = await this.call({ action: "sync", since: 0, changes: {}, deletes: [] });
        if (!res.ok) throw new Error(res.error || "sync failed");
        const serverIds = {};
        Object.keys(res.changes || {}).forEach((c) => (res.changes[c] || []).forEach((r) => { serverIds[c + "|" + r.id] = 1; }));
        (res.deletes || []).forEach((d) => { serverIds[d.c + "|" + d.id] = 1; });
        this.applyRemote(res);
        // 2) local records the centre has never seen are stamped so they get uploaded
        DB.SYNC.forEach((c) => {
          const arr = DB.get(c, []);
          let touched = false;
          arr.forEach((r) => { if (r && r.id && !r._u && !serverIds[c + "|" + r.id]) { r._u = started; touched = true; } });
          if (touched) DB.set(c, arr, { raw: true });
        });
        since = res.serverTime;
        this.saveMeta({ initialized: true, since, lastPush: "" });
      }
      // push changes made since the last push
      const m2 = this.meta();
      const lastPush = m2.lastPush || "";
      const changes = {};
      let any = false;
      DB.SYNC.forEach((c) => {
        const list = DB.get(c, []).filter((r) => r && r.id && r._u && r._u > lastPush);
        if (list.length) { changes[c] = list; any = true; }
      });
      const tomb = DB.get("syncTomb", []);
      res = await this.call({ action: "sync", since, changes, deletes: tomb });
      if (!res.ok) throw new Error(res.error === "unknown action" ? mt("สคริปต์ Apps Script เป็นเวอร์ชันเก่า — วางโค้ดใหม่และ Deploy เวอร์ชันใหม่", "Apps Script is an old version — paste the new code and deploy a new version") : res.error || "sync failed");
      this.applyRemote(res);
      // tombstones that were delivered can go
      DB.set("syncTomb", DB.get("syncTomb", []).filter((t) => t._u > started), { raw: true });
      this.saveMeta({ since: res.serverTime, lastPush: started, lastAt: new Date().toISOString(), status: "ok", lastError: "" });
      await this.syncPhotos(res.photoKeys || []);
      this.paint();
      if (typeof drrAfterSync === "function") drrAfterSync();
      this._listeners.forEach((fn) => { try { fn(); } catch (e) { /* ignore */ } });
    } catch (e) {
      this.saveMeta({ status: "error", lastError: e.message || String(e) });
      this.paint();
    } finally {
      this._busy = false;
    }
  },

  applyRemote(res) {
    let changed = false;
    Object.keys(res.changes || {}).forEach((c) => {
      if (!DB.SYNC.includes(c)) return;
      const local = DB.get(c, []);
      const map = {};
      local.forEach((r, i) => { map[r.id] = i; });
      (res.changes[c] || []).forEach((rec) => {
        const i = map[rec.id];
        if (i === undefined) { local.push(rec); map[rec.id] = local.length - 1; changed = true; }
        else if ((local[i]._u || "") < (rec._u || "")) { local[i] = rec; changed = true; }
      });
      DB.set(c, local, { raw: true });
    });
    (res.deletes || []).forEach((d) => {
      if (!DB.SYNC.includes(d.c)) return;
      const local = DB.get(d.c, []);
      const i = local.findIndex((r) => r.id === d.id);
      if (i >= 0 && (local[i]._u || "") < d._u) { local.splice(i, 1); DB.set(d.c, local, { raw: true }); changed = true; }
    });
    return changed;
  },

  // ---- photos ----
  async syncPhotos(serverKeys) {
    if (!MpImg.available()) return;
    const meta = this.meta();
    const up = meta.photoUp || {};
    const srv = {};
    serverKeys.forEach((k) => { srv[k] = 1; });
    const local = await MpImg.allKeys();
    const localSet = {};
    local.forEach((k) => { localSet[k] = 1; });
    // uploaded earlier but now gone from the centre -> removed by someone else
    for (const k of local) { if (up[k] && !srv[k]) { await MpImg.del(k, true); delete up[k]; localSet[k] = 0; } }
    // photos removed locally while online
    const delQ = meta.photoDel || [];
    for (const k of delQ) { try { await this.call({ action: "photoDel", key: k }); } catch (e) { break; } }
    // upload up to 6 new ones per run
    let n = 0;
    for (const k of local) {
      if (!localSet[k] || up[k] || n >= 6) continue;
      const data = await MpImg.get(k);
      if (!data) continue;
      const r = await this.call({ action: "photoPut", key: k, data });
      if (r.ok) { up[k] = 1; n++; }
    }
    this.saveMeta({ photoUp: up, photoDel: [], serverPhotoKeys: serverKeys });
  },
  /** download photos of one unit / visit that exist centrally but not on this computer */
  async fetchPhotos(prefix) {
    if (!this.enabled() || !MpImg.available()) return 0;
    const keys = (this.meta().serverPhotoKeys || []).filter((k) => k.startsWith(prefix));
    const have = {};
    (await MpImg.allKeys()).forEach((k) => { have[k] = 1; });
    const up = this.meta().photoUp || {};
    let got = 0;
    for (const k of keys) {
      if (have[k]) continue;
      try {
        const r = await this.call({ action: "photoGet", key: k });
        if (r.ok && r.data) { await MpImg.put(k, r.data, true); up[k] = 1; got++; }
      } catch (e) { break; }
    }
    if (got) this.saveMeta({ photoUp: up });
    return got;
  },
  queuePhotoDelete(key) {
    if (!this.enabled()) return;
    const m = this.meta();
    const up = m.photoUp || {};
    if (up[key]) { delete up[key]; this.saveMeta({ photoUp: up, photoDel: (m.photoDel || []).concat(key) }); this.schedule(); }
  },

  // ---- status line in the sidebar ----
  paint(state) {
    const el = document.getElementById("sync-status");
    if (!el) return;
    const c = this.cfg();
    const m = this.meta();
    if (!c.on) { el.innerHTML = `<span title="${mt("ข้อมูลเก็บในเครื่องนี้เท่านั้น", "Data is kept on this computer only")}">○ ${mt("ไม่ได้เชื่อมข้อมูลกลาง", "Local only")}</span>`; return; }
    if (state === "busy") { el.innerHTML = `⟳ ${mt("กำลังซิงก์…", "Syncing…")}`; return; }
    if (m.status === "error") { el.innerHTML = `<span title="${mpEsc(m.lastError || "")}">▲ ${mt("ซิงก์ไม่สำเร็จ", "Sync failed")}</span>`; return; }
    const t = m.lastAt ? new Date(m.lastAt).toLocaleTimeString(mt("th-TH", "en-GB"), { hour: "2-digit", minute: "2-digit" }) : "–";
    el.innerHTML = `✔ ${mt("ซิงก์แล้ว", "Synced")} ${t}`;
  }
};

/**
 * backup.js
 * Backup / restore so data kept in the browser (localStorage + IndexedDB photos) is not lost.
 *   A. JSON backup file  – everything incl. users and photos; download any time, restore from file
 *   B. Google Sheet      – via a Google Apps Script web app the owner deploys; one tab per dataset
 *                          plus a restorable snapshot; runs on a button press or automatically
 *                          every 7 days (checked whenever an admin has the app open)
 *   C. CSV               – per-dataset export (same datasets as Export / Reports)
 * A static web page cannot run in the background, so the "every 7 days" check happens when an
 * admin opens the app (and hourly while it stays open).
 */

const BACKUP_DAYS = 7;
const BACKUP_KEYS = ["buildings", "processStatus", "okrs", "kpis", "capas", "mpPlans", "mpUnits", "mpScores", "mpForms", "drrRecords", "drrCfg", "lang", "uiPrefs", "moduleVisibility"];
// "users" is only in the JSON file backup (it holds passwords). Never sent to Google Sheets.

const BackupMgr = {
  cfg() { return Object.assign({ url: "", token: "", auto: true }, DB.get("backupCfg", {})); },
  saveCfg(c) { DB.set("backupCfg", c); },
  meta() { return DB.get("backupMeta", {}); },
  saveMeta(patch) { DB.set("backupMeta", Object.assign(this.meta(), patch)); },
  lastAt() {
    const m = this.meta();
    return [m.fileAt, m.sheetAt].filter(Boolean).sort().pop() || null;
  },
  daysSince(iso) { return iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : Infinity; },
  isOverdue() { return this.daysSince(this.lastAt()) >= BACKUP_DAYS; },
  validUrl(u) { return /^https:\/\/script\.google(usercontent)?\.com\//.test(String(u || "").trim()); },
  newToken() {
    const a = new Uint8Array(18);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.from(a, (b) => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
  },

  // ---------- collect / apply ----------
  async collect(opts) {
    const keys = {};
    const list = opts.users ? ["users"].concat(BACKUP_KEYS) : BACKUP_KEYS;
    list.forEach((k) => { keys[k] = DB.get(k, null); });
    const out = { app: "PSD eNGINNo QSHE Management", version: "1.0", exportedAt: new Date().toISOString(), by: State.user ? State.user.username : "", keys };
    if (opts.photos && MpImg.available()) {
      const rows = await MpImg._tx("readonly", (st) => st.getAll());
      out.photos = {};
      (rows || []).forEach((r) => { out.photos[r.key] = r.data; });
    }
    return out;
  },
  async apply(snap, opts) {
    if (!snap || typeof snap !== "object" || !snap.keys || typeof snap.keys !== "object") throw new Error("invalid backup");
    const allowed = ["users"].concat(BACKUP_KEYS);
    Object.keys(snap.keys).forEach((k) => {
      if (!allowed.includes(k)) return;
      if (k === "users" && !opts.users) return;
      if (snap.keys[k] !== null) DB.set(k, snap.keys[k]);
    });
    if (snap.photos && MpImg.available()) {
      await MpImg._tx("readwrite", (st) => { st.clear(); Object.keys(snap.photos).forEach((k) => st.put({ key: k, data: snap.photos[k] })); });
    }
  },
  tables() {
    const t = {};
    Object.keys(DATASETS).forEach((k) => {
      const ds = DATASETS[k];
      t[k] = { headers: ds.headers.map((h) => h.label), rows: ds.rows().map((r) => ds.headers.map((h) => (r[h.key] === undefined || r[h.key] === null ? "" : r[h.key]))) };
    });
    // user list for reference only – no passwords
    t.users = { headers: ["username", "name", "role", "status", "buildings"], rows: DB.get("users", []).map((u) => [u.username, u.name, u.role, u.status || "active", (u.buildingIds || []).join(" ")]) };
    return t;
  },

  // ---------- Google Apps Script ----------
  async call(payload) {
    const c = this.cfg();
    if (!this.validUrl(c.url)) throw new Error(mt("URL ของ Apps Script ไม่ถูกต้อง (ต้องขึ้นต้นด้วย https://script.google.com/)", "Invalid Apps Script URL (must start with https://script.google.com/)"));
    if (!c.token) throw new Error(mt("ยังไม่ได้ตั้งรหัสลับ (Token)", "Token is empty"));
    const body = JSON.stringify(Object.assign({ token: c.token }, payload));
    const init = { method: "POST", body, headers: { "Content-Type": "text/plain;charset=utf-8" } };
    try {
      const r = await fetch(c.url.trim(), init);
      return await r.json();
    } catch (e) {
      if (payload.action !== "save") throw new Error(mt("เชื่อมต่อไม่ได้ ตรวจสอบ URL / การ Deploy (Who has access = Anyone)", "Cannot connect. Check the URL and deployment (Who has access = Anyone)"));
      // response not readable (CORS) – send once more blind so the write still happens
      await fetch(c.url.trim(), Object.assign({}, init, { mode: "no-cors" }));
      return { ok: true, unconfirmed: true };
    }
  },
  async backupToSheet(reason) {
    const snapshot = await this.collect({ users: false, photos: false });
    const res = await this.call({ action: "save", reason: reason || "manual", by: snapshot.by, tables: this.tables(), snapshot });
    if (!res.ok) throw new Error(res.error || "failed");
    this.saveMeta({ sheetAt: new Date().toISOString(), sheetStatus: res.unconfirmed ? "unconfirmed" : "ok", sheetReason: reason || "manual" });
    return res;
  },
  async autoCheck() {
    if (!State.user || !Auth.isAdmin(State.user)) return;
    const c = this.cfg();
    if (!c.auto || !this.validUrl(c.url) || !c.token) return;
    if (this.daysSince(this.meta().sheetAt) < BACKUP_DAYS) return;
    try {
      await this.backupToSheet("auto");
      toast(mt("สำรองข้อมูลไป Google Sheet อัตโนมัติแล้ว", "Automatic Google Sheet backup done"));
    } catch (e) {
      this.saveMeta({ sheetStatus: "error: " + e.message });
    }
    if (State.view === "backup") renderView();
  },
  startTimer() {
    if (this._timer) return;
    this._timer = setInterval(() => this.autoCheck(), 3600 * 1000);
  },
  /** banner shown on every page for admins when the last backup is older than 7 days */
  bannerHtml() {
    if (!State.user || !Auth.isAdmin(State.user) || State.view === "backup" || !this.isOverdue()) return "";
    const last = this.lastAt();
    const txt = last
      ? mt(`ยังไม่ได้สำรองข้อมูลมา ${Math.floor(this.daysSince(last))} วันแล้ว (เกณฑ์ ${BACKUP_DAYS} วัน)`, `No backup for ${Math.floor(this.daysSince(last))} days (limit ${BACKUP_DAYS})`)
      : mt("ยังไม่เคยสำรองข้อมูล", "No backup has been made yet");
    return `<div class="mp-banner" id="backup-banner">▲ ${txt} <button class="btn small" id="backup-banner-go" style="margin-left:10px;">${mt("ไปหน้าสำรองข้อมูล", "Go to Backup")}</button></div>`;
  }
};

const APPS_SCRIPT_CODE = `/**
 * PSD eNGINNo QSHE Management - Google Sheet backend  (script version 4)
 *  - backup tabs + _Snapshot (restore)
 *  - central data sync (tabs d_*), so Admin sees everything entered on every computer
 *  - photo storage (tab _photos)
 *  - readable report tabs R_* for the DATA RECORD REPORT module (action reportSheet)
 * Paste into Extensions > Apps Script of the Google Sheet, then Deploy > New deployment > Web app
 * (Execute as: Me, Who has access: Anyone).  After editing: Deploy > Manage deployments > New version.
 */
const TOKEN = '__TOKEN__';   // must equal the Token in the app
const VERSION = 4;
const CHUNK = 45000;         // one cell holds at most 50,000 characters
const MAXCH = 8;             // max cells per record / photo
const COLLS = ['buildings', 'processStatus', 'okrs', 'kpis', 'capas', 'mpPlans', 'mpUnits', 'mpScores', 'mpForms', 'accessLog', 'drrRecords'];

function doPost(e) {
  try {
    var p = JSON.parse(e.postData.contents);
    if (!p.token || p.token !== TOKEN) return out_({ ok: false, error: 'bad token' });
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    switch (p.action) {
      case 'ping': return out_({ ok: true, sheet: ss.getName(), version: VERSION });
      case 'latest': return out_(readSnapshot_(ss));
      case 'save': return out_(save_(ss, p));
      case 'sync': return out_(withLock_(function () { return sync_(ss, p); }));
      case 'photoPut': return out_(withLock_(function () { return photoPut_(ss, p); }));
      case 'photoGet': return out_(photoGet_(ss, p));
      case 'reportSheet': return out_(withLock_(function () { return reportSheet_(ss, p); }));
      case 'photoDel': return out_(withLock_(function () { return photoDel_(ss, p); }));
    }
    return out_({ ok: false, error: 'unknown action' });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  }
}

function withLock_(fn) {
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try { return fn(); } finally { lock.releaseLock(); }
}

/* ---------- backup (unchanged from version 1) ---------- */
function save_(ss, p) {
  var names = Object.keys(p.tables || {});
  names.forEach(function (n) { writeTable_(ss, n, p.tables[n]); });
  var snap = sheet_(ss, '_Snapshot');
  snap.clear();
  var json = JSON.stringify(p.snapshot || {});
  var rows = [['savedAt', new Date().toISOString()]];
  for (var i = 0, k = 1; i < json.length; i += CHUNK, k++) rows.push([String(k), json.substr(i, CHUNK)]);
  snap.getRange(1, 1, rows.length, 2).setNumberFormat('@').setValues(rows);
  sheet_(ss, '_Log').appendRow([new Date(), String(p.by || ''), String(p.reason || ''), names.length + ' tables']);
  return { ok: true, tables: names.length };
}
function readSnapshot_(ss) {
  var snap = ss.getSheetByName('_Snapshot');
  if (!snap) return { ok: false, error: 'no snapshot yet' };
  var v = snap.getDataRange().getValues();
  if (v.length < 2) return { ok: false, error: 'no snapshot yet' };
  var json = v.slice(1).map(function (r) { return r[1]; }).join('');
  return { ok: true, savedAt: v[0][1], snapshot: JSON.parse(json) };
}
function writeTable_(ss, name, t) {
  var sh = sheet_(ss, name);
  sh.clear();
  var data = [t.headers].concat(t.rows || []).map(function (r) {
    return r.map(function (c) { return c === null || c === undefined ? '' : String(c); });
  });
  var rng = sh.getRange(1, 1, data.length, t.headers.length);
  rng.setNumberFormat('@');            // plain text: nothing is evaluated as a formula
  rng.setValues(data);
  sh.setFrozenRows(1);
  sh.getRange(1, 1, 1, t.headers.length).setFontWeight('bold');
}

/* ---------- central data sync: one row per record, last writer wins ---------- */
function dataSheet_(ss, c) {
  var sh = ss.getSheetByName('d_' + c);
  if (!sh) {
    sh = ss.insertSheet('d_' + c);
    sh.getRange(1, 1, 1, 4).setValues([['id', 'updated', 'server', 'deleted']]);
    sh.getRange('A:L').setNumberFormat('@');
    sh.setFrozenRows(1);
  }
  return sh;
}
function chunk_(json) {
  if (json.length > CHUNK * MAXCH) throw new Error('record too large');
  var out = [];
  for (var i = 0; i < json.length; i += CHUNK) out.push(json.substr(i, CHUNK));
  return out;
}
function pad_(row) { while (row.length < 4 + MAXCH) row.push(''); return row; }

function sync_(ss, p) {
  var now = Date.now();
  var since = Number(p.since || 0);
  var res = { ok: true, serverTime: now, changes: {}, deletes: [], photoKeys: [] };
  COLLS.forEach(function (c) {
    var sh = dataSheet_(ss, c);
    var n = Math.max(sh.getLastRow() - 1, 0);
    var meta = n ? sh.getRange(2, 1, n, 4).getValues() : [];
    var idx = {};
    meta.forEach(function (r, i) { idx[String(r[0])] = i; });
    var appendRows = [];
    var incoming = ((p.changes || {})[c]) || [];
    incoming.forEach(function (rec) {
      if (!rec || !rec.id) return;
      var i = idx[rec.id];
      if (i !== undefined && String(meta[i][1]) >= String(rec._u)) return;      // server copy is newer
      var row = pad_([rec.id, rec._u, String(now), '0'].concat(chunk_(JSON.stringify(rec))));
      if (i !== undefined) { sh.getRange(i + 2, 1, 1, row.length).setValues([row]); meta[i] = [rec.id, rec._u, String(now), '0']; }
      else { idx[rec.id] = meta.length + appendRows.length; meta.push([rec.id, rec._u, String(now), '0']); appendRows.push(row); }
    });
    (p.deletes || []).forEach(function (d) {
      if (d.c !== c || !d.id) return;
      var i = idx[d.id];
      var row = pad_([d.id, d._u, String(now), '1']);
      if (i !== undefined) {
        if (String(meta[i][1]) >= String(d._u)) return;
        sh.getRange(i + 2, 1, 1, row.length).setValues([row]); meta[i] = [d.id, d._u, String(now), '1'];
      } else { idx[d.id] = meta.length + appendRows.length; meta.push([d.id, d._u, String(now), '1']); appendRows.push(row); }
    });
    if (appendRows.length) sh.getRange(sh.getLastRow() + 1, 1, appendRows.length, 4 + MAXCH).setValues(appendRows);
    // what changed on the server since the client's last sync
    var list = [];
    meta.forEach(function (r, i) {
      if (Number(r[2]) > since) {
        if (String(r[3]) === '1') res.deletes.push({ c: c, id: String(r[0]), _u: String(r[1]) });
        else {
          var cells = sh.getRange(i + 2, 5, 1, MAXCH).getValues()[0].join('');
          try { list.push(JSON.parse(cells)); } catch (e) {}
        }
      }
    });
    if (list.length) res.changes[c] = list;
  });
  var ph = ss.getSheetByName('_photos');
  if (ph && ph.getLastRow() > 1) res.photoKeys = ph.getRange(2, 1, ph.getLastRow() - 1, 1).getValues().map(function (r) { return String(r[0]); });
  return res;
}

/* ---------- photos (stored as base64 text in _photos) ---------- */
function photoSheet_(ss) {
  var sh = ss.getSheetByName('_photos');
  if (!sh) { sh = ss.insertSheet('_photos'); sh.getRange(1, 1, 1, 2).setValues([['key', 'saved']]); sh.getRange('A:J').setNumberFormat('@'); sh.setFrozenRows(1); }
  return sh;
}
function photoRow_(sh, key) {
  var n = Math.max(sh.getLastRow() - 1, 0);
  if (!n) return -1;
  var keys = sh.getRange(2, 1, n, 1).getValues();
  for (var i = 0; i < n; i++) if (String(keys[i][0]) === key) return i + 2;
  return -1;
}
function photoPut_(ss, p) {
  if (!p.key || !p.data) return { ok: false, error: 'missing key/data' };
  var sh = photoSheet_(ss);
  var row = pad_([p.key, new Date().toISOString()].concat(chunk_(String(p.data)))).slice(0, 2 + MAXCH);
  var r = photoRow_(sh, p.key);
  if (r > 0) sh.getRange(r, 1, 1, row.length).setValues([row]);
  else sh.getRange(sh.getLastRow() + 1, 1, 1, row.length).setValues([row]);
  return { ok: true };
}
function photoGet_(ss, p) {
  var sh = ss.getSheetByName('_photos');
  var r = sh ? photoRow_(sh, p.key) : -1;
  if (r < 0) return { ok: false, error: 'not found' };
  return { ok: true, data: sh.getRange(r, 3, 1, MAXCH).getValues()[0].join('') };
}
function photoDel_(ss, p) {
  var sh = ss.getSheetByName('_photos');
  var r = sh ? photoRow_(sh, p.key) : -1;
  if (r > 0) sh.deleteRow(r);
  return { ok: true };
}

/* ---------- DATA RECORD REPORT: readable tabs (version 4) ----------
 * Controls: only whitelisted report keys, bounded size, one writer at a time (lock),
 * each tab is rewritten in full from the app's synced data (d_drrRecords stays the source of truth),
 * every write is logged in _Log. Do not type into R_* tabs - changes there are overwritten. */
var REPORT_KEYS = { lp: 'R_LivePlay_Incidents', tw: 'R_Township_Incidents', food: 'R_Food_Testing', ww: 'R_Wastewater', ts1: 'R_TS1_Daily', ts2: 'R_TS2_Monthly' };
var REPORT_MAX_ROWS = 5000, REPORT_MAX_COLS = 60, REPORT_MAX_CELL = 2000;
function reportSheet_(ss, p) {
  var list = p.reports || [], done = [], total = 0;
  list.forEach(function (r) {
    var name = REPORT_KEYS[String(r.key)];
    if (!name) return;                                   // unknown report key: ignored
    var cols = (r.columns || []).slice(0, REPORT_MAX_COLS);
    var rows = (r.rows || []).slice(0, REPORT_MAX_ROWS);
    var data = [cols].concat(rows.map(function (row) {
      var o = [];
      for (var i = 0; i < cols.length; i++) {
        var v = row[i]; v = v === null || v === undefined ? '' : String(v);
        o.push(v.length > REPORT_MAX_CELL ? v.slice(0, REPORT_MAX_CELL) : v);
      }
      return o;
    }));
    var sh = sheet_(ss, name);
    sh.clear();
    sh.getRange(1, 1, data.length, cols.length).setNumberFormat('@').setValues(data);
    sh.getRange(1, 1, 1, cols.length).setFontWeight('bold').setBackground('#e8eef7');
    sh.setFrozenRows(1);
    done.push(name); total += rows.length;
  });
  sheet_(ss, '_Log').appendRow([new Date(), String(p.by || ''), 'reportSheet', done.length + ' tabs / ' + total + ' rows']);
  return { ok: true, tabs: done.length, rows: total };
}

function sheet_(ss, name) { return ss.getSheetByName(name) || ss.insertSheet(name); }
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
`;

    BackupMgr.saveCfg(cfg); msg(mt("บันทึกการตั้งค่าแล้ว", "Settings saved"));
  });
  const syCopy = document.getElementById("sy-copy");
  if (syCopy) syCopy.addEventListener("click", () => { const i = document.getElementById("sy-code-show"); i.select(); try { navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand("copy"); } toast(mt("คัดลอกแล้ว", "Copied")); });
  const syStart = document.getElementById("sy-start");
  if (syStart) syStart.addEventListener("click", async () => { syStart.disabled = true; await SyncMgr.connect(SyncMgr.makeCode(c.url, c.token)); renderBackup(root); });
  const syRun = document.getElementById("sy-run");
  if (syRun) syRun.addEventListener("click", async () => { syRun.disabled = true; await SyncMgr.run(); renderBackup(root); });
  document.getElementById("bk-test").addEventListener("click", async (e) => {
    const cfg = readCfg();
    if (cfg.url && !BackupMgr.validUrl(cfg.url)) return msg(mt("URL ต้องขึ้นต้นด้วย https://script.google.com/", "URL must start with https://script.google.com/"), true);
    BackupMgr.saveCfg(cfg); busy(e.target, true); msg(mt("กำลังทดสอบ…", "Testing…"));
    try { const r = await BackupMgr.call({ action: "ping" }); r.ok ? msg(mt("เชื่อมต่อสำเร็จ — ชีต: ", "Connected — sheet: ") + (r.sheet || "")) : msg(r.error === "bad token" ? mt("Token ไม่ตรงกับในโค้ด Apps Script", "Token does not match the Apps Script code") : String(r.error), true); }
    catch (err) { msg(err.message, true); }
    busy(e.target, false);
  });
  document.getElementById("bk-now").addEventListener("click", async (e) => {
    BackupMgr.saveCfg(readCfg()); busy(e.target, true); msg(mt("กำลังสำรองข้อมูล…", "Backing up…"));
    try { const r = await BackupMgr.backupToSheet("manual"); toast(mt("สำรองข้อมูลแล้ว", "Backup done")); renderBackup(root); document.getElementById("bk-msg").textContent = r.unconfirmed ? mt("ส่งข้อมูลแล้ว แต่เบราว์เซอร์อ่านผลตอบกลับไม่ได้ — เปิด Google Sheet ตรวจสอบ", "Sent, but the reply could not be read — open the Google Sheet to verify") : mt("สำรองสำเร็จ", "Backup succeeded"); }
    catch (err) { msg(err.message === "bad token" ? mt("Token ไม่ตรงกับในโค้ด Apps Script", "Token does not match the Apps Script code") : err.message, true); busy(e.target, false); }
  });
  document.getElementById("bk-restore-sheet").addEventListener("click", async (e) => {
    BackupMgr.saveCfg(readCfg()); busy(e.target, true); msg(mt("กำลังดึงข้อมูลล่าสุดจาก Google Sheet…", "Fetching the latest snapshot…"));
    try {
      const r = await BackupMgr.call({ action: "latest" });
      if (!r.ok) throw new Error(r.error || "failed");
      if (!confirm(mt(`กู้คืนข้อมูลจากสแนปช็อตเมื่อ ${r.savedAt}?\nข้อมูลปัจจุบันของ OKR/KPI/CAPA/Master Plan ฯลฯ จะถูกแทนที่ (ผู้ใช้และรูปภาพไม่ถูกแตะต้อง)`, `Restore the snapshot from ${r.savedAt}?\nCurrent OKR/KPI/CAPA/Master Plan etc. will be replaced (users and photos are untouched).`))) { busy(e.target, false); return msg(""); }
      await BackupMgr.apply(r.snapshot, { users: false });
      toast(mt("กู้คืนแล้ว", "Restored")); renderShell(); renderTopbar(); renderBackup(root);
    } catch (err) { msg(err.message, true); busy(e.target, false); }
  });
  document.getElementById("bk-download").addEventListener("click", async () => {
    const snap = await BackupMgr.collect({ users: true, photos: document.getElementById("bk-photos").checked });
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    ExportUtil.download(`QSHE_backup_${stamp}.json`, JSON.stringify(snap), "application/json;charset=utf-8");
    BackupMgr.saveMeta({ fileAt: new Date().toISOString() });
    toast(mt("ดาวน์โหลดไฟล์สำรองแล้ว", "Backup file downloaded"));
    renderBackup(root);
  });
  document.getElementById("bk-restore-file").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      const snap = JSON.parse(await f.text());
      if (snap.app !== "PSD eNGINNo QSHE Management" || !snap.keys) throw new Error(mt("ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบนี้", "This is not a backup file of this app"));
      const hasUsers = !!snap.keys.users;
      if (!confirm(mt(`กู้คืนจากไฟล์ (สำรองเมื่อ ${snap.exportedAt})?\nข้อมูลปัจจุบันทั้งหมด${hasUsers ? " รวมถึงผู้ใช้" : ""}${snap.photos ? " และรูปภาพ" : ""}จะถูกแทนที่ ควรดาวน์โหลดไฟล์สำรองปัจจุบันก่อน`, `Restore from file (made ${snap.exportedAt})?\nAll current data${hasUsers ? " including users" : ""}${snap.photos ? " and photos" : ""} will be replaced. Consider downloading a current backup first.`))) return;
      await BackupMgr.apply(snap, { users: true });
      toast(mt("กู้คืนแล้ว กำลังรีโหลด…", "Restored, reloading…"));
      setTimeout(() => { Auth.logout(); location.reload(); }, 700);
    } catch (err) { msg(err.message || mt("อ่านไฟล์ไม่ได้", "Could not read the file"), true); }
  });
  root.querySelectorAll("[data-csv]").forEach((b) => b.addEventListener("click", () => {
    const ds = DATASETS[b.dataset.csv];
    ExportUtil.exportCSV(ds.rows(), ds.headers, "QSHE_" + b.dataset.csv);
  }));
}

/**
 * app.js
 * PSD eNGINNo QSHE Management V1.0 — main application logic.
 * Vanilla JS SPA, localStorage-backed. See README.md for architecture notes.
 */

const State = {
  user: null,
  view: "dashboard",
  activeBuilding: null // building id, or "ALL"
};

// ---------------------------------------------------------------- boot ---
document.addEventListener("DOMContentLoaded", () => {
  DB.ensureSeeded();
  applyUiPrefs();
  const session = Auth.currentUser();
  if (session) {
    startApp(session);
  } else {
    showLogin();
  }
});

function applyUiPrefs() {
  const prefs = DB.get("uiPrefs", { font: "plex", fontSize: "md", theme: "light" });
  const fontDef = FONT_OPTIONS.find((f) => f.id === prefs.font) || FONT_OPTIONS[0];
  const sizeDef = FONT_SIZE_OPTIONS.find((s) => s.id === prefs.fontSize) || FONT_SIZE_OPTIONS[1];
  document.documentElement.style.setProperty("--app-font", fontDef.stack);
  document.documentElement.style.setProperty("--app-font-size", sizeDef.px);
  document.body.classList.remove("theme-dark", "theme-ocean");
  if (prefs.theme === "dark") document.body.classList.add("theme-dark");
  if (prefs.theme === "ocean") document.body.classList.add("theme-ocean");
}

function showLogin() {
  document.getElementById("app-shell").classList.add("hidden");
  document.getElementById("login-screen").classList.remove("hidden");

  const loginCard = document.getElementById("login-card");
  const registerCard = document.getElementById("register-card");

  // populate the "requested building" dropdown on the register form
  const buildingSelect = document.getElementById("reg-building");
  const buildings = DB.get("buildings", []);
  buildingSelect.innerHTML =
    `<option value="">ยังไม่ระบุ — ให้ผู้ดูแลระบบกำหนด</option>` +
    buildings.map((b) => `<option value="${b.id}">${b.name}</option>`).join("");

  document.getElementById("show-register-btn").addEventListener("click", () => {
    loginCard.classList.add("hidden");
    registerCard.classList.remove("hidden");
  });
  document.getElementById("show-login-btn").addEventListener("click", () => {
    registerCard.classList.add("hidden");
    loginCard.classList.remove("hidden");
  });

  wirePasswordToggle("toggle-login-pw", "login-password");
  wirePasswordToggle("toggle-reg-pw", "reg-password");

  document.getElementById("login-form").onsubmit = (e) => {
    e.preventDefault();
    const username = document.getElementById("login-username").value;
    const password = document.getElementById("login-password").value;
    const res = Auth.login(username, password);
    const errEl = document.getElementById("login-error");
    if (!res.ok) {
      errEl.textContent = res.error;
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    startApp(res.user);
  };

  document.getElementById("register-form").onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById("reg-name").value;
    const username = document.getElementById("reg-username").value;
    const password = document.getElementById("reg-password").value;
    const buildingId = document.getElementById("reg-building").value;
    const errEl = document.getElementById("register-error");
    const okEl = document.getElementById("register-success");
    const res = Auth.register({ name, username, password, buildingId });
    if (!res.ok) {
      okEl.classList.add("hidden");
      errEl.textContent = res.error;
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    okEl.textContent = "ส่งคำขอลงทะเบียนเรียบร้อย รอผู้ดูแลระบบอนุมัติสิทธิ์การใช้งาน";
    okEl.classList.remove("hidden");
    document.getElementById("register-form").reset();
  };
}

function wirePasswordToggle(btnId, inputId) {
  const btn = document.getElementById(btnId);
  const input = document.getElementById(inputId);
  btn.addEventListener("click", () => {
    input.type = input.type === "password" ? "text" : "password";
  });
}

function startApp(user) {
  State.user = user;
  const buildings = DB.get("buildings", []);
  State.activeBuilding = user.buildingIds.includes("ALL")
    ? (buildings[0] ? buildings[0].id : "ALL")
    : user.buildingIds[0];

  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("app-shell").classList.remove("hidden");
  mpMigrate();
  MpImg.migrate().catch(() => {});
  renderShell();
  navigate("dashboard");
  SyncMgr.onChange(() => { if (["dashboard", "mp_plan", "mp_risk", "mp_check", "mp_form", "drr_lp", "drr_tw", "drr_food", "drr_ww", "drr_ts"].includes(State.view) && !document.getElementById("modal-overlay") && !document.activeElement?.closest?.("input,textarea,select")) renderView(); });
  SyncMgr.start();
  BackupMgr.autoCheck();
  BackupMgr.startTimer();
}

function logout() {
  Auth.logout();
  State.user = null;
  // give the central sync a moment to publish the sign-out, then reload
  let p = Promise.resolve();
  try { if (typeof SyncMgr !== "undefined" && SyncMgr.enabled()) p = Promise.race([SyncMgr.run(), new Promise((r) => setTimeout(r, 2500))]); } catch (e) { /* ignore */ }
  p.catch(() => {}).then(() => location.reload());
}

function renderShell() {
  const sidebar = document.getElementById("sidebar");
  const isAdmin = Auth.isAdmin(State.user);
  const initials = State.user.name ? State.user.name.slice(0, 2) : "US";
  const moduleVisibility = DB.get("moduleVisibility", {});
  const lang = DB.get("lang", "th");

  let nav = "";
  NAV_ITEMS.forEach((group) => {
    if (group.admin && !isAdmin) return;
    if (group.visKey && moduleVisibility[group.visKey] === false) return;
    const items = group.isModuleGroup
      ? group.items.filter((it) => moduleVisibility[it.id] !== false)
      : group.items;
    if (!items.length) return;
    nav += `<div class="nav-group-label">${t(group.groupKey)}</div>`;
    items.forEach((it) => {
      nav += `<button class="nav-item" data-nav="${it.id}"><span class="dot"></span>${t(it.labelKey)}</button>`;
    });
  });

  sidebar.innerHTML = `
    <div class="brand-logo"><img src="${LOGO_DATA_URI}" alt="Bhiraj Buri Group" /></div>
    <div class="brand">
