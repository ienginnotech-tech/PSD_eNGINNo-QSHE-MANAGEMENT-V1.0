<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSD eNGINNo — QSHE Management V1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PSD eNGINNo QSHE Management — stylesheet
   Palette ties back to the QSHE framework document:
   deep green (structure/authority) + warm gold (attention/accent)
   ========================================================================== */

:root {
  --dark-green: #12492F;
  --green: #1F7A4D;
  --green-soft: #E8F3EC;
  --gold: #C9992A;
  --gold-soft: #FBF1DD;
  --bg: #F3F5F4;
  --card: #FFFFFF;
  --text: #1C2622;
  --muted: #5C6B65;
  --border: #E1E7E4;
  --red: #C0392B;
  --red-soft: #FBEAE8;
  --yellow: #B9871A;
  --yellow-soft: #FBF1DD;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(18, 73, 47, 0.06), 0 4px 14px rgba(18, 73, 47, 0.06);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "IBM Plex Sans Thai", "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; }

a { color: var(--green); }

.hidden { display: none !important; }

/* ---------- Login / Register screen (dark, blue-green tech theme) ---------- */
:root {
  --auth-bg-1: #050C0A;
  --auth-bg-2: #081C17;
  --auth-card: #0E1B17;
  --auth-card-border: rgba(140, 210, 190, 0.14);
  --auth-text: #E9F5F0;
  --auth-muted: #7FA398;
  --auth-input-bg: #0A1613;
  --auth-input-border: rgba(140, 210, 190, 0.16);
  --accent-emerald: #2FEAA8;
  --accent-azure: #38B6FF;
  --accent-gradient: linear-gradient(90deg, var(--accent-emerald), var(--accent-azure));
}

#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  background:
    radial-gradient(circle at 20% 15%, rgba(47, 234, 168, 0.10), transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(56, 182, 255, 0.10), transparent 45%),
    radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(180deg, var(--auth-bg-1) 0%, var(--auth-bg-2) 100%);
  background-size: auto, auto, 22px 22px, auto;
  color: var(--auth-text);
}

.auth-page { width: 100%; max-width: 420px; }

.auth-header { text-align: center; margin-bottom: 26px; }
.eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--accent-emerald);
  margin-bottom: 14px;
}
.eyebrow-dot { color: var(--accent-azure); }
.auth-title {
  font-family: "JetBrains Mono", monospace;
  font-size: 30px;
  font-weight: 700;
  margin: 0;
  color: #F4FBF8;
  letter-spacing: 0.01em;
}
.auth-title .accent {
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.auth-sub {
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  color: var(--auth-muted);
  margin-top: 10px;
  letter-spacing: 0.05em;
}

.auth-card {
  background: var(--auth-card);
  border: 1px solid var(--auth-card-border);
  border-radius: 16px;
  padding: 28px 26px 24px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.45);
}

.auth-error {
  background: rgba(224, 82, 82, 0.12);
  border: 1px solid rgba(224, 82, 82, 0.35);
  color: #FF9B9B;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}
.auth-success {
  background: rgba(47, 234, 168, 0.10);
  border: 1px solid rgba(47, 234, 168, 0.35);
  color: var(--accent-emerald);
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}

.field-dark { margin-bottom: 16px; }
.field-dark label {
  display: block;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--auth-muted);
  margin-bottom: 7px;
}
.field-dark input, .field-dark select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 9px;
  border: 1px solid var(--auth-input-border);
  background: var(--auth-input-bg);
  color: var(--auth-text);
}
.field-dark select { color: var(--auth-muted); }
.field-dark input::placeholder { color: #4E6B62; }
.field-dark input:focus, .field-dark select:focus {
  outline: none;
  border-color: var(--accent-emerald);
  box-shadow: 0 0 0 3px rgba(47, 234, 168, 0.14);
}

.password-wrap { position: relative; }
.password-wrap input { padding-right: 42px; }
.eye-toggle {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--auth-muted);
  cursor: pointer;
  padding: 4px;
  display: flex;
}
.eye-toggle:hover { color: var(--accent-emerald); }

.btn-glow {
  width: 100%;
  padding: 13px 16px;
  border-radius: 10px;
  border: none;
  background: var(--accent-gradient);
  color: #04140F;
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
  box-shadow: 0 8px 26px rgba(47, 234, 168, 0.28), 0 8px 26px rgba(56, 182, 255, 0.14);
  transition: transform 0.05s ease, box-shadow 0.15s ease;
}
.btn-glow:hover { box-shadow: 0 10px 32px rgba(47, 234, 168, 0.4), 0 10px 32px rgba(56, 182, 255, 0.22); }
.btn-glow:active { transform: translateY(1px); }

/* Generic light-theme field (used in modal forms across the app) */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--dark-green);
  margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--green);
  outline-offset: 1px;
  border-color: var(--green);
}

.btn-outline-dark {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid var(--auth-input-border);
  background: rgba(255,255,255,0.02);
  color: var(--auth-text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.btn-outline-dark:hover { border-color: var(--accent-azure); color: #fff; }

.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0;
  color: var(--auth-muted);
  font-size: 12px;
}
.auth-divider::before, .auth-divider::after {
  content: ""; flex: 1; height: 1px;
  background: var(--auth-input-border);
}

.auth-hint {
  margin-top: 16px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--auth-muted);
  background: rgba(47, 234, 168, 0.06);
  border: 1px solid rgba(47, 234, 168, 0.14);
  border-radius: 9px;
  padding: 10px 12px;
}
.auth-hint strong { color: var(--accent-emerald); }

.auth-footer {
  text-align: center;
  margin-top: 22px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--auth-muted);
  letter-spacing: 0.04em;
}
.auth-footer .accent { color: var(--accent-emerald); font-weight: 700; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: var(--green);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
}
.btn:hover { background: var(--dark-green); }
.btn:active { transform: translateY(1px); }
.btn.block { width: 100%; }
.btn.ghost {
  background: transparent;
  color: var(--dark-green);
  border-color: var(--border);
}
.btn.ghost:hover { background: var(--green-soft); }
.btn.danger { background: var(--red); }
.btn.danger:hover { background: #9c2e22; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.gold { background: var(--gold); color: var(--dark-green); }
.btn.gold:hover { background: #b3861f; }

.login-error {
  background: var(--red-soft);
  color: var(--red);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 12px;
}

.login-hint {
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
  background: var(--green-soft);
  border-radius: 8px;
  padding: 10px 12px;
}

/* ---------- App shell ---------- */
#app-shell {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
}

#sidebar {
  background: var(--dark-green);
  color: #EAF3EE;
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 6px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  margin-bottom: 14px;
}
.brand .mark {
  width: 34px; height: 34px;
  background: var(--gold);
  color: var(--dark-green);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  font-size: 13px;
  flex-shrink: 0;
}
.brand .name { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
.brand .ver { font-size: 11px; color: #9FC2AC; }

.nav-group-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #83A893;
  margin: 14px 8px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 7px;
  color: #D8EADD;
  cursor: pointer;
  font-size: 13.5px;
  margin-bottom: 2px;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,0.08); }
.nav-item.active {
  background: var(--green);
  color: #fff;
  font-weight: 600;
}
.nav-item .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; opacity: 0.5;
}

#sidebar-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.12);
}
.user-chip {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: #C9E0D1;
  padding: 6px;
}
.user-chip .avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--gold); color: var(--dark-green);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px;
}

/* ---------- Main area ---------- */
#main {
  padding: 22px 28px 40px;
  min-width: 0;
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
  flex-wrap: wrap;
}

#topbar h2 {
  margin: 0;
  font-size: 20px;
  color: var(--dark-green);
}
#topbar .subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}

.building-select {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
}
.building-select label { font-size: 12px; color: var(--muted); }
.building-select select { border: none; font-weight: 600; color: var(--dark-green); }
.building-select select:focus { outline: none; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}

.card h3 {
  margin: 0 0 4px;
  font-size: 15px;
  color: var(--dark-green);
}
.card .desc { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

.grid { display: grid; gap: 14px; }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

@media (max-width: 980px) {
  .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.stat-card .label { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.stat-card .value { font-size: 26px; font-weight: 700; color: var(--dark-green); }
.stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th {
  text-align: left;
  background: var(--green-soft);
  color: var(--dark-green);
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  white-space: nowrap;
}
tbody td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
tbody tr:hover td { background: #FAFCFB; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.badge.green { background: var(--green-soft); color: var(--green); }
.badge.gold { background: var(--gold-soft); color: var(--yellow); }
.badge.red { background: var(--red-soft); color: var(--red); }
.badge.grey { background: #EEF1EF; color: var(--muted); }

.status-select, .rag-select {
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 12.5px;
  font-weight: 600;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.toolbar .filters { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar select, .toolbar input[type="text"] {
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid var(--border);
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--dark-green);
  margin: 18px 0 8px;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
}
.section-title:first-child { border-top: none; padding-top: 0; margin-top: 0; }

.fms-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: var(--gold);
  border-radius: 5px;
  padding: 1px 6px;
  margin-right: 6px;
}

/* form modal */
.overlay {
  position: fixed; inset: 0;
  background: rgba(10, 30, 20, 0.45);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  z-index: 50;
}
.modal {
  background: #fff;
  border-radius: 12px;
  width: 100%;
  max-width: 560px;
  padding: 22px 24px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal h3 { margin-top: 0; color: var(--dark-green); }
.modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

.kr-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.kr-row input[type="text"] { flex: 1; }
.kr-row input[type="number"] { width: 70px; }

.checkbox-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.checkbox-pill {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 12.5px;
}

.empty-state {
  text-align: center;
  padding: 30px 10px;
  color: var(--muted);
  font-size: 13.5px;
}

.icon-btn {
  border: none;
  background: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  padding: 4px 6px;
  border-radius: 6px;
}
.icon-btn:hover { background: var(--green-soft); color: var(--green); }
.icon-btn.danger:hover { background: var(--red-soft); color: var(--red); }

.toast {
  position: fixed;
  bottom: 20px; right: 20px;
  background: var(--dark-green);
  color: #fff;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13.5px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  z-index: 100;
  animation: toast-in 0.18s ease;
}
@keyframes toast-in {
  from { transform: translateY(8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.progress-bar {
  width: 100%; height: 7px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
}
.progress-bar > span {
  display: block; height: 100%;
  background: var(--green);
}

/* ---------- Responsive: collapse sidebar to top bar ---------- */
@media (max-width: 860px) {
  #app-shell { grid-template-columns: 1fr; }
  #sidebar {
    flex-direction: row;
    align-items: center;
    overflow-x: auto;
    padding: 10px 12px;
  }
  .brand { border-bottom: none; margin-bottom: 0; padding: 0 10px 0 0; }
  .nav-group-label { display: none; }
  #sidebar nav { display: flex; gap: 4px; }
  .nav-item { white-space: nowrap; }
  #sidebar-footer { margin-top: 0; margin-left: 8px; border-top: none; padding-top: 0; }
  .modal .form-row { grid-template-columns: 1fr; }
}

</style>
</head>
<body>

  <!-- ===================== LOGIN / REGISTER SCREEN ===================== -->
  <div id="login-screen">
    <div class="auth-page">
      <div class="auth-header">
        <div class="eyebrow">PSD <span class="eyebrow-dot">•</span> eNGINNo</div>
        <h1 class="auth-title">QSHE <span class="accent">Management</span></h1>
        <div class="auth-sub">Platform · V1.0 · 2026</div>
      </div>

      <!-- ---- Login card ---- -->
      <div class="auth-card" id="login-card">
        <div id="login-error" class="auth-error hidden"></div>

        <form id="login-form">
          <div class="field-dark">
            <label>USERNAME</label>
            <input type="text" id="login-username" autocomplete="username" placeholder="ชื่อผู้ใช้" required />
          </div>
          <div class="field-dark">
            <label>PASSWORD</label>
            <div class="password-wrap">
              <input type="password" id="login-password" autocomplete="current-password" placeholder="รหัสผ่าน" required />
              <button type="button" class="eye-toggle" id="toggle-login-pw" aria-label="แสดง/ซ่อนรหัสผ่าน">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-glow block">เข้าสู่ระบบ</button>
        </form>

        <div class="auth-divider"><span>หรือ</span></div>
        <button class="btn-outline-dark block" id="show-register-btn" type="button">ลงทะเบียนผู้ใช้ใหม่</button>

        <div class="auth-hint">
          บัญชีผู้ดูแลระบบเริ่มต้น: <strong>admin</strong> / <strong>qshe2026</strong>
        </div>
      </div>

      <!-- ---- Register card ---- -->
      <div class="auth-card hidden" id="register-card">
        <div id="register-error" class="auth-error hidden"></div>
        <div id="register-success" class="auth-success hidden"></div>

        <form id="register-form">
          <div class="field-dark">
            <label>ชื่อ-นามสกุล</label>
            <input type="text" id="reg-name" placeholder="ชื่อ นามสกุล" required />
          </div>
          <div class="field-dark">
            <label>USERNAME</label>
            <input type="text" id="reg-username" placeholder="ตั้งชื่อผู้ใช้" required />
          </div>
          <div class="field-dark">
            <label>PASSWORD</label>
            <div class="password-wrap">
              <input type="password" id="reg-password" placeholder="ตั้งรหัสผ่าน" required />
              <button type="button" class="eye-toggle" id="toggle-reg-pw" aria-label="แสดง/ซ่อนรหัสผ่าน">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

/**
 * storage.js
 * Thin wrapper around localStorage so the rest of the app never touches
 * localStorage directly. Swap this file's internals for a real backend
 * (REST/API) later without changing app.js call sites.
 */

const DB_PREFIX = "qshe_";

const DB = {
  _key(name) {
    return DB_PREFIX + name;
  },
  get(name, fallback) {
    try {
      const raw = localStorage.getItem(this._key(name));
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      console.error("DB.get failed for", name, e);
      return fallback;
    }
  },
  set(name, value) {
    try {
      localStorage.setItem(this._key(name), JSON.stringify(value));
      return true;
    } catch (e) {
      console.error("DB.set failed for", name, e);
      return false;
    }
  },
  ensureSeeded() {
    if (this.get("users", null) === null) this.set("users", SEED.users);
    if (this.get("buildings", null) === null) this.set("buildings", SEED.buildings);
    if (this.get("processStatus", null) === null) this.set("processStatus", SEED.processStatus);
    if (this.get("okrs", null) === null) this.set("okrs", SEED.okrs);
    if (this.get("kpis", null) === null) this.set("kpis", SEED.kpis);
    if (this.get("capas", null) === null) this.set("capas", SEED.capas);
  },
  resetAll() {
    ["users", "buildings", "processStatus", "okrs", "kpis", "capas", "session"].forEach((k) =>
      localStorage.removeItem(this._key(k))
    );
    this.ensureSeeded();
  }
};

function uid(prefix) {
  return (prefix || "id") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}


/**
 * auth.js
 * Minimal client-side auth for a static/local deployment.
 *
 * SECURITY NOTE: this checks the username/password against a list stored in
 * the browser's localStorage. It is meant for an internal, trusted-network
 * prototype (e.g. an intranet kiosk or a single-team tool), NOT for
 * production use with sensitive data on the public internet — anyone with
 * browser dev tools can read localStorage. Wire this up to a real backend
 * (API + hashed passwords + sessions) before using it beyond a demo.
 */

const Auth = {
  currentUser() {
    return DB.get("session", null);
  },
  login(username, password) {
    const users = DB.get("users", []);
    const match = users.find(
      (u) => u.username.toLowerCase() === String(username).trim().toLowerCase() && u.password === password
    );
    if (!match) return { ok: false, error: "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง" };
    if (match.status === "pending") {
      return { ok: false, error: "บัญชีนี้ยังรอการอนุมัติจากผู้ดูแลระบบ กรุณาติดต่อผู้ดูแลระบบ" };
    }
    const session = { id: match.id, username: match.username, name: match.name, role: match.role, buildingIds: match.buildingIds };
    DB.set("session", session);
    return { ok: true, user: session };
  },
  register({ username, password, name, buildingId }) {
    username = String(username || "").trim();
    name = String(name || "").trim();
    if (!username || !password || !name) return { ok: false, error: "กรุณากรอกข้อมูลให้ครบถ้วน" };
    const users = DB.get("users", []);
    if (users.some((u) => u.username.toLowerCase() === username.toLowerCase())) {
      return { ok: false, error: "มีชื่อผู้ใช้นี้อยู่แล้วในระบบ" };
    }
    users.push({
      id: uid("u"),
      username,
      password,
      name,
      role: "pending",
      status: "pending",
      buildingIds: buildingId ? [buildingId] : []
    });
    DB.set("users", users);
    return { ok: true };
  },
  logout() {
    localStorage.removeItem(DB_PREFIX + "session");
  },
  isAdmin(user) {
    return !!user && user.role === "admin";
  },
  canAccessBuilding(user, buildingId) {
    if (!user) return false;
    if (user.buildingIds.includes("ALL")) return true;
    return user.buildingIds.includes(buildingId);
  }
};


/**
 * export.js
 * CSV export (works everywhere, opens cleanly in Excel/Sheets) and a
 * print-friendly report view (browser's native "Save as PDF" via print).
 */

const ExportUtil = {
  toCSV(rows, headers) {
    const esc = (v) => {
      if (v === null || v === undefined) return "";
      const s = String(v).replace(/"/g, '""');
      return /[",\n]/.test(s) ? `"${s}"` : s;
    };
    const lines = [];
    lines.push(headers.map((h) => esc(h.label)).join(","));
    rows.forEach((row) => {
      lines.push(headers.map((h) => esc(row[h.key])).join(","));
    });
    // BOM so Thai text opens correctly in Excel
    return "\uFEFF" + lines.join("\r\n");
  },
  download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  exportCSV(rows, headers, filename) {
    const csv = this.toCSV(rows, headers);
    this.download(filename.endsWith(".csv") ? filename : filename + ".csv", csv);
  },
  printSection(html, title) {
    const win = window.open("", "_blank", "width=900,height=1000");
    win.document.write(`
      <html lang="th">
      <head>
        <meta charset="utf-8" />
        <title>${title}</title>
        <style>
          body { font-family: 'IBM Plex Sans Thai', sans-serif; padding: 32px; color:#1a1a1a; }
          h1 { font-size: 20px; color:#12492F; border-bottom:2px solid #1F7A4D; padding-bottom:8px; }
          table { width:100%; border-collapse: collapse; margin-top:16px; }
          th, td { border:1px solid #ccc; padding:6px 10px; font-size:13px; text-align:left; }
          th { background:#1F7A4D; color:#fff; }
          tr:nth-child(even) td { background:#f3f8f5; }
          .meta { color:#666; font-size:12px; margin-bottom:4px; }
        </style>
      </head>
      <body>${html}</body>
      </html>
    `);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);
  }
};

  });

  wirePasswordToggle("toggle-login-pw", "login-password");

  document.getElementById("login-form").onsubmit = (e) => {
    e.preventDefault();
    const username = document.getElementById("login-username").value;
    const password = document.getElementById("login-password").value;

    const errEl = document.getElementById("login-error");

      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    startApp(res.user);
  };

  document.getElementById("register-form").onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById("reg-name").value;
    const username = document.getElementById("reg-username").value;
    const password = document.getElementById("reg-password").value;
    const buildingId = document.getElementById("reg-building").value;
    const errEl = document.getElementById("register-error");
    const okEl = document.getElementById("register-success");
    const res = Auth.register({ name, username, password, buildingId });
    if (!res.ok) {
      okEl.classList.add("hidden");
      errEl.textContent = res.error;
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    okEl.textContent = "ส่งคำขอลงทะเบียนเรียบร้อย รอผู้ดูแลระบบอนุมัติสิทธิ์การใช้งาน";
    okEl.classList.remove("hidden");
    document.getElementById("register-form").reset();
  };
}

              ${Auth.isAdmin(State.user) ? `<option value="ALL">ทุกอาคาร (รวม)</option>` : ""}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function renderView() {
  const root = document.getElementById("view-root");
  switch (State.view) {
    case "dashboard": return renderDashboard(root);
    case "structure":
    case "system":
    case "process":
    case "people":
    case "culture": return renderModuleView(root, State.view);
    case "okr": return renderOKR(root);
    case "kpi": return renderKPI(root);
    case "capa": return renderCAPA(root);
    case "buildings": return renderBuildings(root);
    case "users": return renderUsers(root);
    case "reports": return renderReports(root);
    default: root.innerHTML = "<div class='card'>ไม่พบหน้านี้</div>";
  }
}

// ------------------------------------------------------- data helpers ---
function buildingsInScope() {
  const buildings = accessibleBuildings();
  if (State.activeBuilding === "ALL") return buildings;
  return buildings.filter((b) => b.id === State.activeBuilding);
}

function getProcessStatus(buildingId, processId) {
  const all = DB.get("processStatus", []);
  return all.find((r) => r.buildingId === buildingId && r.processId === processId) || null;
}

function upsertProcessStatus(buildingId, processId, patch) {
  const all = DB.get("processStatus", []);
  const idx = all.findIndex((r) => r.buildingId === buildingId && r.processId === processId);
  if (idx >= 0) {
    all[idx] = { ...all[idx], ...patch, updatedAt: todayISO(), updatedBy: State.user.username };
  } else {
    all.push({
      id: uid("ps"),
      buildingId,
      processId,
      status: "not_started",
      note: "",
      ...patch,
      updatedAt: todayISO(),
      updatedBy: State.user.username
    });
  }
  DB.set("processStatus", all);
}

function moduleCompletion(buildingIds, moduleId) {
  const procs = PROCESS_REFERENCE.filter((p) => p.module === moduleId);
  let done = 0, inProgress = 0, total = 0;
  buildingIds.forEach((bid) => {
    procs.forEach((p) => {
      total++;
      const rec = getProcessStatus(bid, p.id);
      if (rec && rec.status === "done") done++;
      else if (rec && rec.status === "in_progress") inProgress++;
    });
  });
  return { total, done, inProgress, pct: total ? Math.round((done / total) * 100) : 0 };
}

function ragOf(kpi) {
  if (kpi.actual === null || kpi.actual === undefined || kpi.actual === "") return "grey";
  const a = parseFloat(kpi.actual), t = parseFloat(kpi.target);
  if (isNaN(a) || isNaN(t)) return "grey";
  const ratio = t === 0 ? 1 : a / t;
  if (kpi.direction === "lower_better") {
    if (a <= t) return "green";
    if (a <= t * 1.15) return "yellow";
    return "red";
  }
  if (ratio >= 1) return "green";
  if (ratio >= 0.85) return "yellow";
  return "red";
}

          return sum + avg;

        <div class="value">${Math.round((fmsDone / fmsTotal) * 100)}%</div>
        <div class="sub">${fmsDone} / ${fmsTotal} รายการ (7 แผน × อาคารในขอบเขต)</div>
      </div>
      <div class="stat-card">
        <div class="label">ความคืบหน้า OKR เฉลี่ย</div>
        <div class="value">${okrAvgProgress}%</div>
        <div class="sub">${okrs.length} OKR ในขอบเขตที่เลือก</div>
      </div>
      <div class="stat-card">
        <div class="label">CAPA ที่ยังเปิดอยู่</div>
        <div class="value">${openCapas.length}</div>
        <div class="sub" style="color:${overdueCapas.length ? "var(--red)" : "var(--muted)"}">${overdueCapas.length} รายการเกินกำหนด</div>
      </div>
    </div>

    <div class="grid cols-2">
      <div class="card">
        <h3>ความคืบหน้าแต่ละ Module (S-S-P-P-C)</h3>
        <div class="desc">อิงจากเช็คลิสต์กระบวนการที่บันทึกสถานะไว้ในระบบ</div>
        ${modulePct
          .map(
            (m) => `
          <div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
              <span>${m.nameTh} (${m.name})</span><span style="font-weight:700;color:var(--dark-green);">${m.comp.pct}%</span>
            </div>
            <div class="progress-bar"><span style="width:${m.comp.pct}%"></span></div>
          </div>`
          )
          .join("")}
      </div>

      <div class="card">
        <h3>สถานะ KPI (RAG)</h3>
        <div class="desc">สรุปสถานะตัวชี้วัดทั้งหมดในขอบเขตที่เลือก</div>
        <div class="grid cols-3" style="gap:10px;">
          <div class="stat-card" style="background:var(--green-soft);border-color:transparent;">
            <div class="label">ตามเป้า</div><div class="value" style="color:var(--green)">${ragCounts.green}</div>
          </div>
          <div class="stat-card" style="background:var(--gold-soft);border-color:transparent;">
            <div class="label">เฝ้าระวัง</div><div class="value" style="color:var(--yellow)">${ragCounts.yellow}</div>

          </div>

      </div>

function avgPct(arr) {
  if (!arr.length) return 0;
  return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
}

        ${renderMatrixTable(procs, scope)}

function renderProcessTable(procs, buildingId, label) {
  return `
    <div class="card">
      ${label ? `<h3>${label}</h3>` : ""}
      ${processTableRows(procs, buildingId, false)}

}

function processTableRows(procs, buildingId, isFms) {
  return `
    <table>
      <thead>
        <tr>
          <th>กระบวนการ</th><th>เจ้าของ</th><th>สถานะ</th><th>หมายเหตุ</th><th>อัปเดตล่าสุด</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${procs
          .map((p) => {
            const rec = getProcessStatus(buildingId, p.id) || { status: "not_started", note: "" };
            return `
            <tr data-proc="${p.id}">
              <td>${isFms ? `<span class="fms-tag">${p.fmsCode}</span>` : ""}${p.name}</td>
              <td>${p.owner}</td>
              <td>
                <select class="status-select" data-field="status">
                  <option value="not_started" ${rec.status === "not_started" ? "selected" : ""}>ยังไม่เริ่ม</option>
                  <option value="in_progress" ${rec.status === "in_progress" ? "selected" : ""}>กำลังดำเนินการ</option>
                  <option value="done" ${rec.status === "done" ? "selected" : ""}>เสร็จสมบูรณ์</option>
                </select>
              </td>
              <td><input type="text" data-field="note" value="${escapeAttr(rec.note || "")}" placeholder="หมายเหตุ..." style="width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:6px;" /></td>
              <td style="white-space:nowrap;color:var(--muted);font-size:12px;">${rec.updatedAt || "-"}</td>
              <td><button class="btn small save-proc-btn">บันทึก</button></td>
            </tr>`;
          })
          .join("")}
      </tbody>
    </table>
  `;
}

function wireProcessTable(root, buildingId) {
  root.querySelectorAll(".save-proc-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const row = btn.closest("tr");
      const processId = row.dataset.proc;
      const status = row.querySelector('[data-field="status"]').value;
      const note = row.querySelector('[data-field="note"]').value;
      upsertProcessStatus(buildingId, processId, { status, note });
      toast("บันทึกสถานะแล้ว");
      renderView();
    });
  });
}

function renderMatrixTable(procs, buildings) {
  return `
    <table>
      <thead>
        <tr><th>กระบวนการ</th>${buildings.map((b) => `<th>${b.code}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${procs
          .map(
            (p) => `
          <tr>
            <td>${p.category === "fms" ? `<span class="fms-tag">${p.fmsCode}</span>` : ""}${p.name}</td>
            ${buildings
              .map((b) => {
                const rec = getProcessStatus(b.id, p.id);
                const status = rec ? rec.status : "not_started";
                return `<td><span class="badge ${STATUS_BADGE_CLASS[status]}">${STATUS_LABELS[status]}</span></td>`;
              })
              .join("")}
          </tr>`
          )
          .join("")}
      </tbody>
    </table>
  `;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// ------------------------------------------------------------- modal ---
function openModal(innerHtml) {
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "modal-overlay";
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
  overlay.addEventListener("mousedown", (e) => {
    if (e.target === overlay) closeModal();
  });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal() {
  const el = document.getElementById("modal-overlay");
  if (el) el.remove();
}

// ---------------------------------------------------------------- OKR ---
function renderOKR(root) {
  if (State.activeBuilding === "ALL") {
    root.innerHTML = `<div class="card empty-state">เลือกอาคาร/BU หนึ่งแห่งด้านบนเพื่อดูและจัดการ OKR</div>`;
    return;
  }
  const buildingId = State.activeBuilding;
  const okrs = DB.get("okrs", []).filter((o) => o.buildingId === buildingId);
  const quarters = [...new Set(okrs.map((o) => o.quarter))].sort();

  root.innerHTML = `
    <div class="toolbar">
      <div class="filters">
        <select id="okr-quarter-filter">
          <option value="">ทุกไตรมาส</option>
          ${quarters.map((q) => `<option value="${q}">${q}</option>`).join("")}
        </select>
      </div>
      <button class="btn" id="add-okr-btn">+ เพิ่ม OKR</button>
    </div>
    <div id="okr-list"></div>
  `;

  const listEl = document.getElementById("okr-list");
  function draw() {
    const filterQ = document.getElementById("okr-quarter-filter").value;
    const items = okrs.filter((o) => !filterQ || o.quarter === filterQ);
    listEl.innerHTML = items.length
      ? items.map((o) => okrCardHtml(o)).join("")
      : `<div class="card empty-state">ยังไม่มี OKR — เริ่มเพิ่มรายการแรกได้เลย</div>`;
    listEl.querySelectorAll("[data-edit-okr]").forEach((b) =>
      b.addEventListener("click", () => openOkrForm(buildingId, okrs.find((o) => o.id === b.dataset.editOkr)))
    );
    listEl.querySelectorAll("[data-del-okr]").forEach((b) =>
      b.addEventListener("click", () => {
        if (!confirm("ลบ OKR นี้หรือไม่?")) return;
        DB.set("okrs", DB.get("okrs", []).filter((o) => o.id !== b.dataset.delOkr));
        toast("ลบแล้ว");
        renderView();
      })
    );
  }
  draw();
  document.getElementById("okr-quarter-filter").addEventListener("change", draw);
  document.getElementById("add-okr-btn").addEventListener("click", () => openOkrForm(buildingId, null));
}

function okrCardHtml(o) {
  const krs = o.keyResults || [];
  const avg = krs.length ? Math.round(krs.reduce((s, k) => s + Number(k.progress || 0), 0) / krs.length) : 0;
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <span class="badge green">${o.quarter}</span> <span class="badge grey">${o.pillar}</span>

          <div class="desc">เจ้าของ: ${o.owner || "-"}</div>
        </div>
        <div style="display:flex;gap:4px;">
          <button class="icon-btn" data-edit-okr="${o.id}">แก้ไข</button>
          <button class="icon-btn danger" data-del-okr="${o.id}">ลบ</button>
        </div>
      </div>
      <div style="margin:10px 0 6px;font-size:13px;font-weight:600;color:var(--dark-green);">ความคืบหน้ารวม: ${avg}%</div>
      <div class="progress-bar" style="margin-bottom:12px;"><span style="width:${avg}%"></span></div>
      ${krs
        .map(
          (k) => `
        <div style="margin-bottom:8px;">

        )
        .join("")}
    </div>
  `;

function openOkrForm(buildingId, existing) {
  const krs = existing ? existing.keyResults : [{ text: "", progress: 0 }, { text: "", progress: 0 }, { text: "", progress: 0 }];
  const modal = openModal(`
    <h3>${existing ? "แก้ไข OKR" : "เพิ่ม OKR ใหม่"}</h3>
    <div class="form-row">
      <div class="field">
        <label>ไตรมาส</label>
        <input type="text" id="f-quarter" placeholder="เช่น Q1-2026" value="${existing ? escapeAttr(existing.quarter) : ""}" />
      </div>
      <div class="field">
        <label>Pillar</label>
        <select id="f-pillar">
          ${PILLARS.map((p) => `<option value="${p.id}" ${existing && existing.pillar === p.id ? "selected" : ""}>${p.id} — ${p.nameTh}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="field">
      <label>Objective</label>
      <textarea id="f-objective" rows="2">${existing ? existing.objective : ""}</textarea>
    </div>
    <div class="field">
      <label>เจ้าของ (Owner)</label>
      <input type="text" id="f-owner" value="${existing ? escapeAttr(existing.owner || "") : ""}" />
    </div>
    <div class="field">
      <label>Key Results (ระบุ % ความคืบหน้า)</label>
      <div id="kr-rows"></div>
      <button class="btn ghost small" id="add-kr-row" type="button">+ เพิ่ม Key Result</button>
    </div>
    <div class="actions">
      <button class="btn ghost" id="cancel-okr">ยกเลิก</button>
      <button class="btn" id="save-okr">บันทึก</button>
    </div>
  `);

  const krRows = modal.querySelector("#kr-rows");
  function addKrRow(text, progress) {
    const row = document.createElement("div");
    row.className = "kr-row";
    row.innerHTML = `
      <input type="text" placeholder="Key Result..." value="${escapeAttr(text || "")}" />
      <input type="number" min="0" max="100" value="${progress || 0}" />
      <button class="icon-btn danger" type="button">ลบ</button>
    `;
    row.querySelector(".icon-btn").addEventListener("click", () => row.remove());
    krRows.appendChild(row);
  }
  krs.forEach((k) => addKrRow(k.text, k.progress));
  modal.querySelector("#add-kr-row").addEventListener("click", () => addKrRow("", 0));
  modal.querySelector("#cancel-okr").addEventListener("click", closeModal);

  modal.querySelector("#save-okr").addEventListener("click", () => {
    const objective = modal.querySelector("#f-objective").value.trim();
    if (!objective) { alert("กรุณาระบุ Objective"); return; }
    const keyResults = [...krRows.querySelectorAll(".kr-row")]
      .map((row) => {
        const inputs = row.querySelectorAll("input");
        return { text: inputs[0].value.trim(), progress: Math.max(0, Math.min(100, Number(inputs[1].value) || 0)) };
      })
      .filter((k) => k.text);

    const data = {
      buildingId,
      quarter: modal.querySelector("#f-quarter").value.trim() || "Q?-????",
      pillar: modal.querySelector("#f-pillar").value,
      objective,
      owner: modal.querySelector("#f-owner").value.trim(),
      keyResults
    };
    const all = DB.get("okrs", []);
    if (existing) {
      const idx = all.findIndex((o) => o.id === existing.id);
      all[idx] = { ...existing, ...data };
    } else {
      all.push({ id: uid("okr"), ...data });
    }
    DB.set("okrs", all);
    closeModal();
    toast("บันทึก OKR แล้ว");
    renderView();
  });
}

      <table id="kpi-table">
        <thead><tr><th>Pillar</th><th>ตัวชี้วัด</th><th>เป้าหมาย</th><th>ผลจริง</th><th>หน่วย</th><th>ช่วงเวลา</th><th>สถานะ</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  `;

  const tbody = root.querySelector("#kpi-table tbody");
  function draw() {
    const filterP = document.getElementById("kpi-pillar-filter").value;
    const items = kpis.filter((k) => !filterP || k.pillar === filterP);
    tbody.innerHTML = items.length
      ? items
          .map((k) => {
            const rag = ragOf(k);
            return `
          <tr>
            <td><span class="badge grey">${k.pillar}</span></td>
            <td>${k.name}</td>
            <td>${k.target}</td>
            <td>${k.actual === "" || k.actual === undefined ? "-" : k.actual}</td>
            <td>${k.unit || "-"}</td>
            <td>${k.period || "-"}</td>
            <td><span class="badge ${rag === "grey" ? "grey" : rag === "green" ? "green" : rag === "yellow" ? "gold" : "red"}">${RAG_LABELS[rag] || "ยังไม่มีข้อมูล"}</span></td>
            <td style="white-space:nowrap;">
              <button class="icon-btn" data-edit-kpi="${k.id}">แก้ไข</button>
              <button class="icon-btn danger" data-del-kpi="${k.id}">ลบ</button>
            </td>
          </tr>`;
          })
          .join("")
      : `<tr><td colspan="8" class="empty-state">ยังไม่มีข้อมูล KPI</td></tr>`;

    tbody.querySelectorAll("[data-edit-kpi]").forEach((b) =>
      b.addEventListener("click", () => openKpiForm(buildingId, kpis.find((k) => k.id === b.dataset.editKpi)))
    );
    tbody.querySelectorAll("[data-del-kpi]").forEach((b) =>
      b.addEventListener("click", () => {
        if (!confirm("ลบ KPI นี้หรือไม่?")) return;
        DB.set("kpis", DB.get("kpis", []).filter((k) => k.id !== b.dataset.delKpi));
        toast("ลบแล้ว");
        renderView();
      })
    );
  }
  draw();
  document.getElementById("kpi-pillar-filter").addEventListener("change", draw);
  document.getElementById("add-kpi-btn").addEventListener("click", () => openKpiForm(buildingId, null));
}

function openUserForm(existing, isApproval) {
  const buildings = DB.get("buildings", []);
  const selectedIds = existing ? existing.buildingIds.filter((id) => id !== "ALL") : [];
  const modal = openModal(`
    <h3>${isApproval ? "อนุมัติผู้ใช้งานใหม่" : existing ? "แก้ไขผู้ใช้งาน" : "เพิ่มผู้ใช้งานใหม่"}</h3>
    ${isApproval ? `<div class="desc" style="margin-bottom:14px;">กำหนดสิทธิ์และอาคารที่เข้าถึงได้ก่อนเปิดใช้งานบัญชีนี้</div>` : ""}
    <div class="form-row">
      <div class="field"><label>ชื่อผู้ใช้ (username)</label><input type="text" id="f-username" ${existing ? "disabled" : ""} value="${existing ? escapeAttr(existing.username) : ""}" /></div>
      <div class="field"><label>รหัสผ่าน</label><input type="text" id="f-password" placeholder="${existing ? "เว้นว่างถ้าไม่เปลี่ยน" : ""}" /></div>
    </div>
    <div class="form-row">
      <div class="field"><label>ชื่อ-นามสกุล</label><input type="text" id="f-name" value="${existing ? escapeAttr(existing.name) : ""}" /></div>
      <div class="field">
        <label>สิทธิ์การใช้งาน</label>
        <select id="f-role">
          <option value="user" ${existing && existing.role === "user" ? "selected" : ""}>ผู้ใช้งานทั่วไป</option>
          <option value="admin" ${existing && existing.role === "admin" ? "selected" : ""}>ผู้ดูแลระบบ</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>สถานะบัญชี</label>
      <select id="f-status">
        <option value="active" ${!existing || existing.status !== "pending" ? "selected" : ""}>ใช้งานได้ (Active)</option>
        <option value="pending" ${existing && existing.status === "pending" && !isApproval ? "selected" : ""}>รออนุมัติ (Pending)</option>
      </select>
    </div>
    <div class="field">
      <label>อาคาร/BU ที่เข้าถึงได้</label>
      <div class="checkbox-list" id="building-checks">
        <label class="checkbox-pill"><input type="checkbox" value="ALL" ${existing && existing.buildingIds.includes("ALL") ? "checked" : ""}/> ทุกอาคาร</label>
        ${buildings
          .map((b) => `<label class="checkbox-pill"><input type="checkbox" value="${b.id}" ${selectedIds.includes(b.id) ? "checked" : ""}/> ${b.name}</label>`)
          .join("")}
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="cancel-u">ยกเลิก</button>
      <button class="btn" id="save-u">${isApproval ? "อนุมัติและบันทึก" : "บันทึก"}</button>
    </div>
  `);
  modal.querySelector("#cancel-u").addEventListener("click", closeModal);
  modal.querySelector("#save-u").addEventListener("click", () => {
    const username = modal.querySelector("#f-username").value.trim();
    const name = modal.querySelector("#f-name").value.trim();
    if (!existing && !username) { alert("กรุณาระบุชื่อผู้ใช้"); return; }
    if (!name) { alert("กรุณาระบุชื่อ-นามสกุล"); return; }
    const checked = [...modal.querySelectorAll("#building-checks input:checked")].map((c) => c.value);
    const password = modal.querySelector("#f-password").value;
    const role = modal.querySelector("#f-role").value;
    const status = isApproval ? "active" : modal.querySelector("#f-status").value;
    const all = DB.get("users", []);
    if (existing) {
      const idx = all.findIndex((x) => x.id === existing.id);
      all[idx] = {
        ...existing,
        name,
        role,
        status,
        buildingIds: checked.length ? checked : ["ALL"],
        password: password ? password : existing.password
      };
    } else {
      if (all.some((u) => u.username.toLowerCase() === username.toLowerCase())) {
        alert("มีชื่อผู้ใช้นี้อยู่แล้ว");
        return;
      }
      all.push({
        id: uid("u"),
        username,
        password: password || "changeme",
        name,
        role,
        status,
        buildingIds: checked.length ? checked : ["ALL"]
      });
    }
    DB.set("users", all);
    closeModal();
    toast(isApproval ? "อนุมัติผู้ใช้งานแล้ว" : "บันทึกแล้ว");
    navigate("users");
  });
}

      { key: "buildingName", label: "อาคาร" },
      { key: "processName", label: "กระบวนการ" },
      { key: "status", label: "สถานะ" },
      { key: "note", label: "หมายเหตุ" },
      { key: "updatedAt", label: "อัปเดตล่าสุด" }
    ],
    rows() {
      const buildings = DB.get("buildings", []);
      return DB.get("processStatus", []).map((r) => ({
        buildingName: (buildings.find((b) => b.id === r.buildingId) || {}).name || r.buildingId,
        processName: (PROCESS_REFERENCE.find((p) => p.id === r.processId) || {}).name || r.processId,
        status: STATUS_LABELS[r.status] || r.status,
        note: r.note,
        updatedAt: r.updatedAt
      }));
    }
  },
  okrs: {
    label: "OKR",
    headers: [
      { key: "buildingName", label: "อาคาร" }, { key: "quarter", label: "ไตรมาส" }, { key: "pillar", label: "Pillar" },
      { key: "objective", label: "Objective" }, { key: "avgProgress", label: "ความคืบหน้า (%)" }, { key: "owner", label: "เจ้าของ" }
    ],
    rows() {
      const buildings = DB.get("buildings", []);
      return DB.get("okrs", []).map((o) => {
        const krs = o.keyResults || [];
        const avg = krs.length ? Math.round(krs.reduce((s, k) => s + Number(k.progress || 0), 0) / krs.length) : 0;
        return {
          buildingName: (buildings.find((b) => b.id === o.buildingId) || {}).name || o.buildingId,
          quarter: o.quarter, pillar: o.pillar, objective: o.objective, avgProgress: avg, owner: o.owner
        };
      });
    }
  },
  kpis: {
    label: "KPI",
    headers: [
      { key: "buildingName", label: "อาคาร" }, { key: "pillar", label: "Pillar" }, { key: "name", label: "ตัวชี้วัด" },
      { key: "target", label: "เป้าหมาย" }, { key: "actual", label: "ผลจริง" }, { key: "unit", label: "หน่วย" },
      { key: "period", label: "ช่วงเวลา" }, { key: "rag", label: "สถานะ" }
    ],
    rows() {
      const buildings = DB.get("buildings", []);
      return DB.get("kpis", []).map((k) => ({
        buildingName: (buildings.find((b) => b.id === k.buildingId) || {}).name || k.buildingId,
        pillar: k.pillar, name: k.name, target: k.target, actual: k.actual, unit: k.unit, period: k.period,
        rag: RAG_LABELS[ragOf(k)] || "ยังไม่มีข้อมูล"
      }));
    }
  },
  capas: {
    label: "CAPA / Incident",
    headers: [
      { key: "buildingName", label: "อาคาร" }, { key: "title", label: "เรื่อง" }, { key: "source", label: "ที่มา" },
      { key: "owner", label: "เจ้าของ" }, { key: "openedDate", label: "เปิดเมื่อ" }, { key: "dueDate", label: "กำหนดปิด" },
      { key: "status", label: "สถานะ" }
    ],
    rows() {
      const buildings = DB.get("buildings", []);
      const labels = { open: "เปิด", in_progress: "กำลังดำเนินการ", closed: "ปิดแล้ว" };
      return DB.get("capas", []).map((c) => ({
        buildingName: (buildings.find((b) => b.id === c.buildingId) || {}).name || c.buildingId,
        title: c.title, source: c.source, owner: c.owner, openedDate: c.openedDate, dueDate: c.dueDate,
        status: labels[c.status] || c.status
      }));
    }
  },
  buildings: {
    label: "อาคาร / BU",
    headers: [{ key: "code", label: "รหัส" }, { key: "name", label: "ชื่อ" }, { key: "bu", label: "หน่วยธุรกิจ" }],
    rows() { return DB.get("buildings", []); }
  }
};

function renderReports(root) {
  root.innerHTML = `
    <div class="card">
      <h3>ส่งออกข้อมูล (CSV)</h3>
      <div class="desc">เลือกชุดข้อมูลที่ต้องการ แล้วดาวน์โหลดเป็นไฟล์ CSV เปิดได้ทันทีด้วย Excel / Google Sheets</div>
      <div class="toolbar">
        <div class="filters">
          <select id="dataset-select">
            ${Object.entries(DATASETS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("")}
          </select>
        </div>
        <button class="btn" id="export-csv-btn">ดาวน์โหลด CSV</button>
      </div>
      <div id="dataset-preview"></div>
    </div>

    <div class="card">
      <h3>Executive Summary (พิมพ์ / บันทึกเป็น PDF)</h3>
      <div class="desc">สรุปภาพรวมของอาคาร/BU ที่กำลังเลือกอยู่ ในรูปแบบพร้อมพิมพ์ให้ผู้บริหาร</div>
      <button class="btn gold" id="print-summary-btn">เปิดหน้าสรุปเพื่อพิมพ์</button>
    </div>
  `;

  function drawPreview() {
    const key = document.getElementById("dataset-select").value;
    const ds = DATASETS[key];
    const rows = ds.rows();
    document.getElementById("dataset-preview").innerHTML = `
      <div style="margin-top:12px;font-size:12.5px;color:var(--muted);">พบ ${rows.length} แถว</div>
      <div style="max-height:260px;overflow:auto;margin-top:6px;">
      <table>
        <thead><tr>${ds.headers.map((h) => `<th>${h.label}</th>`).join("")}</tr></thead>
        <tbody>
          ${rows
            .slice(0, 25)
            .map((r) => `<tr>${ds.headers.map((h) => `<td>${r[h.key] ?? "-"}</td>`).join("")}</tr>`)
            .join("") || `<tr><td colspan="${ds.headers.length}" class="empty-state">ไม่มีข้อมูล</td></tr>`}
        </tbody>
      </table>
      </div>
    `;
  }
  drawPreview();
  document.getElementById("dataset-select").addEventListener("change", drawPreview);
  document.getElementById("export-csv-btn").addEventListener("click", () => {
    const key = document.getElementById("dataset-select").value;
    const ds = DATASETS[key];
    ExportUtil.exportCSV(ds.rows(), ds.headers, `qshe_${key}_${todayISO()}`);
    toast("ดาวน์โหลดไฟล์แล้ว");
  });

  document.getElementById("print-summary-btn").addEventListener("click", () => {
    const scope = buildingsInScope();
    const ids = scope.map((b) => b.id);
    const modulePct = MODULES.map((m) => ({ ...m, comp: moduleCompletion(ids, m.id) }));
    const okrs = DB.get("okrs", []).filter((o) => ids.includes(o.buildingId));
    const kpis = DB.get("kpis", []).filter((k) => ids.includes(k.buildingId));
    const capas = DB.get("capas", []).filter((c) => ids.includes(c.buildingId));
    const openCapas = capas.filter((c) => c.status !== "closed");
    const ragCounts = { green: 0, yellow: 0, red: 0, grey: 0 };
    kpis.forEach((k) => ragCounts[ragOf(k)]++);

    const html = `
      <div class="meta">PSD eNGINNo QSHE Management — Executive Summary</div>
      <h1>สรุปผลการดำเนินงาน QSHE ${State.activeBuilding === "ALL" ? "(ทุกอาคาร)" : "— " + scope[0]?.name}</h1>
      <div class="meta">วันที่จัดทำรายงาน: ${todayISO()} &nbsp;|&nbsp; จัดทำโดย: ${State.user.name}</div>
      <table>
        <thead><tr><th>Module</th><th>ความคืบหน้า</th></tr></thead>
        <tbody>${modulePct.map((m) => `<tr><td>${m.nameTh} (${m.name})</td><td>${m.comp.pct}%</td></tr>`).join("")}</tbody>
      </table>
      <table>
        <thead><tr><th>รายการ</th><th>ค่า</th></tr></thead>
        <tbody>
          <tr><td>จำนวน OKR</td><td>${okrs.length}</td></tr>
          <tr><td>KPI ตามเป้า / เฝ้าระวัง / ต้องเร่งแก้ไข</td><td>${ragCounts.green} / ${ragCounts.yellow} / ${ragCounts.red}</td></tr>
          <tr><td>CAPA ที่ยังเปิดอยู่</td><td>${openCapas.length}</td></tr>
        </tbody>
      </table>
    `;
    ExportUtil.printSection(html, "QSHE Executive Summary");
  });
}

</script>
</body>
</html>
