<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSD eNGINNo — QSHE Management V1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PSD eNGINNo QSHE Management — stylesheet
   Palette ties back to the QSHE framework document:
   deep green (structure/authority) + warm gold (attention/accent)
   ========================================================================== */

:root {
  --dark-green: #12492F;
  --brand-fixed: #12492F;
  --heading: #12492F;
  --green: #1F7A4D;
  --green-soft: #E8F3EC;
  --gold: #C9992A;
  --gold-soft: #FBF1DD;
  --bg: #F3F5F4;
  --card: #FFFFFF;
  --text: #1C2622;
  --muted: #5C6B65;
  --border: #E1E7E4;
  --red: #C0392B;
  --red-soft: #FBEAE8;
  --yellow: #B9871A;
  --yellow-soft: #FBF1DD;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(18, 73, 47, 0.06), 0 4px 14px rgba(18, 73, 47, 0.06);
  --app-font: "IBM Plex Sans Thai", "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif;
  --app-font-size: 15px;
}

/* ---------- Theme variants (toggled via body class from Settings) ---------- */
body.theme-dark {
  --bg: #0D1613;
  --card: #142420;
  --border: rgba(255,255,255,0.10);
  --text: #E7F3EF;
  --muted: #86A79B;
  --heading: #EAF7F1;
  --green: #33E6A6;
  --green-soft: rgba(51,230,166,0.14);
  --gold: #F0C24B;
  --gold-soft: rgba(240,194,75,0.16);
  --red: #FF6B6B;
  --red-soft: rgba(255,107,107,0.14);
  --yellow: #F0C24B;
  --yellow-soft: rgba(240,194,75,0.16);
  --shadow: 0 6px 22px rgba(0,0,0,0.4);
}
body.theme-ocean {
  --bg: #F1F6FA;
  --card: #FFFFFF;
  --border: #DCE7F0;
  --text: #16232E;
  --muted: #5A7080;
  --heading: #0B3D66;
  --green: #2596F0;
  --green-soft: #E3F0FC;
  --gold: #14B8A6;
  --gold-soft: #E1F7F3;
  --red: #D64545;
  --red-soft: #FBE7E7;
  --yellow: #C9820F;
  --yellow-soft: #FBF1DD;
  --shadow: 0 1px 2px rgba(11,61,102,0.06), 0 4px 14px rgba(11,61,102,0.08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--app-font);
  font-size: var(--app-font-size);
  line-height: 1.5;
  transition: background 0.15s ease, color 0.15s ease;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; }

a { color: var(--green); }

.hidden { display: none !important; }

/* ---------- Login / Register screen (dark, blue-green tech theme) ---------- */
:root {
  --auth-bg-1: #050C0A;
  --auth-bg-2: #081C17;
  --auth-card: #0E1B17;
  --auth-card-border: rgba(140, 210, 190, 0.14);
  --auth-text: #E9F5F0;
  --auth-muted: #7FA398;
  --auth-input-bg: #0A1613;
  --auth-input-border: rgba(140, 210, 190, 0.16);
  --accent-emerald: #2FEAA8;
  --accent-azure: #38B6FF;
  --accent-gradient: linear-gradient(90deg, var(--accent-emerald), var(--accent-azure));
}

#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  background:
    radial-gradient(circle at 20% 15%, rgba(47, 234, 168, 0.10), transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(56, 182, 255, 0.10), transparent 45%),
    radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(180deg, var(--auth-bg-1) 0%, var(--auth-bg-2) 100%);
  background-size: auto, auto, 22px 22px, auto;
  color: var(--auth-text);
}

.auth-page { width: 100%; max-width: 420px; }

.auth-header { text-align: center; margin-bottom: 26px; }
.eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--accent-emerald);
  margin-bottom: 14px;
}
.eyebrow-dot { color: var(--accent-azure); }
.auth-title {
  font-family: "JetBrains Mono", monospace;
  font-size: 30px;
  font-weight: 700;
  margin: 0;
  color: #F4FBF8;
  letter-spacing: 0.01em;
}
.auth-title .accent {
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.auth-sub {
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  color: var(--auth-muted);
  margin-top: 10px;
  letter-spacing: 0.05em;
}

.auth-card {
  background: var(--auth-card);
  border: 1px solid var(--auth-card-border);
  border-radius: 16px;
  padding: 28px 26px 24px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.45);
}

.auth-error {
  background: rgba(224, 82, 82, 0.12);
  border: 1px solid rgba(224, 82, 82, 0.35);
  color: #FF9B9B;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}
.auth-success {
  background: rgba(47, 234, 168, 0.10);
  border: 1px solid rgba(47, 234, 168, 0.35);
  color: var(--accent-emerald);
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}

.field-dark { margin-bottom: 16px; }
.field-dark label {
  display: block;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--auth-muted);
  margin-bottom: 7px;
}
.field-dark input, .field-dark select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 9px;
  border: 1px solid var(--auth-input-border);
  background: var(--auth-input-bg);
  color: var(--auth-text);
}
.field-dark select { color: var(--auth-muted); }
.field-dark input::placeholder { color: #4E6B62; }
.field-dark input:focus, .field-dark select:focus {
  outline: none;
  border-color: var(--accent-emerald);
  box-shadow: 0 0 0 3px rgba(47, 234, 168, 0.14);
}

.password-wrap { position: relative; }
.password-wrap input { padding-right: 42px; }
.eye-toggle {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--auth-muted);
  cursor: pointer;
  padding: 4px;
  display: flex;
}
.eye-toggle:hover { color: var(--accent-emerald); }

.btn-glow {
  width: 100%;
  padding: 13px 16px;
  border-radius: 10px;
  border: none;
  background: var(--accent-gradient);
  color: #04140F;
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
  box-shadow: 0 8px 26px rgba(47, 234, 168, 0.28), 0 8px 26px rgba(56, 182, 255, 0.14);
  transition: transform 0.05s ease, box-shadow 0.15s ease;
}
.btn-glow:hover { box-shadow: 0 10px 32px rgba(47, 234, 168, 0.4), 0 10px 32px rgba(56, 182, 255, 0.22); }
.btn-glow:active { transform: translateY(1px); }

/* Generic light-theme field (used in modal forms across the app) */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--heading);
  margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--green);
  outline-offset: 1px;
  border-color: var(--green);
}

.btn-outline-dark {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid var(--auth-input-border);
  background: rgba(255,255,255,0.02);
  color: var(--auth-text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.btn-outline-dark:hover { border-color: var(--accent-azure); color: #fff; }

.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0;
  color: var(--auth-muted);
  font-size: 12px;
}
.auth-divider::before, .auth-divider::after {
  content: ""; flex: 1; height: 1px;
  background: var(--auth-input-border);
}

.auth-hint {
  margin-top: 16px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--auth-muted);
  background: rgba(47, 234, 168, 0.06);
  border: 1px solid rgba(47, 234, 168, 0.14);
  border-radius: 9px;
  padding: 10px 12px;
}
.auth-hint strong { color: var(--accent-emerald); }

.auth-footer {
  text-align: center;
  margin-top: 22px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--auth-muted);
  letter-spacing: 0.04em;
}
.auth-footer .accent { color: var(--accent-emerald); font-weight: 700; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: var(--green);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
}
.btn:hover { background: var(--brand-fixed); }
.btn:active { transform: translateY(1px); }
.btn.block { width: 100%; }
.btn.ghost {
  background: transparent;
  color: var(--heading);
  border-color: var(--border);
}
.btn.ghost:hover { background: var(--green-soft); }
.btn.danger { background: var(--red); }
.btn.danger:hover { background: #9c2e22; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.gold { background: var(--gold); color: var(--brand-fixed); }
.btn.gold:hover { background: #b3861f; }

.login-error {
  background: var(--red-soft);
  color: var(--red);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 12px;
}

.login-hint {
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
  background: var(--green-soft);
  border-radius: 8px;
  padding: 10px 12px;
}

/* ---------- App shell ---------- */
#app-shell {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
}

#sidebar {
  background: var(--brand-fixed);
  color: #EAF3EE;
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 6px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  margin-bottom: 14px;
}
.brand .mark {
  width: 34px; height: 34px;
  background: var(--gold);
  color: var(--brand-fixed);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  font-size: 13px;
  flex-shrink: 0;
}
.brand .name { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
.brand .ver { font-size: 11px; color: #9FC2AC; }

.sidebar-toolbar {
  display: flex;
  gap: 6px;
  padding: 4px 6px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  margin-bottom: 10px;
}
.icon-chip {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 8px;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.04);
  color: #D8EADD;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.icon-chip:hover { background: rgba(255,255,255,0.1); color: #fff; }

.nav-group-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #83A893;
  margin: 14px 8px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 7px;
  color: #D8EADD;
  cursor: pointer;
  font-size: 13.5px;
  margin-bottom: 2px;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,0.08); }
.nav-item.active {
  background: var(--green);
  color: #fff;
  font-weight: 600;
}
.nav-item .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; opacity: 0.5;
}

#sidebar-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.12);
}
.user-chip {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: #C9E0D1;
  padding: 6px;
}
.user-chip .avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--gold); color: var(--brand-fixed);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px;
}

/* ---------- Main area ---------- */
#main {
  padding: 22px 28px 40px;
  min-width: 0;
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
  flex-wrap: wrap;
}

#topbar h2 {
  margin: 0;
  font-size: 20px;
  color: var(--heading);
}
#topbar .subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}

.building-select {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
}
.building-select label { font-size: 12px; color: var(--muted); }
.building-select select { border: none; font-weight: 600; color: var(--heading); background: transparent; }
.building-select select:focus { outline: none; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}

.card h3 {
  margin: 0 0 4px;
  font-size: 15px;
  color: var(--heading);
}
.card .desc { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

.grid { display: grid; gap: 14px; }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

@media (max-width: 980px) {
  .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.stat-card .label { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.stat-card .value { font-size: 26px; font-weight: 700; color: var(--heading); }
.stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th {
  text-align: left;
  background: var(--green-soft);
  color: var(--heading);
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  white-space: nowrap;
}
tbody td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
tbody tr:hover td { background: #FAFCFB; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.badge.green { background: var(--green-soft); color: var(--green); }
.badge.gold { background: var(--gold-soft); color: var(--yellow); }
.badge.red { background: var(--red-soft); color: var(--red); }
.badge.grey { background: #EEF1EF; color: var(--muted); }

.status-select, .rag-select {
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 12.5px;
  font-weight: 600;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.toolbar .filters { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar select, .toolbar input[type="text"] {
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid var(--border);
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--heading);
  margin: 18px 0 8px;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
}
.section-title:first-child { border-top: none; padding-top: 0; margin-top: 0; }

.fms-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: var(--gold);
  border-radius: 5px;
  padding: 1px 6px;
  margin-right: 6px;
}

/* form modal */
.overlay {
  position: fixed; inset: 0;
  background: rgba(10, 30, 20, 0.45);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  z-index: 50;
}
.modal {
  background: var(--card);
  border-radius: 12px;
  width: 100%;
  max-width: 560px;
  padding: 22px 24px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal h3 { margin-top: 0; color: var(--heading); }
.modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

.kr-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.kr-row input[type="text"] { flex: 1; }
.kr-row input[type="number"] { width: 70px; }

.settings-section { margin-bottom: 20px; }
.settings-section:last-child { margin-bottom: 0; }
.settings-section h4 {
  font-size: 13px;
  color: var(--heading);
  margin: 0 0 8px;
}
.option-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.option-card {
  border: 1.5px solid var(--border);
  border-radius: 9px;
  padding: 10px 8px;
  text-align: center;
  font-size: 12.5px;
  cursor: pointer;
  background: var(--card);
  color: var(--text);
}
.option-card:hover { border-color: var(--green); }
.option-card.selected {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--heading);
  font-weight: 700;
}
.option-card .swatch {
  width: 100%; height: 22px;
  border-radius: 5px;
  margin-bottom: 6px;
  border: 1px solid rgba(0,0,0,0.06);
}

.checkbox-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.checkbox-pill {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 12.5px;
}

.empty-state {
  text-align: center;
  padding: 30px 10px;
  color: var(--muted);
  font-size: 13.5px;
}

.icon-btn {
  border: none;
  background: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  padding: 4px 6px;
  border-radius: 6px;
}
.icon-btn:hover { background: var(--green-soft); color: var(--green); }
.icon-btn.danger:hover { background: var(--red-soft); color: var(--red); }

.toast {
  position: fixed;
  bottom: 20px; right: 20px;
  background: var(--brand-fixed);
  color: #fff;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13.5px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  z-index: 100;
  animation: toast-in 0.18s ease;
}
@keyframes toast-in {
  from { transform: translateY(8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.progress-bar {
  width: 100%; height: 7px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
}
.progress-bar > span {
  display: block; height: 100%;
  background: var(--green);
}

/* ---------- Responsive: collapse sidebar to top bar ---------- */
@media (max-width: 860px) {
  #app-shell { grid-template-columns: 1fr; }
  #sidebar {
    flex-direction: row;
    align-items: center;
    overflow-x: auto;
    padding: 10px 12px;
  }
  .brand { border-bottom: none; margin-bottom: 0; padding: 0 10px 0 0; }
  .nav-group-label { display: none; }
  #sidebar nav { display: flex; gap: 4px; }
  .nav-item { white-space: nowrap; }
  #sidebar-footer { margin-top: 0; margin-left: 8px; border-top: none; padding-top: 0; }
  .modal .form-row { grid-template-columns: 1fr; }
}

/* ==========================================================================

 "อุปกรณ์ สายรัดนิรภัย (Harness), รอก, สลิง, สลักล็อก (Carabiner) ได้มาตรฐานและผ่านการตรวจสภาพ", "ctx": "เครื่องเล่นปีนผา/สไลเดอร์: ชุด Harness & สลิง | สนามกีฬา: ตาข่าย/โครงโกล์", "law": "พ.ร.บ. ความปลอดภัยฯ พ.ศ. 2554 ม. 8 / มาตรฐานสากล EN/UIAA สำหรับอุปกรณ์ปีนผา"}, {"id": "3.9", "catIdx": 3, "text": "ปั๊มน้ำดับเพลิง / ปั๊มรักษาแรงดันแรงดันน้ำปกติเป็นไปตามมาตรฐาน พร้อมใช้งานไม่มีชำรุด อยู่ในโหมด Automatic", "ctx": "อาคารจอดรถ, อาคารเช่าร้านค้า, โครงการ BEAT Active/Discovery: ห้องปั๊มน้ำดับเพลิง (Fire Pump)", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับการป้องกันและระงับอัคคีภัย พ.ศ. 2555 / มาตรฐาน NFPA 20"}, {"id": "3.10", "catIdx": 3, "text": "ถังเก็บบรรจุน้ำดับเพลิงสำรองน้ำได้มากกว่า 30 นาทีตามกฎหมายกำหนด", "ctx": "อาคารจอดรถ, ศูนย์การค้า, อาคารเช่าส่วนกลาง: ถังเก็บน้ำสำรองดับเพลิง", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับการป้องกันและระงับอัคคีภัย พ.ศ. 2555 / พ.ร.บ. ควบคุมอาคาร พ.ศ. 2522"}, {"id": "4.1", "catIdx": 4, "text": "มีการทำความสะอาดและตรวจสอบระบบความปลอดภัยประจำวัน (Daily Safety Checklist)ตามห้องเครื่องจักรหลัก", "ctx": "พนักงานเช็คเครื่องเล่นทุกเช้าก่อนเปิดบริการ, ช่างเช็คตู้ไฟ/ปั๊มน้ำ, รปภ. ตรวจลานจอด", "law": "ระบบการจัดการความปลอดภัย ISO 45001 / ข้อกำหนดความปลอดภัยอาคาร"}, {"id": "4.2", "catIdx": 4, "text": "มีเอกสารประวัติการบำรุงรักษาเชิงป้องกัน (Preventive Maintenance - PM) ของระบบอาคาร/เครื่องเล่น หรือ เครื่องจักรหลัก", "ctx": "PM ระบบลิฟต์, PM เครื่องเล่น/ปั๊มน้ำ, PM ไฟสนาม, PM แขนกั้นจราจร", "law": "พ.ร.บ. ควบคุมอาคาร (การตรวจสอบอาคารและระบบวิศวกรรมประกอบอาคาร)"}, {"id": "4.3", "catIdx": 4, "text": "ถังน้ำประปาสามารถสำรองน้ำใช้มากกว่า 2 วัน", "ctx": "ทุกโครงการ: ถังน้ำประปาสำรองส่วนกลาง (สำรองน้ำใช้งานไม่น้อยกว่า 2 วัน)", "law": "พ.ร.บ. การสาธารณสุข พ.ศ. 2535 / เกณฑ์มาตรฐานวิศวกรรมสุขาภิบาล"}, {"id": "4.4", "catIdx": 4, "text": "ระบบไฟฟ้าสำรองมีการทดสอบทุกสัปดาห์และน้ำมันสำรอง มากกว่า 4 ชั่วโมง", "ctx": "ทุกโครงการ: เครื่องกำเนิดไฟฟ้าสำรอง (Generator) และน้ำมันดีเซลสำรอง", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับระบบไฟฟ้า พ.ศ. 2558 / มาตรฐาน EIT"}, {"id": "4.5", "catIdx": 4, "text": "ตัวเครื่องเล่น เครื่องจักร ปั๊มน้ำ ปั๊มลม ลมดันสไลเดอร์ มีฝาครอบป้องกันจุดหมุน (Safety Guard)", "ctx": "เจ็ตสกีจำลอง/สไลเดอร์: ปั๊มน้ำ/เครื่องสูบ | ร้านอาหาร: เครื่องบด/ปั่น | ลานจอด: แขนกั้น Barrier", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับเครื่องจักร ปั้นจั่น และหม้อน้ำ พ.ศ. 2564"}, {"id": "4.6", "catIdx": 4, "text": "มีปุ่มหยุดฉุกเฉิน (Emergency Stop / E-Stop) อยู่ในตำแหน่งที่กดได้ทันทีเมื่อเกิดเหตุ", "ctx": "เครื่องเล่นปีนผา/เจ็ตสกีจำลอง/สไลเดอร์ | ลานจอดรถ: แขนกั้นอัตโนมัติ | ลิฟต์อาคาร", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับเครื่องจักรฯ พ.ศ. 2564 หมวดปุ่มหยุดฉุกเฉิน"}, {"id": "4.7", "catIdx": 4, "text": "เบาะรองรับการตก (Crash Pad / Mat) หรือน้ำในสไลเดอร์ มีความหนา/ลึกเพียงพอตามมาตรฐาน", "ctx": "ผาจำลอง: เบาะรองตกหนาแน่น | สไลเดอร์/เจ็ตสกี: ระดับน้ำและกันชนข้าง", "law": "มาตรฐานความปลอดภัยเครื่องเล่นสนาม (มอก. 3000) / มาตรฐานความปลอดภัยสไลเดอร์สวนสนุก"}, {"id": "4.8", "catIdx": 4, "text": "มีการกำหนดนัยสำคัญเรื่องน้ำหนัก ส่วนสูง อายุ และจำนวนผู้เล่นต่อรอบอย่างชัดเจน", "ctx": "เครื่องเล่นปีนผา / สไลเดอร์ / เครื่องเล่นทางน้ำ / สไลเดอร์เด็ก", "law": "พ.ร.บ. ควบคุมอาคาร (เครื่องเล่นตามกฎกระทรวงควบคุมเครื่องเล่น พ.ศ. 2558)"}, {"id": "4.9", "catIdx": 4, "text": "มีป้ายและปฏิบัติตามมาตรการตัดแยกพลังงาน (Lockout/Tagout - LOTO) ขณะซ่อมบำรุงอุปกรณ์", "ctx": "การซ่อมบำรุงลิฟต์, ปั๊มน้ำสไลเดอร์, แขนกั้นลานจอดรถ, ไฟสนาม", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับเครื่องจักรฯ พ.ศ. 2564 หมวดการซ่อมบำรุง"}, {"id": "4.10", "catIdx": 4, "text": "ห้องน้ำส่วนกลาง Cleanliness สะอาด พื้นไม่ลื่น สุขภัณฑ์และพัดลมดูดอากาศทำงานปกติ", "ctx": "ทุกพื้นที่: ร้านอาหาร, สนามกีฬา, ลานจอดรถ, อาคารเช่า, โซนเครื่องเล่น", "law": "พ.ร.บ. การสาธารณสุข พ.ศ. 2535 / มาตรฐานห้องน้ำสาธารณะอาเซียน (HAS)"}, {"id": "5.1", "catIdx": 5, "text": "สารเคมี น้ำยาทำความสะอาด คลอรีน ปุ๋ยเคมี จัดเก็บมิดชิด มี SDS และถาดรองรับการรั่วไหล", "ctx": "ร้านต้นไม้: ปุ๋ย/ยาฆ่าแมลง | สไลเดอร์/เจ็ตสกี: คลอรีนน้ำ | ร้านอาหาร: น้ำยาล้างจาน", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับสารเคมีอันต เชื้อเพลิง"}, {"id": "P19", "text": "ให้จัดสถานที่และอุปกรณ์ในการทำความสะอาดมือและหน้า สำหรับคนงานที่ทำงานเกี่ยวกับสารที่เป็นอันตรายหรือวัสดุมีพิษ"}]}, {"th": "การเก็บ การยก และการขนย้ายวัสดุ", "items": [{"id": "P20", "text": "ให้จัดเก็บวัสดุทุกชนิดที่บรรจุในถุงภาชนะ หรือผูกรวมกันเป็นมัด โดยวิธีกองซ้อนกันมีไม้กั้นยันไว้และจะต้องควบคุมความสูงในการวางซ้อนกัน"}, {"id": "P21", "text": "ให้จัดกองอิฐให้อยู่ในแนวราบบนพื้นที่เรียบและมั่นคง"}, {"id": "P22", "text": "ให้จัดกองเหล็กเส้นแยกไว้ตามขนาดและความยาวของเหล็กเส้นนั้นๆบนพื้นที่มั่นคง"}, {"id": "P23", "text": "ให้จัดกองท่อทุกชนิดซ้อนกันในลักษณะที่จะป้องกันไม่ให้ท่อกลิ้งกระจายออกมาจากกอง"}, {"id": "P24", "text": "ให้มีการใช้เครื่องจักรในการยกและขนย้ายวัสดุในกรณีที่อาจเป็นอันตรายต่อสุขภาพและก่อให้เกิดความไม่ปลอดภัย"}, {"id": "P25", "text": "ให้คนงานเพิ่มความระมัดระวังในการขนย้ายวัสดุที่มีลักษณะยาวในการหลีกเลี่ยงการชน กระแทกกับโครงสร้างอาคาร สายไฟฟ้า หรือบุคคลอื่น"}]}, {"th": "การใช้เครื่องมือและเครื่องจักรกล", "items": [{"id": "P26", "text": "ให้มีการใช้เครื่องมือและเครื่องจักรกลที่เหมาะสมกับงาน"}, {"id": "P27", "text": "ให้มีการติดตั้ง ดูแลที่กำบังของชิ้นส่วนของเครื่องจกรกลที่หมุนหรือเคลื่อนที่โดยเฉพาะอย่างยิ่งเครื่องจักรกลที่มีแรงขับเคลื่อนและมีชิ้นส่วนที่ยื่นออกมา"}, {"id": "P28", "text": "ให้มีเครื่องป้องกันทุกส่วนของเครื่องจักรที่ใช้ในงานตัดวัสดุ ยกเว้นเครื่องที่ใช้เลื่อยหรือตัด"}]}, {"th": "งานรื้อถอน", "items": [{"id": "P29", "text": "จัดการตัดกระแสไฟฟ้าและกิจกรรมที่ต่อเนื่องในบริเวณหรือรอบๆอาคารที่จะรื้อถอน ก่อนลงมือทำงาน"}, {"id": "P30", "text": "จัดทำรั้ว และปิดประกาศ “เขตอันตราย”รอบบริเวณที่จะทำการรื้อถอน"}, {"id": "P31", "text": "จัดให้มีที่รองรับวัสดุ ตลอดแนวผนังรอบนอกของอาคารที่กำลังรื้อถอน"}, {"id": "P32", "text": "จัดให้มีนั่งร้านสำหรับการรื้อถอนส่วนของอาคารที่ไม่ยึดติดกับโครงสร้างของอาคารที่รื้อถอน"}, {"id": "P33", "text": "จัดการรื้อถอนกำแพง ผนังและโครงสร้างอาคารตั้งแต่ชั้นบนสุดก่อนแล้วจึงรื้อชั้นล่างลงมาตามลำดับ"}, {"id": "P34", "text": "จัดให้มีการขนย้าย วัสดุและสิ่งรื้อถอนออกจากบริเวณที่ทำการรื้อถอนโดยเร็วที่สุด"}]}, {"th": "ไฟฟ้า", "items": [{"id": "P35", "text": "จัดทำแผงสวิทซ์ด้วยวัสดุทนไฟ มีความแข็งแรงเพียงพอที่จะทนการปลด-สับ ได้เป็นอย่างดี"}, {"id": "P36", "text": "จัดให้มีหลังคาคลุมแผงสวิทซ์เมื่อต้องตั้งแผงสวิทซ์ไว้ภายนอกอาคาร"}, {"id": "P37", "text": "จัดให้มีการตรวจสภาพและดูแลรักษาแผงไฟสวิทซ์ เต้าเสียบ สายไฟและสายต่อชั่วคราว ให้เหมาะสมกับความต้องการในการใช้ไฟฟ้า"}, {"id": "P38", "text": "จัดให้มีการตรวจสอบอุปกรณ์เครืองมือใช้ไฟฟ้า ก่อนการใช้งานอย่างสม่ำเสมอ"}, {"id": "P39", "text": "จัดให้มีการดูแลพื้นห้อง บริเวณทำงานให้แห้งสนิทในบริเวณที่มีการใช้เครื่องมือเครื่องจักรไฟฟ้า"}]}, {"th": "งานเชื่อมโลหะและงานที่ก่อให้เกิดประกายไฟ", "items": [{"id": "P40", "text": "จัดให้มีและใช้อุปกรณ์เชื่อมและตัด ซึ่งสร้างอยู่ในมาตรฐานและได้รับการตรวจทดสอบและมีเครื่องป้องกันในการใช้งานอย่างปลอดภัย"}, {"id": "P41", "text": "จัดให้บริเวณที่จะทำการเชื่อมโลหะและงานที่เกิดประกายไฟแยกออกให้ห่างจากบริเวณเก็บน้ำมันเชื้อเพลิงหรือสารติดไฟง่าย"}, {"id": "P42", "text": "จัดให้มีและใช้เสื้อผ้าละหน้ากากเชื่อมอุปกรณ์ป้องกันอันตรายต่อ ศีรษะ ดวงตา"}, {"id": "P43", "text": "จัดให้มีเครื่องมือดับเพลิงที่พร้อมใช้งานได้ทันทีและอยู่ใกล้กับบริเวณที่มีการเชื่อมและงานที่ก่อให้เกิดประกายไฟ"}, {"id": "P44", "text": "จัดบริเวณที่เก็บถังก๊าซให้มีการถ่ายเทอากาศที่ดี อยู่ห่างจากแหล่งติดไฟง่ายและมีการป้องกันการล้มกลิ้งของถังก๊าซด้วยโซ่ล็อกหรือคอกกั้น"}]}]};

/**
 * storage.js
 * Thin wrapper around localStorage so the rest of the app never touches
 * localStorage directly. Swap this file's internals for a real backend
 * (REST/API) later without changing app.js call sites.
 */

const DB_PREFIX = "qshe_";

const DB = {
  _key(name) {
    return DB_PREFIX + name;
  },
  get(name, fallback) {
    try {
      const raw = localStorage.getItem(this._key(name));
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      console.error("DB.get failed for", name, e);
      return fallback;
    }
  },
  /**
   * Collections shared through the central Google Sheet (see sync.js). Every record needs an `id`.
   * On each write we stamp changed records with `_u` (ISO time) and remember deletions as tombstones,
   * so all existing code that calls DB.set(name, array) becomes sync-aware without further changes.
   */
  SYNC: ["buildings", "processStatus", "okrs", "kpis", "capas", "mpPlans", "mpUnits", "mpScores", "mpForms"],
  _stable(r) {
    const c = Object.assign({}, r); delete c._u; return JSON.stringify(c);
  },
  set(name, value, opts) {
    try {
      if (!(opts && opts.raw) && this.SYNC.includes(name) && Array.isArray(value)) {
        const prev = this.get(name, []);
        const pm = {};
        prev.forEach((r) => { if (r && r.id) pm[r.id] = this._stable(r); });
        const now = new Date().toISOString();
        const keep = {};
        value.forEach((r) => {
          if (!r || !r.id) return;
          keep[r.id] = 1;
          if (pm[r.id] === undefined || pm[r.id] !== this._stable(r)) r._u = now;
        });
        const gone = prev.filter((r) => r && r.id && !keep[r.id]);
        if (gone.length) {
          const t = this.get("syncTomb", []);
          gone.forEach((r) => t.push({ c: name, id: r.id, _u: now }));
          localStorage.setItem(this._key("syncTomb"), JSON.stringify(t));
        }
        localStorage.setItem(this._key("syncDirty"), "1");
      }
      localStorage.setItem(this._key(name), JSON.stringify(value));
      if (!(opts && opts.raw) && this.SYNC.includes(name) && typeof SyncMgr !== "undefined") SyncMgr.schedule();
      return true;
    } catch (e) {
      console.error("DB.set failed for", name, e);
      return false;
    }
  },
  ensureSeeded() {
    if (this.get("users", null) === null) this.set("users", SEED.users);
    if (this.get("buildings", null) === null) this.set("buildings", SEED.buildings, { raw: true });
    if (this.get("processStatus", null) === null) this.set("processStatus", SEED.processStatus, { raw: true });
    if (this.get("okrs", null) === null) this.set("okrs", SEED.okrs, { raw: true });
    if (this.get("kpis", null) === null) this.set("kpis", SEED.kpis, { raw: true });
    if (this.get("capas", null) === null) this.set("capas", SEED.capas, { raw: true });
    if (this.get("mpPlans", null) === null) this.set("mpPlans", SEED.mpPlans, { raw: true });
    if (this.get("mpUnits", null) === null) this.set("mpUnits", SEED.mpUnits, { raw: true });
    if (this.get("mpScores", null) === null) this.set("mpScores", SEED.mpScores, { raw: true });
    if (this.get("mpForms", null) === null) this.set("mpForms", [], { raw: true });
  },
  resetAll() {
    ["users", "buildings", "processStatus", "okrs", "kpis", "capas", "mpPlans", "mpUnits", "mpScores", "mpForms", "syncCfg", "syncMeta", "syncTomb", "session"].forEach((k) =>
      localStorage.removeItem(this._key(k))
    );
    this.ensureSeeded();
  }
};

function uid(prefix) {
  return (prefix || "id") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

/**
 * auth.js
 * Minimal client-side auth for a static/local deployment.
 *
 * SECURITY NOTE: this checks the username/password against a list stored in
 * the browser's localStorage. It is meant for an internal, trusted-network
 * prototype (e.g. an intranet kiosk or a single-team tool), NOT for
 * production use with sensitive data on the public internet — anyone with
 * browser dev tools can read localStorage. Wire this up to a real backend
 * (API + hashed passwords + sessions) before using it beyond a demo.
 */

const Auth = {
  currentUser() {
    return DB.get("session", null);
  },
  login(username, password) {
    const users = DB.get("users", []);
    const match = users.find(
      (u) => u.username.toLowerCase() === String(username).trim().toLowerCase() && u.password === password
    );
    if (!match) return { ok: false, error: "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง" };
    if (match.status === "pending") {
      return { ok: false, error: "บัญชีนี้ยังรอการอนุมัติจากผู้ดูแลระบบ กรุณาติดต่อผู้ดูแลระบบ" };
    }
    const session = { id: match.id, username: match.username, name: match.name, role: match.role, buildingIds: match.buildingIds };
    DB.set("session", session);
    return { ok: true, user: session };
  },
  register({ username, password, name, buildingId }) {
    username = String(username || "").trim();
    name = String(name || "").trim();
    if (!username || !password || !name) return { ok: false, error: "กรุณากรอกข้อมูลให้ครบถ้วน" };
    const users = DB.get("users", []);
    if (users.some((u) => u.username.toLowerCase() === username.toLowerCase())) {
      return { ok: false, error: "มีชื่อผู้ใช้นี้อยู่แล้วในระบบ" };
    }
    users.push({
      id: uid("u"),
      username,
      password,
      name,
      role: "pending",
      status: "pending",
      buildingIds: buildingId ? [buildingId] : []
    });
    DB.set("users", users);
    return { ok: true };
  },
  logout() {

  isAdmin(user) {

  canAccessBuilding(user, buildingId) {

/**
 * export.js
 * CSV export (works everywhere, opens cleanly in Excel/Sheets) and a
 * print-friendly report view (browser's native "Save as PDF" via print).
 */

const ExportUtil = {
  toCSV(rows, headers) {
    const esc = (v) => {
      if (v === null || v === undefined) return "";
      const s = String(v).replace(/"/g, '""');
      return /[",\n]/.test(s) ? `"${s}"` : s;
    };
    const lines = [];
    lines.push(headers.map((h) => esc(h.label)).join(","));
    rows.forEach((row) => {
      lines.push(headers.map((h) => esc(row[h.key])).join(","));
    });
    // BOM so Thai text opens correctly in Excel
    return "\uFEFF" + lines.join("\r\n");
  },
  download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  exportCSV(rows, headers, filename) {
    const csv = this.toCSV(rows, headers);
    this.download(filename.endsWith(".csv") ? filename : filename + ".csv", csv);
  },
  printSection(html, title) {
    const win = window.open("", "_blank", "width=900,height=1000");
    win.document.write(`
      <html lang="th">
      <head>
        <meta charset="utf-8" />
        <title>${title}</title>
        <style>
          body { font-family: 'IBM Plex Sans Thai', sans-serif; padding: 32px; color:#1a1a1a; }
          h1 { font-size: 20px; color:#12492F; border-bottom:2px solid #1F7A4D; padding-bottom:8px; }
          table { width:100%; border-collapse: collapse; margin-top:16px; }
          th, td { border:1px solid #ccc; padding:6px 10px; font-size:13px; text-align:left; }
          th { background:#1F7A4D; color:#fff; }
          tr:nth-child(even) td { background:#f3f8f5; }
          .meta { color:#666; font-size:12px; margin-bottom:4px; }
        </style>
      </head>
      <body>${html}</body>
      </html>
    `);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);
  }
};

// --------------------------------------------------- scoring engine ---
// Data model: mpScores holds one record per unit AND inspection visit (ครั้งที่ 1, 2, 3 …):
//   { id:"unit:visit", unitId, visit, date, time, inspector, scores:{itemId: 1-5 | "na"}, notes:{}, by }
// Dashboards/summary use each unit's LATEST visit; the checklist lets you open any visit.
function mpMigrate() {
  const all = DB.get("mpScores", []);
  let ch = false;
  all.forEach((r) => {
    if (!r.visit) { r.visit = 1; ch = true; }
    if (!r.id) { r.id = r.unitId + ":" + r.visit; ch = true; }
    if (r.time === undefined) { r.time = ""; ch = true; }
  });
  if (ch) DB.set("mpScores", all);
}
function mpItemsOfCat(catId) {
  return MP_ITEMS.filter((i) => i.catIdx === catId);
}
function mpVisits(unitId) {
  return DB.get("mpScores", []).filter((r) => r.unitId === unitId).sort((a, b) => a.visit - b.visit);
}
/** one visit, or (no visit given) the latest one */
function mpRecord(unitId, visit) {
  const v = mpVisits(unitId);
  if (visit) return v.find((r) => r.visit === visit) || null;
  return v[v.length - 1] || null;
}
function mpNowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function mpNewRecord(unitId, visit) {
  return { id: unitId + ":" + visit, unitId, visit, date: todayISO(), time: mpNowHM(), inspector: "", scores: {}, notes: {}, by: State.user ? State.user.username : "" };
}
function mpSaveRecord(rec) {
  rec.id = rec.unitId + ":" + rec.visit;
  if (State.user) rec.by = State.user.username;
  const all = DB.get("mpScores", []);
  const idx = all.findIndex((r) => r.id === rec.id);
  if (idx >= 0) all[idx] = rec; else all.push(rec);
  DB.set("mpScores", all);
}
function mpDeleteVisit(unitId, visit) {
  DB.set("mpScores", DB.get("mpScores", []).filter((r) => !(r.unitId === unitId && r.visit === visit)));
}
function mpRiskOfScore(v) {
  return v <= 1 ? "critical" : v <= 2 ? "high" : v <= 3 ? "medium" : "low";
}
/**
 * Stats for a list of records (one per unit normally).
 *  - N/A counts as ASSESSED (done) and as 0 points, but is left out of the % (numerator and denominator)
 *  - blank items are neither done nor counted
 */
function mpStatsFromRecs(recs, unitIds) {
  const cats = MP_CATEGORIES.map((c) => ({
    id: c.id, th: c.th, en: c.en, total: mpItemsOfCat(c.id).length * unitIds.length,
    assessed: 0, na: 0, done: 0, sum: 0, max: 0, pct: null,
    risk: { critical: 0, high: 0, medium: 0, low: 0 }
  }));
  const perUnit = {};
  unitIds.forEach((u) => { perUnit[u] = { assessed: 0, na: 0, done: 0, sum: 0, max: 0 }; });
  const issues = [];
  recs.forEach((rec) => {
    if (!perUnit[rec.unitId]) return;
    MP_ITEMS.forEach((it) => {
      const v = (rec.scores || {})[it.id];
      const c = cats[it.catIdx - 1];
      const pu = perUnit[rec.unitId];
      if (v === "na") { c.na++; c.done++; pu.na++; pu.done++; return; }
      if (typeof v !== "number") return;
      c.assessed++; c.done++; c.sum += v; c.max += 5;
      const rk = mpRiskOfScore(v);
      c.risk[rk]++;
      pu.assessed++; pu.done++; pu.sum += v; pu.max += 5;
      if (rk === "critical" || rk === "high") issues.push({ unitId: rec.unitId, visit: rec.visit, item: it, score: v, risk: rk, note: (rec.notes || {})[it.id] || "" });
    });
  });
  cats.forEach((c) => { c.pct = c.max ? (c.sum / c.max) * 100 : null; });
  const sum = cats.reduce((a, c) => a + c.sum, 0);
  const max = cats.reduce((a, c) => a + c.max, 0);
  const risk = { critical: 0, high: 0, medium: 0, low: 0 };
  cats.forEach((c) => MP_RISK.forEach((r) => { risk[r.id] += c.risk[r.id]; }));
  Object.keys(perUnit).forEach((u) => { const p = perUnit[u]; p.pct = p.max ? (p.sum / p.max) * 100 : null; });
  issues.sort((a, b) => a.score - b.score);
  return {
    cats, perUnit, risk, issues, sum, max,
    assessed: cats.reduce((a, c) => a + c.assessed, 0),
    na: cats.reduce((a, c) => a + c.na, 0),
    done: cats.reduce((a, c) => a + c.done, 0),
    total: MP_ITEMS.length * unitIds.length,
    pct: max ? (sum / max) * 100 : null
  };
}
/** each unit's latest visit */
function mpStats(unitIds) {
  return mpStatsFromRecs(unitIds.map((u) => mpRecord(u)).filter(Boolean), unitIds);
}

function mpWireTips(root) {
  let tip = document.getElementById("mp-tip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "mp-tip";
    tip.className = "mp-tip";
    tip.setAttribute("role", "tooltip");
    document.body.appendChild(tip);
  }
  const hide = () => { tip.style.display = "none"; };
  root.addEventListener("mouseover", (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el || !root.contains(el)) return hide();
    tip.textContent = el.dataset.tip;
    tip.style.display = "block";
  });
  root.addEventListener("mousemove", (e) => {
    if (tip.style.display !== "block") return;
    const w = tip.offsetWidth;
    let x = e.clientX + 14;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = e.clientY + 16 + "px";
  });
  root.addEventListener("mouseout", (e) => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest("[data-tip]")) hide(); });
  root.addEventListener("mouseleave", hide);
}

        <select id="mp-plan-status">
          <option value="all">${mt("ทุกสถานะ", "All statuses")}</option>

      </div>

      <div class="mp-scroll">

            <th>${mt("ผู้รับผิดชอบ", "Owner")}</th><th>${mt("ระยะเวลา", "Period")}</th>${monthHead}<th>${mt("สถานะ", "Status")}</th><th></th>

  document.getElementById("mp-plan-status").addEventListener("change", (e) => { MpPlanUI.status = e.target.value; renderMpPlan(root); });
  document.getElementById("mp-plan-add").addEventListener("click", () => openMpPlanForm(null));

  }));
}

function openMpPlanForm(id) {
  const ex = id ? DB.get("mpPlans", []).find((p) => p.id === id) : null;
  const v = ex || { step: "", detail: "", location: "", owner: "", start: todayISO(), end: todayISO(), status: "todo" };
  const modal = openModal(`
    <h3>${ex ? mt("แก้ไขแผนงาน", "Edit plan") : mt("เพิ่มแผนงาน", "Add plan")}</h3>
    <div class="field"><label>${mt("ขั้นตอนหลัก / ชื่อแผน", "Key step / plan name")} *</label><input type="text" id="f-step" value="${mpEsc(v.step.trim())}" /></div>
    <div class="field"><label>${mt("กิจกรรมย่อย / รายละเอียด", "Activities / details")}</label><textarea id="f-detail" rows="3">${mpEsc(v.detail)}</textarea></div>
    <div class="field"><label>${mt("พื้นที่เป้าหมาย", "Target location")}</label><textarea id="f-loc" rows="2">${mpEsc(v.location)}</textarea></div>
    <div class="form-row">
      <div class="field"><label>${mt("ผู้รับผิดชอบ", "Owner")}</label><input type="text" id="f-owner" value="${mpEsc(v.owner)}" /></div>
      <div class="field"><label>${mt("สถานะ", "Status")}</label><select id="f-status">${MP_PLAN_STATUS.map((s) => `<option value="${s.id}" ${v.status === s.id ? "selected" : ""}>${mt(s.th, s.en)}</option>`).join("")}</select></div>
    </div>
    <div class="form-row">
      <div class="field"><label>${mt("วันที่เริ่ม", "Start date")}</label><input type="date" id="f-start" value="${v.start}" /></div>
      <div class="field"><label>${mt("วันที่สิ้นสุด", "End date")}</label><input type="date" id="f-end" value="${v.end}" /></div>
    </div>
    <div class="actions"><button class="btn ghost" id="f-cancel">${mt("ยกเลิก", "Cancel")}</button><button class="btn" id="f-save">${mt("บันทึก", "Save")}</button></div>
  `);
  modal.querySelector("#f-cancel").addEventListener("click", closeModal);
  modal.querySelector("#f-save").addEventListener("click", () => {
    const step = modal.querySelector("#f-step").value.trim();
    const start = modal.querySelector("#f-start").value;
    const end = modal.querySelector("#f-end").value;
    if (!step) return alert(mt("กรุณากรอกชื่อแผน", "Please enter a plan name"));
    if (!start || !end || end < start) return alert(mt("วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม", "End date must not be before start date"));
    const next = {
      id: ex ? ex.id : uid("mpp"), step,
      detail: modal.querySelector("#f-detail").value.trim(),
      location: modal.querySelector("#f-loc").value.trim(),
      owner: modal.querySelector("#f-owner").value.trim(),
      status: modal.querySelector("#f-status").value, start, end
    };
    const all = DB.get("mpPlans", []);
    if (ex) all[all.findIndex((p) => p.id === ex.id)] = next; else all.push(next);
    DB.set("mpPlans", all);
    closeModal();
    toast(mt("บันทึกแล้ว", "Saved"));
    renderMpPlan(document.getElementById("view-root"));
  });
}

// ===================================================== 2. RISK SUMMARY ===
const MpRiskUI = { scope: "ALL", table: false };

function mpBar(label, pct, tip, cls) {
  const st = mpStatusOf(pct);
  return `<div class="bar-row">
    <div class="bar-label">${label}</div>
    <div class="bar-track" data-tip="${mpEsc(tip)}" tabindex="0">
      ${pct === null ? "" : `<div class="bar-fill" style="width:${Math.max(pct, 0.8).toFixed(1)}%;background:var(--st-${cls || st.cls});"></div>`}
      <span class="thr" style="left:70%"></span><span class="thr" style="left:85%"></span>
    </div>
    <div class="bar-val">${mpFmtPct(pct)}</div>
    <div class="bar-st">${pct === null ? `<span class="st-chip muted">${mt("ยังไม่ประเมิน", "Not assessed")}</span>` : mpChip(st)}</div>
  </div>`;
}
function mpBarAxis() {
  return `<div class="bar-row axis"><div class="bar-label"></div><div class="bar-track axis-t">
    <span style="left:0">0</span><span style="left:70%">70</span><span style="left:85%">85</span><span style="left:100%">100%</span></div><div class="bar-val"></div><div class="bar-st"></div></div>`;
}
function mpCatName(c) {
  return `${c.id}. ${mt(c.th, c.en)}`;
}

function renderMpRisk(root) {
  const units = DB.get("mpUnits", []);
  if (MpRiskUI.scope !== "ALL" && !units.find((u) => u.id === MpRiskUI.scope)) MpRiskUI.scope = "ALL";
  const scoped = MpRiskUI.scope === "ALL" ? units : units.filter((u) => u.id === MpRiskUI.scope);
  const ids = scoped.map((u) => u.id);
  const S = mpStats(ids);
  const recs = DB.get("mpScores", []);
  const demo = recs.some((r) => r.demo && ids.includes(r.unitId));
  const scopeName = MpRiskUI.scope === "ALL" ? mt("ทุกหน่วยงาน (รวม)", "All units (pooled)") : scoped[0].name;
  const overall = mpOverallStatusOf(S.pct);
  const unitName = (id) => (units.find((u) => u.id === id) || {}).name || id;

  const toolbar = `
    <div class="toolbar">
      <div class="filters">

          ${units.map((u) => `<option value="${u.id}" ${MpRiskUI.scope === u.id ? "selected" : ""}>${mpEsc(u.name)}</option>`).join("")}
        </select>

      </div>
      <div style="display:flex;gap:8px;">

  if (!S.done) {
    root.innerHTML = toolbar + `<div class="card empty-state">

  const riskTotal = S.risk.critical + S.risk.high + S.risk.medium + S.risk.low;
  const catBars = S.cats.map((c) =>
    mpBar(mpCatName(c), c.pct, `${mpCatName(c)}\n${mt("คะแนน", "Score")} ${c.sum}/${c.max} (${mpFmtPct(c.pct)}) · ${c.done} ${mt("ข้อที่ประเมินแล้ว", "items done")} (N/A ${c.na})`)
  ).join("");

  const stackRows = S.cats.map((c) => {

  const issueHtml = `<div class="card"><h3>${mt("รายการเสี่ยงสูงที่ต้องแก้ไขก่อน", "Highest-risk items to fix first")}</h3>

    ${S.issues.length ? `<div class="mp-scroll"><table><thead><tr><th>${mt("หน่วยงาน", "Unit")}</th><th>${mt("ข้อ", "Item")}</th><th>${mt("รายการตรวจ", "Checklist item")}</th><th>${mt("คะแนน", "Score")}</th><th>${mt("ระดับ", "Risk")}</th><th>${mt("ข้อสังเกต", "Note")}</th><th>${mt("รูป", "Photos")}</th></tr></thead><tbody>
      ${issues.map((x) => `<tr><td>${mpEsc(unitName(x.unitId))}<div class="muted-s">${mt("ครั้งที่", "Visit")} ${x.visit}</div></td><td>${x.item.id}</td><td>${mpEsc(x.item.text)}</td><td>${x.score}/5</td><td>${mpRiskChip(x.risk)}</td><td>${mpEsc(x.note) || "–"}</td><td class="ph-cell" data-ph-unit="${x.unitId}" data-ph-visit="${x.visit}" data-ph-item="${x.item.id}"></td></tr>`).join("")}
    </tbody></table></div>` : ""}</div>`;

  const tableHtml = `<div class="card"><h3>${mt("ตารางสรุปตามหมวด", "Summary by category")}</h3>
    <div class="mp-scroll"><table><thead><tr><th>${mt("หมวดหมู่การตรวจประเมิน", "Category")}</th><th>${mt("ประเมินแล้ว", "Done")}</th><th>N/A</th><th>${mt("คะแนนเต็มรวม (ไม่รวม N/A)", "Max (excl. N/A)")}</th><th>${mt("คะแนนที่ได้", "Score")}</th><th>%</th>${MP_RISK.map((r) => `<th>${r.icon} ${mt(r.th, r.en)}</th>`).join("")}<th>${mt("สถานะ", "Status")}</th></tr></thead><tbody>
    ${S.cats.map((c) => `<tr><td>${mpCatName(c)}</td><td>${c.done}/${c.total}</td><td>${c.na}</td><td>${c.max}</td><td>${c.sum}</td><td>${mpFmtPct(c.pct)}</td>${MP_RISK.map((r) => `<td>${c.risk[r.id]}</td>`).join("")}<td>${mpChip(mpStatusOf(c.pct))}</td></tr>`).join("")}
    <tr class="total-row"><td><strong>${mt("รวมทั้งสิ้น", "Total")}</strong></td><td>${S.done}/${S.total}</td><td>${S.na}</td><td>${S.max}</td><td>${S.sum}</td><td><strong>${mpFmtPct(S.pct)}</strong></td>${MP_RISK.map((r) => `<td>${S.risk[r.id]}</td>`).join("")}<td>${mpChip(overall)}</td></tr>
    </tbody></table></div></div>`;

  const histRows = scoped.map((u) => mpVisits(u.id).map((r) => {
    const st = mpStatsFromRecs([r], [u.id]);
    return `<tr><td>${mpEsc(u.name)}</td><td>${mt("ครั้งที่", "Visit")} ${r.visit}</td><td>${mpFmtDT(r.date, r.time)}</td><td>${mpEsc(r.inspector) || "–"}</td><td>${st.done}/${st.total} (N/A ${st.na})</td><td>${mpFmtPct(st.pct)}</td><td>${mpChip(mpOverallStatusOf(st.pct))}</td></tr>`;
  }).join("")).join("");
  const histHtml = `<div class="card"><h3>${mt("ประวัติการเข้าประเมิน", "Inspection visit history")}</h3>
    <div class="desc">${mt("กราฟและตัวเลขด้านบนใช้ผลการประเมินครั้งล่าสุดของแต่ละหน่วยงาน", "Charts above use each unit's latest visit")}</div>

    </div>
    ${MpRiskUI.table ? tableHtml : `
    <div class="card"><h3>${mt("คะแนนตามหมวดหมู่ (% เทียบเกณฑ์)", "Score by category (% vs thresholds)")}</h3>
      <div class="desc">${mt("เส้นที่ 70% = เกณฑ์ขั้นต่ำ, 85% = ดีมาก", "Lines at 70% = minimum, 85% = very good")}</div>
      ${mpBarAxis()}${catBars}
    </div>
    <div class="card"><h3>${mt("ระดับความเสี่ยงของข้อตรวจ แยกตามหมวด", "Risk level of items, by category")}</h3>
      <div class="desc">${mt("จำนวนข้อตรวจในแต่ละระดับความเสี่ยง (วิกฤต = คะแนน 1, สูง = 2, กลาง = 3, ต่ำ = 4–5)", "Item count per risk level (Critical = score 1, High = 2, Medium = 3, Low = 4–5)")}</div>
      <div class="mp-legend top">${MP_RISK.map((r) => `<span><i class="sw" style="background:${mpRiskColor(r.id)}"></i>${r.icon} ${mt(r.th, r.en)} <b>${S.risk[r.id]}</b></span>`).join("")}<span class="muted-s">${mt("รวม", "Total")} ${riskTotal}</span></div>
      ${stackRows}

    ${compareHtml}`}

    ${histHtml}
  `;
  bindMpRiskCommon(root);
  mpFillIssuePhotos(root);
}

/** thumbnails (photos 1-3) in the risk-items table, loaded from IndexedDB */
function mpFillIssuePhotos(root) {
  const cells = [...root.querySelectorAll(".ph-cell")];
  if (!cells.length || !MpImg.available()) return;
  const cache = {};
  const pairs = [...new Set(cells.map((c) => c.dataset.phUnit + "|" + c.dataset.phVisit))];
  Promise.all(pairs.map((k) => { const [u, v] = k.split("|"); return MpImg.forUnit(u, Number(v)).then((all) => { cache[k] = all; }); })).then(() => {
    cells.forEach((c) => {
      const all = cache[c.dataset.phUnit + "|" + c.dataset.phVisit] || {};
      c.innerHTML = [1, 2, 3].map((n) => {
        const d = all[c.dataset.phItem + "|" + n];
        return d ? `<button type="button" class="ph-mini" data-full="${n}" title="${mt(MP_PHOTO_LABEL[n].th, MP_PHOTO_LABEL[n].en)} (${mt(MP_PHOTO_LABEL[n].sub.th, MP_PHOTO_LABEL[n].sub.en)})"><img src="${d}" alt="" /></button>` : "";
      }).join("") || "–";
      c.querySelectorAll(".ph-mini").forEach((b) => b.addEventListener("click", () => mpShowPhoto(b.querySelector("img").src, `${c.dataset.phItem} · ${mt(MP_PHOTO_LABEL[b.dataset.full].th, MP_PHOTO_LABEL[b.dataset.full].en)}`)));
    });
  }).catch(() => {});
}

function bindMpRiskCommon(root) {
  mpWireTips(root);
  const sc = document.getElementById("mp-risk-scope");
  if (sc) sc.addEventListener("change", () => { MpRiskUI.scope = sc.value; renderMpRisk(root); });
  const vw = document.getElementById("mp-risk-view");
  if (vw) vw.addEventListener("click", () => { MpRiskUI.table = !MpRiskUI.table; renderMpRisk(root); });
  mpToolbarExport("mp-risk-csv", "mpSummary", "QSHE_Inspection_Risk_Summary");
  const pr = document.getElementById("mp-risk-print");

/** Deterministic demo scores for units that have none (flagged demo:true). Two units get a 2nd visit. */
function mpLoadDemo() {
  const units = DB.get("mpUnits", []);
  const bias = [4.3, 3.6, 4.0, 3.1, 3.8];
  const day = (n) => new Date(Date.now() - n * 86400000).toISOString().slice(0, 10);
  units.forEach((u, ui) => {
    if (mpRecord(u.id)) return;
    let seed = 7 + ui * 13;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const make = (b, visit, daysAgo, time) => {
      const scores = {};
      MP_ITEMS.forEach((it) => {
        const r = rnd();
        if (r < 0.04) { scores[it.id] = "na"; return; }
        const v = Math.round(b + (rnd() - 0.5) * 3.2 - (it.catIdx === 3 && ui === 3 ? 0.8 : 0));
        scores[it.id] = Math.min(5, Math.max(1, v));
      });
      mpSaveRecord({ id: u.id + ":" + visit, unitId: u.id, visit, date: day(daysAgo), time, inspector: "(demo)", scores, notes: {}, demo: true });
    };
    make(bias[ui % bias.length] - (ui % 2 === 0 ? 0.5 : 0), 1, 21, "09:30");
    if (ui % 2 === 0) make(bias[ui % bias.length] + 0.4, 2, 6, "13:45");
  });
  if (typeof mpLoadDemoForms === "function") mpLoadDemoForms();
}

// ------------------------------------------------ photo store (IndexedDB) ---
// Photos (3 per checklist item and visit: 1 = before / finding, 2 = during, 3 = after correction) are
// compressed in the browser and kept in IndexedDB (not localStorage: size limit). When central sync
// is on they are also uploaded to the Google Sheet so Admin can see them.
const MpImg = {
  _db: null,
  available() { return typeof indexedDB !== "undefined" && !!indexedDB; },
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("qshe_images", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("img", { keyPath: "key" });
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error);
    });
  },
  _tx(mode, fn) {
    return this.open().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction("img", mode);
      const st = tx.objectStore("img");
      const out = fn(st);
      tx.oncomplete = () => resolve(out && "result" in out ? out.result : undefined);
      tx.onerror = () => reject(tx.error);
    }));
  },
  key(unitId, visit, itemId, slot) { return `${unitId}|${visit}|${itemId}|${slot}`; },
  put(key, data, silent) {
    return this._tx("readwrite", (st) => st.put({ key, data })).then(() => { if (!silent && typeof SyncMgr !== "undefined") SyncMgr.schedule(); });
  },
  get(key) { return this._tx("readonly", (st) => st.get(key)).then((r) => (r ? r.data : null)); },
  del(key, silent) {
    return this._tx("readwrite", (st) => st.delete(key)).then(() => { if (!silent && typeof SyncMgr !== "undefined") SyncMgr.queuePhotoDelete(key); });
  },
  allKeys() { return this._tx("readonly", (st) => st.getAllKeys()).then((k) => k || []); },
  /** all photos of one unit visit -> { "itemId|slot": dataURL } */
  forUnit(unitId, visit) {
    return this._tx("readonly", (st) => st.getAll()).then((rows) => {
      const out = {};
      (rows || []).forEach((r) => {
        const [u, v, item, slot] = r.key.split("|");
        if (u === unitId && Number(v) === Number(visit)) out[item + "|" + slot] = r.data;
      });
      return out;
    });
  },
  async delPrefix(prefix) {
    const keys = (await this.allKeys()).filter((k) => k.startsWith(prefix));
    for (const k of keys) await this.del(k);
  },
  /** older versions stored `unit|item|slot` (2 photos) -> `unit|1|item|slot`, "after" moves to slot 3 */
  async migrate() {
    if (!this.available()) return;
    const keys = await this.allKeys();
    for (const k of keys) {
      const parts = k.split("|");
      if (parts.length !== 3) continue;
      const data = await this.get(k);
      const slot = parts[2] === "2" ? "3" : parts[2];
      await this.put(`${parts[0]}|1|${parts[1]}|${slot}`, data, true);
      await this.del(k, true);
    }
  },
  /** resize to max 800px, JPEG 0.65 -> dataURL */
  compress(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 800, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.65));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }
};
const MP_PHOTO_LABEL = [
  null,
  { th: "รูปที่ 1", en: "Photo 1", sub: { th: "ก่อนแก้ไข", en: "before" } },
  { th: "รูปที่ 2", en: "Photo 2", sub: { th: "ระหว่างแก้ไข", en: "during" } },
  { th: "รูปที่ 3", en: "Photo 3", sub: { th: "หลังแก้ไข", en: "after fix" } }
];
function mpPhotoSlotHtml(itemId, slot) {
  const L = MP_PHOTO_LABEL[slot];
  return `<div class="ph-slot" data-ph-item="${itemId}" data-ph-slot="${slot}">
    <label class="ph-add" title="${mt("เพิ่ม", "Add")} ${mt(L.th, L.en)} (${mt(L.sub.th, L.sub.en)})">
      <span class="ph-plus">＋</span><span>${mt(L.th, L.en)}</span><small>${mt(L.sub.th, L.sub.en)}</small>
      <input type="file" accept="image/*" hidden />
    </label>
  </div>`;
}
function mpPaintSlot(slotEl, data) {
  const slot = Number(slotEl.dataset.phSlot), L = MP_PHOTO_LABEL[slot];
  slotEl.querySelector(".ph-img")?.remove(); slotEl.querySelector(".ph-x")?.remove();
  if (!data) { slotEl.classList.remove("has"); return; }
  slotEl.classList.add("has");
  const b = document.createElement("button");
  b.type = "button"; b.className = "ph-img"; b.title = mt("ดูรูปขยาย", "View larger");
  b.innerHTML = `<img src="${data}" alt="${mt(L.th, L.en)}" /><span class="ph-tag">${mt(L.th, L.en)}</span>`;
  slotEl.appendChild(b);
  const x = document.createElement("button");
  x.type = "button"; x.className = "ph-x"; x.title = mt("ลบรูป", "Remove photo"); x.textContent = "×";
  slotEl.appendChild(x);
}
function mpShowPhoto(data, caption) {
  const m = openModal(`<h3 style="font-size:15px;">${mpEsc(caption)}</h3>
    <img src="${data}" alt="" style="max-width:100%;border-radius:8px;display:block;margin:0 auto;" />
    <div class="actions"><button class="btn ghost" id="ph-close">${mt("ปิด", "Close")}</button></div>`);
  m.querySelector("#ph-close").addEventListener("click", closeModal);
}
function mpWirePhotos(body, unit, visit) {
  if (!MpImg.available()) {
    body.querySelectorAll(".ph-slot").forEach((s) => { s.classList.add("disabled"); s.title = mt("เบราว์เซอร์นี้ไม่รองรับการเก็บรูป", "Photo storage not supported in this browser"); });
    return;
  }
  const slots = () => [...body.querySelectorAll(".ph-slot")];
  const paintAll = () => MpImg.forUnit(unit.id, visit).then((all) => {
    slots().forEach((el) => { const d = all[el.dataset.phItem + "|" + el.dataset.phSlot]; if (d) mpPaintSlot(el, d); });
  }).catch(() => {});
  paintAll();
  // photos taken on other computers
  if (typeof SyncMgr !== "undefined" && SyncMgr.enabled()) SyncMgr.fetchPhotos(`${unit.id}|${visit}|`).then((n) => { if (n) paintAll(); }).catch(() => {});
  body.addEventListener("change", (e) => {
    const inp = e.target.closest(".ph-slot input[type=file]");
    if (!inp || !inp.files[0]) return;
    const el = inp.closest(".ph-slot");
    const key = MpImg.key(unit.id, visit, el.dataset.phItem, el.dataset.phSlot);
    MpImg.compress(inp.files[0])
      .then((data) => MpImg.put(key, data).then(() => mpPaintSlot(el, data)))
      .catch(() => alert(mt("ไม่สามารถบันทึกรูปนี้ได้", "Could not save this photo")));
    inp.value = "";
  });
  body.addEventListener("click", (e) => {
    const el = e.target.closest(".ph-slot");
    if (!el) return;
    const slot = el.dataset.phSlot;
    if (e.target.closest(".ph-x")) {
      MpImg.del(MpImg.key(unit.id, visit, el.dataset.phItem, slot)).then(() => mpPaintSlot(el, null));
    } else if (e.target.closest(".ph-img")) {
      const src = el.querySelector(".ph-img img").src;
      mpShowPhoto(src, `${unit.name} · ${mt("ครั้งที่", "Visit")} ${visit} · ${el.dataset.phItem} · ${mt(MP_PHOTO_LABEL[slot].th, MP_PHOTO_LABEL[slot].en)}`);
    }
  });
}

      <div class="desc" style="margin-top:8px;">${mt("เกณฑ์: 5 ดีเยี่ยม · 4 ดี · 3 พอใช้ · 2 ปรับปรุง · 1 วิกฤต/ไม่ปลอดภัย · ข้อที่ไม่เกี่ยวข้องเลือก N/A = 0 คะแนน นับว่าประเมินแล้ว แต่ไม่นำมาคิด % · แนบรูปได้ข้อละ 3 รูป (ก่อน/ระหว่าง/หลังแก้ไข) · บันทึกอัตโนมัติ", "Scale: 5 excellent · 4 good · 3 fair · 2 needs work · 1 critical/unsafe · N/A = 0 points, counts as assessed but is left out of the % · up to 3 photos per item (before / during / after) · saved automatically")}</div>
      ${rec0.by ? `<div class="muted-s" style="margin-top:4px;">${mt("บันทึกล่าสุดโดย", "Last saved by")}: ${mpEsc(rec0.by)}</div>` : ""}

  const refresh = () => {

    });
    document.getElementById("mp-sumbar").innerHTML =
      `<div><b>${mpFmtPct(S.pct)}</b> <span class="muted-s">${S.sum}/${S.max}</span></div><div>${mpChip(mpOverallStatusOf(S.pct))}</div>
       <div class="muted-s">${S.done}/${S.total} ${mt("ข้อที่ประเมินแล้ว", "items assessed")} · N/A ${S.na}</div>
       <div class="muted-s">${MP_RISK.map((r) => `${r.icon} ${mpRiskLabel(r.id)} ${S.risk[r.id]}`).join(" · ")}</div>`;
    const all = mpStats([unit.id]);
    const card = document.querySelector(`.unit-card[data-unit="${unit.id}"] .u-meta`);
    if (card) card.textContent = `${unit.type ? unit.type + " · " : ""}${all.done}/${MP_ITEMS.length} ${mt("ข้อ", "items")} · ${mpFmtPct(all.pct)}${visits.length > 1 ? ` · ${visits.length} ${mt("ครั้ง", "visits")}` : ""}`;

  if (typeof mpRenderFormsPanel === "function") mpRenderFormsPanel(document.getElementById("forms-panel"), unit);

  body.querySelectorAll("details.chk-cat[data-cat]").forEach((d) => d.addEventListener("toggle", () => { MpCheckUI.open[unit.id + ":" + d.dataset.cat] = d.open; }));

  });

  body.querySelectorAll("[data-note]").forEach((inp) => inp.addEventListener("change", () => {

  document.getElementById("mp-unit-del").addEventListener("click", async () => {

function openMpUnitForm(id) {
  const ex = id ? DB.get("mpUnits", []).find((u) => u.id === id) : null;
  const v = ex || { name: "", type: "", note: "" };
  const modal = openModal(`
    <h3>${ex ? mt("แก้ไขหน่วยงาน", "Edit unit") : mt("เพิ่มหน่วยงาน", "Add unit")}</h3>
    <div class="field"><label>${mt("ชื่อหน่วยงาน / พื้นที่", "Unit / area name")} *</label><input type="text" id="f-name" value="${mpEsc(v.name)}" /></div>
    <div class="field"><label>${mt("ประเภทพื้นที่", "Area type")}</label>
      <input type="text" id="f-type" list="mp-type-list" value="${mpEsc(v.type)}" placeholder="${mt("เช่น อาคารจอดรถ, สนามกีฬา, อาคารเช่าร้านค้า", "e.g. car park, sports field, retail building")}" />
      <datalist id="mp-type-list">${["ร้านต้นไม้/ร้านอาหาร", "เครื่องเล่น/ผาจำลอง/สไลเดอร์", "อาคารจอดรถ", "สนามกีฬา", "อาคารเช่าร้านค้า"].map((x) => `<option value="${x}">`).join("")}</datalist></div>
    <div class="field"><label>${mt("หมายเหตุ", "Note")}</label><textarea id="f-note" rows="2">${mpEsc(v.note)}</textarea></div>
    <div class="actions"><button class="btn ghost" id="f-cancel">${mt("ยกเลิก", "Cancel")}</button><button class="btn" id="f-save">${mt("บันทึก", "Save")}</button></div>
  `);
  modal.querySelector("#f-cancel").addEventListener("click", closeModal);
  modal.querySelector("#f-save").addEventListener("click", () => {
    const name = modal.querySelector("#f-name").value.trim();
    if (!name) return alert(mt("กรุณากรอกชื่อหน่วยงาน", "Please enter a unit name"));
    const all = DB.get("mpUnits", []);
    if (all.some((u) => u.name.toLowerCase() === name.toLowerCase() && u.id !== (ex && ex.id)))
      return alert(mt("มีหน่วยงานชื่อนี้แล้ว", "A unit with this name already exists"));
    const next = { id: ex ? ex.id : uid("mpu"), name, type: modal.querySelector("#f-type").value.trim(), note: modal.querySelector("#f-note").value.trim() };
    if (ex) all[all.findIndex((u) => u.id === ex.id)] = next; else all.push(next);
    DB.set("mpUnits", all);
    MpCheckUI.unitId = next.id; MpCheckUI.visit = null;
    closeModal();
    toast(mt("บันทึกแล้ว", "Saved"));
    renderMpCheck(document.getElementById("view-root"));
  });
}

/**
 * forms.js
 * PCRA (Pre-Construction Risk Assessment) and ICRA (construction inspection) as fill-in forms
 * placed under category 7 of the Risk Assessment Checklist.
 *  - Yes / No / N/A ticks, notes, signatures (drawn), date + time of each signature
 *  - draft -> final (locked; admin can reopen)
 *  - stored in `mpForms` (synced to the central Google Sheet, also listed in the backup tables)
 *  - PDF export through the browser print dialog ("Save as PDF")
 */

const MP_FORM_TYPES = {
  PCRA: { th: "PCRA · การประเมินความเสี่ยงก่อนการก่อสร้าง", en: "PCRA · Pre-Construction Risk Assessment" },
  ICRA: { th: "ICRA · การตรวจประเมินความเสี่ยงระหว่างก่อสร้าง/ปรับปรุง", en: "ICRA · Construction / renovation risk inspection" }
};
const MP_FORM_SIGNERS = {
  PCRA: [
    { id: "requester", th: "ผู้ขอดำเนินการ / ผู้รับเหมา", en: "Requester / contractor" },
    { id: "safety", th: "เจ้าหน้าที่ความปลอดภัย (QSHE)", en: "Safety officer (QSHE)" },
    { id: "approver", th: "ผู้อนุมัติ / หัวหน้าหน่วยงาน", en: "Approver / unit head" }
  ],
  ICRA: [
    { id: "inspector", th: "ผู้ตรวจประเมิน", en: "Inspector" },
    { id: "contractor", th: "ผู้รับเหมา / ผู้ควบคุมงาน", en: "Contractor / supervisor" },
    { id: "approver", th: "ผู้อนุมัติ / หัวหน้าหน่วยงาน", en: "Approver / unit head" }
  ]
};
// PCRA sections that are compliance measures (Yes = good). The others are risk screening questions.
const MP_PCRA_COMPLIANCE_SECTIONS = ["B", "G"];
const MpFormUI = { id: null };

/** flat item list of a form type: {id, text, group, comply} */
function mpFormItems(type) {
  const out = [];
  if (type === "PCRA") {
    MP_PCRA.sections.forEach((s) => s.items.forEach((it) => out.push({ id: it.id, text: it.text, group: s.id + ". " + s.th, comply: MP_PCRA_COMPLIANCE_SECTIONS.includes(s.id) })));
    MP_PCRA.practices.forEach((s) => s.items.forEach((it) => out.push({ id: it.id, text: it.text, group: s.th, comply: true })));
  } else {
    MP_ICRA.groups.forEach((g) => g.items.forEach((it) => out.push({ id: it.id, text: it.text, group: g.id + " " + g.en + " · " + g.th, comply: true })));
  }
  return out;
}
const mpFormIsExempt = (f) => f.type === "PCRA" && Object.keys(f.exempt || {}).some((k) => f.exempt[k]);

function mpFormStats(f) {
  const items = mpFormItems(f.type);
  const a = f.answers || {};
  const S = { yes: 0, no: 0, na: 0, blank: 0, total: items.length, cYes: 0, cNo: 0 };
  items.forEach((it) => {
    const v = a[it.id];
    if (v === "yes") { S.yes++; if (it.comply) S.cYes++; }
    else if (v === "no") { S.no++; if (it.comply) S.cNo++; }
    else if (v === "na") S.na++;
    else S.blank++;
  });
  const roles = MP_FORM_SIGNERS[f.type];
  const sig = f.signatures || {};
  S.signersNeeded = roles.filter((r) => !(sig[r.id] && sig[r.id].skip)).length;
  S.signed = roles.filter((r) => sig[r.id] && !sig[r.id].skip && sig[r.id].strokes && sig[r.id].strokes.length).length;
  S.exempt = mpFormIsExempt(f);
  /** compliance % : Yes / (Yes + No) on compliance items; N/A and blank are left out */
  S.pct = S.cYes + S.cNo ? (S.cYes / (S.cYes + S.cNo)) * 100 : null;
  S.complete = S.exempt ? 100 : Math.round(((S.total - S.blank) / S.total) * 100);
  return S;
}
function mpFormsOf(unitId, type) {
  return DB.get("mpForms", []).filter((f) => f.unitId === unitId && (!type || f.type === type))
    .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
}
const mpFormsCount = (unitId, type) => mpFormsOf(unitId, type).length;

function mpNewForm(type, unitId) {
  return {
    id: uid("frm"), type, unitId, projectName: "", fields: { area: "", contractor: "", tel: "", start: "", end: "", date: todayISO(), time: mpNowHM() },
    exempt: {}, scope: {}, answers: {}, notes: {}, signatures: {}, status: "draft",
    by: State.user ? State.user.name || State.user.username : "", createdAt: new Date().toISOString(), finalAt: ""
  };
}
const mpGetForm = (id) => DB.get("mpForms", []).find((f) => f.id === id);
function mpSaveForm(f) {
  const all = DB.get("mpForms", []);

}

// ------------------------------------------------------------ signatures ---
function mpSigSvg(sig, h) {
  if (!sig || !sig.strokes || !sig.strokes.length) return "";
  const paths = sig.strokes.map((s) => (s.length === 1 ? `<circle cx="${s[0][0]}" cy="${s[0][1]}" r="1.2" fill="currentColor"/>` :
    `<polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${s.map((p) => p[0] + "," + p[1]).join(" ")}"/>`)).join("");
  return `<svg class="sig-svg" viewBox="0 0 ${sig.w} ${sig.h}" style="height:${h || 70}px" preserveAspectRatio="xMidYMid meet" role="img" aria-label="signature">${paths}</svg>`;
}
function mpOpenSignPad(roleLabel, existing, onSave) {
  const W = 480, H = 180;
  const modal = openModal(`
    <h3>${mt("ลงลายมือชื่อ", "Sign")} · ${mpEsc(roleLabel)}</h3>
    <canvas id="sig-cv" class="sig-canvas" width="${W}" height="${H}" aria-label="${mt("พื้นที่เซ็นชื่อ", "Signature area")}"></canvas>
    <div class="muted-s">${mt("ใช้นิ้ว เมาส์ หรือปากกาเซ็นในกรอบ", "Sign in the box with a finger, mouse or stylus")}</div>
    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;">
      <div class="field"><label>${mt("ชื่อ-สกุล (ตัวบรรจง)", "Full name")} *</label><input type="text" id="sg-name" value="${mpEsc(existing && existing.name || "")}" /></div>
      <div class="field"><label>${mt("โทรศัพท์ / ตำแหน่ง", "Phone / position")}</label><input type="text" id="sg-tel" value="${mpEsc(existing && existing.tel || "")}" /></div>
    </div>
    <div class="actions"><button class="btn ghost" id="sg-clear">${mt("ล้าง", "Clear")}</button><button class="btn ghost" id="sg-cancel">${mt("ยกเลิก", "Cancel")}</button><button class="btn" id="sg-ok">${mt("บันทึกลายเซ็น", "Save signature")}</button></div>`);
  const cv = modal.querySelector("#sig-cv"), g = cv.getContext("2d");
  let strokes = existing && existing.strokes ? JSON.parse(JSON.stringify(existing.strokes)) : [];
  let cur = null;
  const redraw = () => {
    g.clearRect(0, 0, W, H);
    g.lineWidth = 2; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#111"; g.fillStyle = "#111";
    strokes.forEach((s) => {
      if (s.length === 1) { g.beginPath(); g.arc(s[0][0], s[0][1], 1.2, 0, 7); g.fill(); return; }
      g.beginPath(); s.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.stroke();
    });
  };
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [Math.round(((e.clientX - r.left) / r.width) * W), Math.round(((e.clientY - r.top) / r.height) * H)]; };
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } cur = [pos(e)]; strokes.push(cur); redraw(); });
  cv.addEventListener("pointermove", (e) => { if (!cur) return; cur.push(pos(e)); redraw(); });
  const end = () => { cur = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  redraw();
  modal.querySelector("#sg-clear").addEventListener("click", () => { strokes = []; redraw(); });
  modal.querySelector("#sg-cancel").addEventListener("click", closeModal);
  modal.querySelector("#sg-ok").addEventListener("click", () => {
    const name = modal.querySelector("#sg-name").value.trim();
    if (!strokes.length) return alert(mt("กรุณาเซ็นชื่อในกรอบ", "Please sign in the box"));
    if (!name) return alert(mt("กรุณากรอกชื่อ-สกุล", "Please enter the full name"));
    onSave({ strokes, w: W, h: H, name, tel: modal.querySelector("#sg-tel").value.trim(), at: new Date().toISOString() });
    closeModal();
  });
}
const mpFmtStamp = (iso) => (iso ? new Date(iso).toLocaleString(mt("th-TH", "en-GB"), { dateStyle: "medium", timeStyle: "short" }) : "");

      if (!BackupMgr.validUrl(BackupMgr.cfg().url)) throw new Error(mt("ยังไม่ได้ตั้งค่า Google Sheet (เมนู สำรองข้อมูล)", "Google Sheet is not set up yet (Backup page)"));
      await BackupMgr.backupToSheet("form");
      toast(mt("สำรองลง Google Sheet แล้ว", "Backed up to Google Sheet"));
    } catch (err) { alert(err.message || String(err)); }
    e.target.disabled = false;
  });
}

function mpFormValidate(f) {
  const issues = [];
  if (!f.projectName) issues.push(mt("ระบุชื่อโครงการ / งาน", "Enter the project / work name"));
  const S = mpFormStats(f);
  if (!S.exempt && S.blank) issues.push(mt(`ยังไม่ได้ตอบ ${S.blank} ข้อ (เลือก ใช่ / ไม่ใช่ / N/A)`, `${S.blank} item(s) not answered (choose Yes / No / N/A)`));
  const sig = f.signatures || {};
  MP_FORM_SIGNERS[f.type].forEach((r) => {
    const s = sig[r.id];
    if (!s || (!s.skip && !(s.strokes && s.strokes.length))) issues.push(mt(`ยังไม่ลงนาม: ${r.th}`, `Not signed: ${r.en}`));
  });
  return issues;
}

/**
 * monitor.js
 * "Construction & Renovation Monitor" on the main Dashboard.
 * Evaluated from checklist items 7.1-7.6 (latest visit per unit) paired with the PCRA / ICRA forms
 * of the same unit.  Compliance of a form = Yes / (Yes + No) on its compliance items (N/A left out).
 * Combined score of a unit = average of the available parts (items 7.x %, PCRA %, ICRA %).
 * Target line: 90 %.
 */
const MP_TARGET = 90;
const MpMonUI = { unit: "ALL", table: false };

/** a unit counts as "construction / renovation" when it has a PCRA/ICRA form or any scored (non-N/A) item 7.x */
function mpIsConstruction(u, forms) {
  if ((forms || DB.get("mpForms", [])).some((f) => f.unitId === u.id)) return true;
  const rec = mpRecord(u.id);
  return !!rec && mpItemsOfCat(7).some((it) => typeof (rec.scores || {})[it.id] === "number");
}
const mpShort = (t, n) => (t.length > (n || 46) ? t.slice(0, n || 46) + "…" : t);
const MP_RISK_CLS = { critical: "critical", high: "serious", medium: "warning", low: "good" };

function mpMonData() {
  const allUnits = DB.get("mpUnits", []);
  const forms = DB.get("mpForms", []);
  const units = allUnits.filter((u) => mpIsConstruction(u, forms));
  const rows = units.map((u) => {
    const rec = mpRecord(u.id);
    const S = rec ? mpStatsFromRecs([rec], [u.id]) : null;
    const c7 = S ? S.cats[6] : null;
    const fl = (type) => {
      const fs = forms.filter((f) => f.unitId === u.id && f.type === type).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
      const sc = fs.map((f) => mpFormStats(f).pct).filter((p) => p !== null);
      return { n: fs.length, final: fs.filter((f) => f.status === "final").length, pct: sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : null, list: fs };
    };
    const pc = fl("PCRA"), ic = fl("ICRA");
    const parts = [c7 && c7.pct, pc.pct, ic.pct].filter((x) => x !== null && x !== undefined);
    // risks found: items 7.x scored <=3 (latest visit) and form answers "No" on compliance items
    const items = [];
    if (rec) mpItemsOfCat(7).forEach((it) => { const v = rec.scores[it.id]; if (typeof v === "number" && v <= 3) items.push({ id: it.id, text: it.text, risk: mpRiskOfScore(v), score: v }); });
    const noAns = [];
    pc.list.concat(ic.list).forEach((f) => {
      mpFormItems(f.type).forEach((it) => { if (it.comply && (f.answers || {})[it.id] === "no") noAns.push({ type: f.type, id: it.id, text: it.text }); });
    });
    const crit = items.filter((x) => x.risk === "critical" || x.risk === "high").length;
    return { unit: u, c7, rec, pcra: pc, icra: ic, combined: parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : null, items, noAns, crit };
  });
  const ev = { item: {}, all: {} };
  const add = (bag, date, y) => { if (date && y !== null && y !== undefined) (bag[date] = bag[date] || []).push(y); };
  units.forEach((u) => {
    if (MpMonUI.unit !== "ALL" && MpMonUI.unit !== u.id) return;
    mpVisits(u.id).forEach((r) => {
      const S = mpStatsFromRecs([r], [u.id]);
      add(ev.item, r.date, S.cats[6].pct); add(ev.all, r.date, S.cats[6].pct);
    });
    forms.filter((f) => f.unitId === u.id).forEach((f) => add(ev.all, f.fields && f.fields.date, mpFormStats(f).pct));
  });
  const toPts = (bag) => Object.keys(bag).sort().map((d) => ({ date: d, y: bag[d].reduce((a, b) => a + b, 0) / bag[d].length, n: bag[d].length }));
  // risk distribution of items 7.x (latest visits) with the unit + item behind each level
  const risk = { critical: 0, high: 0, medium: 0, low: 0, na: 0 };
  const who = { critical: {}, high: {}, medium: {}, low: {}, na: {} };
  rows.forEach((r) => {
    if (!r.rec || (MpMonUI.unit !== "ALL" && MpMonUI.unit !== r.unit.id)) return;
    mpItemsOfCat(7).forEach((it) => {
      const v = r.rec.scores[it.id];
      const k = v === "na" ? "na" : typeof v === "number" ? mpRiskOfScore(v) : null;
      if (!k) return;
      risk[k]++;
      (who[k][r.unit.name] = who[k][r.unit.name] || []).push(it.id);
    });
  });
  return { rows, allUnits: units, itemPts: toPts(ev.item), allPts: toPts(ev.all), risk, who };
}

/** responsive SVG line chart. series: [{name,color,pts:[{date,y,n}]}] */
function mpLineChartSvg(series, opt) {
  opt = opt || {};
  const W = 420, H = 240, L = 40, R = 14, T = 14, B = 34;
  const all = series.flatMap((s) => s.pts.map((p) => new Date(p.date).getTime()));
  if (!all.length) return `<div class="empty-state">${mt("ยังไม่มีข้อมูล", "No data yet")}</div>`;
  let x0 = Math.min.apply(null, all), x1 = Math.max.apply(null, all);
  if (x0 === x1) { x0 -= 3 * 86400000; x1 += 3 * 86400000; }
  const X = (ms) => L + ((ms - x0) / (x1 - x0)) * (W - L - R);
  const Y = (v) => T + (1 - v / 100) * (H - T - B);
  let g = "";
  [0, 25, 50, 75, 100].forEach((v) => { g += `<line class="lc-grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="lc-t" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`; });
  const ticks = Math.min(5, Math.max(2, all.length));
  for (let i = 0; i < ticks; i++) {
    const ms = x0 + ((x1 - x0) * i) / (ticks - 1);
    const d = new Date(ms);
    g += `<text class="lc-t" x="${X(ms)}" y="${H - 10}" text-anchor="${i === 0 ? "start" : i === ticks - 1 ? "end" : "middle"}">${d.getDate()}/${d.getMonth() + 1}/${String(d.getFullYear() + 543).slice(2)}</text>`;
  }
  if (opt.target) g += `<line class="lc-target" x1="${L}" x2="${W - R}" y1="${Y(opt.target)}" y2="${Y(opt.target)}"/><text class="lc-tl" x="${W - R}" y="${Y(opt.target) - 5}" text-anchor="end">${mt("เป้าหมาย", "Target")} &gt;${opt.target}%</text>`;
  series.forEach((s) => {
    const pts = s.pts.map((p) => [X(new Date(p.date).getTime()), Y(p.y), p]);
    if (pts.length > 1) g += `<polyline class="lc-line" style="stroke:${s.color}" points="${pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}"/>`;
    pts.forEach((p) => {
      const tip = `${s.name}\n${mpFmtDate(p[2].date)}\n${p[2].y.toFixed(1)}%${p[2].n > 1 ? ` (${p[2].n} ${mt("รายการ", "results")})` : ""}`;
      g += `<circle class="lc-dot" style="fill:${s.color}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/><circle class="lc-hit" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="12" data-tip="${mpEsc(tip)}"/>`;
    });
  });
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${mpEsc(opt.label || "line chart")}">${g}</svg>`;
}
function mpDonutSvg(parts) {
  const total = parts.reduce((a, p) => a + p.v, 0);
  if (!total) return `<div class="empty-state">${mt("ยังไม่มีข้อมูล", "No data yet")}</div>`;
  const R = 52, C = 2 * Math.PI * R;
  let off = 0, g = "";
  parts.filter((p) => p.v).forEach((p) => {
    const len = (p.v / total) * C, gap = parts.filter((q) => q.v).length > 1 ? 2 : 0;
    g += `<circle class="dn" r="${R}" cx="70" cy="70" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" data-tip="${mpEsc(p.tip || p.label + ": " + p.v)}\n(${((p.v / total) * 100).toFixed(0)}%)"/>`;
    off += len;
  });
  return `<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="${mt("สัดส่วนระดับความเสี่ยง", "Risk level share")}">${g}<text x="70" y="68" text-anchor="middle" class="dn-n">${total}</text><text x="70" y="84" text-anchor="middle" class="lc-t">${mt("ข้อ", "items")}</text></svg>`;
}


/** donut of 7.x risk levels – lives at the top of the dashboard; hover shows which unit / items */
function mpRenderDashDonut(host) {

    return { v: D.risk[id], color, label, tip: `${label} · ${D.risk[id]} ${mt("ข้อ", "items")}${detail ? "\n" + detail : ""}` };
  });
