    <div class="desc" style="margin:0 0 8px;">${mt("ข้อ 7.1–7.6 ตรวจล่าสุด · เฉพาะหน่วยงานที่มีงานก่อสร้างหรือ Renovation (", "Items 7.1–7.6, latest visit · only units with construction / renovation (")}${D.allUnits.length}${mt(" หน่วย) · เลื่อนเมาส์ดูอาคารและข้อที่พบ", " units) · hover for unit and items")}</div>

function renderConstructionMonitor(host) {
  if (!host) return;
  const units = DB.get("mpUnits", []);
  const D = mpMonData();
  const visRows = D.rows.filter((r) => MpMonUI.unit === "ALL" || MpMonUI.unit === r.unit.id);
  if (MpMonUI.unit !== "ALL" && !D.rows.find((r) => r.unit.id === MpMonUI.unit)) MpMonUI.unit = "ALL";
  const sc = (v) => (v === null || v === undefined ? "–" : v.toFixed(0) + "%");
  const stChip = (p) => {
    if (p === null) return `<span class="st-chip muted" title="${mt("ยังไม่ประเมิน", "Not assessed")}">–</span>`;
    const o = p >= MP_TARGET ? ["good", "✔", mt("ถึงเป้า", "On target")] : p >= 70 ? ["warning", "◆", mt("ติดตาม", "Follow up")] : ["serious", "▲", mt("ต้องปรับปรุง", "Improve")];
    return `<span class="st-chip" title="${o[2]}" aria-label="${o[2]}"><i style="color:var(--st-${o[0]})">${o[1]}</i></span>`;
  };
  const riskTip = (r) => {
    const lines = [r.unit.name];
    r.items.forEach((x) => lines.push(`${mpRiskMeta(x.risk).icon} ${x.id} ${mpShort(x.text)} (${x.score})`));
    const byForm = {};
    r.noAns.forEach((x) => { (byForm[x.type] = byForm[x.type] || []).push(x); });
    Object.keys(byForm).forEach((t) => { lines.push(`${t} · ${mt("ไม่ใช่", "No")}:`); byForm[t].slice(0, 8).forEach((x) => lines.push(`  ${x.id} ${mpShort(x.text, 40)}`)); if (byForm[t].length > 8) lines.push(`  … +${byForm[t].length - 8}`); });
    return lines.length > 1 ? lines.join("\n") : r.unit.name + "\n" + mt("ไม่พบความเสี่ยง", "No risk found");
  };
  const list = visRows.map((r) => {
    const nRisk = r.items.length + r.noAns.length;
    return `<tr>
      <td><b>${mpEsc(r.unit.name)}</b><div class="muted-s">${r.rec ? mpFmtDT(r.rec.date, r.rec.time) : mt("ยังไม่ตรวจ", "not inspected")}</div></td>
      <td class="num">${sc(r.c7 && r.c7.pct)}</td>
      <td class="num">${r.pcra.n ? `${r.pcra.n}<span class="muted-s"> · ${sc(r.pcra.pct)}</span>` : "–"}</td>
      <td class="num">${r.icra.n ? `${r.icra.n}<span class="muted-s"> · ${sc(r.icra.pct)}</span>` : "–"}</td>
      <td class="num rk-find" data-tip="${mpEsc(riskTip(r))}">${nRisk ? `<b style="color:var(--st-${r.crit ? "critical" : "warning"})">${r.crit ? "✖" : "◆"} ${nRisk}</b>` : `<span style="color:var(--st-good)">✔ 0</span>`}</td>
      <td class="num"><b>${sc(r.combined)}</b></td><td>${stChip(r.combined)}</td></tr>`;
  }).join("");

const mpRiskOrder = (a, b) => (b.risk.critical - a.risk.critical) || (b.risk.high - a.risk.high) || (b.risk.medium - a.risk.medium) || (b.risk.low - a.risk.low) || ((a.pct === null ? 101 : a.pct) - (b.pct === null ? 101 : b.pct));

function mpRiskStackRow(label, risk, pct, extraTip, link) {
  const n = risk.critical + risk.high + risk.medium + risk.low;

    <div class="stack-track">${n ? segs : `<span class="muted-s">${mt("ยังไม่ประเมิน / N/A", "Not assessed / N/A")}</span>`}</div>

const MP_SAFETY = { start: "2026-01-01", target: 365 };
const MpSafeUI = { scope: null };
const mpDayNum = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
function mpIsAccident(c) { return c.type === "incident" || (!c.type && /incident|accident|อุบัติเหตุ/i.test(c.source || "")); }
function mpSafetyStats(buildingIds) {
  const today = todayISO();
  const t0 = mpDayNum(today), s0 = mpDayNum(MP_SAFETY.start);
  const dates = DB.get("capas", []).filter((c) => buildingIds.includes(c.buildingId) && mpIsAccident(c))
    .map((c) => c.occurredDate || c.openedDate).filter((d) => d && d >= MP_SAFETY.start && d <= today).sort();
  if (!dates.length) { const d = Math.max(0, t0 - s0 + 1); return { last: null, days: d, best: d, count: 0 }; }
  let best = 0, prev = s0;
  dates.forEach((d) => { const n = mpDayNum(d); best = Math.max(best, n - prev); prev = n; });
  const days = t0 - prev;
  return { last: dates[dates.length - 1], days, best: Math.max(best, days), count: dates.length };
}
const mpBoxes = (n, min) => String(Math.max(0, n)).padStart(min || 3, "0").split("").map((d) => `<span class="sf-box">${d}</span>`).join("");

/**
 * sync.js
 * Central data sync through the same Google Apps Script web app used for backup.
 * Why: data is otherwise kept in each browser's own storage, so an Admin on another computer
 * cannot see what a unit entered. With sync on, every computer pushes its changes to the
 * Google Sheet (tabs d_*) and pulls everybody else's, so Admin sees all of it.
 *
 *  - record level, last writer wins (compared by the `_u` time stamp that DB.set puts on records)
 *  - deletions travel as tombstones
 *  - photos are uploaded to the sheet (tab _photos) and fetched on demand
 *  - users / passwords are NOT synced
 * Connection: the Admin copies a "team connection code" (URL + token) from the Backup page and
 * each user pastes it once in Settings.
 */

const SyncMgr = {
  _busy: false,
  _timer: null,
  _deb: null,
  _listeners: [],

  cfg() { return Object.assign({ url: "", token: "", on: false }, DB.get("syncCfg", {})); },
  saveCfg(c) { DB.set("syncCfg", c); },
  meta() { return DB.get("syncMeta", {}); },
  saveMeta(p) { DB.set("syncMeta", Object.assign(this.meta(), p)); },
  enabled() { const c = this.cfg(); return !!(c.on && BackupMgr.validUrl(c.url) && c.token); },

  // ---- connection code ----
  makeCode(url, token) {
    return "QSHE1." + btoa(unescape(encodeURIComponent(JSON.stringify({ u: url, t: token }))));
  },
  parseCode(code) {
    const m = String(code || "").trim().match(/^QSHE1\.([A-Za-z0-9+/=]+)$/);
    if (!m) throw new Error(mt("รหัสเชื่อมต่อไม่ถูกต้อง", "Invalid connection code"));
    let o;
    try { o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (e) { throw new Error(mt("รหัสเชื่อมต่อไม่ถูกต้อง", "Invalid connection code")); }
    if (!o || !BackupMgr.validUrl(o.u) || !o.t) throw new Error(mt("รหัสเชื่อมต่อไม่ถูกต้อง", "Invalid connection code"));
    return { url: o.u, token: o.t };
  },
  /** low-level call using the sync connection (never the blind fallback) */
  async call(payload) {
    const c = this.cfg();
    if (!BackupMgr.validUrl(c.url) || !c.token) throw new Error(mt("ยังไม่ได้เชื่อมต่อ", "Not connected"));
    const r = await fetch(c.url.trim(), { method: "POST", body: JSON.stringify(Object.assign({ token: c.token }, payload)), headers: { "Content-Type": "text/plain;charset=utf-8" } });
    return r.json();
  },
  connect(code) {
    const o = this.parseCode(code);
    this.saveCfg({ url: o.url, token: o.token, on: true });
    // the same connection also serves backups
    const b = BackupMgr.cfg();
    if (!b.url) BackupMgr.saveCfg(Object.assign(b, { url: o.url, token: o.token, auto: false }));
    DB.set("syncMeta", {});
    return this.run(true);
  },
  disconnect() { this.saveCfg(Object.assign(this.cfg(), { on: false })); this.paint(); },

  // ---- scheduling ----
  schedule() {
    if (!this.enabled()) return;
    clearTimeout(this._deb);
    this._deb = setTimeout(() => this.run(), 4000);
  },
  start() {
    if (this._timer) return;
    this._timer = setInterval(() => { if (!document.hidden) this.run(); }, 120000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) this.run(); });
    this.run();
  },
  onChange(fn) { this._listeners.push(fn); },

  // ---- main sync ----
  async run(first) {
    if (!this.enabled() || this._busy) return;
    this._busy = true; this.paint("busy");
    const started = new Date().toISOString();
    try {
      const meta = this.meta();
      const init = !meta.initialized;
      let since = init ? 0 : meta.since || 0;
      let res;
      if (init) {
        // 1) pull everything that already exists centrally (central copy wins)
        res = await this.call({ action: "sync", since: 0, changes: {}, deletes: [] });
        if (!res.ok) throw new Error(res.error || "sync failed");
        const serverIds = {};
        Object.keys(res.changes || {}).forEach((c) => (res.changes[c] || []).forEach((r) => { serverIds[c + "|" + r.id] = 1; }));
        (res.deletes || []).forEach((d) => { serverIds[d.c + "|" + d.id] = 1; });
        this.applyRemote(res);
        // 2) local records the centre has never seen are stamped so they get uploaded
        DB.SYNC.forEach((c) => {
          const arr = DB.get(c, []);
          let touched = false;
          arr.forEach((r) => { if (r && r.id && !r._u && !serverIds[c + "|" + r.id]) { r._u = started; touched = true; } });
          if (touched) DB.set(c, arr, { raw: true });
        });
        since = res.serverTime;
        this.saveMeta({ initialized: true, since, lastPush: "" });
      }
      // push changes made since the last push
      const m2 = this.meta();
      const lastPush = m2.lastPush || "";
      const changes = {};
      let any = false;
      DB.SYNC.forEach((c) => {
        const list = DB.get(c, []).filter((r) => r && r.id && r._u && r._u > lastPush);
        if (list.length) { changes[c] = list; any = true; }
      });
      const tomb = DB.get("syncTomb", []);
      res = await this.call({ action: "sync", since, changes, deletes: tomb });
      if (!res.ok) throw new Error(res.error === "unknown action" ? mt("สคริปต์ Apps Script เป็นเวอร์ชันเก่า — วางโค้ดใหม่และ Deploy เวอร์ชันใหม่", "Apps Script is an old version — paste the new code and deploy a new version") : res.error || "sync failed");
      this.applyRemote(res);
      // tombstones that were delivered can go
      DB.set("syncTomb", DB.get("syncTomb", []).filter((t) => t._u > started), { raw: true });
      this.saveMeta({ since: res.serverTime, lastPush: started, lastAt: new Date().toISOString(), status: "ok", lastError: "" });
      await this.syncPhotos(res.photoKeys || []);
      this.paint();
      this._listeners.forEach((fn) => { try { fn(); } catch (e) { /* ignore */ } });
    } catch (e) {
      this.saveMeta({ status: "error", lastError: e.message || String(e) });
      this.paint();
    } finally {
      this._busy = false;
    }
  },

  applyRemote(res) {
    let changed = false;
    Object.keys(res.changes || {}).forEach((c) => {
      if (!DB.SYNC.includes(c)) return;
      const local = DB.get(c, []);
      const map = {};
      local.forEach((r, i) => { map[r.id] = i; });
      (res.changes[c] || []).forEach((rec) => {
        const i = map[rec.id];
        if (i === undefined) { local.push(rec); map[rec.id] = local.length - 1; changed = true; }
        else if ((local[i]._u || "") < (rec._u || "")) { local[i] = rec; changed = true; }
      });
      DB.set(c, local, { raw: true });
    });
    (res.deletes || []).forEach((d) => {
      if (!DB.SYNC.includes(d.c)) return;
      const local = DB.get(d.c, []);
      const i = local.findIndex((r) => r.id === d.id);
      if (i >= 0 && (local[i]._u || "") < d._u) { local.splice(i, 1); DB.set(d.c, local, { raw: true }); changed = true; }
    });
    return changed;
  },

  // ---- photos ----
  async syncPhotos(serverKeys) {
    if (!MpImg.available()) return;
    const meta = this.meta();
    const up = meta.photoUp || {};
    const srv = {};
    serverKeys.forEach((k) => { srv[k] = 1; });
    const local = await MpImg.allKeys();
    const localSet = {};
    local.forEach((k) => { localSet[k] = 1; });
    // uploaded earlier but now gone from the centre -> removed by someone else
    for (const k of local) { if (up[k] && !srv[k]) { await MpImg.del(k, true); delete up[k]; localSet[k] = 0; } }
    // photos removed locally while online
    const delQ = meta.photoDel || [];
    for (const k of delQ) { try { await this.call({ action: "photoDel", key: k }); } catch (e) { break; } }
    // upload up to 6 new ones per run
    let n = 0;
    for (const k of local) {
      if (!localSet[k] || up[k] || n >= 6) continue;
      const data = await MpImg.get(k);
      if (!data) continue;
      const r = await this.call({ action: "photoPut", key: k, data });
      if (r.ok) { up[k] = 1; n++; }
    }
    this.saveMeta({ photoUp: up, photoDel: [], serverPhotoKeys: serverKeys });
  },
  /** download photos of one unit / visit that exist centrally but not on this computer */
  async fetchPhotos(prefix) {
    if (!this.enabled() || !MpImg.available()) return 0;
    const keys = (this.meta().serverPhotoKeys || []).filter((k) => k.startsWith(prefix));
    const have = {};
    (await MpImg.allKeys()).forEach((k) => { have[k] = 1; });
    const up = this.meta().photoUp || {};
    let got = 0;
    for (const k of keys) {
      if (have[k]) continue;
      try {
        const r = await this.call({ action: "photoGet", key: k });
        if (r.ok && r.data) { await MpImg.put(k, r.data, true); up[k] = 1; got++; }
      } catch (e) { break; }
    }
    if (got) this.saveMeta({ photoUp: up });
    return got;
  },
  queuePhotoDelete(key) {
    if (!this.enabled()) return;
    const m = this.meta();
    const up = m.photoUp || {};
    if (up[key]) { delete up[key]; this.saveMeta({ photoUp: up, photoDel: (m.photoDel || []).concat(key) }); this.schedule(); }
  },

  // ---- status line in the sidebar ----
  paint(state) {
    const el = document.getElementById("sync-status");
    if (!el) return;
    const c = this.cfg();
    const m = this.meta();
    if (!c.on) { el.innerHTML = `<span title="${mt("ข้อมูลเก็บในเครื่องนี้เท่านั้น", "Data is kept on this computer only")}">○ ${mt("ไม่ได้เชื่อมข้อมูลกลาง", "Local only")}</span>`; return; }
    if (state === "busy") { el.innerHTML = `⟳ ${mt("กำลังซิงก์…", "Syncing…")}`; return; }
    if (m.status === "error") { el.innerHTML = `<span title="${mpEsc(m.lastError || "")}">▲ ${mt("ซิงก์ไม่สำเร็จ", "Sync failed")}</span>`; return; }
    const t = m.lastAt ? new Date(m.lastAt).toLocaleTimeString(mt("th-TH", "en-GB"), { hour: "2-digit", minute: "2-digit" }) : "–";
    el.innerHTML = `✔ ${mt("ซิงก์แล้ว", "Synced")} ${t}`;
  }
};

/**
 * backup.js
 * Backup / restore so data kept in the browser (localStorage + IndexedDB photos) is not lost.
 *   A. JSON backup file  – everything incl. users and photos; download any time, restore from file
 *   B. Google Sheet      – via a Google Apps Script web app the owner deploys; one tab per dataset
 *                          plus a restorable snapshot; runs on a button press or automatically
 *                          every 7 days (checked whenever an admin has the app open)
 *   C. CSV               – per-dataset export (same datasets as Export / Reports)
 * A static web page cannot run in the background, so the "every 7 days" check happens when an
 * admin opens the app (and hourly while it stays open).
 */

const BACKUP_DAYS = 7;
const BACKUP_KEYS = ["buildings", "processStatus", "okrs", "kpis", "capas", "mpPlans", "mpUnits", "mpScores", "mpForms", "lang", "uiPrefs", "moduleVisibility"];
// "users" is only in the JSON file backup (it holds passwords). Never sent to Google Sheets.

const BackupMgr = {
  cfg() { return Object.assign({ url: "", token: "", auto: true }, DB.get("backupCfg", {})); },
  saveCfg(c) { DB.set("backupCfg", c); },
  meta() { return DB.get("backupMeta", {}); },
  saveMeta(patch) { DB.set("backupMeta", Object.assign(this.meta(), patch)); },
  lastAt() {
    const m = this.meta();
    return [m.fileAt, m.sheetAt].filter(Boolean).sort().pop() || null;
  },
  daysSince(iso) { return iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : Infinity; },
  isOverdue() { return this.daysSince(this.lastAt()) >= BACKUP_DAYS; },
  validUrl(u) { return /^https:\/\/script\.google(usercontent)?\.com\//.test(String(u || "").trim()); },
  newToken() {
    const a = new Uint8Array(18);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.from(a, (b) => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
  },

  // ---------- collect / apply ----------
  async collect(opts) {
    const keys = {};
    const list = opts.users ? ["users"].concat(BACKUP_KEYS) : BACKUP_KEYS;
    list.forEach((k) => { keys[k] = DB.get(k, null); });
    const out = { app: "PSD eNGINNo QSHE Management", version: "1.0", exportedAt: new Date().toISOString(), by: State.user ? State.user.username : "", keys };
    if (opts.photos && MpImg.available()) {
      const rows = await MpImg._tx("readonly", (st) => st.getAll());
      out.photos = {};
      (rows || []).forEach((r) => { out.photos[r.key] = r.data; });
    }
    return out;
  },
  async apply(snap, opts) {
    if (!snap || typeof snap !== "object" || !snap.keys || typeof snap.keys !== "object") throw new Error("invalid backup");
    const allowed = ["users"].concat(BACKUP_KEYS);
    Object.keys(snap.keys).forEach((k) => {
      if (!allowed.includes(k)) return;
      if (k === "users" && !opts.users) return;
      if (snap.keys[k] !== null) DB.set(k, snap.keys[k]);
    });
    if (snap.photos && MpImg.available()) {
      await MpImg._tx("readwrite", (st) => { st.clear(); Object.keys(snap.photos).forEach((k) => st.put({ key: k, data: snap.photos[k] })); });
    }
  },
  tables() {
    const t = {};
    Object.keys(DATASETS).forEach((k) => {
      const ds = DATASETS[k];
      t[k] = { headers: ds.headers.map((h) => h.label), rows: ds.rows().map((r) => ds.headers.map((h) => (r[h.key] === undefined || r[h.key] === null ? "" : r[h.key]))) };
    });
    // user list for reference only – no passwords
    t.users = { headers: ["username", "name", "role", "status", "buildings"], rows: DB.get("users", []).map((u) => [u.username, u.name, u.role, u.status || "active", (u.buildingIds || []).join(" ")]) };
    return t;
  },

  // ---------- Google Apps Script ----------
  async call(payload) {
    const c = this.cfg();
    if (!this.validUrl(c.url)) throw new Error(mt("URL ของ Apps Script ไม่ถูกต้อง (ต้องขึ้นต้นด้วย https://script.google.com/)", "Invalid Apps Script URL (must start with https://script.google.com/)"));
    if (!c.token) throw new Error(mt("ยังไม่ได้ตั้งรหัสลับ (Token)", "Token is empty"));
    const body = JSON.stringify(Object.assign({ token: c.token }, payload));
    const init = { method: "POST", body, headers: { "Content-Type": "text/plain;charset=utf-8" } };
    try {
      const r = await fetch(c.url.trim(), init);
      return await r.json();
    } catch (e) {
      if (payload.action !== "save") throw new Error(mt("เชื่อมต่อไม่ได้ ตรวจสอบ URL / การ Deploy (Who has access = Anyone)", "Cannot connect. Check the URL and deployment (Who has access = Anyone)"));
      // response not readable (CORS) – send once more blind so the write still happens
      await fetch(c.url.trim(), Object.assign({}, init, { mode: "no-cors" }));
      return { ok: true, unconfirmed: true };
    }
  },
  async backupToSheet(reason) {
    const snapshot = await this.collect({ users: false, photos: false });
    const res = await this.call({ action: "save", reason: reason || "manual", by: snapshot.by, tables: this.tables(), snapshot });
    if (!res.ok) throw new Error(res.error || "failed");
    this.saveMeta({ sheetAt: new Date().toISOString(), sheetStatus: res.unconfirmed ? "unconfirmed" : "ok", sheetReason: reason || "manual" });
    return res;
  },
  async autoCheck() {
    if (!State.user || !Auth.isAdmin(State.user)) return;
    const c = this.cfg();
    if (!c.auto || !this.validUrl(c.url) || !c.token) return;
    if (this.daysSince(this.meta().sheetAt) < BACKUP_DAYS) return;
    try {
      await this.backupToSheet("auto");
      toast(mt("สำรองข้อมูลไป Google Sheet อัตโนมัติแล้ว", "Automatic Google Sheet backup done"));
    } catch (e) {
      this.saveMeta({ sheetStatus: "error: " + e.message });
    }
    if (State.view === "backup") renderView();
  },
  startTimer() {
    if (this._timer) return;
    this._timer = setInterval(() => this.autoCheck(), 3600 * 1000);
  },
  /** banner shown on every page for admins when the last backup is older than 7 days */
  bannerHtml() {
    if (!State.user || !Auth.isAdmin(State.user) || State.view === "backup" || !this.isOverdue()) return "";
    const last = this.lastAt();
    const txt = last
      ? mt(`ยังไม่ได้สำรองข้อมูลมา ${Math.floor(this.daysSince(last))} วันแล้ว (เกณฑ์ ${BACKUP_DAYS} วัน)`, `No backup for ${Math.floor(this.daysSince(last))} days (limit ${BACKUP_DAYS})`)
      : mt("ยังไม่เคยสำรองข้อมูล", "No backup has been made yet");
    return `<div class="mp-banner" id="backup-banner">▲ ${txt} <button class="btn small" id="backup-banner-go" style="margin-left:10px;">${mt("ไปหน้าสำรองข้อมูล", "Go to Backup")}</button></div>`;
  }
};

const APPS_SCRIPT_CODE = `/**
 * PSD eNGINNo QSHE Management - Google Sheet backend  (script version 2)
 *  - backup tabs + _Snapshot (restore)
 *  - central data sync (tabs d_*), so Admin sees everything entered on every computer
 *  - photo storage (tab _photos)
 * Paste into Extensions > Apps Script of the Google Sheet, then Deploy > New deployment > Web app
 * (Execute as: Me, Who has access: Anyone).  After editing: Deploy > Manage deployments > New version.
 */
const TOKEN = '__TOKEN__';   // must equal the Token in the app
const VERSION = 2;
const CHUNK = 45000;         // one cell holds at most 50,000 characters
const MAXCH = 8;             // max cells per record / photo
const COLLS = ['buildings', 'processStatus', 'okrs', 'kpis', 'capas', 'mpPlans', 'mpUnits', 'mpScores', 'mpForms'];

function doPost(e) {
  try {
    var p = JSON.parse(e.postData.contents);
    if (!p.token || p.token !== TOKEN) return out_({ ok: false, error: 'bad token' });
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    switch (p.action) {
      case 'ping': return out_({ ok: true, sheet: ss.getName(), version: VERSION });
      case 'latest': return out_(readSnapshot_(ss));
      case 'save': return out_(save_(ss, p));
      case 'sync': return out_(withLock_(function () { return sync_(ss, p); }));
      case 'photoPut': return out_(withLock_(function () { return photoPut_(ss, p); }));
      case 'photoGet': return out_(photoGet_(ss, p));
      case 'photoDel': return out_(withLock_(function () { return photoDel_(ss, p); }));
    }
    return out_({ ok: false, error: 'unknown action' });
  } catch (err) {
    return out_({ ok: false, error: String(err) });
  }
}

function withLock_(fn) {
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try { return fn(); } finally { lock.releaseLock(); }
}

/* ---------- backup (unchanged from version 1) ---------- */
function save_(ss, p) {
  var names = Object.keys(p.tables || {});
  names.forEach(function (n) { writeTable_(ss, n, p.tables[n]); });
  var snap = sheet_(ss, '_Snapshot');
  snap.clear();
  var json = JSON.stringify(p.snapshot || {});
  var rows = [['savedAt', new Date().toISOString()]];
  for (var i = 0, k = 1; i < json.length; i += CHUNK, k++) rows.push([String(k), json.substr(i, CHUNK)]);
  snap.getRange(1, 1, rows.length, 2).setNumberFormat('@').setValues(rows);
  sheet_(ss, '_Log').appendRow([new Date(), String(p.by || ''), String(p.reason || ''), names.length + ' tables']);
  return { ok: true, tables: names.length };
}
function readSnapshot_(ss) {
  var snap = ss.getSheetByName('_Snapshot');
  if (!snap) return { ok: false, error: 'no snapshot yet' };
  var v = snap.getDataRange().getValues();
  if (v.length < 2) return { ok: false, error: 'no snapshot yet' };
  var json = v.slice(1).map(function (r) { return r[1]; }).join('');
  return { ok: true, savedAt: v[0][1], snapshot: JSON.parse(json) };
}
function writeTable_(ss, name, t) {
  var sh = sheet_(ss, name);
  sh.clear();
  var data = [t.headers].concat(t.rows || []).map(function (r) {
    return r.map(function (c) { return c === null || c === undefined ? '' : String(c); });
  });
  var rng = sh.getRange(1, 1, data.length, t.headers.length);
  rng.setNumberFormat('@');            // plain text: nothing is evaluated as a formula
  rng.setValues(data);
  sh.setFrozenRows(1);
  sh.getRange(1, 1, 1, t.headers.length).setFontWeight('bold');
}

/* ---------- central data sync: one row per record, last writer wins ---------- */
function dataSheet_(ss, c) {
  var sh = ss.getSheetByName('d_' + c);
  if (!sh) {
    sh = ss.insertSheet('d_' + c);
    sh.getRange(1, 1, 1, 4).setValues([['id', 'updated', 'server', 'deleted']]);
    sh.getRange('A:L').setNumberFormat('@');
    sh.setFrozenRows(1);
  }
  return sh;
}
function chunk_(json) {
  if (json.length > CHUNK * MAXCH) throw new Error('record too large');
  var out = [];
  for (var i = 0; i < json.length; i += CHUNK) out.push(json.substr(i, CHUNK));
  return out;
}
function pad_(row) { while (row.length < 4 + MAXCH) row.push(''); return row; }

function sync_(ss, p) {
  var now = Date.now();
  var since = Number(p.since || 0);
  var res = { ok: true, serverTime: now, changes: {}, deletes: [], photoKeys: [] };
  COLLS.forEach(function (c) {
    var sh = dataSheet_(ss, c);
    var n = Math.max(sh.getLastRow() - 1, 0);
    var meta = n ? sh.getRange(2, 1, n, 4).getValues() : [];
    var idx = {};
    meta.forEach(function (r, i) { idx[String(r[0])] = i; });
    var appendRows = [];
    var incoming = ((p.changes || {})[c]) || [];
    incoming.forEach(function (rec) {
      if (!rec || !rec.id) return;
      var i = idx[rec.id];
      if (i !== undefined && String(meta[i][1]) >= String(rec._u)) return;      // server copy is newer
      var row = pad_([rec.id, rec._u, String(now), '0'].concat(chunk_(JSON.stringify(rec))));
      if (i !== undefined) { sh.getRange(i + 2, 1, 1, row.length).setValues([row]); meta[i] = [rec.id, rec._u, String(now), '0']; }
      else { idx[rec.id] = meta.length + appendRows.length; meta.push([rec.id, rec._u, String(now), '0']); appendRows.push(row); }
    });
    (p.deletes || []).forEach(function (d) {
      if (d.c !== c || !d.id) return;
      var i = idx[d.id];
      var row = pad_([d.id, d._u, String(now), '1']);
      if (i !== undefined) {
        if (String(meta[i][1]) >= String(d._u)) return;
        sh.getRange(i + 2, 1, 1, row.length).setValues([row]); meta[i] = [d.id, d._u, String(now), '1'];
      } else { idx[d.id] = meta.length + appendRows.length; meta.push([d.id, d._u, String(now), '1']); appendRows.push(row); }
    });
    if (appendRows.length) sh.getRange(sh.getLastRow() + 1, 1, appendRows.length, 4 + MAXCH).setValues(appendRows);
    // what changed on the server since the client's last sync
    var list = [];
    meta.forEach(function (r, i) {
      if (Number(r[2]) > since) {
        if (String(r[3]) === '1') res.deletes.push({ c: c, id: String(r[0]), _u: String(r[1]) });
        else {
          var cells = sh.getRange(i + 2, 5, 1, MAXCH).getValues()[0].join('');
          try { list.push(JSON.parse(cells)); } catch (e) {}
        }
      }
    });
    if (list.length) res.changes[c] = list;
  });
  var ph = ss.getSheetByName('_photos');
  if (ph && ph.getLastRow() > 1) res.photoKeys = ph.getRange(2, 1, ph.getLastRow() - 1, 1).getValues().map(function (r) { return String(r[0]); });
  return res;
}

/* ---------- photos (stored as base64 text in _photos) ---------- */
function photoSheet_(ss) {
  var sh = ss.getSheetByName('_photos');
  if (!sh) { sh = ss.insertSheet('_photos'); sh.getRange(1, 1, 1, 2).setValues([['key', 'saved']]); sh.getRange('A:J').setNumberFormat('@'); sh.setFrozenRows(1); }
  return sh;
}
function photoRow_(sh, key) {
  var n = Math.max(sh.getLastRow() - 1, 0);
  if (!n) return -1;
  var keys = sh.getRange(2, 1, n, 1).getValues();
  for (var i = 0; i < n; i++) if (String(keys[i][0]) === key) return i + 2;
  return -1;
}
function photoPut_(ss, p) {
  if (!p.key || !p.data) return { ok: false, error: 'missing key/data' };
  var sh = photoSheet_(ss);
  var row = pad_([p.key, new Date().toISOString()].concat(chunk_(String(p.data)))).slice(0, 2 + MAXCH);
  var r = photoRow_(sh, p.key);
  if (r > 0) sh.getRange(r, 1, 1, row.length).setValues([row]);
  else sh.getRange(sh.getLastRow() + 1, 1, 1, row.length).setValues([row]);
  return { ok: true };
}
function photoGet_(ss, p) {
  var sh = ss.getSheetByName('_photos');
  var r = sh ? photoRow_(sh, p.key) : -1;
  if (r < 0) return { ok: false, error: 'not found' };
  return { ok: true, data: sh.getRange(r, 3, 1, MAXCH).getValues()[0].join('') };
}
function photoDel_(ss, p) {
  var sh = ss.getSheetByName('_photos');
  var r = sh ? photoRow_(sh, p.key) : -1;
  if (r > 0) sh.deleteRow(r);
  return { ok: true };
}

function sheet_(ss, name) { return ss.getSheetByName(name) || ss.insertSheet(name); }
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
`;

        <div class="field"><label>${mt("รหัสลับ (Token)", "Token (shared secret)")}</label>

  const msg = (txt, bad) => { const el = document.getElementById("bk-msg"); el.textContent = txt; el.style.color = bad ? "var(--text)" : "var(--muted)"; el.style.fontWeight = bad ? "700" : "400"; if (bad) el.textContent = "▲ " + txt; };
  const readCfg = () => ({ url: document.getElementById("bk-url").value.trim(), token: document.getElementById("bk-token").value.trim(), auto: document.getElementById("bk-auto").checked });
  const drawCode = () => { document.getElementById("bk-code").textContent = APPS_SCRIPT_CODE.replace("__TOKEN__", (document.getElementById("bk-token").value.trim() || "PUT-YOUR-TOKEN-HERE").replace(/[^\w-]/g, "")); };
  drawCode();
  const busy = (b, on) => { b.disabled = on; b.style.opacity = on ? 0.6 : 1; };

  document.getElementById("bk-token").addEventListener("input", drawCode);
  document.getElementById("bk-gen").addEventListener("click", () => { document.getElementById("bk-token").value = BackupMgr.newToken(); drawCode(); });
  document.getElementById("bk-copy-code").addEventListener("click", () => {
    const code = document.getElementById("bk-code").textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast(mt("คัดลอกแล้ว", "Copied")), () => {

  document.getElementById("bk-save").addEventListener("click", () => {
    const cfg = readCfg();
    if (cfg.url && !BackupMgr.validUrl(cfg.url)) return msg(mt("URL ต้องขึ้นต้นด้วย https://script.google.com/", "URL must start with https://script.google.com/"), true);
    BackupMgr.saveCfg(cfg); msg(mt("บันทึกการตั้งค่าแล้ว", "Settings saved"));
  });
  const syCopy = document.getElementById("sy-copy");
  if (syCopy) syCopy.addEventListener("click", () => { const i = document.getElementById("sy-code-show"); i.select(); try { navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand("copy"); } toast(mt("คัดลอกแล้ว", "Copied")); });
  const syStart = document.getElementById("sy-start");
  if (syStart) syStart.addEventListener("click", async () => { syStart.disabled = true; await SyncMgr.connect(SyncMgr.makeCode(c.url, c.token)); renderBackup(root); });
  const syRun = document.getElementById("sy-run");
  if (syRun) syRun.addEventListener("click", async () => { syRun.disabled = true; await SyncMgr.run(); renderBackup(root); });
  document.getElementById("bk-test").addEventListener("click", async (e) => {
    const cfg = readCfg();
    if (cfg.url && !BackupMgr.validUrl(cfg.url)) return msg(mt("URL ต้องขึ้นต้นด้วย https://script.google.com/", "URL must start with https://script.google.com/"), true);
    BackupMgr.saveCfg(cfg); busy(e.target, true); msg(mt("กำลังทดสอบ…", "Testing…"));
    try { const r = await BackupMgr.call({ action: "ping" }); r.ok ? msg(mt("เชื่อมต่อสำเร็จ — ชีต: ", "Connected — sheet: ") + (r.sheet || "")) : msg(r.error === "bad token" ? mt("Token ไม่ตรงกับในโค้ด Apps Script", "Token does not match the Apps Script code") : String(r.error), true); }
    catch (err) { msg(err.message, true); }
    busy(e.target, false);
  });
  document.getElementById("bk-now").addEventListener("click", async (e) => {
    BackupMgr.saveCfg(readCfg()); busy(e.target, true); msg(mt("กำลังสำรองข้อมูล…", "Backing up…"));
    try { const r = await BackupMgr.backupToSheet("manual"); toast(mt("สำรองข้อมูลแล้ว", "Backup done")); renderBackup(root); document.getElementById("bk-msg").textContent = r.unconfirmed ? mt("ส่งข้อมูลแล้ว แต่เบราว์เซอร์อ่านผลตอบกลับไม่ได้ — เปิด Google Sheet ตรวจสอบ", "Sent, but the reply could not be read — open the Google Sheet to verify") : mt("สำรองสำเร็จ", "Backup succeeded"); }
    catch (err) { msg(err.message === "bad token" ? mt("Token ไม่ตรงกับในโค้ด Apps Script", "Token does not match the Apps Script code") : err.message, true); busy(e.target, false); }
  });
  document.getElementById("bk-restore-sheet").addEventListener("click", async (e) => {
    BackupMgr.saveCfg(readCfg()); busy(e.target, true); msg(mt("กำลังดึงข้อมูลล่าสุดจาก Google Sheet…", "Fetching the latest snapshot…"));
    try {
      const r = await BackupMgr.call({ action: "latest" });
      if (!r.ok) throw new Error(r.error || "failed");
      if (!confirm(mt(`กู้คืนข้อมูลจากสแนปช็อตเมื่อ ${r.savedAt}?\nข้อมูลปัจจุบันของ OKR/KPI/CAPA/Master Plan ฯลฯ จะถูกแทนที่ (ผู้ใช้และรูปภาพไม่ถูกแตะต้อง)`, `Restore the snapshot from ${r.savedAt}?\nCurrent OKR/KPI/CAPA/Master Plan etc. will be replaced (users and photos are untouched).`))) { busy(e.target, false); return msg(""); }
      await BackupMgr.apply(r.snapshot, { users: false });
      toast(mt("กู้คืนแล้ว", "Restored")); renderShell(); renderTopbar(); renderBackup(root);
    } catch (err) { msg(err.message, true); busy(e.target, false); }
  });
  document.getElementById("bk-download").addEventListener("click", async () => {
    const snap = await BackupMgr.collect({ users: true, photos: document.getElementById("bk-photos").checked });
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    ExportUtil.download(`QSHE_backup_${stamp}.json`, JSON.stringify(snap), "application/json;charset=utf-8");
    BackupMgr.saveMeta({ fileAt: new Date().toISOString() });
    toast(mt("ดาวน์โหลดไฟล์สำรองแล้ว", "Backup file downloaded"));
    renderBackup(root);
  });
  document.getElementById("bk-restore-file").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      const snap = JSON.parse(await f.text());
      if (snap.app !== "PSD eNGINNo QSHE Management" || !snap.keys) throw new Error(mt("ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบนี้", "This is not a backup file of this app"));
      const hasUsers = !!snap.keys.users;
      if (!confirm(mt(`กู้คืนจากไฟล์ (สำรองเมื่อ ${snap.exportedAt})?\nข้อมูลปัจจุบันทั้งหมด${hasUsers ? " รวมถึงผู้ใช้" : ""}${snap.photos ? " และรูปภาพ" : ""}จะถูกแทนที่ ควรดาวน์โหลดไฟล์สำรองปัจจุบันก่อน`, `Restore from file (made ${snap.exportedAt})?\nAll current data${hasUsers ? " including users" : ""}${snap.photos ? " and photos" : ""} will be replaced. Consider downloading a current backup first.`))) return;
      await BackupMgr.apply(snap, { users: true });
      toast(mt("กู้คืนแล้ว กำลังรีโหลด…", "Restored, reloading…"));
      setTimeout(() => { Auth.logout(); location.reload(); }, 700);
    } catch (err) { msg(err.message || mt("อ่านไฟล์ไม่ได้", "Could not read the file"), true); }
  });
  root.querySelectorAll("[data-csv]").forEach((b) => b.addEventListener("click", () => {
    const ds = DATASETS[b.dataset.csv];
    ExportUtil.exportCSV(ds.rows(), ds.headers, "QSHE_" + b.dataset.csv);
  }));
}

/**
 * app.js
 * PSD eNGINNo QSHE Management V1.0 — main application logic.
 * Vanilla JS SPA, localStorage-backed. See README.md for architecture notes.
 */

const State = {
  user: null,
  view: "dashboard",
  activeBuilding: null // building id, or "ALL"
};

// ---------------------------------------------------------------- boot ---
document.addEventListener("DOMContentLoaded", () => {
  DB.ensureSeeded();
  applyUiPrefs();
  const session = Auth.currentUser();
  if (session) {
    startApp(session);
  } else {
    showLogin();
  }
});

function applyUiPrefs() {
  const prefs = DB.get("uiPrefs", { font: "plex", fontSize: "md", theme: "light" });
  const fontDef = FONT_OPTIONS.find((f) => f.id === prefs.font) || FONT_OPTIONS[0];
  const sizeDef = FONT_SIZE_OPTIONS.find((s) => s.id === prefs.fontSize) || FONT_SIZE_OPTIONS[1];
  document.documentElement.style.setProperty("--app-font", fontDef.stack);
  document.documentElement.style.setProperty("--app-font-size", sizeDef.px);
  document.body.classList.remove("theme-dark", "theme-ocean");
  if (prefs.theme === "dark") document.body.classList.add("theme-dark");
  if (prefs.theme === "ocean") document.body.classList.add("theme-ocean");
}

function showLogin() {
  document.getElementById("app-shell").classList.add("hidden");
  document.getElementById("login-screen").classList.remove("hidden");

  const loginCard = document.getElementById("login-card");
  const registerCard = document.getElementById("register-card");

  // populate the "requested building" dropdown on the register form
  const buildingSelect = document.getElementById("reg-building");
  const buildings = DB.get("buildings", []);
  buildingSelect.innerHTML =
    `<option value="">ยังไม่ระบุ — ให้ผู้ดูแลระบบกำหนด</option>` +
    buildings.map((b) => `<option value="${b.id}">${b.name}</option>`).join("");

  document.getElementById("show-register-btn").addEventListener("click", () => {
    loginCard.classList.add("hidden");
    registerCard.classList.remove("hidden");
  });
  document.getElementById("show-login-btn").addEventListener("click", () => {
    registerCard.classList.add("hidden");
    loginCard.classList.remove("hidden");
  });

  wirePasswordToggle("toggle-login-pw", "login-password");
  wirePasswordToggle("toggle-reg-pw", "reg-password");

  document.getElementById("login-form").onsubmit = (e) => {
    e.preventDefault();
    const username = document.getElementById("login-username").value;
    const password = document.getElementById("login-password").value;
    const res = Auth.login(username, password);
    const errEl = document.getElementById("login-error");
    if (!res.ok) {
      errEl.textContent = res.error;
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    startApp(res.user);
  };

  document.getElementById("register-form").onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById("reg-name").value;
    const username = document.getElementById("reg-username").value;
    const password = document.getElementById("reg-password").value;
    const buildingId = document.getElementById("reg-building").value;
    const errEl = document.getElementById("register-error");
    const okEl = document.getElementById("register-success");
    const res = Auth.register({ name, username, password, buildingId });

  };

function buildingsInScope() {
  const buildings = accessibleBuildings();
  if (State.activeBuilding === "ALL") return buildings;
  return buildings.filter((b) => b.id === State.activeBuilding);
}

function getProcessStatus(buildingId, processId) {
  const all = DB.get("processStatus", []);
  return all.find((r) => r.buildingId === buildingId && r.processId === processId) || null;
}

function upsertProcessStatus(buildingId, processId, patch) {
  const all = DB.get("processStatus", []);
  const idx = all.findIndex((r) => r.buildingId === buildingId && r.processId === processId);
  if (idx >= 0) {
    all[idx] = { ...all[idx], ...patch, updatedAt: todayISO(), updatedBy: State.user.username };
  } else {
    all.push({
      id: uid("ps"),
      buildingId,
      processId,
      status: "not_started",
      note: "",
      ...patch,
      updatedAt: todayISO(),
      updatedBy: State.user.username
    });
  }
  DB.set("processStatus", all);
}

function moduleCompletion(buildingIds, moduleId) {
  const procs = PROCESS_REFERENCE.filter((p) => p.module === moduleId);
  let done = 0, inProgress = 0, total = 0;
  buildingIds.forEach((bid) => {
    procs.forEach((p) => {
      total++;
      const rec = getProcessStatus(bid, p.id);
      if (rec && rec.status === "done") done++;
      else if (rec && rec.status === "in_progress") inProgress++;
    });
  });
  return { total, done, inProgress, pct: total ? Math.round((done / total) * 100) : 0 };
}

function ragOf(kpi) {
  if (kpi.actual === null || kpi.actual === undefined || kpi.actual === "") return "grey";
  const a = parseFloat(kpi.actual), t = parseFloat(kpi.target);
  if (isNaN(a) || isNaN(t)) return "grey";
  const ratio = t === 0 ? 1 : a / t;
  if (kpi.direction === "lower_better") {
    if (a <= t) return "green";
    if (a <= t * 1.15) return "yellow";
    return "red";
  }
  if (ratio >= 1) return "green";
  if (ratio >= 0.85) return "yellow";
  return "red";
}

// ---------------------------------------------------------- dashboard ---
function renderDashboard(root) {
  const scope = buildingsInScope();
  const ids = scope.map((b) => b.id);
  const mv = DB.get("moduleVisibility", {});
  const visMods = MODULES.filter((m) => mv[m.id] !== false);          // modules the admin has not hidden
  const showMp = mv.masterplan !== false;
  const modulePct = visMods.map((m) => ({ ...m, comp: moduleCompletion(ids, m.id) }));

  const okrs = DB.get("okrs", []).filter((o) => ids.includes(o.buildingId));
  const okrAvgProgress = okrs.length
    ? Math.round(
        okrs.reduce((sum, o) => {
          const krs = o.keyResults || [];
          const avg = krs.length ? krs.reduce((s, k) => s + Number(k.progress || 0), 0) / krs.length : 0;
          return sum + avg;
        }, 0) / okrs.length
      )
    : 0;

  const kpis = DB.get("kpis", []).filter((k) => ids.includes(k.buildingId));
  const ragCounts = { green: 0, yellow: 0, red: 0, grey: 0 };
  kpis.forEach((k) => ragCounts[ragOf(k)]++);

  const capas = DB.get("capas", []).filter((c) => ids.includes(c.buildingId));
  const openCapas = capas.filter((c) => c.status !== "closed");
  const overdueCapas = openCapas.filter((c) => c.dueDate && c.dueDate < todayISO());

  const fmsProcs = PROCESS_REFERENCE.filter((p) => p.category === "fms");
  const fmsDone = ids.reduce((sum, bid) => {
    return sum + fmsProcs.filter((p) => (getProcessStatus(bid, p.id) || {}).status === "done").length;
  }, 0);
  const fmsTotal = fmsProcs.length * ids.length || 1;
  const showFms = mv.process !== false;

  const statCards = [];
  if (visMods.length) statCards.push(`<div class="stat-card"><div class="label">${t("dash_stat1_label")}</div><div class="value">${avgPct(modulePct.map((m) => m.comp.pct))}%</div><div class="sub">${t("dash_stat1_sub")}</div></div>`);
  if (showFms) statCards.push(`<div class="stat-card"><div class="label">${t("dash_stat2_label")}</div><div class="value">${Math.round((fmsDone / fmsTotal) * 100)}%</div><div class="sub">${fmsDone} / ${fmsTotal} รายการ (7 แผน × อาคารในขอบเขต)</div></div>`);
  statCards.push(`<div class="stat-card"><div class="label">${t("dash_stat3_label")}</div><div class="value">${okrAvgProgress}%</div><div class="sub">${okrs.length} OKR ในขอบเขตที่เลือก</div></div>`);
  statCards.push(`<div class="stat-card"><div class="label">${t("dash_stat4_label")}</div><div class="value">${openCapas.length}</div><div class="sub" style="color:${overdueCapas.length ? "var(--red)" : "var(--muted)"}">${overdueCapas.length} รายการเกินกำหนด</div></div>`);

  const modCard = visMods.length ? `<div class="card">
        <h3>${t("dash_modcard_title")}</h3>
        <div class="desc">${t("dash_modcard_desc")}</div>
        ${modulePct.map((m) => `
          <div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
              <span>${m.nameTh} (${m.name})</span><span style="font-weight:700;color:var(--heading);">${m.comp.pct}%</span>
            </div>
            <div class="progress-bar"><span style="width:${m.comp.pct}%"></span></div>
          </div>`).join("")}
      </div>` : "";
  const kpiCard = `<div class="card">
        <h3>${t("dash_kpicard_title")}</h3>
        <div class="desc">${t("dash_kpicard_desc")}</div>
        <div class="grid cols-3" style="gap:10px;">
          <div class="stat-card" style="background:var(--green-soft);border-color:transparent;"><div class="label">${t("dash_rag_green")}</div><div class="value" style="color:var(--green)">${ragCounts.green}</div></div>
          <div class="stat-card" style="background:var(--gold-soft);border-color:transparent;"><div class="label">${t("dash_rag_yellow")}</div><div class="value" style="color:var(--yellow)">${ragCounts.yellow}</div></div>
          <div class="stat-card" style="background:var(--red-soft);border-color:transparent;"><div class="label">${t("dash_rag_red")}</div><div class="value" style="color:var(--red)">${ragCounts.red}</div></div>
        </div>
        ${kpis.length === 0 ? `<div class="empty-state">${t("dash_kpi_empty")}</div>` : ""}
      </div>`;

  MpSafeUI.scope = null;
  root.innerHTML = `
    <div class="dash-top ${showMp ? "" : "one"}">
      ${showMp ? `<div id="dash-donut"></div>` : ""}
      <div id="dash-safety"></div>
    </div>
    ${showMp ? `<div id="dash-mp"></div><div id="mon-host" style="margin-top:14px;"></div>` : ""}
    <div class="grid cols-${statCards.length}" style="margin-top:14px;">${statCards.join("")}</div>
    <div class="grid ${visMods.length ? "cols-2" : "cols-1"}">${modCard}${kpiCard}</div>
  `;
  renderSafetyBoard(document.getElementById("dash-safety"));
  if (showMp) {
    mpRenderDashDonut(document.getElementById("dash-donut"));
    renderDashMasterPlan(document.getElementById("dash-mp"));
    renderConstructionMonitor(document.getElementById("mon-host"));
  }
}

function avgPct(arr) {
  if (!arr.length) return 0;
  return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
}

const STATUS_BADGE_CLASS = { not_started: "grey", in_progress: "gold", done: "green" };

function renderModuleView(root, moduleId) {
  const procs = PROCESS_REFERENCE.filter((p) => p.module === moduleId);
  const fmsProcs = procs.filter((p) => p.category === "fms");
  const normalProcs = procs.filter((p) => p.category !== "fms");

    const scope = buildingsInScope();

      <div class="card">
        <h3>มุมมองรวมทุกอาคาร (อ่านอย่างเดียว)</h3>
        <div class="desc">เลือกอาคารใดอาคารหนึ่งด้านบนเพื่อแก้ไขสถานะและบันทึกหมายเหตุ</div>
        ${renderMatrixTable(procs, scope)}
      </div>
    `;
    return;
  }

  const buildingId = State.activeBuilding;
  let html = "";
  if (normalProcs.length) html += renderProcessTable(normalProcs, buildingId, null);
  if (fmsProcs.length) {
    html += `
      <div class="card">
        <h3>Facility Management and Safety (FMS)</h3>
        <div class="desc">ระบบบริหารวิศวกรรมสิ่งอำนวยความสะดวกและความปลอดภัย — 7 แผนงานที่ผนวกเข้ากับ Module 3 ใช้ได้กับอาคารหรือสถานประกอบการทุกประเภท</div>
        ${processTableRows(fmsProcs, buildingId, true)}
      </div>
    `;
  }
  root.innerHTML = html;
  wireProcessTable(root, buildingId);
}

function renderProcessTable(procs, buildingId, label) {
  return `
    <div class="card">
      ${label ? `<h3>${label}</h3>` : ""}
      ${processTableRows(procs, buildingId, false)}
    </div>
  `;
}

function processTableRows(procs, buildingId, isFms) {
  return `
    <table>
      <thead>
        <tr>
          <th>กระบวนการ</th><th>เจ้าของ</th><th>สถานะ</th><th>หมายเหตุ</th><th>อัปเดตล่าสุด</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${procs
          .map((p) => {
            const rec = getProcessStatus(buildingId, p.id) || { status: "not_started", note: "" };
            return `
            <tr data-proc="${p.id}">
              <td>${isFms ? `<span class="fms-tag">${p.fmsCode}</span>` : ""}${p.name}</td>
              <td>${p.owner}</td>
              <td>
                <select class="status-select" data-field="status">
                  <option value="not_started" ${rec.status === "not_started" ? "selected" : ""}>ยังไม่เริ่ม</option>
                  <option value="in_progress" ${rec.status === "in_progress" ? "selected" : ""}>กำลังดำเนินการ</option>
                  <option value="done" ${rec.status === "done" ? "selected" : ""}>เสร็จสมบูรณ์</option>
                </select>
              </td>
              <td><input type="text" data-field="note" value="${escapeAttr(rec.note || "")}" placeholder="หมายเหตุ..." style="width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:6px;" /></td>
              <td style="white-space:nowrap;color:var(--muted);font-size:12px;">${rec.updatedAt || "-"}</td>
              <td><button class="btn small save-proc-btn">${t("btn_save")}</button></td>
            </tr>`;
          })
          .join("")}
      </tbody>
    </table>
  `;
}

function wireProcessTable(root, buildingId) {
  root.querySelectorAll(".save-proc-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const row = btn.closest("tr");
      const processId = row.dataset.proc;
      const status = row.querySelector('[data-field="status"]').value;
      const note = row.querySelector('[data-field="note"]').value;
      upsertProcessStatus(buildingId, processId, { status, note });
      toast("บันทึกสถานะแล้ว");
      renderView();
    });
  });
}

function renderMatrixTable(procs, buildings) {
  return `
    <table>
      <thead>
        <tr><th>กระบวนการ</th>${buildings.map((b) => `<th>${b.code}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${procs
          .map(
            (p) => `
          <tr>
            <td>${p.category === "fms" ? `<span class="fms-tag">${p.fmsCode}</span>` : ""}${p.name}</td>
            ${buildings
              .map((b) => {
                const rec = getProcessStatus(b.id, p.id);
                const status = rec ? rec.status : "not_started";
                return `<td><span class="badge ${STATUS_BADGE_CLASS[status]}">${STATUS_LABELS[status]}</span></td>`;
              })
              .join("")}
          </tr>`
          )
          .join("")}
      </tbody>
    </table>
  `;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

  const prefs = DB.get("uiPrefs", { font: "plex", fontSize: "md", theme: "light" });
  const moduleVisibility = DB.get("moduleVisibility", {});
  const lang = DB.get("lang", "th");
  const labelKey = lang === "th" ? "labelTh" : "labelEn";

  const fontCards = FONT_OPTIONS.map(
    (f) => `<div class="option-card ${f.id === prefs.font ? "selected" : ""}" data-setting="font" data-value="${f.id}" style="font-family:${f.stack};">Aก ${f[labelKey]}</div>`
  ).join("");

  const themeSwatch = { light: "linear-gradient(135deg,#FFFFFF,#E8F3EC)", dark: "linear-gradient(135deg,#0D1613,#142420)", ocean: "linear-gradient(135deg,#F1F6FA,#2596F0)" };
  const themeCards = THEME_OPTIONS.map(
    (th_) => `<div class="option-card ${th_.id === prefs.theme ? "selected" : ""}" data-setting="theme" data-value="${th_.id}">
      <div class="swatch" style="background:${themeSwatch[th_.id]};"></div>${th_[labelKey]}
    </div>`
  ).join("");

  const sizeCards = FONT_SIZE_OPTIONS.map(
    (s) => `<div class="option-card ${s.id === prefs.fontSize ? "selected" : ""}" data-setting="fontSize" data-value="${s.id}" style="font-size:${s.px};">Aa ${s[labelKey]}</div>`
  ).join("");

  const moduleChecks = MODULES.map((m) => {
    const checked = moduleVisibility[m.id] !== false;
    return `<label class="checkbox-pill"><input type="checkbox" data-module-toggle="${m.id}" ${checked ? "checked" : ""}/> ${m.nameTh} (${m.name})</label>`;
  }).join("") +
    `<label class="checkbox-pill"><input type="checkbox" data-module-toggle="masterplan" ${moduleVisibility.masterplan !== false ? "checked" : ""}/> ${t("settings_mp_label")}</label>`;

  const modal = openModal(`
    <h3>${t("settings_title")}</h3>
    <div class="settings-section">
      <h4>${t("settings_font")}</h4>
      <div class="option-grid" data-setting-group="font">${fontCards}</div>
    </div>
    <div class="settings-section">
      <h4>${t("settings_theme")}</h4>
      <div class="option-grid" data-setting-group="theme">${themeCards}</div>
    </div>
    <div class="settings-section">
      <h4>${t("settings_fontsize")}</h4>
      <div class="option-grid" data-setting-group="fontSize">${sizeCards}</div>
    </div>
    ${
      isAdmin
        ? `<div class="settings-section">
            <h4>${t("settings_modules")}</h4>
            <div class="desc" style="margin-bottom:8px;">${t("settings_modules_desc")}</div>
            <div class="checkbox-list">${moduleChecks}</div>
          </div>`
        : ""
    }
    <div class="settings-section" id="sync-sec"></div>
    <div class="actions">
      <button class="btn ghost" id="close-settings">${t("settings_close")}</button>
    </div>
  `);

  modal.querySelectorAll("[data-setting]").forEach((card) => {
    card.addEventListener("click", () => {
      const key = card.dataset.setting;
      const value = card.dataset.value;
      const p = DB.get("uiPrefs", { font: "plex", fontSize: "md", theme: "light" });
      p[key] = value;
      DB.set("uiPrefs", p);
      applyUiPrefs();
      modal.querySelectorAll(`[data-setting-group="${key}"] .option-card`).forEach((c) => c.classList.remove("selected"));
      card.classList.add("selected");
    });
  });

  if (isAdmin) {
    modal.querySelectorAll("[data-module-toggle]").forEach((cb) => {
      cb.addEventListener("change", () => {
        const mv = DB.get("moduleVisibility", {});
        mv[cb.dataset.moduleToggle] = cb.checked;
        DB.set("moduleVisibility", mv);
        renderShell();
      });
    });
  }

  mpRenderSyncSettings(modal.querySelector("#sync-sec"));
  modal.querySelector("#close-settings").addEventListener("click", () => {
    closeModal();
    toast(t("settings_saved"));
  });
}


// ---------------------------------------------------------------- OKR ---
function renderOKR(root) {
  if (State.activeBuilding === "ALL") {
    root.innerHTML = `<div class="card empty-state">เลือกอาคาร/BU หนึ่งแห่งด้านบนเพื่อดูและจัดการ OKR</div>`;
    return;
  }
  const buildingId = State.activeBuilding;
  const okrs = DB.get("okrs", []).filter((o) => o.buildingId === buildingId);
  const quarters = [...new Set(okrs.map((o) => o.quarter))].sort();

  root.innerHTML = `
    <div class="toolbar">
      <div class="filters">
        <select id="okr-quarter-filter">
          <option value="">ทุกไตรมาส</option>
          ${quarters.map((q) => `<option value="${q}">${q}</option>`).join("")}
        </select>
      </div>
      <button class="btn" id="add-okr-btn">+ เพิ่ม OKR</button>
    </div>
    <div id="okr-list"></div>
  `;

  const listEl = document.getElementById("okr-list");
  function draw() {
    const filterQ = document.getElementById("okr-quarter-filter").value;
    const items = okrs.filter((o) => !filterQ || o.quarter === filterQ);
    listEl.innerHTML = items.length
      ? items.map((o) => okrCardHtml(o)).join("")
      : `<div class="card empty-state">ยังไม่มี OKR — เริ่มเพิ่มรายการแรกได้เลย</div>`;
    listEl.querySelectorAll("[data-edit-okr]").forEach((b) =>
      b.addEventListener("click", () => openOkrForm(buildingId, okrs.find((o) => o.id === b.dataset.editOkr)))
    );
    listEl.querySelectorAll("[data-del-okr]").forEach((b) =>
      b.addEventListener("click", () => {
        if (!confirm("ลบ OKR นี้หรือไม่?")) return;
        DB.set("okrs", DB.get("okrs", []).filter((o) => o.id !== b.dataset.delOkr));
        toast("ลบแล้ว");
        renderView();
      })
    );
  }
  draw();
  document.getElementById("okr-quarter-filter").addEventListener("change", draw);
  document.getElementById("add-okr-btn").addEventListener("click", () => openOkrForm(buildingId, null));
}

function okrCardHtml(o) {
  const krs = o.keyResults || [];
  const avg = krs.length ? Math.round(krs.reduce((s, k) => s + Number(k.progress || 0), 0) / krs.length) : 0;
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <span class="badge green">${o.quarter}</span> <span class="badge grey">${o.pillar}</span>
          <h3 style="margin-top:8px;">${o.objective}</h3>
          <div class="desc">เจ้าของ: ${o.owner || "-"}</div>
        </div>
        <div style="display:flex;gap:4px;">
          <button class="icon-btn" data-edit-okr="${o.id}">${t("btn_edit")}</button>
          <button class="icon-btn danger" data-del-okr="${o.id}">${t("btn_delete")}</button>
        </div>
      </div>
      <div style="margin:10px 0 6px;font-size:13px;font-weight:600;color:var(--heading);">ความคืบหน้ารวม: ${avg}%</div>
      <div class="progress-bar" style="margin-bottom:12px;"><span style="width:${avg}%"></span></div>
      ${krs
        .map(
          (k) => `
        <div style="margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;"><span>${k.text}</span><span>${k.progress}%</span></div>
          <div class="progress-bar"><span style="width:${k.progress}%;background:var(--gold);"></span></div>
        </div>`
        )
        .join("")}
    </div>
  `;
}

function openOkrForm(buildingId, existing) {
  const krs = existing ? existing.keyResults : [{ text: "", progress: 0 }, { text: "", progress: 0 }, { text: "", progress: 0 }];
  const modal = openModal(`
    <h3>${existing ? "แก้ไข OKR" : "เพิ่ม OKR ใหม่"}</h3>
    <div class="form-row">
      <div class="field">
        <label>ไตรมาส</label>
        <input type="text" id="f-quarter" placeholder="เช่น Q1-2026" value="${existing ? escapeAttr(existing.quarter) : ""}" />
      </div>
      <div class="field">
        <label>Pillar</label>
        <select id="f-pillar">
          ${PILLARS.map((p) => `<option value="${p.id}" ${existing && existing.pillar === p.id ? "selected" : ""}>${p.id} — ${p.nameTh}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="field">
      <label>Objective</label>
      <textarea id="f-objective" rows="2">${existing ? existing.objective : ""}</textarea>
    </div>
    <div class="field">
      <label>เจ้าของ (Owner)</label>
      <input type="text" id="f-owner" value="${existing ? escapeAttr(existing.owner || "") : ""}" />
    </div>
    <div class="field">
      <label>Key Results (ระบุ % ความคืบหน้า)</label>
      <div id="kr-rows"></div>
      <button class="btn ghost small" id="add-kr-row" type="button">+ เพิ่ม Key Result</button>
    </div>
    <div class="actions">
      <button class="btn ghost" id="cancel-okr">${t("btn_cancel")}</button>
      <button class="btn" id="save-okr">${t("btn_save")}</button>
    </div>
  `);

  const krRows = modal.querySelector("#kr-rows");
  function addKrRow(text, progress) {
    const row = document.createElement("div");
    row.className = "kr-row";
    row.innerHTML = `
      <input type="text" placeholder="Key Result..." value="${escapeAttr(text || "")}" />
      <input type="number" min="0" max="100" value="${progress || 0}" />
      <button class="icon-btn danger" type="button">${t("btn_delete")}</button>
    `;
    row.querySelector(".icon-btn").addEventListener("click", () => row.remove());
    krRows.appendChild(row);
  }
  krs.forEach((k) => addKrRow(k.text, k.progress));
  modal.querySelector("#add-kr-row").addEventListener("click", () => addKrRow("", 0));
  modal.querySelector("#cancel-okr").addEventListener("click", closeModal);

  modal.querySelector("#save-okr").addEventListener("click", () => {
    const objective = modal.querySelector("#f-objective").value.trim();
    if (!objective) { alert("กรุณาระบุ Objective"); return; }
    const keyResults = [...krRows.querySelectorAll(".kr-row")]
      .map((row) => {
        const inputs = row.querySelectorAll("input");
        return { text: inputs[0].value.trim(), progress: Math.max(0, Math.min(100, Number(inputs[1].value) || 0)) };
      })
      .filter((k) => k.text);

    const data = {
      buildingId,
      quarter: modal.querySelector("#f-quarter").value.trim() || "Q?-????",
      pillar: modal.querySelector("#f-pillar").value,
      objective,
      owner: modal.querySelector("#f-owner").value.trim(),
      keyResults
    };
    const all = DB.get("okrs", []);
    if (existing) {
      const idx = all.findIndex((o) => o.id === existing.id);
      all[idx] = { ...existing, ...data };
    } else {
      all.push({ id: uid("okr"), ...data });
    }
    DB.set("okrs", all);
    closeModal();
    toast("บันทึก OKR แล้ว");
    renderView();
  });
}

function renderCAPA(root) {

    return;
  }
  const buildingId = State.activeBuilding;
  const capas = DB.get("capas", []).filter((c) => c.buildingId === buildingId);

  root.innerHTML = `
    <div class="toolbar">
      <div></div>
      <button class="btn" id="add-capa-btn">+ เพิ่มรายการ CAPA</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>เรื่อง</th><th>ประเภท</th><th>วันที่เกิดเหตุ</th><th>ที่มา</th><th>เจ้าของ</th><th>เปิดเมื่อ</th><th>กำหนดปิด</th><th>สถานะ</th><th></th></tr></thead>
        <tbody>
          ${
            capas.length
              ? capas
                  .map((c) => {
                    const overdue = c.status !== "closed" && c.dueDate && c.dueDate < todayISO();
                    return `
              <tr>
                <td>${c.title}</td>
                <td>${mpIsAccident(c) ? '<span class="st-chip"><i style="color:var(--st-critical)">✖</i>Incident</span>' : c.type === "nearmiss" ? "Near-miss" : "CAPA"}</td>

                <td>${c.source || "-"}</td>
                <td>${c.owner || "-"}</td>
                <td>${c.openedDate || "-"}</td>
                <td style="color:${overdue ? "var(--red)" : "inherit"};font-weight:${overdue ? "700" : "400"};">${c.dueDate || "-"}${overdue ? " (เกินกำหนด)" : ""}</td>
                <td>
                  <select class="status-select" data-capa="${c.id}">
                    <option value="open" ${c.status === "open" ? "selected" : ""}>เปิด</option>
                    <option value="in_progress" ${c.status === "in_progress" ? "selected" : ""}>กำลังดำเนินการ</option>
                    <option value="closed" ${c.status === "closed" ? "selected" : ""}>ปิดแล้ว</option>
                  </select>
                </td>
                <td><button class="icon-btn danger" data-del-capa="${c.id}">${t("btn_delete")}</button></td>
              </tr>`;
                  })
                  .join("")
              : `<tr><td colspan="9" class="empty-state">ยังไม่มีรายการ CAPA</td></tr>`
          }
        </tbody>
      </table>
    </div>
  `;

  root.querySelectorAll("[data-capa]").forEach((sel) => {
    sel.addEventListener("change", () => {
      const all = DB.get("capas", []);
      const idx = all.findIndex((c) => c.id === sel.dataset.capa);
      all[idx].status = sel.value;
      DB.set("capas", all);
      toast("อัปเดตสถานะแล้ว");
      renderView();
    });
  });
  root.querySelectorAll("[data-del-capa]").forEach((b) => {
    b.addEventListener("click", () => {
      if (!confirm("ลบรายการนี้หรือไม่?")) return;
      DB.set("capas", DB.get("capas", []).filter((c) => c.id !== b.dataset.delCapa));
      toast("ลบแล้ว");
      renderView();
    });
