// ------------------------------------------------------- data helpers ---
function buildingsInScope() {
  const buildings = accessibleBuildings();
  if (State.activeBuilding === "ALL") return buildings;
  return buildings.filter((b) => b.id === State.activeBuilding);
}

function getProcessStatus(buildingId, processId) {
  const all = DB.get("processStatus", []);
  return all.find((r) => r.buildingId === buildingId && r.processId === processId) || null;
}

function upsertProcessStatus(buildingId, processId, patch) {
  const all = DB.get("processStatus", []);
  const idx = all.findIndex((r) => r.buildingId === buildingId && r.processId === processId);
  if (idx >= 0) {
    all[idx] = { ...all[idx], ...patch, updatedAt: todayISO(), updatedBy: State.user.username };
  } else {
    all.push({
      id: uid("ps"),
      buildingId,
      processId,
      status: "not_started",
      note: "",
      ...patch,
      updatedAt: todayISO(),
      updatedBy: State.user.username
    });
  }
  DB.set("processStatus", all);
}

function moduleCompletion(buildingIds, moduleId) {
  const procs = PROCESS_REFERENCE.filter((p) => p.module === moduleId);
  let done = 0, inProgress = 0, total = 0;
  buildingIds.forEach((bid) => {
    procs.forEach((p) => {
      total++;
      const rec = getProcessStatus(bid, p.id);
      if (rec && rec.status === "done") done++;
      else if (rec && rec.status === "in_progress") inProgress++;
    });
  });
  return { total, done, inProgress, pct: total ? Math.round((done / total) * 100) : 0 };
}

function ragOf(kpi) {
  if (kpi.actual === null || kpi.actual === undefined || kpi.actual === "") return "grey";
  const a = parseFloat(kpi.actual), t = parseFloat(kpi.target);
  if (isNaN(a) || isNaN(t)) return "grey";
  const ratio = t === 0 ? 1 : a / t;
  if (kpi.direction === "lower_better") {
    if (a <= t) return "green";
    if (a <= t * 1.15) return "yellow";
    return "red";
  }
  if (ratio >= 1) return "green";
  if (ratio >= 0.85) return "yellow";
  return "red";
}

// ---------------------------------------------------------- dashboard ---
function renderDashboard(root) {
  const scope = buildingsInScope();
  const ids = scope.map((b) => b.id);
  const mv = DB.get("moduleVisibility", {});
  const visMods = MODULES.filter((m) => mv[m.id] !== false);          // modules the admin has not hidden
  const showMp = mv.masterplan !== false;
  const modulePct = visMods.map((m) => ({ ...m, comp: moduleCompletion(ids, m.id) }));

  const okrs = DB.get("okrs", []).filter((o) => ids.includes(o.buildingId));
  const okrAvgProgress = okrs.length
    ? Math.round(
        okrs.reduce((sum, o) => {
          const krs = o.keyResults || [];
          const avg = krs.length ? krs.reduce((s, k) => s + Number(k.progress || 0), 0) / krs.length : 0;
          return sum + avg;
        }, 0) / okrs.length
      )
    : 0;

  const kpis = DB.get("kpis", []).filter((k) => ids.includes(k.buildingId));
  const ragCounts = { green: 0, yellow: 0, red: 0, grey: 0 };
  kpis.forEach((k) => ragCounts[ragOf(k)]++);

  const capas = DB.get("capas", []).filter((c) => ids.includes(c.buildingId));
  const openCapas = capas.filter((c) => c.status !== "closed");
  const overdueCapas = openCapas.filter((c) => c.dueDate && c.dueDate < todayISO());

  const fmsProcs = PROCESS_REFERENCE.filter((p) => p.category === "fms");
  const fmsDone = ids.reduce((sum, bid) => {
    return sum + fmsProcs.filter((p) => (getProcessStatus(bid, p.id) || {}).status === "done").length;
  }, 0);
  const fmsTotal = fmsProcs.length * ids.length || 1;
  const showFms = mv.process !== false;

  const statCards = [];
  if (visMods.length) statCards.push(`<div class="stat-card"><div class="label">${t("dash_stat1_label")}</div><div class="value">${avgPct(modulePct.map((m) => m.comp.pct))}%</div><div class="sub">${t("dash_stat1_sub")}</div></div>`);
  if (showFms) statCards.push(`<div class="stat-card"><div class="label">${t("dash_stat2_label")}</div><div class="value">${Math.round((fmsDone / fmsTotal) * 100)}%</div><div class="sub">${fmsDone} / ${fmsTotal} รายการ (7 แผน × อาคารในขอบเขต)</div></div>`);
  statCards.push(`<div class="stat-card"><div class="label">${t("dash_stat3_label")}</div><div class="value">${okrAvgProgress}%</div><div class="sub">${okrs.length} OKR ในขอบเขตที่เลือก</div></div>`);
  statCards.push(`<div class="stat-card"><div class="label">${t("dash_stat4_label")}</div><div class="value">${openCapas.length}</div><div class="sub" style="color:${overdueCapas.length ? "var(--red)" : "var(--muted)"}">${overdueCapas.length} รายการเกินกำหนด</div></div>`);

  const modCard = visMods.length ? `<div class="card">
        <h3>${t("dash_modcard_title")}</h3>
        <div class="desc">${t("dash_modcard_desc")}</div>
        ${modulePct.map((m) => `
          <div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
              <span>${m.nameTh} (${m.name})</span><span style="font-weight:700;color:var(--heading);">${m.comp.pct}%</span>
            </div>
            <div class="progress-bar"><span style="width:${m.comp.pct}%"></span></div>
          </div>`).join("")}
      </div>` : "";
  const kpiCard = `<div class="card">
        <h3>${t("dash_kpicard_title")}</h3>
        <div class="desc">${t("dash_kpicard_desc")}</div>
        <div class="grid cols-3" style="gap:10px;">
          <div class="stat-card" style="background:var(--green-soft);border-color:transparent;"><div class="label">${t("dash_rag_green")}</div><div class="value" style="color:var(--green)">${ragCounts.green}</div></div>
          <div class="stat-card" style="background:var(--gold-soft);border-color:transparent;"><div class="label">${t("dash_rag_yellow")}</div><div class="value" style="color:var(--yellow)">${ragCounts.yellow}</div></div>
          <div class="stat-card" style="background:var(--red-soft);border-color:transparent;"><div class="label">${t("dash_rag_red")}</div><div class="value" style="color:var(--red)">${ragCounts.red}</div></div>
        </div>
        ${kpis.length === 0 ? `<div class="empty-state">${t("dash_kpi_empty")}</div>` : ""}
      </div>`;

  root.innerHTML = `
    <div class="dash-top ${showMp ? "" : "one"}">
      ${showMp ? `<div id="dash-rank"></div><div id="dash-score"></div>` : ""}
      <div id="dash-safety"></div>
    </div>
    ${showMp ? `<div id="dash-mp"></div><div id="mon-host" style="margin-top:14px;"></div>` : ""}
    <div class="grid cols-${statCards.length}" style="margin-top:14px;">${statCards.join("")}</div>
    <div class="grid ${visMods.length ? "cols-2" : "cols-1"}">${modCard}${kpiCard}</div>
  `;
  renderSafetyBoard(document.getElementById("dash-safety"));
  if (showMp) {
    mpRenderDashRank(document.getElementById("dash-rank"));
    mpRenderDashScore(document.getElementById("dash-score"));
    renderDashMasterPlan(document.getElementById("dash-mp"));
    renderConstructionMonitor(document.getElementById("mon-host"));
  }
}

function avgPct(arr) {
  if (!arr.length) return 0;
  return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
}

// ------------------------------------------------------- module view ---
const STATUS_BADGE_CLASS = { not_started: "grey", in_progress: "gold", done: "green" };

function renderModuleView(root, moduleId) {
  const procs = PROCESS_REFERENCE.filter((p) => p.module === moduleId);
  const fmsProcs = procs.filter((p) => p.category === "fms");
  const normalProcs = procs.filter((p) => p.category !== "fms");

  if (State.activeBuilding === "ALL") {
    const scope = buildingsInScope();
    root.innerHTML = `
      <div class="card">
        <h3>มุมมองรวมทุกอาคาร (อ่านอย่างเดียว)</h3>
        <div class="desc">เลือกอาคารใดอาคารหนึ่งด้านบนเพื่อแก้ไขสถานะและบันทึกหมายเหตุ</div>
        ${renderMatrixTable(procs, scope)}
      </div>
    `;
    return;
  }

  const buildingId = State.activeBuilding;
  let html = "";
  if (normalProcs.length) html += renderProcessTable(normalProcs, buildingId, null);
  if (fmsProcs.length) {
    html += `
      <div class="card">
        <h3>Facility Management and Safety (FMS)</h3>
        <div class="desc">ระบบบริหารวิศวกรรมสิ่งอำนวยความสะดวกและความปลอดภัย — 7 แผนงานที่ผนวกเข้ากับ Module 3 ใช้ได้กับอาคารหรือสถานประกอบการทุกประเภท</div>
        ${processTableRows(fmsProcs, buildingId, true)}
      </div>
    `;
  }
  root.innerHTML = html;
  wireProcessTable(root, buildingId);
}

function renderProcessTable(procs, buildingId, label) {
  return `
    <div class="card">
      ${label ? `<h3>${label}</h3>` : ""}
      ${processTableRows(procs, buildingId, false)}
    </div>
  `;
}

function processTableRows(procs, buildingId, isFms) {
  return `
    <table>
      <thead>
        <tr>
          <th>กระบวนการ</th><th>เจ้าของ</th><th>สถานะ</th><th>หมายเหตุ</th><th>อัปเดตล่าสุด</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${procs
          .map((p) => {
            const rec = getProcessStatus(buildingId, p.id) || { status: "not_started", note: "" };
            return `
            <tr data-proc="${p.id}">
              <td>${isFms ? `<span class="fms-tag">${p.fmsCode}</span>` : ""}${p.name}</td>
              <td>${p.owner}</td>
              <td>
                <select class="status-select" data-field="status">
                  <option value="not_started" ${rec.status === "not_started" ? "selected" : ""}>ยังไม่เริ่ม</option>
                  <option value="in_progress" ${rec.status === "in_progress" ? "selected" : ""}>กำลังดำเนินการ</option>
                  <option value="done" ${rec.status === "done" ? "selected" : ""}>เสร็จสมบูรณ์</option>
                </select>
              </td>
              <td><input type="text" data-field="note" value="${escapeAttr(rec.note || "")}" placeholder="หมายเหตุ..." style="width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:6px;" /></td>
              <td style="white-space:nowrap;color:var(--muted);font-size:12px;">${rec.updatedAt || "-"}</td>
              <td><button class="btn small save-proc-btn">${t("btn_save")}</button></td>
            </tr>`;
          })
          .join("")}
      </tbody>
    </table>
  `;
}

function wireProcessTable(root, buildingId) {
  root.querySelectorAll(".save-proc-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const row = btn.closest("tr");
      const processId = row.dataset.proc;
      const status = row.querySelector('[data-field="status"]').value;
      const note = row.querySelector('[data-field="note"]').value;
      upsertProcessStatus(buildingId, processId, { status, note });
      toast("บันทึกสถานะแล้ว");
      renderView();
    });
  });
}

function renderMatrixTable(procs, buildings) {
  return `
    <table>
      <thead>
        <tr><th>กระบวนการ</th>${buildings.map((b) => `<th>${b.code}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${procs
          .map(
            (p) => `
          <tr>
            <td>${p.category === "fms" ? `<span class="fms-tag">${p.fmsCode}</span>` : ""}${p.name}</td>
            ${buildings
              .map((b) => {
                const rec = getProcessStatus(b.id, p.id);
                const status = rec ? rec.status : "not_started";
                return `<td><span class="badge ${STATUS_BADGE_CLASS[status]}">${STATUS_LABELS[status]}</span></td>`;
              })
              .join("")}
          </tr>`
          )
          .join("")}
      </tbody>
    </table>
  `;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function openModal(innerHtml) {
  closeModal();

  overlay.className = "overlay";
  overlay.id = "modal-overlay";
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
  overlay.addEventListener("mousedown", (e) => {
    if (e.target === overlay) closeModal();
  });
  document.body.appendChild(overlay);
  return overlay;
}

  const el = document.getElementById("modal-overlay");
  if (el) el.remove();
}

  ).join("");

  const moduleChecks = MODULES.map((m) => {
    const checked = moduleVisibility[m.id] !== false;
    return `<label class="checkbox-pill"><input type="checkbox" data-module-toggle="${m.id}" ${checked ? "checked" : ""}/> ${m.nameTh} (${m.name})</label>`;
  }).join("") +
    `<label class="checkbox-pill"><input type="checkbox" data-module-toggle="masterplan" ${moduleVisibility.masterplan !== false ? "checked" : ""}/> ${t("settings_mp_label")}</label>` +
    `<label class="checkbox-pill"><input type="checkbox" data-module-toggle="datareports" ${moduleVisibility.datareports !== false ? "checked" : ""}/> ${t("settings_drr_label")}</label>`;

  const modal = openModal(`
    <h3>${t("settings_title")}</h3>
    <div class="settings-section">
      <h4>${t("settings_font")}</h4>
      <div class="option-grid" data-setting-group="font">${fontCards}</div>
    </div>
    <div class="settings-section">
      <h4>${t("settings_theme")}</h4>
      <div class="option-grid" data-setting-group="theme">${themeCards}</div>
    </div>
    <div class="settings-section">
      <h4>${t("settings_fontsize")}</h4>
      <div class="option-grid" data-setting-group="fontSize">${sizeCards}</div>
    </div>
    ${
      isAdmin
        ? `<div class="settings-section">
            <h4>${t("settings_modules")}</h4>
            <div class="desc" style="margin-bottom:8px;">${t("settings_modules_desc")}</div>
            <div class="checkbox-list">${moduleChecks}</div>
          </div>`
        : ""
    }
    <div class="settings-section" id="sync-sec"></div>
    <div class="actions">
      <button class="btn ghost" id="close-settings">${t("settings_close")}</button>
    </div>
  `);

  modal.querySelectorAll("[data-setting]").forEach((card) => {
    card.addEventListener("click", () => {
      const key = card.dataset.setting;
      const value = card.dataset.value;
      const p = DB.get("uiPrefs", { font: "plex", fontSize: "md", theme: "light" });
      p[key] = value;
      DB.set("uiPrefs", p);
      applyUiPrefs();
      modal.querySelectorAll(`[data-setting-group="${key}"] .option-card`).forEach((c) => c.classList.remove("selected"));
      card.classList.add("selected");
    });
  });

  if (isAdmin) {
    modal.querySelectorAll("[data-module-toggle]").forEach((cb) => {
      cb.addEventListener("change", () => {
        const mv = DB.get("moduleVisibility", {});
        mv[cb.dataset.moduleToggle] = cb.checked;
        DB.set("moduleVisibility", mv);
        renderShell();
      });
    });
  }

  mpRenderSyncSettings(modal.querySelector("#sync-sec"));
  modal.querySelector("#close-settings").addEventListener("click", () => {
    closeModal();
    toast(t("settings_saved"));
  });

function renderOKR(root) {
  if (State.activeBuilding === "ALL") {
    root.innerHTML = `<div class="card empty-state">เลือกอาคาร/BU หนึ่งแห่งด้านบนเพื่อดูและจัดการ OKR</div>`;
    return;
  }
  const buildingId = State.activeBuilding;
  const okrs = DB.get("okrs", []).filter((o) => o.buildingId === buildingId);
  const quarters = [...new Set(okrs.map((o) => o.quarter))].sort();

  root.innerHTML = `
    <div class="toolbar">
      <div class="filters">
        <select id="okr-quarter-filter">
          <option value="">ทุกไตรมาส</option>
          ${quarters.map((q) => `<option value="${q}">${q}</option>`).join("")}
        </select>
      </div>
      <button class="btn" id="add-okr-btn">+ เพิ่ม OKR</button>
    </div>
    <div id="okr-list"></div>
  `;

  const listEl = document.getElementById("okr-list");
  function draw() {
    const filterQ = document.getElementById("okr-quarter-filter").value;
    const items = okrs.filter((o) => !filterQ || o.quarter === filterQ);
    listEl.innerHTML = items.length
      ? items.map((o) => okrCardHtml(o)).join("")
      : `<div class="card empty-state">ยังไม่มี OKR — เริ่มเพิ่มรายการแรกได้เลย</div>`;
    listEl.querySelectorAll("[data-edit-okr]").forEach((b) =>
      b.addEventListener("click", () => openOkrForm(buildingId, okrs.find((o) => o.id === b.dataset.editOkr)))
    );
    listEl.querySelectorAll("[data-del-okr]").forEach((b) =>
      b.addEventListener("click", () => {
        if (!confirm("ลบ OKR นี้หรือไม่?")) return;
        DB.set("okrs", DB.get("okrs", []).filter((o) => o.id !== b.dataset.delOkr));
        toast("ลบแล้ว");
        renderView();
      })
    );
  }
  draw();
  document.getElementById("okr-quarter-filter").addEventListener("change", draw);
  document.getElementById("add-okr-btn").addEventListener("click", () => openOkrForm(buildingId, null));
}

function okrCardHtml(o) {
  const krs = o.keyResults || [];
  const avg = krs.length ? Math.round(krs.reduce((s, k) => s + Number(k.progress || 0), 0) / krs.length) : 0;
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <span class="badge green">${o.quarter}</span> <span class="badge grey">${o.pillar}</span>
          <h3 style="margin-top:8px;">${o.objective}</h3>
          <div class="desc">เจ้าของ: ${o.owner || "-"}</div>
        </div>
        <div style="display:flex;gap:4px;">
          <button class="icon-btn" data-edit-okr="${o.id}">${t("btn_edit")}</button>
          <button class="icon-btn danger" data-del-okr="${o.id}">${t("btn_delete")}</button>
        </div>
      </div>
      <div style="margin:10px 0 6px;font-size:13px;font-weight:600;color:var(--heading);">ความคืบหน้ารวม: ${avg}%</div>
      <div class="progress-bar" style="margin-bottom:12px;"><span style="width:${avg}%"></span></div>
      ${krs
        .map(
          (k) => `
        <div style="margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;"><span>${k.text}</span><span>${k.progress}%</span></div>
          <div class="progress-bar"><span style="width:${k.progress}%;background:var(--gold);"></span></div>
        </div>`
        )
        .join("")}
    </div>
  `;
}

function openOkrForm(buildingId, existing) {
  const krs = existing ? existing.keyResults : [{ text: "", progress: 0 }, { text: "", progress: 0 }, { text: "", progress: 0 }];
  const modal = openModal(`
    <h3>${existing ? "แก้ไข OKR" : "เพิ่ม OKR ใหม่"}</h3>
    <div class="form-row">
      <div class="field">
        <label>ไตรมาส</label>
        <input type="text" id="f-quarter" placeholder="เช่น Q1-2026" value="${existing ? escapeAttr(existing.quarter) : ""}" />
      </div>
      <div class="field">
        <label>Pillar</label>
        <select id="f-pillar">
          ${PILLARS.map((p) => `<option value="${p.id}" ${existing && existing.pillar === p.id ? "selected" : ""}>${p.id} — ${p.nameTh}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="field">
      <label>Objective</label>
      <textarea id="f-objective" rows="2">${existing ? existing.objective : ""}</textarea>
    </div>
    <div class="field">
      <label>เจ้าของ (Owner)</label>
      <input type="text" id="f-owner" value="${existing ? escapeAttr(existing.owner || "") : ""}" />
    </div>
    <div class="field">
      <label>Key Results (ระบุ % ความคืบหน้า)</label>
      <div id="kr-rows"></div>
      <button class="btn ghost small" id="add-kr-row" type="button">+ เพิ่ม Key Result</button>
    </div>
    <div class="actions">
      <button class="btn ghost" id="cancel-okr">${t("btn_cancel")}</button>
      <button class="btn" id="save-okr">${t("btn_save")}</button>
    </div>
  `);

  const krRows = modal.querySelector("#kr-rows");
  function addKrRow(text, progress) {
    const row = document.createElement("div");
    row.className = "kr-row";
    row.innerHTML = `
      <input type="text" placeholder="Key Result..." value="${escapeAttr(text || "")}" />
      <input type="number" min="0" max="100" value="${progress || 0}" />
      <button class="icon-btn danger" type="button">${t("btn_delete")}</button>
    `;
    row.querySelector(".icon-btn").addEventListener("click", () => row.remove());
    krRows.appendChild(row);
  }
  krs.forEach((k) => addKrRow(k.text, k.progress));
  modal.querySelector("#add-kr-row").addEventListener("click", () => addKrRow("", 0));
  modal.querySelector("#cancel-okr").addEventListener("click", closeModal);

  modal.querySelector("#save-okr").addEventListener("click", () => {
    const objective = modal.querySelector("#f-objective").value.trim();
    if (!objective) { alert("กรุณาระบุ Objective"); return; }
    const keyResults = [...krRows.querySelectorAll(".kr-row")]
      .map((row) => {
        const inputs = row.querySelectorAll("input");
        return { text: inputs[0].value.trim(), progress: Math.max(0, Math.min(100, Number(inputs[1].value) || 0)) };
      })
      .filter((k) => k.text);

    const data = {
      buildingId,
      quarter: modal.querySelector("#f-quarter").value.trim() || "Q?-????",
      pillar: modal.querySelector("#f-pillar").value,
      objective,
      owner: modal.querySelector("#f-owner").value.trim(),
      keyResults
    };
    const all = DB.get("okrs", []);
    if (existing) {
      const idx = all.findIndex((o) => o.id === existing.id);
      all[idx] = { ...existing, ...data };
    } else {
      all.push({ id: uid("okr"), ...data });
    }
    DB.set("okrs", all);
    closeModal();
    toast("บันทึก OKR แล้ว");
    renderView();
  });
}

  }
  const buildingId = State.activeBuilding;
  const capas = DB.get("capas", []).filter((c) => c.buildingId === buildingId);

  root.innerHTML = `
    <div class="toolbar">
      <div></div>
      <button class="btn" id="add-capa-btn">+ เพิ่มรายการ CAPA</button>

                <td>${c.title}</td>

                <td>${c.source || "-"}</td>
                <td>${c.owner || "-"}</td>

                </td>

      </table>

  root.querySelectorAll("[data-capa]").forEach((sel) => {

      <button class="btn ghost" id="cancel-b">${t("btn_cancel")}</button>
      <button class="btn" id="save-b">${t("btn_save")}</button>
    </div>
  `);
  modal.querySelector("#cancel-b").addEventListener("click", closeModal);
  modal.querySelector("#save-b").addEventListener("click", () => {
    const name = modal.querySelector("#f-name").value.trim();
    const code = modal.querySelector("#f-code").value.trim();
    if (!name || !code) { alert("กรุณาระบุรหัสและชื่ออาคาร"); return; }
    const all = DB.get("buildings", []);
    if (existing) {
      const idx = all.findIndex((x) => x.id === existing.id);
      all[idx] = { ...existing, code, name, bu: modal.querySelector("#f-bu").value.trim() };
    } else {
      all.push({ id: uid("b"), code, name, bu: modal.querySelector("#f-bu").value.trim() });
    }
    DB.set("buildings", all);
    closeModal();
    toast("บันทึกแล้ว");
    renderShell();
    navigate("buildings");
  });
}

function renderUsers(root) {
  if (!Auth.isAdmin(State.user)) {
    root.innerHTML = `<div class="card empty-state">เฉพาะผู้ดูแลระบบเท่านั้นที่จัดการหน้านี้ได้</div>`;
    return;
  }
  const users = DB.get("users", []);
  const buildings = DB.get("buildings", []);
  const pendingCount = users.filter((u) => u.status === "pending").length;
  root.innerHTML = `
    ${
      pendingCount
        ? `<div class="card" style="border-color:var(--gold);background:var(--gold-soft);">
             <h3 style="color:var(--yellow);">มีคำขอลงทะเบียนใหม่รออนุมัติ ${pendingCount} รายการ</h3>
             <div class="desc">ตรวจสอบและกำหนดสิทธิ์/อาคารให้ผู้ใช้งานใหม่ในตารางด้านล่าง</div>
           </div>`
        : ""
    }
    <div class="toolbar">
      <div></div>
      <button class="btn" id="add-user-btn">+ เพิ่มผู้ใช้งาน</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ-นามสกุล</th><th>สิทธิ์</th><th>เข้าถึงอาคาร</th><th>สถานะ</th><th></th></tr></thead>
        <tbody>
          ${users
            .map((u) => {
              const scope = u.buildingIds.includes("ALL")
                ? "ทุกอาคาร"
                : u.buildingIds.map((id) => (buildings.find((b) => b.id === id) || {}).code || "?").join(", ") || "-";
              const isPending = u.status === "pending";
              return `
              <tr>
                <td>${u.username}</td>
                <td>${u.name}</td>
                <td><span class="badge ${u.role === "admin" ? "gold" : "grey"}">${u.role === "admin" ? "ผู้ดูแลระบบ" : u.role === "pending" ? "ยังไม่กำหนด" : "ผู้ใช้งาน"}</span></td>
                <td>${scope}</td>
                <td><span class="badge ${isPending ? "gold" : "green"}">${isPending ? "รออนุมัติ" : "ใช้งานได้"}</span></td>
                <td style="white-space:nowrap;">
                  ${isPending ? `<button class="icon-btn" data-approve-u="${u.id}" style="color:var(--green);font-weight:700;">${t("btn_approve")}</button>` : `<button class="icon-btn" data-edit-u="${u.id}">${t("btn_edit")}</button>`}
                  ${u.username !== "admin" ? `<button class="icon-btn danger" data-del-u="${u.id}">${t("btn_delete")}</button>` : ""}
                </td>
              </tr>`;
            })
            .join("")}
        </tbody>
      </table>
    </div>
  `;
  root.querySelectorAll("[data-edit-u]").forEach((b) =>
    b.addEventListener("click", () => openUserForm(users.find((x) => x.id === b.dataset.editU)))
  );
  root.querySelectorAll("[data-approve-u]").forEach((b) =>
    b.addEventListener("click", () => openUserForm(users.find((x) => x.id === b.dataset.approveU), true))
  );
  root.querySelectorAll("[data-del-u]").forEach((b) =>
    b.addEventListener("click", () => {
      if (!confirm("ลบผู้ใช้งานนี้หรือไม่?")) return;
      DB.set("users", DB.get("users", []).filter((x) => x.id !== b.dataset.delU));
      toast("ลบแล้ว");
      navigate("users");
    })
  );
  document.getElementById("add-user-btn").addEventListener("click", () => openUserForm(null));
  const accHost = document.createElement("div"); accHost.id = "acc-host"; root.appendChild(accHost);
  renderAccessSection(accHost);
}

/** Admin-only: sign-in / sign-out history and the latest data edits */
const AccUI = { user: "ALL", limit: 100 };
function renderAccessSection(host) {
  const logs = DB.get("accessLog", []).slice().sort((x, y) => (y.inAt || "").localeCompare(x.inAt || ""));
  const names = [...new Set(logs.map((l) => l.user))].sort();
  if (AccUI.user !== "ALL" && !names.includes(AccUI.user)) AccUI.user = "ALL";
  const shown = logs.filter((l) => AccUI.user === "ALL" || l.user === AccUI.user);
  const dur = (l) => {
    if (!l.outAt) return "";
    const m = Math.round((new Date(l.outAt) - new Date(l.inAt)) / 60000);
    if (isNaN(m) || m < 0) return "";
    return m >= 60 ? `${Math.floor(m / 60)} ${mt("ชม.", "h")} ${m % 60} ${mt("น.", "min")}` : `${m} ${mt("นาที", "min")}`;
  };
  const perUser = names.map((n) => {
    const mine = logs.filter((l) => l.user === n);
    const outs = mine.filter((l) => l.outAt).map((l) => l.outAt).sort();
    return { n, name: (mine[0] && mine[0].name) || "", cnt: mine.length, lastIn: mine[0] && mine[0].inAt, lastOut: outs[outs.length - 1] || "" };
  });
  // latest edit per checklist item (who / when), newest first
  const units = DB.get("mpUnits", []);
  const edits = [];
  DB.get("mpScores", []).forEach((r) => {
    const u = units.find((x) => x.id === r.unitId);
    Object.keys(r.meta || {}).forEach((id) => { const m = r.meta[id]; if (m && m.at) edits.push({ unit: u ? u.name : r.unitId, visit: r.visit, id, by: m.by, at: m.at }); });
  });
  edits.sort((x, y) => y.at.localeCompare(x.at));
  host.innerHTML = `
    <div class="card" style="margin-top:14px;">
      <div class="toolbar" style="margin-bottom:6px;">
        <div><h3 style="margin:0;">${mt("ประวัติการเข้า–ออกระบบ (เฉพาะผู้ดูแลระบบ)", "Sign-in / sign-out history (admins only)")}</h3>
          <div class="desc" style="margin:2px 0 0;">${mt("บันทึกทุกครั้งที่เข้าสู่ระบบและออกจากระบบ · ถ้าปิดหน้าต่างโดยไม่กด “ออกจากระบบ” จะไม่มีเวลาออก", "Every sign-in and sign-out is recorded · closing the window without signing out leaves the sign-out time empty")}</div></div>
        <select id="acc-user" aria-label="${mt("กรองผู้ใช้", "Filter user")}"><option value="ALL">${mt("ทุกผู้ใช้", "All users")}</option>${names.map((n) => `<option value="${mpEsc(n)}" ${AccUI.user === n ? "selected" : ""}>${mpEsc(n)}</option>`).join("")}</select>
      </div>
      <div class="acc-grid">
        <div><div class="mon-t">${mt("สรุปรายผู้ใช้", "By user")}</div>
          <table><thead><tr><th>${mt("ผู้ใช้", "User")}</th><th>${mt("เข้าล่าสุด", "Last in")}</th><th>${mt("ออกล่าสุด", "Last out")}</th><th>${mt("ครั้ง", "Times")}</th></tr></thead><tbody>
          ${perUser.length ? perUser.map((p) => `<tr><td>${mpEsc(p.n)}<div class="muted-s">${mpEsc(p.name)}</div></td><td>${mpFmtWhen(p.lastIn)}</td><td>${p.lastOut ? mpFmtWhen(p.lastOut) : "–"}</td><td>${p.cnt}</td></tr>`).join("") : `<tr><td colspan="4" class="muted-s">${mt("ยังไม่มีบันทึก — จะเริ่มบันทึกตั้งแต่การเข้าสู่ระบบครั้งถัดไป", "Nothing yet — recording starts from the next sign-in")}</td></tr>`}
          </tbody></table></div>
        <div><div class="mon-t">${mt("การเข้า–ออกล่าสุด", "Recent sessions")} (${Math.min(shown.length, AccUI.limit)}/${shown.length})</div>
          <div class="acc-scroll"><table><thead><tr><th>${mt("ผู้ใช้", "User")}</th><th>${mt("เข้าสู่ระบบ", "Signed in")}</th><th>${mt("ออกจากระบบ", "Signed out")}</th><th>${mt("ระยะเวลา", "Duration")}</th></tr></thead><tbody>
          ${shown.slice(0, AccUI.limit).map((l) => `<tr><td>${mpEsc(l.user)}</td><td>${mpFmtWhen(l.inAt)}</td><td>${l.outAt ? mpFmtWhen(l.outAt) : `<span class="muted-s">${mt("ยังไม่ออก / ปิดหน้าต่าง", "no sign-out")}</span>`}</td><td>${dur(l)}</td></tr>`).join("")}
          </tbody></table></div></div>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <h3 style="margin-bottom:2px;">${mt("การแก้ไขข้อมูล Checklist ล่าสุด", "Latest Checklist edits")}</h3>
      <div class="desc">${mt("แสดงผู้แก้ไขและวันเวลาล่าสุดของแต่ละข้อ (เก็บเฉพาะครั้งล่าสุด) · 30 รายการล่าสุด", "Latest editor and time per item (only the most recent is kept) · newest 30")}</div>
      <div class="acc-scroll"><table><thead><tr><th>${mt("วันเวลา", "When")}</th><th>${mt("ผู้แก้ไข", "Editor")}</th><th>${mt("หน่วยงาน", "Unit")}</th><th>${mt("ครั้งที่", "Visit")}</th><th>${mt("ข้อ", "Item")}</th></tr></thead><tbody>
      ${edits.length ? edits.slice(0, 30).map((e) => `<tr><td>${mpFmtWhen(e.at)}</td><td>${mpEsc(e.by || "–")}</td><td>${mpEsc(e.unit)}</td><td>${e.visit}</td><td>${mpEsc(e.id)}</td></tr>`).join("") : `<tr><td colspan="5" class="muted-s">${mt("ยังไม่มีการแก้ไขที่บันทึกผู้แก้ — จะเริ่มบันทึกตั้งแต่การแก้ไขครั้งถัดไป", "No attributed edits yet — recording starts with the next edit")}</td></tr>`}
      </tbody></table></div>
    </div>`;
  const sel = host.querySelector("#acc-user");
  if (sel) sel.addEventListener("change", () => { AccUI.user = sel.value; renderAccessSection(host); });
}

function openUserForm(existing, isApproval) {
  const buildings = DB.get("buildings", []);
  const selectedIds = existing ? existing.buildingIds.filter((id) => id !== "ALL") : [];
  const modal = openModal(`
    <h3>${isApproval ? "อนุมัติผู้ใช้งานใหม่" : existing ? "แก้ไขผู้ใช้งาน" : "เพิ่มผู้ใช้งานใหม่"}</h3>
    ${isApproval ? `<div class="desc" style="margin-bottom:14px;">กำหนดสิทธิ์และอาคารที่เข้าถึงได้ก่อนเปิดใช้งานบัญชีนี้</div>` : ""}
    <div class="form-row">
      <div class="field"><label>ชื่อผู้ใช้ (username)</label><input type="text" id="f-username" ${existing ? "disabled" : ""} value="${existing ? escapeAttr(existing.username) : ""}" /></div>
      <div class="field"><label>รหัสผ่าน</label><input type="text" id="f-password" placeholder="${existing ? "เว้นว่างถ้าไม่เปลี่ยน" : ""}" /></div>
    </div>
    <div class="form-row">
      <div class="field"><label>ชื่อ-นามสกุล</label><input type="text" id="f-name" value="${existing ? escapeAttr(existing.name) : ""}" /></div>
      <div class="field">
        <label>สิทธิ์การใช้งาน</label>
        <select id="f-role">
          <option value="user" ${existing && existing.role === "user" ? "selected" : ""}>ผู้ใช้งานทั่วไป</option>
          <option value="admin" ${existing && existing.role === "admin" ? "selected" : ""}>ผู้ดูแลระบบ</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>สถานะบัญชี</label>
      <select id="f-status">
        <option value="active" ${!existing || existing.status !== "pending" ? "selected" : ""}>ใช้งานได้ (Active)</option>
        <option value="pending" ${existing && existing.status === "pending" && !isApproval ? "selected" : ""}>รออนุมัติ (Pending)</option>
      </select>
    </div>
    <div class="field">
      <label>อาคาร/BU ที่เข้าถึงได้</label>
      <div class="checkbox-list" id="building-checks">
        <label class="checkbox-pill"><input type="checkbox" value="ALL" ${existing && existing.buildingIds.includes("ALL") ? "checked" : ""}/> ทุกอาคาร</label>
        ${buildings
          .map((b) => `<label class="checkbox-pill"><input type="checkbox" value="${b.id}" ${selectedIds.includes(b.id) ? "checked" : ""}/> ${b.name}</label>`)
          .join("")}
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="cancel-u">${t("btn_cancel")}</button>
      <button class="btn" id="save-u">${isApproval ? "อนุมัติและบันทึก" : "บันทึก"}</button>
    </div>
  `);
  modal.querySelector("#cancel-u").addEventListener("click", closeModal);
  modal.querySelector("#save-u").addEventListener("click", () => {
    const username = modal.querySelector("#f-username").value.trim();
    const name = modal.querySelector("#f-name").value.trim();
    if (!existing && !username) { alert("กรุณาระบุชื่อผู้ใช้"); return; }
    if (!name) { alert("กรุณาระบุชื่อ-นามสกุล"); return; }
    const checked = [...modal.querySelectorAll("#building-checks input:checked")].map((c) => c.value);
    const password = modal.querySelector("#f-password").value;
    const role = modal.querySelector("#f-role").value;
    const status = isApproval ? "active" : modal.querySelector("#f-status").value;
    const all = DB.get("users", []);
    if (existing) {
      const idx = all.findIndex((x) => x.id === existing.id);
      all[idx] = {
        ...existing,
        name,
        role,
        status,
        buildingIds: checked.length ? checked : ["ALL"],
        password: password ? password : existing.password
      };
    } else {
      if (all.some((u) => u.username.toLowerCase() === username.toLowerCase())) {
        alert("มีชื่อผู้ใช้นี้อยู่แล้ว");
        return;
      }
      all.push({
        id: uid("u"),
        username,
        password: password || "changeme",
        name,
        role,
        status,
        buildingIds: checked.length ? checked : ["ALL"]
      });
    }
    DB.set("users", all);
    closeModal();
    toast(isApproval ? "อนุมัติผู้ใช้งานแล้ว" : "บันทึกแล้ว");
    navigate("users");
  });
}

            .slice(0, 25)
            .map((r) => `<tr>${ds.headers.map((h) => `<td>${r[h.key] ?? "-"}</td>`).join("")}</tr>`)
            .join("") || `<tr><td colspan="${ds.headers.length}" class="empty-state">ไม่มีข้อมูล</td></tr>`}
        </tbody>
      </table>
      </div>
    `;
  }
  drawPreview();
  document.getElementById("dataset-select").addEventListener("change", drawPreview);
  document.getElementById("export-csv-btn").addEventListener("click", () => {
    const key = document.getElementById("dataset-select").value;
    const ds = DATASETS[key];
    ExportUtil.exportCSV(ds.rows(), ds.headers, `qshe_${key}_${todayISO()}`);
    toast("ดาวน์โหลดไฟล์แล้ว");
  });

  document.getElementById("print-summary-btn").addEventListener("click", () => {
    const scope = buildingsInScope();
    const ids = scope.map((b) => b.id);
    const modulePct = MODULES.map((m) => ({ ...m, comp: moduleCompletion(ids, m.id) }));
    const okrs = DB.get("okrs", []).filter((o) => ids.includes(o.buildingId));
    const kpis = DB.get("kpis", []).filter((k) => ids.includes(k.buildingId));
    const capas = DB.get("capas", []).filter((c) => ids.includes(c.buildingId));
    const openCapas = capas.filter((c) => c.status !== "closed");
    const ragCounts = { green: 0, yellow: 0, red: 0, grey: 0 };
    kpis.forEach((k) => ragCounts[ragOf(k)]++);

    const html = `
      <div class="meta">PSD eNGINNo QSHE Management — Executive Summary</div>
      <h1>สรุปผลการดำเนินงาน QSHE ${State.activeBuilding === "ALL" ? "(ทุกอาคาร)" : "— " + scope[0]?.name}</h1>
      <div class="meta">วันที่จัดทำรายงาน: ${todayISO()} &nbsp;|&nbsp; จัดทำโดย: ${State.user.name}</div>
      <table>
        <thead><tr><th>Module</th><th>ความคืบหน้า</th></tr></thead>
        <tbody>${modulePct.map((m) => `<tr><td>${m.nameTh} (${m.name})</td><td>${m.comp.pct}%</td></tr>`).join("")}</tbody>
      </table>
      <table>
        <thead><tr><th>รายการ</th><th>ค่า</th></tr></thead>
        <tbody>
          <tr><td>จำนวน OKR</td><td>${okrs.length}</td></tr>
          <tr><td>KPI ตามเป้า / เฝ้าระวัง / ต้องเร่งแก้ไข</td><td>${ragCounts.green} / ${ragCounts.yellow} / ${ragCounts.red}</td></tr>
          <tr><td>CAPA ที่ยังเปิดอยู่</td><td>${openCapas.length}</td></tr>
        </tbody>
      </table>
    `;
    ExportUtil.printSection(html, "QSHE Executive Summary");
  });
}


// ------------------------------------------- central data connection (settings) ---
function mpRenderSyncSettings(el) {
  if (!el) return;
  const c = SyncMgr.cfg(), m = SyncMgr.meta();
  const on = SyncMgr.enabled();
  el.innerHTML = `<h4>${mt("เชื่อมต่อข้อมูลกลาง (Google Sheet)", "Central data connection (Google Sheet)")}</h4>
    <div class="desc" style="margin-bottom:8px;">${mt("เมื่อเชื่อมต่อ ข้อมูลที่หน่วยงานกรอกจะถูกส่งไปที่ Google Sheet และ Admin เห็นข้อมูลของทุกเครื่อง · ขอรหัสเชื่อมต่อทีมจาก Admin (หน้า สำรองข้อมูล)", "When connected, what each unit enters goes to the Google Sheet so Admin sees every computer's data · get the team connection code from Admin (Backup page)")}</div>
    ${on ? `<div class="mp-banner">✔ ${mt("เชื่อมต่อแล้ว", "Connected")} · ${m.lastAt ? new Date(m.lastAt).toLocaleString(mt("th-TH", "en-GB")) : "–"}${m.status === "error" ? ` · ▲ ${mpEsc(m.lastError || "")}` : ""}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;"><button class="btn small" id="sy-now">${mt("ซิงก์ตอนนี้", "Sync now")}</button><button class="btn ghost small" id="sy-off">${mt("ยกเลิกการเชื่อมต่อ", "Disconnect")}</button></div>`
    : `<div class="field"><label>${mt("รหัสเชื่อมต่อทีม", "Team connection code")}</label><input type="text" id="sy-code" placeholder="QSHE1.…" /></div>
      <button class="btn small" id="sy-on">${mt("เชื่อมต่อ", "Connect")}</button> <span class="muted-s" id="sy-msg"></span>`}`;
  const rerender = () => mpRenderSyncSettings(el);
  const on_ = el.querySelector("#sy-on");
  if (on_) on_.addEventListener("click", async () => {
    const msg = el.querySelector("#sy-msg");
    try { msg.textContent = mt("กำลังเชื่อมต่อ…", "Connecting…"); await SyncMgr.connect(el.querySelector("#sy-code").value); SyncMgr.paint(); toast(mt("เชื่อมต่อแล้ว", "Connected")); rerender(); renderView(); }
    catch (e) { msg.textContent = e.message || String(e); }
  });
  const now = el.querySelector("#sy-now"); if (now) now.addEventListener("click", async () => { await SyncMgr.run(); rerender(); renderView(); });
  const off = el.querySelector("#sy-off"); if (off) off.addEventListener("click", () => { SyncMgr.disconnect(); rerender(); });
}


// ------------------------------------------- dashboard period buttons + live clock ---
let dashClockTimer = null;
function dashClockText() {
  const d = new Date();
  const lang = DB.get("lang", "th") === "en" ? "en-GB" : "th-TH";
  return d.toLocaleDateString(lang, { weekday: "short", day: "numeric", month: "short", year: "numeric" }) + " · " + d.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
}
function dashToolsHtml() {
  const b = (k, th, en) => `<button type="button" class="per-btn ${MpPeriod.kind === k ? "active" : ""}" data-period="${k}" aria-pressed="${MpPeriod.kind === k}">${mt(th, en)}</button>`;
  return `<div class="dash-tools">
    <div class="dash-row">
      ${(DB.get("moduleVisibility", {}).masterplan !== false) ? `<label class="dash-unit"><span>${mt("หน่วยงาน", "Unit")}</span><select id="dash-unit" aria-label="${mt("เลือกหน่วยงาน", "Select unit")}"><option value="ALL">${mt("รวมทุกหน่วยงาน", "All units")}</option>${DB.get("mpUnits", []).map((u) => `<option value="${u.id}" ${MpDashUI.scope === u.id ? "selected" : ""}>${mpEsc(u.name)}</option>`).join("")}</select></label>` : ""}
      <div class="per-group" role="group" aria-label="${mt("ช่วงเวลา ปี / เดือน", "Period year / month")}">${b("year", "ปี", "Year")}${b("month", "เดือน", "Month")}</div>
      <div class="per-group" role="group" aria-label="${mt("ช่วงเวลา สัปดาห์ / วัน", "Period week / day")}">${b("week", "สัปดาห์", "Week")}${b("day", "วัน", "Day")}</div>
      <div class="dash-clock" id="dash-clock" aria-live="off">${dashClockText()}</div>
    </div>
    <div class="per-range muted-s" id="per-range">${mt("ช่วงข้อมูล", "Range")}: ${mpPeriodLabel()}</div>
  </div>`;
}
function wireDashTools() {
  const du = document.getElementById("dash-unit");
  if (du) du.addEventListener("change", () => { MpDashUI.scope = du.value; mpDashRefresh(); });
  document.querySelectorAll("[data-period]").forEach((btn) => btn.addEventListener("click", () => {
    MpPeriod.kind = MpPeriod.kind === btn.dataset.period ? null : btn.dataset.period;   // click again = all time
    document.querySelectorAll("[data-period]").forEach((x) => { const on = x.dataset.period === MpPeriod.kind; x.classList.toggle("active", on); x.setAttribute("aria-pressed", on); });
    const r = document.getElementById("per-range"); if (r) r.textContent = `${mt("ช่วงข้อมูล", "Range")}: ${mpPeriodLabel()}`;
    renderView();
  }));
  clearInterval(dashClockTimer);
  dashClockTimer = setInterval(() => {
    const el = document.getElementById("dash-clock");
    if (!el) { clearInterval(dashClockTimer); return; }
    el.textContent = dashClockText();
  }, 1000);
}

</script>
