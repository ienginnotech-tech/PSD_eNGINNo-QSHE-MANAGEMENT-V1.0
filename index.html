<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSD eNGINNo — QSHE Management V1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PSD eNGINNo QSHE Management — stylesheet
   Palette ties back to the QSHE framework document:
   deep green (structure/authority) + warm gold (attention/accent)
   ========================================================================== */

:root {
  --dark-green: #12492F;
  --brand-fixed: #12492F;
  --heading: #12492F;
  --green: #1F7A4D;
  --green-soft: #E8F3EC;
  --gold: #C9992A;
  --gold-soft: #FBF1DD;
  --bg: #F3F5F4;
  --card: #FFFFFF;
  --text: #1C2622;
  --muted: #5C6B65;
  --border: #E1E7E4;
  --red: #C0392B;
  --red-soft: #FBEAE8;
  --yellow: #B9871A;
  --yellow-soft: #FBF1DD;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(18, 73, 47, 0.06), 0 4px 14px rgba(18, 73, 47, 0.06);
  --app-font: "IBM Plex Sans Thai", "Noto Sans Thai", -apple-system, "Segoe UI", sans-serif;
  --app-font-size: 15px;
}

/* ---------- Theme variants (toggled via body class from Settings) ---------- */
body.theme-dark {
  --bg: #0D1613;
  --card: #142420;
  --border: rgba(255,255,255,0.10);
  --text: #E7F3EF;
  --muted: #86A79B;
  --heading: #EAF7F1;
  --green: #33E6A6;
  --green-soft: rgba(51,230,166,0.14);
  --gold: #F0C24B;
  --gold-soft: rgba(240,194,75,0.16);
  --red: #FF6B6B;
  --red-soft: rgba(255,107,107,0.14);
  --yellow: #F0C24B;
  --yellow-soft: rgba(240,194,75,0.16);
  --shadow: 0 6px 22px rgba(0,0,0,0.4);
}
body.theme-ocean {
  --bg: #F1F6FA;
  --card: #FFFFFF;
  --border: #DCE7F0;
  --text: #16232E;
  --muted: #5A7080;
  --heading: #0B3D66;
  --green: #2596F0;
  --green-soft: #E3F0FC;
  --gold: #14B8A6;
  --gold-soft: #E1F7F3;
  --red: #D64545;
  --red-soft: #FBE7E7;
  --yellow: #C9820F;
  --yellow-soft: #FBF1DD;
  --shadow: 0 1px 2px rgba(11,61,102,0.06), 0 4px 14px rgba(11,61,102,0.08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--app-font);
  font-size: var(--app-font-size);
  line-height: 1.5;
  transition: background 0.15s ease, color 0.15s ease;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; }

a { color: var(--green); }

.hidden { display: none !important; }

/* ---------- Login / Register screen (dark, blue-green tech theme) ---------- */
:root {
  --auth-bg-1: #050C0A;
  --auth-bg-2: #081C17;
  --auth-card: #0E1B17;
  --auth-card-border: rgba(140, 210, 190, 0.14);
  --auth-text: #E9F5F0;
  --auth-muted: #7FA398;
  --auth-input-bg: #0A1613;
  --auth-input-border: rgba(140, 210, 190, 0.16);
  --accent-emerald: #2FEAA8;
  --accent-azure: #38B6FF;
  --accent-gradient: linear-gradient(90deg, var(--accent-emerald), var(--accent-azure));
}

#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  background:
    radial-gradient(circle at 20% 15%, rgba(47, 234, 168, 0.10), transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(56, 182, 255, 0.10), transparent 45%),
    radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(180deg, var(--auth-bg-1) 0%, var(--auth-bg-2) 100%);
  background-size: auto, auto, 22px 22px, auto;
  color: var(--auth-text);
}

.auth-page { width: 100%; max-width: 420px; }

.auth-header { text-align: center; margin-bottom: 26px; }
.eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.28em;
  color: var(--accent-emerald);
  margin-bottom: 14px;
}
.eyebrow-dot { color: var(--accent-azure); }
.auth-title {
  font-family: "JetBrains Mono", monospace;
  font-size: 30px;
  font-weight: 700;
  margin: 0;
  color: #F4FBF8;
  letter-spacing: 0.01em;
}
.auth-title .accent {
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.auth-sub {
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  color: var(--auth-muted);
  margin-top: 10px;
  letter-spacing: 0.05em;
}

.auth-card {
  background: var(--auth-card);
  border: 1px solid var(--auth-card-border);
  border-radius: 16px;
  padding: 28px 26px 24px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.45);
}

.auth-error {
  background: rgba(224, 82, 82, 0.12);
  border: 1px solid rgba(224, 82, 82, 0.35);
  color: #FF9B9B;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}
.auth-success {
  background: rgba(47, 234, 168, 0.10);
  border: 1px solid rgba(47, 234, 168, 0.35);
  color: var(--accent-emerald);
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}

.field-dark { margin-bottom: 16px; }
.field-dark label {
  display: block;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--auth-muted);
  margin-bottom: 7px;
}
.field-dark input, .field-dark select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 9px;
  border: 1px solid var(--auth-input-border);
  background: var(--auth-input-bg);
  color: var(--auth-text);
}
.field-dark select { color: var(--auth-muted); }
.field-dark input::placeholder { color: #4E6B62; }
.field-dark input:focus, .field-dark select:focus {
  outline: none;
  border-color: var(--accent-emerald);
  box-shadow: 0 0 0 3px rgba(47, 234, 168, 0.14);
}

.password-wrap { position: relative; }
.password-wrap input { padding-right: 42px; }
.eye-toggle {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--auth-muted);
  cursor: pointer;
  padding: 4px;
  display: flex;
}
.eye-toggle:hover { color: var(--accent-emerald); }

.btn-glow {
  width: 100%;
  padding: 13px 16px;
  border-radius: 10px;
  border: none;
  background: var(--accent-gradient);
  color: #04140F;
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
  box-shadow: 0 8px 26px rgba(47, 234, 168, 0.28), 0 8px 26px rgba(56, 182, 255, 0.14);
  transition: transform 0.05s ease, box-shadow 0.15s ease;
}
.btn-glow:hover { box-shadow: 0 10px 32px rgba(47, 234, 168, 0.4), 0 10px 32px rgba(56, 182, 255, 0.22); }
.btn-glow:active { transform: translateY(1px); }

/* Generic light-theme field (used in modal forms across the app) */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--heading);
  margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--green);
  outline-offset: 1px;
  border-color: var(--green);
}

.btn-outline-dark {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid var(--auth-input-border);
  background: rgba(255,255,255,0.02);
  color: var(--auth-text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.btn-outline-dark:hover { border-color: var(--accent-azure); color: #fff; }

.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0;
  color: var(--auth-muted);
  font-size: 12px;
}
.auth-divider::before, .auth-divider::after {
  content: ""; flex: 1; height: 1px;
  background: var(--auth-input-border);
}

.auth-hint {
  margin-top: 16px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--auth-muted);
  background: rgba(47, 234, 168, 0.06);
  border: 1px solid rgba(47, 234, 168, 0.14);
  border-radius: 9px;
  padding: 10px 12px;
}
.auth-hint strong { color: var(--accent-emerald); }

.auth-footer {
  text-align: center;
  margin-top: 22px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--auth-muted);
  letter-spacing: 0.04em;
}
.auth-footer .accent { color: var(--accent-emerald); font-weight: 700; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: var(--green);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
}
.btn:hover { background: var(--brand-fixed); }
.btn:active { transform: translateY(1px); }
.btn.block { width: 100%; }
.btn.ghost {
  background: transparent;
  color: var(--heading);
  border-color: var(--border);
}
.btn.ghost:hover { background: var(--green-soft); }
.btn.danger { background: var(--red); }
.btn.danger:hover { background: #9c2e22; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.gold { background: var(--gold); color: var(--brand-fixed); }
.btn.gold:hover { background: #b3861f; }

.login-error {
  background: var(--red-soft);
  color: var(--red);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 12px;
}

.login-hint {
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
  background: var(--green-soft);
  border-radius: 8px;
  padding: 10px 12px;
}

/* ---------- App shell ---------- */
#app-shell {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
}

#sidebar {
  background: var(--brand-fixed);
  color: #EAF3EE;
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 6px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  margin-bottom: 14px;
}
.brand .mark {
  width: 34px; height: 34px;
  background: var(--gold);
  color: var(--brand-fixed);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  font-size: 13px;
  flex-shrink: 0;
}
.brand .name { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
.brand .ver { font-size: 11px; color: #9FC2AC; }

.sidebar-toolbar {
  display: flex;
  gap: 6px;
  padding: 4px 6px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  margin-bottom: 10px;
}
.icon-chip {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 8px;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.04);
  color: #D8EADD;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.icon-chip:hover { background: rgba(255,255,255,0.1); color: #fff; }

.nav-group-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #83A893;
  margin: 14px 8px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 7px;
  color: #D8EADD;
  cursor: pointer;
  font-size: 13.5px;
  margin-bottom: 2px;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,0.08); }
.nav-item.active {
  background: var(--green);
  color: #fff;
  font-weight: 600;
}
.nav-item .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; opacity: 0.5;
}

#sidebar-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.12);
}
.user-chip {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: #C9E0D1;
  padding: 6px;
}
.user-chip .avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--gold); color: var(--brand-fixed);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px;
}

/* ---------- Main area ---------- */
#main {
  padding: 22px 28px 40px;
  min-width: 0;
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
  flex-wrap: wrap;
}

#topbar h2 {
  margin: 0;
  font-size: 20px;
  color: var(--heading);
}
#topbar .subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}

.building-select {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
}
.building-select label { font-size: 12px; color: var(--muted); }
.building-select select { border: none; font-weight: 600; color: var(--heading); background: transparent; }
.building-select select:focus { outline: none; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
}

.card h3 {
  margin: 0 0 4px;
  font-size: 15px;
  color: var(--heading);
}
.card .desc { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

.grid { display: grid; gap: 14px; }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

@media (max-width: 980px) {
  .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.stat-card .label { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.stat-card .value { font-size: 26px; font-weight: 700; color: var(--heading); }
.stat-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th {
  text-align: left;
  background: var(--green-soft);
  color: var(--heading);
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  white-space: nowrap;
}
tbody td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
tbody tr:hover td { background: #FAFCFB; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.badge.green { background: var(--green-soft); color: var(--green); }
.badge.gold { background: var(--gold-soft); color: var(--yellow); }
.badge.red { background: var(--red-soft); color: var(--red); }
.badge.grey { background: #EEF1EF; color: var(--muted); }

.status-select, .rag-select {
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 12.5px;
  font-weight: 600;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.toolbar .filters { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar select, .toolbar input[type="text"] {
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid var(--border);
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--heading);
  margin: 18px 0 8px;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
}
.section-title:first-child { border-top: none; padding-top: 0; margin-top: 0; }

.fms-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: var(--gold);
  border-radius: 5px;
  padding: 1px 6px;
  margin-right: 6px;
}

/* form modal */
.overlay {
  position: fixed; inset: 0;
  background: rgba(10, 30, 20, 0.45);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  z-index: 50;
}
.modal {
  background: var(--card);
  border-radius: 12px;
  width: 100%;
  max-width: 560px;
  padding: 22px 24px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal h3 { margin-top: 0; color: var(--heading); }
.modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

.kr-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.kr-row input[type="text"] { flex: 1; }
.kr-row input[type="number"] { width: 70px; }

.settings-section { margin-bottom: 20px; }
.settings-section:last-child { margin-bottom: 0; }
.settings-section h4 {
  font-size: 13px;
  color: var(--heading);
  margin: 0 0 8px;
}
.option-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.option-card {
  border: 1.5px solid var(--border);
  border-radius: 9px;
  padding: 10px 8px;
  text-align: center;
  font-size: 12.5px;
  cursor: pointer;
  background: var(--card);
  color: var(--text);
}
.option-card:hover { border-color: var(--green); }
.option-card.selected {
  border-color: var(--green);
  background: var(--green-soft);
  color: var(--heading);
  font-weight: 700;
}
.option-card .swatch {
  width: 100%; height: 22px;
  border-radius: 5px;
  margin-bottom: 6px;
  border: 1px solid rgba(0,0,0,0.06);
}

.checkbox-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.checkbox-pill {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 12.5px;
}

.empty-state {
  text-align: center;
  padding: 30px 10px;
  color: var(--muted);
  font-size: 13.5px;
}

.icon-btn {
  border: none;
  background: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  padding: 4px 6px;
  border-radius: 6px;
}
.icon-btn:hover { background: var(--green-soft); color: var(--green); }
.icon-btn.danger:hover { background: var(--red-soft); color: var(--red); }

.toast {
  position: fixed;
  bottom: 20px; right: 20px;
  background: var(--brand-fixed);
  color: #fff;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13.5px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  z-index: 100;
  animation: toast-in 0.18s ease;
}
@keyframes toast-in {
  from { transform: translateY(8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.progress-bar {
  width: 100%; height: 7px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
}
.progress-bar > span {
  display: block; height: 100%;
  background: var(--green);
}

/* ---------- Responsive: collapse sidebar to top bar ---------- */
@media (max-width: 860px) {
  #app-shell { grid-template-columns: 1fr; }
  #sidebar {
    flex-direction: row;
    align-items: center;
    overflow-x: auto;
    padding: 10px 12px;
  }
  .brand { border-bottom: none; margin-bottom: 0; padding: 0 10px 0 0; }
  .nav-group-label { display: none; }
  #sidebar nav { display: flex; gap: 4px; }
  .nav-item { white-space: nowrap; }
  #sidebar-footer { margin-top: 0; margin-left: 8px; border-top: none; padding-top: 0; }
  .modal .form-row { grid-template-columns: 1fr; }
}

/* ==========================================================================

:root {
  /* Status palette is fixed across themes (always paired with an icon + label) */
  --st-good: #0ca30c;
  --st-warning: #fab219;
  --st-serious: #ec835a;
  --st-critical: #d03b3b;
}
.brand-logo {
  background: #fff;
  border-radius: 10px;
  padding: 8px 12px;
  margin: 2px 4px 14px;
  display: flex; align-items: center; justify-content: center;
}
.brand-logo img { display: block; width: 100%; max-width: 168px; height: auto; }

.mp-scroll { overflow-x: auto; }
.mp-sub { font-size: 12px; color: var(--muted); margin-top: 3px; max-width: 360px; }
.mp-od { color: var(--text); font-size: 11.5px; font-weight: 700; margin-top: 2px; }
.mp-od::first-letter { color: var(--st-critical); }
.muted-s { font-size: 12px; color: var(--muted); }
.mp-banner {
  background: var(--gold-soft); color: var(--text); border: 1px solid var(--border);
  border-left: 4px solid var(--st-warning); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; margin-bottom: 12px;
}
.mp-tip {
  position: fixed; z-index: 90; display: none; pointer-events: none;
  background: var(--heading); color: var(--card); font-size: 12.5px; line-height: 1.45;
  padding: 7px 10px; border-radius: 6px; white-space: pre-line; max-width: 320px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

/* plan table + timeline */
.mp-plan-table { min-width: 1100px; }
.mp-plan-table th, .mp-plan-table td { vertical-align: top; }
.mp-plan-table .c-no { width: 28px; color: var(--muted); }
.mp-plan-table .c-step { min-width: 220px; }
.mp-plan-table .c-loc, .mp-plan-table .c-own { min-width: 130px; font-size: 13px; }
.mp-plan-table .c-per { min-width: 110px; font-size: 12.5px; white-space: nowrap; }
.mp-plan-table .c-act { white-space: nowrap; }
.tl-h { padding: 4px 0 !important; width: 28px; min-width: 28px; text-align: center; font-weight: 600; line-height: 1.1; }
.tl-h span { display: block; font-size: 11px; }
.tl-h small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
.tl-h.cur, .tl-c.cur { background: var(--green-soft); }
.tl-c { padding: 0 !important; text-align: center; vertical-align: middle !important; }
.tl-bar { display: block; height: 8px; margin: 0 1px; border-radius: 4px; background: var(--muted); }
.tl-c .tl-bar { margin: 0 2px; }
.tl-bar.st-todo { background: #9AA7A1; }
.tl-bar.st-doing { background: var(--st-warning); }
.tl-bar.st-done { background: var(--st-good); }
i.tl-bar { display: inline-block; width: 18px; vertical-align: middle; margin-right: 4px; }
.mp-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 10px 2px 0; align-items: center; }
.mp-legend.top { margin: 0 0 12px; color: var(--text); }
.mp-legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* status chip: icon carries the colour, label stays in ink */
.st-chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
  color: var(--text); padding: 2px 10px 2px 8px; border: 1px solid var(--border); border-radius: 999px; white-space: nowrap;
}
.st-chip i { font-style: normal; font-size: 12px; }
.st-chip.muted { color: var(--muted); font-weight: 400; }

/* horizontal bars */
.bar-row { display: grid; grid-template-columns: minmax(140px, 300px) 1fr 62px minmax(120px, 190px); gap: 12px; align-items: center; padding: 5px 0; }
.bar-label { font-size: 13px; color: var(--text); }
.bar-val { font-size: 13px; font-weight: 700; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
.bar-track { position: relative; height: 14px; background: var(--green-soft); border-radius: 4px; cursor: default; }
.bar-track:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; transition: width .25s; }
.bar-track .thr { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--card); }
.bar-track .thr::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .55; }
.bar-row.axis { padding: 0; }
.bar-track.axis-t { background: none; height: 16px; cursor: default; }
.axis-t span { position: absolute; top: 0; font-size: 11px; color: var(--muted); transform: translateX(-50%); }
.axis-t span:first-child { transform: none; }
.axis-t span:last-child { transform: translateX(-100%); }
.stack-row { grid-template-columns: minmax(140px, 300px) 1fr 80px; }
.stack-track { display: flex; gap: 2px; height: 16px; align-items: center; }
.stack-track .seg { height: 100%; border-radius: 3px; display: flex; align-items: center; justify-content: center; min-width: 6px; cursor: default; }
.stack-track .seg:first-child { border-radius: 4px 3px 3px 4px; }
.stack-track .seg b { font-size: 10.5px; color: #111; font-weight: 700; }
.total-row td { border-top: 2px solid var(--border); }

/* checklist */
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.unit-card {
  position: relative; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 34px 10px 12px;
  background: var(--card); cursor: pointer;
}
.unit-card:hover { border-color: var(--green); }
.unit-card.selected { border-color: var(--green); background: var(--green-soft); }
.unit-card .u-name { font-weight: 700; font-size: 14px; color: var(--heading); }
.unit-card .u-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.unit-card .u-st { position: absolute; right: 12px; top: 10px; font-size: 15px; }
.unit-card .u-st i { font-style: normal; color: var(--muted); }
.mp-sumbar { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; font-size: 14px; padding: 10px 12px; background: var(--green-soft); border-radius: 8px; }
.mp-sumbar b { font-size: 20px; color: var(--heading); }
.chk-cat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 12px; box-shadow: var(--shadow); }
.chk-cat > summary { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; cursor: pointer; font-weight: 700; color: var(--heading); list-style: none; }
.chk-cat > summary::-webkit-details-marker { display: none; }
.chk-cat > summary::before { content: "▸"; margin-right: 8px; transition: transform .15s; display: inline-block; }
.chk-cat[open] > summary::before { transform: rotate(90deg); }
.chk-cat > summary .cat-title { flex: 1; }
.cat-sum { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.cat-sum i { font-style: normal; }
.chk-row { display: grid; grid-template-columns: 44px 1fr 210px; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); border-left: 4px solid var(--rk, transparent); }
.chk-id { font-weight: 700; color: var(--muted); font-size: 13px; }
.chk-text { font-size: 14px; }
.chk-more { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.chk-more summary { cursor: pointer; }
.chk-more div { margin-top: 3px; }
.chk-note { margin-top: 6px; width: 100%; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); font-family: inherit; }
.chk-score select { width: 100%; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); font-family: inherit; font-size: 13.5px; }
.chk-risk { margin-top: 6px; min-height: 24px; }
textarea { font-family: inherit; }

@media (max-width: 900px) {
  .bar-row { grid-template-columns: 1fr 56px; }
  .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; }
  .bar-row .bar-st { grid-column: 1 / -1; }
  .bar-row.axis { display: none; }
  .stack-row { grid-template-columns: 1fr 70px; }
  .stack-row .stack-track { grid-column: 1 / -1; grid-row: 2; }
  .chk-row { grid-template-columns: 36px 1fr; }
  .chk-score { grid-column: 2; }
}
@media (max-width: 860px) { .brand-logo { display: none; } }
.mp-plan-table { min-width: 0; width: 100%; }
.mp-plan-table .c-step { min-width: 190px; max-width: 260px; }
.mp-plan-table .c-loc { min-width: 110px; max-width: 150px; }
.mp-plan-table .c-own { min-width: 100px; max-width: 120px; }
.mp-plan-table .badge { white-space: nowrap; }
.mp-plan-table .c-act { display: table-cell; }
.mp-plan-table .c-act .icon-btn { display: block; margin: 0 0 4px; }
.tl-h { width: 20px; min-width: 20px; }
.tl-h span { font-size: 10px; }
.tl-c .tl-bar { margin: 0 1px; }
#mp-check-body .form-row { display: grid; grid-template-columns: 220px 1fr; gap: 12px; }
@media (max-width: 860px) { #mp-check-body .form-row { grid-template-columns: 1fr; } }

/* checklist photos: slot 1 = before / finding, slot 2 = after correction */
.chk-row { grid-template-columns: 44px 1fr 184px 210px; }
.chk-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
.ph-slot { position: relative; height: 76px; }
.ph-add {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  border: 1.5px dashed var(--border); border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 11.5px; text-align: center; line-height: 1.25;
}
.ph-add:hover { border-color: var(--green); color: var(--green); background: var(--green-soft); }
.ph-add small { font-size: 10.5px; opacity: .85; }
.ph-plus { font-size: 17px; line-height: 1; }
.ph-slot.has .ph-add { display: none; }
.ph-slot.disabled { opacity: .45; pointer-events: none; }
.ph-img { position: absolute; inset: 0; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: zoom-in; background: var(--card); }
.ph-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-tag { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 10.5px; padding: 1px 0; text-align: center; }
.ph-x { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--st-critical); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; padding: 0; }
.ph-cell { white-space: nowrap; }
.ph-mini { padding: 0; border: 1px solid var(--border); border-radius: 6px; margin-right: 4px; width: 44px; height: 34px; overflow: hidden; cursor: zoom-in; background: var(--card); }
.ph-mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 900px) {
  .chk-row { grid-template-columns: 36px 1fr; }
  .chk-photos { grid-column: 2; grid-template-columns: 110px 110px; }
}

 "อุปกรณ์ สายรัดนิรภัย (Harness), รอก, สลิง, สลักล็อก (Carabiner) ได้มาตรฐานและผ่านการตรวจสภาพ", "ctx": "เครื่องเล่นปีนผา/สไลเดอร์: ชุด Harness & สลิง | สนามกีฬา: ตาข่าย/โครงโกล์", "law": "พ.ร.บ. ความปลอดภัยฯ พ.ศ. 2554 ม. 8 / มาตรฐานสากล EN/UIAA สำหรับอุปกรณ์ปีนผา"}, {"id": "3.9", "catIdx": 3, "text": "ปั๊มน้ำดับเพลิง / ปั๊มรักษาแรงดันแรงดันน้ำปกติเป็นไปตามมาตรฐาน พร้อมใช้งานไม่มีชำรุด อยู่ในโหมด Automatic", "ctx": "อาคารจอดรถ, อาคารเช่าร้านค้า, โครงการ BEAT Active/Discovery: ห้องปั๊มน้ำดับเพลิง (Fire Pump)", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับการป้องกันและระงับอัคคีภัย พ.ศ. 2555 / มาตรฐาน NFPA 20"}, {"id": "3.10", "catIdx": 3, "text": "ถังเก็บบรรจุน้ำดับเพลิงสำรองน้ำได้มากกว่า 30 นาทีตามกฎหมายกำหนด", "ctx": "อาคารจอดรถ, ศูนย์การค้า, อาคารเช่าส่วนกลาง: ถังเก็บน้ำสำรองดับเพลิง", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับการป้องกันและระงับอัคคีภัย พ.ศ. 2555 / พ.ร.บ. ควบคุมอาคาร พ.ศ. 2522"}, {"id": "4.1", "catIdx": 4, "text": "มีการทำความสะอาดและตรวจสอบระบบความปลอดภัยประจำวัน (Daily Safety Checklist)ตามห้องเครื่องจักรหลัก", "ctx": "พนักงานเช็คเครื่องเล่นทุกเช้าก่อนเปิดบริการ, ช่างเช็คตู้ไฟ/ปั๊มน้ำ, รปภ. ตรวจลานจอด", "law": "ระบบการจัดการความปลอดภัย ISO 45001 / ข้อกำหนดความปลอดภัยอาคาร"}, {"id": "4.2", "catIdx": 4, "text": "มีเอกสารประวัติการบำรุงรักษาเชิงป้องกัน (Preventive Maintenance - PM) ของระบบอาคาร/เครื่องเล่น หรือ เครื่องจักรหลัก", "ctx": "PM ระบบลิฟต์, PM เครื่องเล่น/ปั๊มน้ำ, PM ไฟสนาม, PM แขนกั้นจราจร", "law": "พ.ร.บ. ควบคุมอาคาร (การตรวจสอบอาคารและระบบวิศวกรรมประกอบอาคาร)"}, {"id": "4.3", "catIdx": 4, "text": "ถังน้ำประปาสามารถสำรองน้ำใช้มากกว่า 2 วัน", "ctx": "ทุกโครงการ: ถังน้ำประปาสำรองส่วนกลาง (สำรองน้ำใช้งานไม่น้อยกว่า 2 วัน)", "law": "พ.ร.บ. การสาธารณสุข พ.ศ. 2535 / เกณฑ์มาตรฐานวิศวกรรมสุขาภิบาล"}, {"id": "4.4", "catIdx": 4, "text": "ระบบไฟฟ้าสำรองมีการทดสอบทุกสัปดาห์และน้ำมันสำรอง มากกว่า 4 ชั่วโมง", "ctx": "ทุกโครงการ: เครื่องกำเนิดไฟฟ้าสำรอง (Generator) และน้ำมันดีเซลสำรอง", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับระบบไฟฟ้า พ.ศ. 2558 / มาตรฐาน EIT"}, {"id": "4.5", "catIdx": 4, "text": "ตัวเครื่องเล่น เครื่องจักร ปั๊มน้ำ ปั๊มลม ลมดันสไลเดอร์ มีฝาครอบป้องกันจุดหมุน (Safety Guard)", "ctx": "เจ็ตสกีจำลอง/สไลเดอร์: ปั๊มน้ำ/เครื่องสูบ | ร้านอาหาร: เครื่องบด/ปั่น | ลานจอด: แขนกั้น Barrier", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับเครื่องจักร ปั้นจั่น และหม้อน้ำ พ.ศ. 2564"}, {"id": "4.6", "catIdx": 4, "text": "มีปุ่มหยุดฉุกเฉิน (Emergency Stop / E-Stop) อยู่ในตำแหน่งที่กดได้ทันทีเมื่อเกิดเหตุ", "ctx": "เครื่องเล่นปีนผา/เจ็ตสกีจำลอง/สไลเดอร์ | ลานจอดรถ: แขนกั้นอัตโนมัติ | ลิฟต์อาคาร", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับเครื่องจักรฯ พ.ศ. 2564 หมวดปุ่มหยุดฉุกเฉิน"}, {"id": "4.7", "catIdx": 4, "text": "เบาะรองรับการตก (Crash Pad / Mat) หรือน้ำในสไลเดอร์ มีความหนา/ลึกเพียงพอตามมาตรฐาน", "ctx": "ผาจำลอง: เบาะรองตกหนาแน่น | สไลเดอร์/เจ็ตสกี: ระดับน้ำและกันชนข้าง", "law": "มาตรฐานความปลอดภัยเครื่องเล่นสนาม (มอก. 3000) / มาตรฐานความปลอดภัยสไลเดอร์สวนสนุก"}, {"id": "4.8", "catIdx": 4, "text": "มีการกำหนดนัยสำคัญเรื่องน้ำหนัก ส่วนสูง อายุ และจำนวนผู้เล่นต่อรอบอย่างชัดเจน", "ctx": "เครื่องเล่นปีนผา / สไลเดอร์ / เครื่องเล่นทางน้ำ / สไลเดอร์เด็ก", "law": "พ.ร.บ. ควบคุมอาคาร (เครื่องเล่นตามกฎกระทรวงควบคุมเครื่องเล่น พ.ศ. 2558)"}, {"id": "4.9", "catIdx": 4, "text": "มีป้ายและปฏิบัติตามมาตรการตัดแยกพลังงาน (Lockout/Tagout - LOTO) ขณะซ่อมบำรุงอุปกรณ์", "ctx": "การซ่อมบำรุงลิฟต์, ปั๊มน้ำสไลเดอร์, แขนกั้นลานจอดรถ, ไฟสนาม", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับเครื่องจักรฯ พ.ศ. 2564 หมวดการซ่อมบำรุง"}, {"id": "4.10", "catIdx": 4, "text": "ห้องน้ำส่วนกลาง Cleanliness สะอาด พื้นไม่ลื่น สุขภัณฑ์และพัดลมดูดอากาศทำงานปกติ", "ctx": "ทุกพื้นที่: ร้านอาหาร, สนามกีฬา, ลานจอดรถ, อาคารเช่า, โซนเครื่องเล่น", "law": "พ.ร.บ. การสาธารณสุข พ.ศ. 2535 / มาตรฐานห้องน้ำสาธารณะอาเซียน (HAS)"}, {"id": "5.1", "catIdx": 5, "text": "สารเคมี น้ำยาทำความสะอาด คลอรีน ปุ๋ยเคมี จัดเก็บมิดชิด มี SDS และถาดรองรับการรั่วไหล", "ctx": "ร้านต้นไม้: ปุ๋ย/ยาฆ่าแมลง | สไลเดอร์/เจ็ตสกี: คลอรีนน้ำ | ร้านอาหาร: น้ำยาล้างจาน", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับสารเคมีอันตราย พ.ศ. 2556 / พ.ร.บ. วัตถุอันตราย พ.ศ. 2535"}, {"id": "5.2", "catIdx": 5, "text": "ถังขยะมีการแยกประเภท มีฝาปิดมิดชิด จุดพักขยะสะอาด ไม่ส่งกลิ่นหรือเป็นแหล่งเชื้อโรค", "ctx": "ร้านอาหาร: ขยะเปียก/เศษอาหาร | ร้านต้นไม้: เศษกระถาง/ใบไม้ | ลานจอด: ขยะทั่วไป", "law": "พ.ร.บ. การสาธารณสุข พ.ศ. 2535 หมวดการจัดการสิ่งปฏิกูลและมูลฝอย"}, {"id": "5.3", "catIdx": 5, "text": "ระบบท่อน้ำทิ้ง ถังดักไขมัน (Grease Trap) ไม่บวมรั่ว ไม่มีน้ำท่วมขังหรือส่งกลิ่นเหม็น", "ctx": "ร้านอาหาร/ครัว: ถังดักไขมัน | ร้านต้นไม้: ทางระบายน้ำ | สไลเดอร์: ระบบกรองน้ำ", "law": "ข้อบัญญัติ กทม. / เทศบาล เรื่อง การบำบัดน้ำเสียและดักไขมันในสถานประกอบการอาหาร"}, {"id": "5.4", "catIdx": 5, "text": "คุณภาพน้ำใช้งาน/น้ำเล่นกีฬา/น้ำดื่ม ผ่านการตรวจวัดตามมาตรฐาน สะอาด ปลอดเชื้อโรค", "ctx": "เจ็ตสกีจำลอง/สไลเดอร์: คุณภาพน้ำ | ร้านอาหาร/สนามกีฬา: น้ำดื่มส่วนกลาง", "law": "ประกาศกระทรวงสาธารณสุข เรื่อง มาตรฐานน้ำบริโภค / มาตรฐานคุณภาพน้ำสระว่ายน้ำ"}, {"id": "5.5", "catIdx": 5, "text": "มีมาตรการควบคุมสัตว์พาหะนำโรค (Pest Control) เช่น หนู แมลงสาบ ยุง มด อย่างสม่ำเสมอ", "ctx": "ร้านอาหาร, ร้านขายต้นไม้, อาคารเช่าร้านค้า, โซนเครื่องเล่น", "law": "พ.ร.บ. การสาธารณสุข พ.ศ. 2535 หมวดสุขลักษณะของสถานที่จำหน่ายอาหาร"}, {"id": "5.6", "catIdx": 5, "text": "สภาพบ่อบำบัด ฝาปิดสนิท/ไม่มีกลิ่น / ระบบควบคุมทำงานปกติ / ค่าน้ำผ่านทุกค่าควบคุม", "ctx": "ทุกโครงการ: ระบบบำบัดน้ำเสียส่วนกลาง และบ่อดักไขมัน", "law": "พ.ร.บ. ส่งเสริมและรักษาคุณภาพสิ่งแวดล้อมแห่งชาติ พ.ศ. 2535 / พ.ร.บ. การสาธารณสุข พ.ศ. 2535"}, {"id": "6.1", "catIdx": 6, "text": "มีกล่อง/ตู้ปฐมพยาบาล (First Aid Kit) มียาสมุนไพร/เวชภัณฑ์ครบถ้วนและไม่หมดอายุ", "ctx": "ประจำเคาน์เตอร์ร้านค้า, คลับฮ้าส์กีฬา, ซุ้มเครื่องเล่น, ป้อม รปภ.", "law": "ประกาศกระทรวงแรงงาน เรื่อง จัดให้มีใบอนุญาตและอุปกรณ์ปฐมพยาบาลในสถานที่ทำงาน"}, {"id": "6.2", "catIdx": 6, "text": "มีเครื่องกระตุกหัวใจไฟฟ้าอัตโนมัติ (AED) อยู่ในจุดที่เข้าถึงง่าย พร้อมใช้งานตลอดเวลา", "ctx": "โซนกีฬา (แบด/เทนนิส), โซนเครื่องเล่นเสี่ยงสูง, อาคารส่วนกลาง, ลานจอดรถ", "law": "คำแนะนำสถาบันการแพทย์ฉุกเฉินแห่งชาติ (สพฉ.) / ประกาศกระทรวงสาธารณสุข"}, {"id": "6.3", "catIdx": 6, "text": "มีอุปกรณ์กู้ภัยเฉพาะทางประจำพื้นที่ (เช่น ห่วงยางกู้ภัย, ไม้สไลด์, บอร์ดดามหลัง)", "ctx": "เครื่องเล่นเจ็ตสกี/สไลเดอร์/ผาจำลอง: อุปกรณ์เซฟตี้กู้ภัยทางน้ำ/ทางสูง", "law": "พ.ร.บ. ควบคุมอาคาร (กฎกระทรวงควบคุมเครื่องเล่น พ.ศ. 2558) / มาตรฐานกู้ภัย"}, {"id": "6.4", "catIdx": 6, "text": "มีเบอร์โทรศัพท์สายด่วนฉุกเฉิน (Emergency Contact) ปิดแสดงในจุดที่เห็นชัดเจน", "ctx": "ติดประจำเคาน์เตอร์บริการ, จุดขายตั๋วเครื่องเล่น, ป้อม รปภ., ห้องควบคุม", "law": "แนวปฏิบัติระบบการจัดการความปลอดภัย อาชีวอนามัย (TOSH / ISO 45001)"}, {"id": "6.5", "catIdx": 6, "text": "มีพื้นที่จุดปฐมพยาบาลเบื้องต้น (First Aid Room/Corner) ที่เป็นสัดส่วนและสะอาด", "ctx": "โซนเครื่องเล่นกิจกรรม, สนามกีฬา, อาคารเช่าส่วนกลาง", "law": "ประกาศกระทรวงแรงงาน เรื่อง สวัสดิการในสถานประกอบการ"}, {"id": "6.6", "catIdx": 6, "text": "เจ้าหน้าที่ประจำพื้นที่ผ่านการอบรมการปฐมพยาบาลเบื้องต้นและการทำ CPR/AED", "ctx": "พนักงานควบคุมเครื่องเล่น, โค้ช/เจ้าหน้าที่สนาม, รปภ., เจ้าหน้าที่อาคาร", "law": "พ.ร.บ. ความปลอดภัย อาชีวอนามัยฯ พ.ศ. 2554 ม. 16 (การฝึกอบรมความปลอดภัย)"}, {"id": "6.7", "catIdx": 6, "text": "มีแผนและการซ้อมแผนความเสี่ยงภัยพิบัติ น้ำท่วม / พายุรุนแรง / สารเคมีรั่วไหล / แผ่นดินไหว ทุกปีหรือตามความเหมาะสม", "ctx": "ทุกโครงการ: แผนรับมือภัยพิบัติธรรมชาติ (น้ำท่วม/พายุ/แผ่นดินไหว/สารเคมี)", "law": "พ.ร.บ. ป้องกันและบรรเทาสาธารณภัย พ.ศ. 2550 / แนวปฏิบัติตาม ISO 45001"}, {"id": "6.8", "catIdx": 6, "text": "มีการซ้อมแผนฉุกเฉิน เป็นไปตามแผนและทุกคนมีส่วนร่วม", "ctx": "ทุกโครงการ: การซ้อมแผนฉุกเฉินและอพยพหนีไฟประจำปี", "law": "กฎกระทรวง กำหนดมาตรฐานเกี่ยวกับการป้องกันและระงับอัคคีภัย พ.ศ. 2555 ข้อ 28-30"}, {"id": "7.1", "catIdx": 7, "text": "ผู้รับเหมาภายนอกมีการขออนุญาตทำงานเสี่ยง (Permit to Work) ก่อนเข้าปฏิบัติงาน", "ctx": "การซ่อมบำรุงบนที่สูง, งานเชื่อมไฟฟ้า, งานตกแต่งร้านค้าผู้เช่า, งานระบบไฟ", "law": "พ.ร.บ. ความปลอดภัยฯ พ.ศ. 2554 ม. 14 / แนวปฏิบัติการควบคุมงานเสี่ยง (High Risk Work)"}, {"id": "7.2", "catIdx": 7, "text": "พื้นที่ก่อสร้างหรือปรับปรุง มีป้ายโครงการ ระบุวันเริ่ม/เสร็จ ผู้รับผิดชอบ ชัดเจน", "ctx": "พื้นที่ที่มีการปรับปรุง/ก่อสร้าง: ป้ายชื่อโครงการ ระบุวันเริ่ม-เสร็จ และผู้ควบคุมงาน", "law": "พ.ร.บ. ควบคุมอาคาร พ.ศ. 2522 / พ.ร.บ. ความปลอดภัยฯ พ.ศ. 2554 ม. 14"}, {"id": "7.3", "catIdx": 7, "text": "พื้นที่ก่อสร้างหรือปรับปรุง มีป้ายแสดงความปลอดภัย และ PPE ตามกำหนด", "ctx": "พื้นที่ก่อสร้าง/ปรับปรุง: ป้ายเตือนความปลอดภัย และข้อบังคับการสวมใส่ PPE", "law": "ประกาศกรมสวัสดิการและคุ้มครองแรงงาน เรื่อง เครื่องหมายความปลอดภัย / พ.ร.บ. ความปลอดภัยฯ ม. 22"}, {"id": "7.4", "catIdx": 7, "text": "พื้นที่ก่อสร้างหรือปรับปรุง มีการประเมินความเสี่ยง PCRA & ICRA และปฎิบัติตามอย่างเคร่งครัด", "ctx": "พื้นที่ก่อสร้าง/ปรับปรุง: เอกสารประเมินความเสี่ยง PCRA & ICRA ก่อนเริ่มงาน", "law": "แนวปฏิบัติความปลอดภัยงานก่อสร้าง / พ.ร.บ. ความปลอดภัย อาชีวอนามัยฯ พ.ศ. 2554"}, {"id": "7.5", "catIdx": 7, "text": "พื้นที่ก่อสร้างหรือปรับปรุง มีอบรมผู้รับเหมาก่อนทำงาน", "ctx": "พื้นที่ก่อสร้าง/ปรับปรุง: บันทึกการอบรม Safety Orientation ผู้รับเหมาก่อนเข้าทำงาน", "law": "พ.ร.บ. ความปลอดภัย อาชีวอนามัยฯ พ.ศ. 2554 ม. 16 (การฝึกอบรมความปลอดภัย)"}, {"id": "7.6", "catIdx": 7, "text": "พื้นที่ก่อสร้างหรือปรับปรุง มีการเดินตรวจสอบความปลอดภัยโดยผู้ควบคุมงาน", "ctx": "พื้นที่ก่อสร้าง/ปรับปรุง: สมุดบันทึกการตรวจความปลอดภัยประจำวันโดยผู้ควบคุมงาน (Safety Walk)", "law": "พ.ร.บ. ความปลอดภัย อาชีวอนามัยฯ พ.ศ. 2554 ม. 14 / แนวปฏิบัติการควบคุมงานก่อสร้าง"}, {"id": "8.1", "catIdx": 8, "text": "มีระบบการรับแจ้งข้อร้องเรียน/อุบัติเหตุ (Incident Report) และการวิเคราะห์หาสาเหตุป้องกันซ้ำ", "ctx": "บันทึกเมื่อเกิดเหตุคนลื่นล้ม, อุปกรณ์ชำรุด, หรือเครื่องเล่นติดขัด", "law": "ประกาศกระทรวงแรงงาน เรื่อง การรายงานอุบัติเหตุและการประสบอันตรายจากการทำงาน"}, {"id": "8.2", "catIdx": 8, "text": "อาคารผ่านการรับรองความปลอดภัยจากทางราชการหรือองค์กรหน่วยงานภายนอกรับรอง", "ctx": "ทุกโครงการ: ใบอนุญาตประกอบอาคาร (อ.1/อ.6), ใบรับรองการตรวจสอบอาคารประจำปี", "law": "พ.ร.บ. ควบคุมอาคาร พ.ศ. 2522 ม. 32 / กฎกระทรวงกำหนดประเภทอาคารที่ต้องตรวจ พ.ศ. 2548"}, {"id": "8.3", "catIdx": 8, "text": "ไม่มีข้อร้องเรียนจากผู้อยู่อาศัยรอบๆหรือชุมชน ได้รับการสนับสนุนเป็นอย่างดีและเข้าร่วมกับชุมชนอย่างต่อเนื่อง", "ctx": "ทุกโครงการ: ช่องทางรับข้อร้องเรียนชุมชนรอบข้าง (CSR/CRM) และบันทึกการแก้ไข", "law": "พ.ร.บ. การสาธารณสุข พ.ศ. 2535 หมวดเหตุรำคาญ / แนวปฏิบัติด้านสิ่งแวดล้อม QSHE"}];

/**
 * storage.js
 * Thin wrapper around localStorage so the rest of the app never touches
 * localStorage directly. Swap this file's internals for a real backend
 * (REST/API) later without changing app.js call sites.
 */

const DB_PREFIX = "qshe_";

const DB = {
  _key(name) {
    return DB_PREFIX + name;
  },
  get(name, fallback) {
    try {
      const raw = localStorage.getItem(this._key(name));
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      console.error("DB.get failed for", name, e);
      return fallback;
    }
  },
  set(name, value) {
    try {
      localStorage.setItem(this._key(name), JSON.stringify(value));
      return true;
    } catch (e) {
      console.error("DB.set failed for", name, e);
      return false;
    }
  },
  ensureSeeded() {
    if (this.get("users", null) === null) this.set("users", SEED.users);
    if (this.get("buildings", null) === null) this.set("buildings", SEED.buildings);
    if (this.get("processStatus", null) === null) this.set("processStatus", SEED.processStatus);
    if (this.get("okrs", null) === null) this.set("okrs", SEED.okrs);
    if (this.get("kpis", null) === null) this.set("kpis", SEED.kpis);
    if (this.get("capas", null) === null) this.set("capas", SEED.capas);
    if (this.get("mpPlans", null) === null) this.set("mpPlans", SEED.mpPlans);
    if (this.get("mpUnits", null) === null) this.set("mpUnits", SEED.mpUnits);
    if (this.get("mpScores", null) === null) this.set("mpScores", SEED.mpScores);
  },
  resetAll() {
    ["users", "buildings", "processStatus", "okrs", "kpis", "capas", "mpPlans", "mpUnits", "mpScores", "session"].forEach((k) =>
      localStorage.removeItem(this._key(k))
    );
    this.ensureSeeded();
  }
};

/**
 * auth.js
 * Minimal client-side auth for a static/local deployment.
 *
 * SECURITY NOTE: this checks the username/password against a list stored in
 * the browser's localStorage. It is meant for an internal, trusted-network
 * prototype (e.g. an intranet kiosk or a single-team tool), NOT for
 * production use with sensitive data on the public internet — anyone with
 * browser dev tools can read localStorage. Wire this up to a real backend
 * (API + hashed passwords + sessions) before using it beyond a demo.
 */

const Auth = {
  currentUser() {
    return DB.get("session", null);
  },
  login(username, password) {
    const users = DB.get("users", []);
    const match = users.find(
      (u) => u.username.toLowerCase() === String(username).trim().toLowerCase() && u.password === password
    );
    if (!match) return { ok: false, error: "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง" };
    if (match.status === "pending") {
      return { ok: false, error: "บัญชีนี้ยังรอการอนุมัติจากผู้ดูแลระบบ กรุณาติดต่อผู้ดูแลระบบ" };
    }
    const session = { id: match.id, username: match.username, name: match.name, role: match.role, buildingIds: match.buildingIds };
    DB.set("session", session);
    return { ok: true, user: session };
  },
  register({ username, password, name, buildingId }) {
    username = String(username || "").trim();
    name = String(name || "").trim();
    if (!username || !password || !name) return { ok: false, error: "กรุณากรอกข้อมูลให้ครบถ้วน" };
    const users = DB.get("users", []);
    if (users.some((u) => u.username.toLowerCase() === username.toLowerCase())) {
      return { ok: false, error: "มีชื่อผู้ใช้นี้อยู่แล้วในระบบ" };
    }
    users.push({
      id: uid("u"),
      username,
      password,
      name,
      role: "pending",
      status: "pending",
      buildingIds: buildingId ? [buildingId] : []
    });
    DB.set("users", users);
    return { ok: true };
  },
  logout() {
    localStorage.removeItem(DB_PREFIX + "session");
  },
  isAdmin(user) {
    return !!user && user.role === "admin";
  },
  canAccessBuilding(user, buildingId) {
    if (!user) return false;
    if (user.buildingIds.includes("ALL")) return true;
    return user.buildingIds.includes(buildingId);
  }
};

/**
 * export.js
 * CSV export (works everywhere, opens cleanly in Excel/Sheets) and a
 * print-friendly report view (browser's native "Save as PDF" via print).
 */

const ExportUtil = {
  toCSV(rows, headers) {
    const esc = (v) => {
      if (v === null || v === undefined) return "";
      const s = String(v).replace(/"/g, '""');
      return /[",\n]/.test(s) ? `"${s}"` : s;
    };
    const lines = [];
    lines.push(headers.map((h) => esc(h.label)).join(","));
    rows.forEach((row) => {
      lines.push(headers.map((h) => esc(row[h.key])).join(","));
    });
    // BOM so Thai text opens correctly in Excel
    return "\uFEFF" + lines.join("\r\n");
  },
  download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  exportCSV(rows, headers, filename) {
    const csv = this.toCSV(rows, headers);
    this.download(filename.endsWith(".csv") ? filename : filename + ".csv", csv);
  },
  printSection(html, title) {
    const win = window.open("", "_blank", "width=900,height=1000");
    win.document.write(`
      <html lang="th">
      <head>
        <meta charset="utf-8" />
        <title>${title}</title>
        <style>
          body { font-family: 'IBM Plex Sans Thai', sans-serif; padding: 32px; color:#1a1a1a; }
          h1 { font-size: 20px; color:#12492F; border-bottom:2px solid #1F7A4D; padding-bottom:8px; }
          table { width:100%; border-collapse: collapse; margin-top:16px; }
          th, td { border:1px solid #ccc; padding:6px 10px; font-size:13px; text-align:left; }
          th { background:#1F7A4D; color:#fff; }
          tr:nth-child(even) td { background:#f3f8f5; }
          .meta { color:#666; font-size:12px; margin-bottom:4px; }
        </style>
      </head>
      <body>${html}</body>
      </html>
    `);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);
  }
};

// --------------------------------------------------- scoring engine ---
function mpItemsOfCat(catId) {
  return MP_ITEMS.filter((i) => i.catIdx === catId);
}
function mpRecord(unitId) {
  return DB.get("mpScores", []).find((r) => r.unitId === unitId) || null;
}
function mpSaveRecord(rec) {
  const all = DB.get("mpScores", []);
  const idx = all.findIndex((r) => r.unitId === rec.unitId);
  if (idx >= 0) all[idx] = rec; else all.push(rec);
  DB.set("mpScores", all);
}
/** Stats for a list of unit ids (pooled). */
function mpStats(unitIds) {
  const recs = DB.get("mpScores", []).filter((r) => unitIds.includes(r.unitId));
  const cats = MP_CATEGORIES.map((c) => ({
    id: c.id, th: c.th, en: c.en, total: mpItemsOfCat(c.id).length * unitIds.length,
    assessed: 0, na: 0, sum: 0, max: 0, pct: null,
    risk: { critical: 0, high: 0, medium: 0, low: 0 }
  }));
  const perUnit = {};
  unitIds.forEach((u) => { perUnit[u] = { assessed: 0, sum: 0, max: 0 }; });
  const issues = [];
  recs.forEach((rec) => {
    MP_ITEMS.forEach((it) => {
      const v = (rec.scores || {})[it.id];
      const c = cats[it.catIdx - 1];
      if (v === "na") { c.na++; return; }
      if (typeof v !== "number") return;
      c.assessed++; c.sum += v; c.max += 5;
      const rk = v <= 1 ? "critical" : v <= 2 ? "high" : v <= 3 ? "medium" : "low";
      c.risk[rk]++;
      perUnit[rec.unitId].assessed++; perUnit[rec.unitId].sum += v; perUnit[rec.unitId].max += 5;
      if (rk === "critical" || rk === "high") issues.push({ unitId: rec.unitId, item: it, score: v, risk: rk, note: (rec.notes || {})[it.id] || "" });
    });
  });
  cats.forEach((c) => { c.pct = c.max ? (c.sum / c.max) * 100 : null; });
  const sum = cats.reduce((a, c) => a + c.sum, 0);
  const max = cats.reduce((a, c) => a + c.max, 0);
  const risk = { critical: 0, high: 0, medium: 0, low: 0 };
  cats.forEach((c) => MP_RISK.forEach((r) => { risk[r.id] += c.risk[r.id]; }));
  Object.keys(perUnit).forEach((u) => { const p = perUnit[u]; p.pct = p.max ? (p.sum / p.max) * 100 : null; });
  issues.sort((a, b) => a.score - b.score);
  return {
    cats, perUnit, risk, issues, sum, max,
    assessed: cats.reduce((a, c) => a + c.assessed, 0),
    total: MP_ITEMS.length * unitIds.length,
    pct: max ? (sum / max) * 100 : null
  };
}
const mpFmtPct = (p) => (p === null ? "–" : p.toFixed(1) + "%");

function mpWireTips(root) {
  let tip = document.getElementById("mp-tip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "mp-tip";
    tip.className = "mp-tip";
    tip.setAttribute("role", "tooltip");
    document.body.appendChild(tip);
  }
  const hide = () => { tip.style.display = "none"; };
  root.addEventListener("mouseover", (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el || !root.contains(el)) return hide();
    tip.textContent = el.dataset.tip;
    tip.style.display = "block";
  });
  root.addEventListener("mousemove", (e) => {
    if (tip.style.display !== "block") return;
    const w = tip.offsetWidth;
    let x = e.clientX + 14;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = e.clientY + 16 + "px";
  });
  root.addEventListener("mouseout", (e) => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest("[data-tip]")) hide(); });
  root.addEventListener("mouseleave", hide);
}

function openMpPlanForm(id) {
  const ex = id ? DB.get("mpPlans", []).find((p) => p.id === id) : null;
  const v = ex || { step: "", detail: "", location: "", owner: "", start: todayISO(), end: todayISO(), status: "todo" };
  const modal = openModal(`
    <h3>${ex ? mt("แก้ไขแผนงาน", "Edit plan") : mt("เพิ่มแผนงาน", "Add plan")}</h3>
    <div class="field"><label>${mt("ขั้นตอนหลัก / ชื่อแผน", "Key step / plan name")} *</label><input type="text" id="f-step" value="${mpEsc(v.step.trim())}" /></div>
    <div class="field"><label>${mt("กิจกรรมย่อย / รายละเอียด", "Activities / details")}</label><textarea id="f-detail" rows="3">${mpEsc(v.detail)}</textarea></div>
    <div class="field"><label>${mt("พื้นที่เป้าหมาย", "Target location")}</label><textarea id="f-loc" rows="2">${mpEsc(v.location)}</textarea></div>
    <div class="form-row">
      <div class="field"><label>${mt("ผู้รับผิดชอบ", "Owner")}</label><input type="text" id="f-owner" value="${mpEsc(v.owner)}" /></div>
      <div class="field"><label>${mt("สถานะ", "Status")}</label><select id="f-status">${MP_PLAN_STATUS.map((s) => `<option value="${s.id}" ${v.status === s.id ? "selected" : ""}>${mt(s.th, s.en)}</option>`).join("")}</select></div>
    </div>
    <div class="form-row">
      <div class="field"><label>${mt("วันที่เริ่ม", "Start date")}</label><input type="date" id="f-start" value="${v.start}" /></div>
      <div class="field"><label>${mt("วันที่สิ้นสุด", "End date")}</label><input type="date" id="f-end" value="${v.end}" /></div>
    </div>
    <div class="actions"><button class="btn ghost" id="f-cancel">${mt("ยกเลิก", "Cancel")}</button><button class="btn" id="f-save">${mt("บันทึก", "Save")}</button></div>
  `);
  modal.querySelector("#f-cancel").addEventListener("click", closeModal);
  modal.querySelector("#f-save").addEventListener("click", () => {
    const step = modal.querySelector("#f-step").value.trim();
    const start = modal.querySelector("#f-start").value;
    const end = modal.querySelector("#f-end").value;
    if (!step) return alert(mt("กรุณากรอกชื่อแผน", "Please enter a plan name"));
    if (!start || !end || end < start) return alert(mt("วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม", "End date must not be before start date"));
    const next = {
      id: ex ? ex.id : uid("mpp"), step,
      detail: modal.querySelector("#f-detail").value.trim(),
      location: modal.querySelector("#f-loc").value.trim(),
      owner: modal.querySelector("#f-owner").value.trim(),
      status: modal.querySelector("#f-status").value, start, end
    };
    const all = DB.get("mpPlans", []);
    if (ex) all[all.findIndex((p) => p.id === ex.id)] = next; else all.push(next);
    DB.set("mpPlans", all);
    closeModal();
    toast(mt("บันทึกแล้ว", "Saved"));
    renderMpPlan(document.getElementById("view-root"));
  });
}

// ===================================================== 2. RISK SUMMARY ===
const MpRiskUI = { scope: "ALL", table: false };

function mpBar(label, pct, tip, cls) {
  const st = mpStatusOf(pct);
  return `<div class="bar-row">
    <div class="bar-label">${label}</div>
    <div class="bar-track" data-tip="${mpEsc(tip)}" tabindex="0">
      ${pct === null ? "" : `<div class="bar-fill" style="width:${Math.max(pct, 0.8).toFixed(1)}%;background:var(--st-${cls || st.cls});"></div>`}
      <span class="thr" style="left:70%"></span><span class="thr" style="left:85%"></span>
    </div>
    <div class="bar-val">${mpFmtPct(pct)}</div>
    <div class="bar-st">${pct === null ? `<span class="st-chip muted">${mt("ยังไม่ประเมิน", "Not assessed")}</span>` : mpChip(st)}</div>
  </div>`;
}
function mpBarAxis() {
  return `<div class="bar-row axis"><div class="bar-label"></div><div class="bar-track axis-t">
    <span style="left:0">0</span><span style="left:70%">70</span><span style="left:85%">85</span><span style="left:100%">100%</span></div><div class="bar-val"></div><div class="bar-st"></div></div>`;
}
function mpCatName(c) {
  return `${c.id}. ${mt(c.th, c.en)}`;
}

function renderMpRisk(root) {
  const units = DB.get("mpUnits", []);

  const ids = scoped.map((u) => u.id);
  const S = mpStats(ids);
  const recs = DB.get("mpScores", []);
  const demo = recs.some((r) => r.demo && ids.includes(r.unitId));
  const scopeName = MpRiskUI.scope === "ALL" ? mt("ทุกหน่วยงาน (รวม)", "All units (pooled)") : scoped[0].name;
  const overall = mpOverallStatusOf(S.pct);
  const unitName = (id) => (units.find((u) => u.id === id) || {}).name || id;

  const toolbar = `
    <div class="toolbar">
      <div class="filters">
        <select id="mp-risk-scope">

      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" id="mp-risk-csv">${mt("ส่งออก CSV", "Export CSV")}</button>
        <button class="btn" id="mp-risk-print">${mt("พิมพ์ / PDF", "Print / PDF")}</button>
      </div>
    </div>`;

  if (!S.assessed) {
    root.innerHTML = toolbar + `<div class="card empty-state">
      <div style="font-size:15px;margin-bottom:6px;">${mt("ยังไม่มีคะแนนการตรวจประเมินของ", "No inspection scores yet for")} <strong>${mpEsc(scopeName)}</strong></div>
      <div style="margin-bottom:14px;">${mt("กรอกคะแนนในหน้า Risk Assessment Checklist แล้วกราฟและระดับความเสี่ยงจะแสดงที่นี่อัตโนมัติ", "Score items in the Risk Assessment Checklist and charts + risk levels will appear here automatically.")}</div>

    </div>`;
    bindMpRiskCommon(root);
    return;
  }

  const riskTotal = S.risk.critical + S.risk.high + S.risk.medium + S.risk.low;
  const catBars = S.cats.map((c) =>
    mpBar(mpCatName(c), c.pct, `${mpCatName(c)}\n${mt("คะแนน", "Score")} ${c.sum}/${c.max} (${mpFmtPct(c.pct)}) · ${c.assessed} ${mt("ข้อที่ประเมิน", "items assessed")}`)
  ).join("");

  const stackRows = S.cats.map((c) => {
    const n = c.assessed;
    const segs = MP_RISK.map((r) => {
      const k = c.risk[r.id];
      if (!k) return "";
      return `<div class="seg" style="flex:${k};background:${mpRiskColor(r.id)};" data-tip="${mpEsc(mpCatName(c))}\n${r.icon} ${mpRiskLabel(r.id)}: ${k} ${mt("ข้อ", "items")} (${((k / n) * 100).toFixed(0)}%)">${k >= 2 ? `<b>${k}</b>` : ""}</div>`;
    }).join("");
    return `<div class="bar-row stack-row"><div class="bar-label">${mpCatName(c)}</div>
      <div class="stack-track">${n ? segs : `<span class="muted-s">${mt("ยังไม่ประเมิน", "Not assessed")}</span>`}</div>
      <div class="bar-val">${n} ${mt("ข้อ", "items")}</div></div>`;
  }).join("");

  const compareHtml = MpRiskUI.scope === "ALL" && units.length > 1
    ? `<div class="card"><h3>${mt("เปรียบเทียบหน่วยงาน", "Unit comparison")}</h3>
        <div class="desc">${mt("คะแนนรวมแต่ละหน่วยงาน เรียงจากมากไปน้อย (เส้นที่ 70% และ 85% คือเกณฑ์)", "Overall score per unit, highest first (lines mark the 70% and 85% thresholds)")}</div>

          const p = S.perUnit[u.id];
          return mpBar(mpEsc(u.name), p.pct, `${u.name}\n${mt("คะแนน", "Score")} ${p.sum}/${p.max} · ${p.assessed}/${MP_ITEMS.length} ${mt("ข้อ", "items")}`);
        }).join("")}</div>`
    : "";

  const issues = S.issues.slice(0, 15);
  const issueHtml = `<div class="card"><h3>${mt("รายการเสี่ยงสูงที่ต้องแก้ไขก่อน", "Highest-risk items to fix first")}</h3>
    <div class="desc">${S.issues.length ? mt(`พบ ${S.issues.length} ข้อที่เสี่ยงระดับวิกฤต/สูง (แสดง ${issues.length} ข้อแรก เรียงจากคะแนนต่ำสุด)`, `${S.issues.length} items rated Critical/High (showing the first ${issues.length}, lowest score first)`) : mt("ไม่พบข้อที่เสี่ยงระดับวิกฤตหรือสูง", "No Critical or High risk items")}</div>
    ${S.issues.length ? `<div class="mp-scroll"><table><thead><tr><th>${mt("หน่วยงาน", "Unit")}</th><th>${mt("ข้อ", "Item")}</th><th>${mt("รายการตรวจ", "Checklist item")}</th><th>${mt("คะแนน", "Score")}</th><th>${mt("ระดับ", "Risk")}</th><th>${mt("ข้อสังเกต", "Note")}</th><th>${mt("รูป", "Photos")}</th></tr></thead><tbody>
      ${issues.map((x) => `<tr><td>${mpEsc(unitName(x.unitId))}</td><td>${x.item.id}</td><td>${mpEsc(x.item.text)}</td><td>${x.score}/5</td><td>${mpRiskChip(x.risk)}</td><td>${mpEsc(x.note) || "–"}</td><td class="ph-cell" data-ph-unit="${x.unitId}" data-ph-item="${x.item.id}"></td></tr>`).join("")}
    </tbody></table></div>` : ""}</div>`;

  const tableHtml = `<div class="card"><h3>${mt("ตารางสรุปตามหมวด", "Summary by category")}</h3>
    <div class="mp-scroll"><table><thead><tr><th>${mt("หมวดหมู่การตรวจประเมิน", "Category")}</th><th>${mt("ข้อที่ประเมิน", "Assessed")}</th><th>${mt("คะแนนเต็มรวม", "Max")}</th><th>${mt("คะแนนที่ได้", "Score")}</th><th>%</th>${MP_RISK.map((r) => `<th>${r.icon} ${mt(r.th, r.en)}</th>`).join("")}<th>${mt("สถานะ", "Status")}</th></tr></thead><tbody>
    ${S.cats.map((c) => `<tr><td>${mpCatName(c)}</td><td>${c.assessed}/${c.total}</td><td>${c.max}</td><td>${c.sum}</td><td>${mpFmtPct(c.pct)}</td>${MP_RISK.map((r) => `<td>${c.risk[r.id]}</td>`).join("")}<td>${mpChip(mpStatusOf(c.pct))}</td></tr>`).join("")}
    <tr class="total-row"><td><strong>${mt("รวมทั้งสิ้น", "Total")}</strong></td><td>${S.assessed}/${S.total}</td><td>${S.max}</td><td>${S.sum}</td><td><strong>${mpFmtPct(S.pct)}</strong></td>${MP_RISK.map((r) => `<td>${S.risk[r.id]}</td>`).join("")}<td>${mpChip(overall)}</td></tr>
    </tbody></table></div></div>`;

  root.innerHTML = toolbar + (demo ? `<div class="mp-banner">ⓘ ${mt("กำลังแสดงคะแนนตัวอย่าง (Demo) ไม่ใช่ผลตรวจจริง – แก้ไขคะแนนในหน้า Checklist เพื่อแทนที่", "Showing demo scores, not real inspection results – edit scores in the Checklist to replace them")}</div>` : "") + `
    <div class="grid cols-4" style="margin-bottom:14px;">
      <div class="stat-card"><div class="label">${mt("คะแนนรวม", "Overall score")} · ${mpEsc(scopeName)}</div><div class="value">${mpFmtPct(S.pct)}</div><div class="sub">${S.sum}/${S.max} ${mt("คะแนน", "pts")}</div></div>
      <div class="stat-card"><div class="label">${mt("ระดับการประเมินภาพรวม", "Overall rating")}</div><div class="value" style="font-size:15px;line-height:1.5;padding-top:6px;">${mpChip(overall)}</div></div>
      <div class="stat-card"><div class="label">${mt("ข้อที่ประเมินแล้ว", "Items assessed")}</div><div class="value">${S.assessed}<span style="font-size:15px;color:var(--muted);">/${S.total}</span></div><div class="sub">${Math.round((S.assessed / S.total) * 100)}%</div></div>
      <div class="stat-card"><div class="label">${mt("ข้อเสี่ยงวิกฤต + สูง", "Critical + High items")}</div><div class="value">${S.risk.critical + S.risk.high}</div><div class="sub">${mt("วิกฤต", "Critical")} ${S.risk.critical} · ${mt("สูง", "High")} ${S.risk.high}</div></div>
    </div>
    ${MpRiskUI.table ? tableHtml : `
    <div class="card"><h3>${mt("คะแนนตามหมวดหมู่ (% เทียบเกณฑ์)", "Score by category (% vs thresholds)")}</h3>
      <div class="desc">${mt("เส้นที่ 70% = เกณฑ์ขั้นต่ำ, 85% = ดีมาก", "Lines at 70% = minimum, 85% = very good")}</div>
      ${mpBarAxis()}${catBars}
    </div>

/** thumbnails (before / after) in the risk-items table, loaded from IndexedDB */
function mpFillIssuePhotos(root) {
  const cells = [...root.querySelectorAll(".ph-cell")];
  if (!cells.length || !MpImg.available()) return;
  const cache = {};
  const unitIds = [...new Set(cells.map((c) => c.dataset.phUnit))];
  Promise.all(unitIds.map((u) => MpImg.forUnit(u).then((all) => { cache[u] = all; }))).then(() => {
    cells.forEach((c) => {
      const all = cache[c.dataset.phUnit] || {};
      c.innerHTML = [1, 2].map((n) => {
        const d = all[c.dataset.phItem + "|" + n];
        return d ? `<button type="button" class="ph-mini" data-full="${n}" title="${mt(MP_PHOTO_LABEL[n].th, MP_PHOTO_LABEL[n].en)} (${mt(MP_PHOTO_LABEL[n].sub.th, MP_PHOTO_LABEL[n].sub.en)})"><img src="${d}" alt="" /></button>` : "";
      }).join("") || "–";
      c.querySelectorAll(".ph-mini").forEach((b) => b.addEventListener("click", () => mpShowPhoto(b.querySelector("img").src, `${c.dataset.phItem} · ${mt(MP_PHOTO_LABEL[b.dataset.full].th, MP_PHOTO_LABEL[b.dataset.full].en)}`)));
    });
  }).catch(() => {});
}

function bindMpRiskCommon(root) {
  mpWireTips(root);
  const sc = document.getElementById("mp-risk-scope");
  if (sc) sc.addEventListener("change", () => { MpRiskUI.scope = sc.value; renderMpRisk(root); });
  const vw = document.getElementById("mp-risk-view");
  if (vw) vw.addEventListener("click", () => { MpRiskUI.table = !MpRiskUI.table; renderMpRisk(root); });
  mpToolbarExport("mp-risk-csv", "mpSummary", "QSHE_Inspection_Risk_Summary");
  const pr = document.getElementById("mp-risk-print");
  if (pr) pr.addEventListener("click", () => {
    const units = DB.get("mpUnits", []);
    const ids = MpRiskUI.scope === "ALL" ? units.map((u) => u.id) : [MpRiskUI.scope];
    const S = mpStats(ids);
    const nm = MpRiskUI.scope === "ALL" ? "ทุกหน่วยงาน (รวม)" : (units.find((u) => u.id === MpRiskUI.scope) || {}).name;
    const html = `<div class="meta">PSD eNGINNo QSHE Management — Inspection Risk Summary</div>
      <h1>สรุปผลการตรวจประเมินความปลอดภัย — ${mpEsc(nm)}</h1>
      <div class="meta">วันที่จัดทำ: ${todayISO()} | คะแนนรวม ${mpFmtPct(S.pct)} | ข้อเสี่ยงวิกฤต ${S.risk.critical} / สูง ${S.risk.high}</div>
      <table><thead><tr><th>หมวดหมู่</th><th>ข้อที่ประเมิน</th><th>คะแนน</th><th>%</th><th>สถานะ</th></tr></thead><tbody>
      ${S.cats.map((c) => { const st = mpStatusOf(c.pct); return `<tr><td>${c.id}. ${c.th} (${c.en})</td><td>${c.assessed}/${c.total}</td><td>${c.sum}/${c.max}</td><td>${mpFmtPct(c.pct)}</td><td>${st ? st.icon + " " + st.th : "ยังไม่ประเมิน"}</td></tr>`; }).join("")}
      </tbody></table>`;
    ExportUtil.printSection(html, "QSHE Inspection Risk Summary");
  });
  const go = document.getElementById("mp-go-check");
  if (go) go.addEventListener("click", () => navigate("mp_check"));
  const dm = document.getElementById("mp-load-demo");
  if (dm) dm.addEventListener("click", () => {
    mpLoadDemo();
    toast(mt("สร้างคะแนนตัวอย่างแล้ว", "Demo scores created"));
    renderMpRisk(root);
  });
}

/** Deterministic demo scores for units that have none (flagged demo:true). */
function mpLoadDemo() {
  const units = DB.get("mpUnits", []);
  const bias = [4.3, 3.6, 4.0, 3.1, 3.8];
  units.forEach((u, ui) => {
    if (mpRecord(u.id)) return;
    let seed = 7 + ui * 13;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const scores = {};
    MP_ITEMS.forEach((it) => {
      const r = rnd();
      if (r < 0.04) { scores[it.id] = "na"; return; }
      let v = Math.round(bias[ui % bias.length] + (rnd() - 0.5) * 3.2 - (it.catIdx === 3 && ui === 3 ? 0.8 : 0));
      scores[it.id] = Math.min(5, Math.max(1, v));
    });
    mpSaveRecord({ unitId: u.id, date: todayISO(), inspector: "(demo)", scores, notes: {}, demo: true });
  });
}

// ------------------------------------------------ photo store (IndexedDB) ---
// Photos (2 per checklist item: 1 = finding / before, 2 = after correction) are
// compressed in the browser and kept in IndexedDB, not localStorage (size limit).
const MpImg = {
  _db: null,
  available() { return typeof indexedDB !== "undefined" && !!indexedDB; },
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("qshe_images", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("img", { keyPath: "key" });
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error);
    });
  },
  _tx(mode, fn) {
    return this.open().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction("img", mode);
      const st = tx.objectStore("img");
      const out = fn(st);
      tx.oncomplete = () => resolve(out && "result" in out ? out.result : undefined);
      tx.onerror = () => reject(tx.error);
    }));
  },
  key(unitId, itemId, slot) { return `${unitId}|${itemId}|${slot}`; },
  put(key, data) { return this._tx("readwrite", (st) => st.put({ key, data })); },
  del(key) { return this._tx("readwrite", (st) => st.delete(key)); },
  /** all photos of one unit -> { "itemId|slot": dataURL } */
  forUnit(unitId) {
    return this._tx("readonly", (st) => st.getAll()).then((rows) => {
      const out = {};
      (rows || []).forEach((r) => {
        const [u, item, slot] = r.key.split("|");
        if (u === unitId) out[item + "|" + slot] = r.data;
      });
      return out;
    });
  },
  delUnit(unitId) {
    return this._tx("readwrite", (st) => {
      const req = st.getAllKeys();
      req.onsuccess = () => req.result.filter((k) => k.startsWith(unitId + "|")).forEach((k) => st.delete(k));
      return req;
    });
  },
  /** resize to max 1000px, JPEG 0.75 -> dataURL */
  compress(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1000, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }
};
const MP_PHOTO_LABEL = [
  null,
  { th: "รูปที่ 1", en: "Photo 1", sub: { th: "ก่อนแก้ไข", en: "before" } },
  { th: "รูปที่ 2", en: "Photo 2", sub: { th: "หลังแก้ไข", en: "after fix" } }
];
function mpPhotoSlotHtml(unitId, itemId, slot) {
  const L = MP_PHOTO_LABEL[slot];
  return `<div class="ph-slot" data-ph-item="${itemId}" data-ph-slot="${slot}">
    <label class="ph-add" title="${mt("เพิ่ม", "Add")} ${mt(L.th, L.en)} (${mt(L.sub.th, L.sub.en)})">
      <span class="ph-plus">＋</span><span>${mt(L.th, L.en)}</span><small>${mt(L.sub.th, L.sub.en)}</small>
      <input type="file" accept="image/*" hidden />
    </label>
  </div>`;
}
function mpPaintSlot(slotEl, data) {
  const slot = Number(slotEl.dataset.phSlot), L = MP_PHOTO_LABEL[slot];
  if (!data) { slotEl.classList.remove("has"); slotEl.querySelector(".ph-img")?.remove(); slotEl.querySelector(".ph-x")?.remove(); return; }
  slotEl.classList.add("has");
  slotEl.querySelector(".ph-img")?.remove(); slotEl.querySelector(".ph-x")?.remove();
  const b = document.createElement("button");
  b.type = "button"; b.className = "ph-img"; b.title = mt("ดูรูปขยาย", "View larger");
  b.innerHTML = `<img src="${data}" alt="${mt(L.th, L.en)}" /><span class="ph-tag">${mt(L.th, L.en)}</span>`;
  slotEl.appendChild(b);
  const x = document.createElement("button");
  x.type = "button"; x.className = "ph-x"; x.title = mt("ลบรูป", "Remove photo"); x.textContent = "×";
  slotEl.appendChild(x);
}
function mpShowPhoto(data, caption) {
  const m = openModal(`<h3 style="font-size:15px;">${mpEsc(caption)}</h3>
    <img src="${data}" alt="" style="max-width:100%;border-radius:8px;display:block;margin:0 auto;" />
    <div class="actions"><button class="btn ghost" id="ph-close">${mt("ปิด", "Close")}</button></div>`);
  m.querySelector("#ph-close").addEventListener("click", closeModal);
}
function mpWirePhotos(body, unit) {
  if (!MpImg.available()) {
    body.querySelectorAll(".ph-slot").forEach((s) => { s.classList.add("disabled"); s.title = mt("เบราว์เซอร์นี้ไม่รองรับการเก็บรูป", "Photo storage not supported in this browser"); });
    return;
  }
  const slots = () => [...body.querySelectorAll(".ph-slot")];
  MpImg.forUnit(unit.id).then((all) => {
    slots().forEach((el) => { const d = all[el.dataset.phItem + "|" + el.dataset.phSlot]; if (d) mpPaintSlot(el, d); });
  }).catch(() => {});
  body.addEventListener("change", (e) => {
    const inp = e.target.closest(".ph-slot input[type=file]");
    if (!inp || !inp.files[0]) return;
    const el = inp.closest(".ph-slot");
    const key = MpImg.key(unit.id, el.dataset.phItem, el.dataset.phSlot);
    MpImg.compress(inp.files[0])
      .then((data) => MpImg.put(key, data).then(() => mpPaintSlot(el, data)))
      .catch(() => alert(mt("ไม่สามารถบันทึกรูปนี้ได้", "Could not save this photo")));
    inp.value = "";
  });
  body.addEventListener("click", (e) => {
    const el = e.target.closest(".ph-slot");
    if (!el) return;
    if (e.target.closest(".ph-x")) {
      MpImg.del(MpImg.key(unit.id, el.dataset.phItem, el.dataset.phSlot)).then(() => mpPaintSlot(el, null));
    } else if (e.target.closest(".ph-img")) {
      const src = el.querySelector(".ph-img img").src;
      mpShowPhoto(src, `${unit.name} · ${el.dataset.phItem} · ${mt(MP_PHOTO_LABEL[el.dataset.phSlot].th, MP_PHOTO_LABEL[el.dataset.phSlot].en)}`);
    }
  });
}

        <div class="field"><label>${mt("วันที่ตรวจประเมิน", "Inspection date")}</label><input type="date" id="mp-date" value="${rec.date || ""}" /></div>

    const row = body.querySelector(`[data-row="${id}"]`);
    if (rk) row.style.setProperty("--rk", mpRiskColor(rk)); else row.style.removeProperty("--rk");
    body.querySelector(`[data-risk="${id}"]`).innerHTML = rk ? mpRiskChip(rk) : "";
    const banner = body.querySelector(".mp-banner"); if (banner) banner.remove();
    refresh();
  }));
  body.querySelectorAll("[data-note]").forEach((inp) => inp.addEventListener("change", () => {

  document.getElementById("mp-unit-del").addEventListener("click", () => {
    if (!confirm(mt(`ลบหน่วยงาน “${unit.name}” พร้อมคะแนนและรูปทั้งหมดหรือไม่?`, `Delete unit “${unit.name}” with all its scores and photos?`))) return;

    label: "Master Plan — Inspection Risk Summary (หน่วยงาน × หมวด)",
    headers: [
      { key: "unit", label: "หน่วยงาน" }, { key: "category", label: "หมวดหมู่" }, { key: "assessed", label: "ข้อที่ประเมิน" },
      { key: "max", label: "คะแนนเต็มรวม" }, { key: "sum", label: "คะแนนที่ได้รวม" }, { key: "pct", label: "คิดเป็น %" },
      { key: "critical", label: "วิกฤต" }, { key: "high", label: "สูง" }, { key: "medium", label: "กลาง" }, { key: "low", label: "ต่ำ" }, { key: "status", label: "ระดับการประเมิน" }
    ],
    rows() {
      const out = [];
      DB.get("mpUnits", []).forEach((u) => {
        const S = mpStats([u.id]);
        S.cats.forEach((c) => out.push({
          unit: u.name, category: `${c.id}. ${c.th} (${c.en})`, assessed: c.assessed, max: c.max, sum: c.sum,
          pct: c.pct === null ? "" : c.pct.toFixed(1), critical: c.risk.critical, high: c.risk.high, medium: c.risk.medium, low: c.risk.low,
          status: c.pct === null ? "ยังไม่ประเมิน" : mpStatusOf(c.pct).th
        }));
        out.push({
          unit: u.name, category: "รวมทั้งสิ้น (Total)", assessed: S.assessed, max: S.max, sum: S.sum,
          pct: S.pct === null ? "" : S.pct.toFixed(1), critical: S.risk.critical, high: S.risk.high, medium: S.risk.medium, low: S.risk.low,
          status: S.pct === null ? "ยังไม่ประเมิน" : mpOverallStatusOf(S.pct).th
        });
      });
      return out;
    }
  },
  mpScores: {
    label: "Master Plan — Risk Assessment Checklist (รายข้อ)",
    headers: [
      { key: "unit", label: "หน่วยงาน" }, { key: "date", label: "วันที่ตรวจ" }, { key: "inspector", label: "ผู้ตรวจ" },
      { key: "id", label: "ข้อ" }, { key: "category", label: "หมวด" }, { key: "text", label: "รายการตรวจ" },
      { key: "score", label: "คะแนน (เต็ม 5)" }, { key: "risk", label: "ระดับความเสี่ยง" }, { key: "note", label: "ข้อสังเกต" }
    ],
    rows() {
      const out = [];
      DB.get("mpUnits", []).forEach((u) => {
        const rec = mpRecord(u.id);
        MP_ITEMS.forEach((it) => {
          const v = rec ? rec.scores[it.id] : undefined;
          out.push({
            unit: u.name, date: rec ? rec.date : "", inspector: rec ? rec.inspector : "", id: it.id,
            category: MP_CATEGORIES[it.catIdx - 1].th, text: it.text,
            score: v === "na" ? "N/A" : typeof v === "number" ? v : "",
            risk: typeof v === "number" ? mpRiskMeta(v <= 1 ? "critical" : v <= 2 ? "high" : v <= 3 ? "medium" : "low").th : "",
            note: rec && rec.notes ? rec.notes[it.id] || "" : ""
          });
        });
      });
      return out;
    }
  }
};

document.addEventListener("DOMContentLoaded", () => {
  DB.ensureSeeded();
  applyUiPrefs();
  const session = Auth.currentUser();
  if (session) {
    startApp(session);
  } else {
    showLogin();
  }
});

function applyUiPrefs() {
  const prefs = DB.get("uiPrefs", { font: "plex", fontSize: "md", theme: "light" });
  const fontDef = FONT_OPTIONS.find((f) => f.id === prefs.font) || FONT_OPTIONS[0];
  const sizeDef = FONT_SIZE_OPTIONS.find((s) => s.id === prefs.fontSize) || FONT_SIZE_OPTIONS[1];
  document.documentElement.style.setProperty("--app-font", fontDef.stack);
  document.documentElement.style.setProperty("--app-font-size", sizeDef.px);
  document.body.classList.remove("theme-dark", "theme-ocean");
  if (prefs.theme === "dark") document.body.classList.add("theme-dark");
  if (prefs.theme === "ocean") document.body.classList.add("theme-ocean");
}

function showLogin() {
  document.getElementById("app-shell").classList.add("hidden");
  document.getElementById("login-screen").classList.remove("hidden");

  const loginCard = document.getElementById("login-card");
  const registerCard = document.getElementById("register-card");

  // populate the "requested building" dropdown on the register form
  const buildingSelect = document.getElementById("reg-building");
  const buildings = DB.get("buildings", []);
  buildingSelect.innerHTML =
    `<option value="">ยังไม่ระบุ — ให้ผู้ดูแลระบบกำหนด</option>` +
    buildings.map((b) => `<option value="${b.id}">${b.name}</option>`).join("");

  document.getElementById("show-register-btn").addEventListener("click", () => {
    loginCard.classList.add("hidden");
    registerCard.classList.remove("hidden");
  });
  document.getElementById("show-login-btn").addEventListener("click", () => {
    registerCard.classList.add("hidden");
    loginCard.classList.remove("hidden");
  });

  wirePasswordToggle("toggle-login-pw", "login-password");
  wirePasswordToggle("toggle-reg-pw", "reg-password");

  document.getElementById("login-form").onsubmit = (e) => {
    e.preventDefault();
    const username = document.getElementById("login-username").value;
    const password = document.getElementById("login-password").value;
    const res = Auth.login(username, password);
    const errEl = document.getElementById("login-error");
    if (!res.ok) {
      errEl.textContent = res.error;
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    startApp(res.user);
  };

  document.getElementById("register-form").onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById("reg-name").value;
    const username = document.getElementById("reg-username").value;
    const password = document.getElementById("reg-password").value;
    const buildingId = document.getElementById("reg-building").value;
    const errEl = document.getElementById("register-error");
    const okEl = document.getElementById("register-success");
    const res = Auth.register({ name, username, password, buildingId });
    if (!res.ok) {
      okEl.classList.add("hidden");
      errEl.textContent = res.error;
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    okEl.textContent = "ส่งคำขอลงทะเบียนเรียบร้อย รอผู้ดูแลระบบอนุมัติสิทธิ์การใช้งาน";
    okEl.classList.remove("hidden");
    document.getElementById("register-form").reset();
  };
}

function wirePasswordToggle(btnId, inputId) {
  const btn = document.getElementById(btnId);
  const input = document.getElementById(inputId);
  btn.addEventListener("click", () => {
    input.type = input.type === "password" ? "text" : "password";
  });
}

// ------------------------------------------------------- data helpers ---
function buildingsInScope() {
  const buildings = accessibleBuildings();
  if (State.activeBuilding === "ALL") return buildings;
  return buildings.filter((b) => b.id === State.activeBuilding);
}

function getProcessStatus(buildingId, processId) {
  const all = DB.get("processStatus", []);
  return all.find((r) => r.buildingId === buildingId && r.processId === processId) || null;
}

function upsertProcessStatus(buildingId, processId, patch) {
  const all = DB.get("processStatus", []);
  const idx = all.findIndex((r) => r.buildingId === buildingId && r.processId === processId);
  if (idx >= 0) {
    all[idx] = { ...all[idx], ...patch, updatedAt: todayISO(), updatedBy: State.user.username };
  } else {
    all.push({
      id: uid("ps"),
      buildingId,
      processId,
      status: "not_started",
      note: "",
      ...patch,
      updatedAt: todayISO(),
      updatedBy: State.user.username
    });
  }
  DB.set("processStatus", all);
}

function moduleCompletion(buildingIds, moduleId) {
  const procs = PROCESS_REFERENCE.filter((p) => p.module === moduleId);
  let done = 0, inProgress = 0, total = 0;
  buildingIds.forEach((bid) => {
    procs.forEach((p) => {
      total++;
      const rec = getProcessStatus(bid, p.id);
      if (rec && rec.status === "done") done++;
      else if (rec && rec.status === "in_progress") inProgress++;
    });
  });
  return { total, done, inProgress, pct: total ? Math.round((done / total) * 100) : 0 };
}

function ragOf(kpi) {
  if (kpi.actual === null || kpi.actual === undefined || kpi.actual === "") return "grey";
  const a = parseFloat(kpi.actual), t = parseFloat(kpi.target);
  if (isNaN(a) || isNaN(t)) return "grey";
  const ratio = t === 0 ? 1 : a / t;
  if (kpi.direction === "lower_better") {
    if (a <= t) return "green";
    if (a <= t * 1.15) return "yellow";
    return "red";
  }
  if (ratio >= 1) return "green";
  if (ratio >= 0.85) return "yellow";
  return "red";
}

          const krs = o.keyResults || [];
          const avg = krs.length ? krs.reduce((s, k) => s + Number(k.progress || 0), 0) / krs.length : 0;
          return sum + avg;
        }, 0) / okrs.length
      )
