        <div class="sub">${fmsDone} / ${fmsTotal} รายการ (7 แผน × อาคารในขอบเขต)</div>
      </div>
      <div class="stat-card">
        <div class="label">${t("dash_stat3_label")}</div>
        <div class="value">${okrAvgProgress}%</div>
        <div class="sub">${okrs.length} OKR ในขอบเขตที่เลือก</div>
      </div>
      <div class="stat-card">
        <div class="label">${t("dash_stat4_label")}</div>
        <div class="value">${openCapas.length}</div>
        <div class="sub" style="color:${overdueCapas.length ? "var(--red)" : "var(--muted)"}">${overdueCapas.length} รายการเกินกำหนด</div>
      </div>
    </div>

    <div class="grid cols-2">
      <div class="card">
        <h3>${t("dash_modcard_title")}</h3>
        <div class="desc">${t("dash_modcard_desc")}</div>
        ${modulePct
          .map(
            (m) => `
          <div style="margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
              <span>${m.nameTh} (${m.name})</span><span style="font-weight:700;color:var(--heading);">${m.comp.pct}%</span>
            </div>
            <div class="progress-bar"><span style="width:${m.comp.pct}%"></span></div>
          </div>`
          )
          .join("")}
      </div>

      <div class="card">
        <h3>${t("dash_kpicard_title")}</h3>
        <div class="desc">${t("dash_kpicard_desc")}</div>
        <div class="grid cols-3" style="gap:10px;">
          <div class="stat-card" style="background:var(--green-soft);border-color:transparent;">
            <div class="label">${t("dash_rag_green")}</div><div class="value" style="color:var(--green)">${ragCounts.green}</div>
          </div>
          <div class="stat-card" style="background:var(--gold-soft);border-color:transparent;">
            <div class="label">${t("dash_rag_yellow")}</div><div class="value" style="color:var(--yellow)">${ragCounts.yellow}</div>
          </div>
          <div class="stat-card" style="background:var(--red-soft);border-color:transparent;">

function avgPct(arr) {
  if (!arr.length) return 0;
  return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
}

const STATUS_BADGE_CLASS = { not_started: "grey", in_progress: "gold", done: "green" };

function renderModuleView(root, moduleId) {
  const procs = PROCESS_REFERENCE.filter((p) => p.module === moduleId);
  const fmsProcs = procs.filter((p) => p.category === "fms");
  const normalProcs = procs.filter((p) => p.category !== "fms");

  if (State.activeBuilding === "ALL") {
    const scope = buildingsInScope();
    root.innerHTML = `
      <div class="card">
        <h3>มุมมองรวมทุกอาคาร (อ่านอย่างเดียว)</h3>
        <div class="desc">เลือกอาคารใดอาคารหนึ่งด้านบนเพื่อแก้ไขสถานะและบันทึกหมายเหตุ</div>
        ${renderMatrixTable(procs, scope)}
      </div>
    `;
    return;
  }

  const buildingId = State.activeBuilding;
  let html = "";
  if (normalProcs.length) html += renderProcessTable(normalProcs, buildingId, null);
  if (fmsProcs.length) {
    html += `
      <div class="card">
        <h3>Facility Management and Safety (FMS)</h3>
        <div class="desc">ระบบบริหารวิศวกรรมสิ่งอำนวยความสะดวกและความปลอดภัย — 7 แผนงานที่ผนวกเข้ากับ Module 3 ใช้ได้กับอาคารหรือสถานประกอบการทุกประเภท</div>
        ${processTableRows(fmsProcs, buildingId, true)}
      </div>
    `;
  }
  root.innerHTML = html;
  wireProcessTable(root, buildingId);
}

function renderProcessTable(procs, buildingId, label) {
  return `
    <div class="card">
      ${label ? `<h3>${label}</h3>` : ""}
      ${processTableRows(procs, buildingId, false)}
    </div>
  `;
}

function processTableRows(procs, buildingId, isFms) {
  return `
    <table>
      <thead>
        <tr>
          <th>กระบวนการ</th><th>เจ้าของ</th><th>สถานะ</th><th>หมายเหตุ</th><th>อัปเดตล่าสุด</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${procs
          .map((p) => {
            const rec = getProcessStatus(buildingId, p.id) || { status: "not_started", note: "" };
            return `
            <tr data-proc="${p.id}">
              <td>${isFms ? `<span class="fms-tag">${p.fmsCode}</span>` : ""}${p.name}</td>
              <td>${p.owner}</td>
              <td>
                <select class="status-select" data-field="status">
                  <option value="not_started" ${rec.status === "not_started" ? "selected" : ""}>ยังไม่เริ่ม</option>
                  <option value="in_progress" ${rec.status === "in_progress" ? "selected" : ""}>กำลังดำเนินการ</option>
                  <option value="done" ${rec.status === "done" ? "selected" : ""}>เสร็จสมบูรณ์</option>
                </select>
              </td>
              <td><input type="text" data-field="note" value="${escapeAttr(rec.note || "")}" placeholder="หมายเหตุ..." style="width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:6px;" /></td>
              <td style="white-space:nowrap;color:var(--muted);font-size:12px;">${rec.updatedAt || "-"}</td>
              <td><button class="btn small save-proc-btn">${t("btn_save")}</button></td>
            </tr>`;
          })
          .join("")}
      </tbody>
    </table>
  `;
}

function wireProcessTable(root, buildingId) {
  root.querySelectorAll(".save-proc-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const row = btn.closest("tr");
      const processId = row.dataset.proc;
      const status = row.querySelector('[data-field="status"]').value;
      const note = row.querySelector('[data-field="note"]').value;
      upsertProcessStatus(buildingId, processId, { status, note });
      toast("บันทึกสถานะแล้ว");
      renderView();
    });
  });
}

function renderMatrixTable(procs, buildings) {
  return `
    <table>
      <thead>
        <tr><th>กระบวนการ</th>${buildings.map((b) => `<th>${b.code}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${procs
          .map(
            (p) => `
          <tr>
            <td>${p.category === "fms" ? `<span class="fms-tag">${p.fmsCode}</span>` : ""}${p.name}</td>
            ${buildings
              .map((b) => {
                const rec = getProcessStatus(b.id, p.id);
                const status = rec ? rec.status : "not_started";
                return `<td><span class="badge ${STATUS_BADGE_CLASS[status]}">${STATUS_LABELS[status]}</span></td>`;
              })
              .join("")}
          </tr>`
          )
          .join("")}
      </tbody>
    </table>
  `;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// ------------------------------------------------------------- modal ---
function openModal(innerHtml) {
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "modal-overlay";
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
  overlay.addEventListener("mousedown", (e) => {
    if (e.target === overlay) closeModal();
  });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal() {
  const el = document.getElementById("modal-overlay");
  if (el) el.remove();
}

// ------------------------------------------------------------ settings ---
function openSettingsModal() {
  const isAdmin = Auth.isAdmin(State.user);
  const prefs = DB.get("uiPrefs", { font: "plex", fontSize: "md", theme: "light" });
  const moduleVisibility = DB.get("moduleVisibility", {});
  const lang = DB.get("lang", "th");
  const labelKey = lang === "th" ? "labelTh" : "labelEn";

  const fontCards = FONT_OPTIONS.map(
    (f) => `<div class="option-card ${f.id === prefs.font ? "selected" : ""}" data-setting="font" data-value="${f.id}" style="font-family:${f.stack};">Aก ${f[labelKey]}</div>`
  ).join("");

  const themeSwatch = { light: "linear-gradient(135deg,#FFFFFF,#E8F3EC)", dark: "linear-gradient(135deg,#0D1613,#142420)", ocean: "linear-gradient(135deg,#F1F6FA,#2596F0)" };
  const themeCards = THEME_OPTIONS.map(
    (th_) => `<div class="option-card ${th_.id === prefs.theme ? "selected" : ""}" data-setting="theme" data-value="${th_.id}">
      <div class="swatch" style="background:${themeSwatch[th_.id]};"></div>${th_[labelKey]}
    </div>`
  ).join("");

  const sizeCards = FONT_SIZE_OPTIONS.map(
    (s) => `<div class="option-card ${s.id === prefs.fontSize ? "selected" : ""}" data-setting="fontSize" data-value="${s.id}" style="font-size:${s.px};">Aa ${s[labelKey]}</div>`
  ).join("");

  const moduleChecks = MODULES.map((m) => {
    const checked = moduleVisibility[m.id] !== false;
    return `<label class="checkbox-pill"><input type="checkbox" data-module-toggle="${m.id}" ${checked ? "checked" : ""}/> ${m.nameTh} (${m.name})</label>`;
  }).join("") +
    `<label class="checkbox-pill"><input type="checkbox" data-module-toggle="masterplan" ${moduleVisibility.masterplan !== false ? "checked" : ""}/> ${t("settings_mp_label")}</label>`;

  const modal = openModal(`
    <h3>${t("settings_title")}</h3>
    <div class="settings-section">
      <h4>${t("settings_font")}</h4>
      <div class="option-grid" data-setting-group="font">${fontCards}</div>
    </div>
    <div class="settings-section">
      <h4>${t("settings_theme")}</h4>
      <div class="option-grid" data-setting-group="theme">${themeCards}</div>
    </div>
    <div class="settings-section">
      <h4>${t("settings_fontsize")}</h4>
      <div class="option-grid" data-setting-group="fontSize">${sizeCards}</div>
    </div>
    ${
      isAdmin
        ? `<div class="settings-section">
            <h4>${t("settings_modules")}</h4>
            <div class="desc" style="margin-bottom:8px;">${t("settings_modules_desc")}</div>
            <div class="checkbox-list">${moduleChecks}</div>
          </div>`
        : ""
    }
    <div class="actions">
      <button class="btn ghost" id="close-settings">${t("settings_close")}</button>
    </div>
  `);

  modal.querySelectorAll("[data-setting]").forEach((card) => {
    card.addEventListener("click", () => {
      const key = card.dataset.setting;
      const value = card.dataset.value;
      const p = DB.get("uiPrefs", { font: "plex", fontSize: "md", theme: "light" });
      p[key] = value;
      DB.set("uiPrefs", p);
      applyUiPrefs();
      modal.querySelectorAll(`[data-setting-group="${key}"] .option-card`).forEach((c) => c.classList.remove("selected"));
      card.classList.add("selected");
    });
  });

  if (isAdmin) {
    modal.querySelectorAll("[data-module-toggle]").forEach((cb) => {
      cb.addEventListener("change", () => {
        const mv = DB.get("moduleVisibility", {});
        mv[cb.dataset.moduleToggle] = cb.checked;
        DB.set("moduleVisibility", mv);
        renderShell();
      });
    });
  }

  modal.querySelector("#close-settings").addEventListener("click", () => {
    closeModal();
    toast(t("settings_saved"));
  });
}


// ---------------------------------------------------------------- OKR ---
function renderOKR(root) {
  if (State.activeBuilding === "ALL") {
    root.innerHTML = `<div class="card empty-state">เลือกอาคาร/BU หนึ่งแห่งด้านบนเพื่อดูและจัดการ OKR</div>`;
    return;
  }
  const buildingId = State.activeBuilding;
  const okrs = DB.get("okrs", []).filter((o) => o.buildingId === buildingId);
  const quarters = [...new Set(okrs.map((o) => o.quarter))].sort();

  root.innerHTML = `
    <div class="toolbar">
      <div class="filters">
        <select id="okr-quarter-filter">
          <option value="">ทุกไตรมาส</option>
          ${quarters.map((q) => `<option value="${q}">${q}</option>`).join("")}
        </select>
      </div>
      <button class="btn" id="add-okr-btn">+ เพิ่ม OKR</button>
    </div>
    <div id="okr-list"></div>
  `;

  const listEl = document.getElementById("okr-list");
  function draw() {
    const filterQ = document.getElementById("okr-quarter-filter").value;
    const items = okrs.filter((o) => !filterQ || o.quarter === filterQ);
    listEl.innerHTML = items.length
      ? items.map((o) => okrCardHtml(o)).join("")
      : `<div class="card empty-state">ยังไม่มี OKR — เริ่มเพิ่มรายการแรกได้เลย</div>`;
    listEl.querySelectorAll("[data-edit-okr]").forEach((b) =>
      b.addEventListener("click", () => openOkrForm(buildingId, okrs.find((o) => o.id === b.dataset.editOkr)))
    );
    listEl.querySelectorAll("[data-del-okr]").forEach((b) =>
      b.addEventListener("click", () => {
        if (!confirm("ลบ OKR นี้หรือไม่?")) return;
        DB.set("okrs", DB.get("okrs", []).filter((o) => o.id !== b.dataset.delOkr));
        toast("ลบแล้ว");
        renderView();
      })
    );
  }
  draw();
  document.getElementById("okr-quarter-filter").addEventListener("change", draw);
  document.getElementById("add-okr-btn").addEventListener("click", () => openOkrForm(buildingId, null));
}

function okrCardHtml(o) {
  const krs = o.keyResults || [];
  const avg = krs.length ? Math.round(krs.reduce((s, k) => s + Number(k.progress || 0), 0) / krs.length) : 0;
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <span class="badge green">${o.quarter}</span> <span class="badge grey">${o.pillar}</span>
          <h3 style="margin-top:8px;">${o.objective}</h3>
          <div class="desc">เจ้าของ: ${o.owner || "-"}</div>
        </div>
        <div style="display:flex;gap:4px;">
          <button class="icon-btn" data-edit-okr="${o.id}">${t("btn_edit")}</button>
          <button class="icon-btn danger" data-del-okr="${o.id}">${t("btn_delete")}</button>
        </div>
      </div>
      <div style="margin:10px 0 6px;font-size:13px;font-weight:600;color:var(--heading);">ความคืบหน้ารวม: ${avg}%</div>
      <div class="progress-bar" style="margin-bottom:12px;"><span style="width:${avg}%"></span></div>
      ${krs
        .map(
          (k) => `
        <div style="margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;"><span>${k.text}</span><span>${k.progress}%</span></div>
          <div class="progress-bar"><span style="width:${k.progress}%;background:var(--gold);"></span></div>
        </div>`
        )
        .join("")}
    </div>
  `;
}

function openOkrForm(buildingId, existing) {
  const krs = existing ? existing.keyResults : [{ text: "", progress: 0 }, { text: "", progress: 0 }, { text: "", progress: 0 }];
  const modal = openModal(`
    <h3>${existing ? "แก้ไข OKR" : "เพิ่ม OKR ใหม่"}</h3>
    <div class="form-row">
      <div class="field">
        <label>ไตรมาส</label>
        <input type="text" id="f-quarter" placeholder="เช่น Q1-2026" value="${existing ? escapeAttr(existing.quarter) : ""}" />
      </div>
      <div class="field">
        <label>Pillar</label>
        <select id="f-pillar">
          ${PILLARS.map((p) => `<option value="${p.id}" ${existing && existing.pillar === p.id ? "selected" : ""}>${p.id} — ${p.nameTh}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="field">
      <label>Objective</label>
      <textarea id="f-objective" rows="2">${existing ? existing.objective : ""}</textarea>
    </div>
    <div class="field">
      <label>เจ้าของ (Owner)</label>
      <input type="text" id="f-owner" value="${existing ? escapeAttr(existing.owner || "") : ""}" />
    </div>
    <div class="field">
      <label>Key Results (ระบุ % ความคืบหน้า)</label>
      <div id="kr-rows"></div>
      <button class="btn ghost small" id="add-kr-row" type="button">+ เพิ่ม Key Result</button>
    </div>
    <div class="actions">
      <button class="btn ghost" id="cancel-okr">${t("btn_cancel")}</button>
      <button class="btn" id="save-okr">${t("btn_save")}</button>
    </div>
  `);

  const krRows = modal.querySelector("#kr-rows");
  function addKrRow(text, progress) {
    const row = document.createElement("div");
    row.className = "kr-row";
    row.innerHTML = `
      <input type="text" placeholder="Key Result..." value="${escapeAttr(text || "")}" />
      <input type="number" min="0" max="100" value="${progress || 0}" />
      <button class="icon-btn danger" type="button">${t("btn_delete")}</button>
    `;
    row.querySelector(".icon-btn").addEventListener("click", () => row.remove());
    krRows.appendChild(row);
  }
  krs.forEach((k) => addKrRow(k.text, k.progress));
  modal.querySelector("#add-kr-row").addEventListener("click", () => addKrRow("", 0));
  modal.querySelector("#cancel-okr").addEventListener("click", closeModal);

  modal.querySelector("#save-okr").addEventListener("click", () => {
    const objective = modal.querySelector("#f-objective").value.trim();
    if (!objective) { alert("กรุณาระบุ Objective"); return; }
    const keyResults = [...krRows.querySelectorAll(".kr-row")]
      .map((row) => {
        const inputs = row.querySelectorAll("input");
        return { text: inputs[0].value.trim(), progress: Math.max(0, Math.min(100, Number(inputs[1].value) || 0)) };
      })
      .filter((k) => k.text);

    const data = {
      buildingId,
      quarter: modal.querySelector("#f-quarter").value.trim() || "Q?-????",
      pillar: modal.querySelector("#f-pillar").value,
      objective,
      owner: modal.querySelector("#f-owner").value.trim(),
      keyResults
    };
    const all = DB.get("okrs", []);
    if (existing) {
      const idx = all.findIndex((o) => o.id === existing.id);
      all[idx] = { ...existing, ...data };
    } else {
      all.push({ id: uid("okr"), ...data });
    }
    DB.set("okrs", all);
    closeModal();
    toast("บันทึก OKR แล้ว");
    renderView();
  });
}

                <td>${c.source || "-"}</td>
                <td>${c.owner || "-"}</td>
                <td>${c.openedDate || "-"}</td>
                <td style="color:${overdue ? "var(--red)" : "inherit"};font-weight:${overdue ? "700" : "400"};">${c.dueDate || "-"}${overdue ? " (เกินกำหนด)" : ""}</td>
                <td>
                  <select class="status-select" data-capa="${c.id}">
                    <option value="open" ${c.status === "open" ? "selected" : ""}>เปิด</option>
                    <option value="in_progress" ${c.status === "in_progress" ? "selected" : ""}>กำลังดำเนินการ</option>
                    <option value="closed" ${c.status === "closed" ? "selected" : ""}>ปิดแล้ว</option>
                  </select>
                </td>
                <td><button class="icon-btn danger" data-del-capa="${c.id}">${t("btn_delete")}</button></td>
              </tr>`;
                  })
                  .join("")

          }
        </tbody>
      </table>
    </div>
  `;

  root.querySelectorAll("[data-capa]").forEach((sel) => {
    sel.addEventListener("change", () => {
      const all = DB.get("capas", []);
      const idx = all.findIndex((c) => c.id === sel.dataset.capa);
      all[idx].status = sel.value;
      DB.set("capas", all);
      toast("อัปเดตสถานะแล้ว");
      renderView();

      toast("ลบแล้ว");
      renderView();
    });
  });
  document.getElementById("add-capa-btn").addEventListener("click", () => openCapaForm(buildingId));
}

function openUserForm(existing, isApproval) {
  const buildings = DB.get("buildings", []);
  const selectedIds = existing ? existing.buildingIds.filter((id) => id !== "ALL") : [];
  const modal = openModal(`
    <h3>${isApproval ? "อนุมัติผู้ใช้งานใหม่" : existing ? "แก้ไขผู้ใช้งาน" : "เพิ่มผู้ใช้งานใหม่"}</h3>
    ${isApproval ? `<div class="desc" style="margin-bottom:14px;">กำหนดสิทธิ์และอาคารที่เข้าถึงได้ก่อนเปิดใช้งานบัญชีนี้</div>` : ""}
    <div class="form-row">
      <div class="field"><label>ชื่อผู้ใช้ (username)</label><input type="text" id="f-username" ${existing ? "disabled" : ""} value="${existing ? escapeAttr(existing.username) : ""}" /></div>
      <div class="field"><label>รหัสผ่าน</label><input type="text" id="f-password" placeholder="${existing ? "เว้นว่างถ้าไม่เปลี่ยน" : ""}" /></div>
    </div>
    <div class="form-row">
      <div class="field"><label>ชื่อ-นามสกุล</label><input type="text" id="f-name" value="${existing ? escapeAttr(existing.name) : ""}" /></div>
      <div class="field">
        <label>สิทธิ์การใช้งาน</label>
        <select id="f-role">
          <option value="user" ${existing && existing.role === "user" ? "selected" : ""}>ผู้ใช้งานทั่วไป</option>
          <option value="admin" ${existing && existing.role === "admin" ? "selected" : ""}>ผู้ดูแลระบบ</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>สถานะบัญชี</label>
      <select id="f-status">
        <option value="active" ${!existing || existing.status !== "pending" ? "selected" : ""}>ใช้งานได้ (Active)</option>
        <option value="pending" ${existing && existing.status === "pending" && !isApproval ? "selected" : ""}>รออนุมัติ (Pending)</option>
      </select>
    </div>
    <div class="field">
      <label>อาคาร/BU ที่เข้าถึงได้</label>
      <div class="checkbox-list" id="building-checks">
        <label class="checkbox-pill"><input type="checkbox" value="ALL" ${existing && existing.buildingIds.includes("ALL") ? "checked" : ""}/> ทุกอาคาร</label>
        ${buildings
          .map((b) => `<label class="checkbox-pill"><input type="checkbox" value="${b.id}" ${selectedIds.includes(b.id) ? "checked" : ""}/> ${b.name}</label>`)
          .join("")}
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="cancel-u">${t("btn_cancel")}</button>
      <button class="btn" id="save-u">${isApproval ? "อนุมัติและบันทึก" : "บันทึก"}</button>
    </div>
  `);
  modal.querySelector("#cancel-u").addEventListener("click", closeModal);
  modal.querySelector("#save-u").addEventListener("click", () => {
    const username = modal.querySelector("#f-username").value.trim();
    const name = modal.querySelector("#f-name").value.trim();
    if (!existing && !username) { alert("กรุณาระบุชื่อผู้ใช้"); return; }
    if (!name) { alert("กรุณาระบุชื่อ-นามสกุล"); return; }
    const checked = [...modal.querySelectorAll("#building-checks input:checked")].map((c) => c.value);
    const password = modal.querySelector("#f-password").value;
    const role = modal.querySelector("#f-role").value;
    const status = isApproval ? "active" : modal.querySelector("#f-status").value;
    const all = DB.get("users", []);
    if (existing) {
      const idx = all.findIndex((x) => x.id === existing.id);
      all[idx] = {
        ...existing,
        name,
        role,
        status,
        buildingIds: checked.length ? checked : ["ALL"],
        password: password ? password : existing.password
      };
    } else {
      if (all.some((u) => u.username.toLowerCase() === username.toLowerCase())) {
        alert("มีชื่อผู้ใช้นี้อยู่แล้ว");
        return;
      }
      all.push({
        id: uid("u"),
        username,
        password: password || "changeme",
        name,
        role,
        status,
        buildingIds: checked.length ? checked : ["ALL"]
      });
    }
    DB.set("users", all);
    closeModal();
    toast(isApproval ? "อนุมัติผู้ใช้งานแล้ว" : "บันทึกแล้ว");
    navigate("users");
  });
}

  capas: {

    headers: [
      { key: "buildingName", label: "อาคาร" }, { key: "title", label: "เรื่อง" }, { key: "source", label: "ที่มา" },

      { key: "status", label: "สถานะ" }

  });

  document.getElementById("print-summary-btn").addEventListener("click", () => {
    const scope = buildingsInScope();
    const ids = scope.map((b) => b.id);
    const modulePct = MODULES.map((m) => ({ ...m, comp: moduleCompletion(ids, m.id) }));
    const okrs = DB.get("okrs", []).filter((o) => ids.includes(o.buildingId));
    const kpis = DB.get("kpis", []).filter((k) => ids.includes(k.buildingId));
    const capas = DB.get("capas", []).filter((c) => ids.includes(c.buildingId));
    const openCapas = capas.filter((c) => c.status !== "closed");
    const ragCounts = { green: 0, yellow: 0, red: 0, grey: 0 };
    kpis.forEach((k) => ragCounts[ragOf(k)]++);

    const html = `
      <div class="meta">PSD eNGINNo QSHE Management — Executive Summary</div>
      <h1>สรุปผลการดำเนินงาน QSHE ${State.activeBuilding === "ALL" ? "(ทุกอาคาร)" : "— " + scope[0]?.name}</h1>
      <div class="meta">วันที่จัดทำรายงาน: ${todayISO()} &nbsp;|&nbsp; จัดทำโดย: ${State.user.name}</div>
      <table>
        <thead><tr><th>Module</th><th>ความคืบหน้า</th></tr></thead>
        <tbody>${modulePct.map((m) => `<tr><td>${m.nameTh} (${m.name})</td><td>${m.comp.pct}%</td></tr>`).join("")}</tbody>
      </table>
      <table>
        <thead><tr><th>รายการ</th><th>ค่า</th></tr></thead>
        <tbody>
          <tr><td>จำนวน OKR</td><td>${okrs.length}</td></tr>
          <tr><td>KPI ตามเป้า / เฝ้าระวัง / ต้องเร่งแก้ไข</td><td>${ragCounts.green} / ${ragCounts.yellow} / ${ragCounts.red}</td></tr>
          <tr><td>CAPA ที่ยังเปิดอยู่</td><td>${openCapas.length}</td></tr>
        </tbody>
      </table>
    `;
    ExportUtil.printSection(html, "QSHE Executive Summary");
  });
}

</script>
</body>
</html>
