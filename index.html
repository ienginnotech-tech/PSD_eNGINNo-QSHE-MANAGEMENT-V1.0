<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSD eNGINNo — QSHE Management V1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== LOGIN SCREEN ===================== -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="mark">QS</div>
        <h1>PSD eNGINNo</h1>
        <p>QSHE Management System · V1.0</p>
      </div>

      <div id="login-error" class="login-error hidden"></div>

      <form id="login-form">
        <div class="field">
          <label for="login-username">ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="login-username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">รหัสผ่าน (Password)</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn block">เข้าสู่ระบบ</button>
      </form>

      <div class="login-hint">
        บัญชีผู้ดูแลระบบเริ่มต้น: <strong>admin</strong> / <strong>qshe2026</strong><br/>
        แนะนำให้เปลี่ยนรหัสผ่านทันทีหลังเข้าใช้งานครั้งแรก (เมนู "ผู้ใช้งาน")
      </div>
    </div>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app-shell" class="hidden">
    <aside id="sidebar"></aside>
    <main id="main">
      <div id="topbar"></div>
      <div id="view-root"></div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
